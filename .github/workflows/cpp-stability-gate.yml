name: cpp-stability-gate

# Heavy tier: nightly (on dev), on demand, and on release tags. Not on PRs.
# Builds only test_execution_kernel (stability_gate.sh) and repeats it under load.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-changed:
    uses: ./.github/workflows/nightly-dev-changed.yml
    permissions:
      contents: read
      actions: read

  manyforge-core-stability:
    name: manyforge_core repeat-under-load stability
    needs: dev-changed
    if: needs.dev-changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CORE_BUILD_DIR: "${{ github.workspace }}/build/stability-core"
      MANYFORGE_STABILITY_ITERATIONS: "5"
      MANYFORGE_STABILITY_LOAD_WORKERS: "3"
      MANYFORGE_STABILITY_TIMEOUT_SECONDS: "240"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - name: Install C++ test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ ccache libgtest-dev libc6 pkg-config \
            libdouble-conversion-dev libutf8proc-dev libssl-dev libsqlite3-dev
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-stability-${{ github.sha }}
          restore-keys: ccache-stability-
      - name: Configure core tests
        run: |
          cmake -S manyforge_core -B "$CORE_BUILD_DIR" \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Run loaded execution-kernel gate
        run: manyforge_core/tools/stability_gate.sh
