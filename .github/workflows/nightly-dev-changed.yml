name: nightly-dev-changed

# Called first by every workflow with a nightly schedule. A scheduled run goes
# ahead only if this workflow has no finished run (any trigger: push, tag,
# manual or an earlier nightly; any result except cancelled) for dev's current
# commit, so unchanged code is not tested again. Push, pull request, tag and
# manual runs always go ahead. Callers grant `actions: read` to the calling job.
on:
  workflow_call:
    outputs:
      run:
        description: "'true' when the calling workflow should run its jobs"
        value: ${{ jobs.check.outputs.run }}

jobs:
  check:
    name: dev commit not yet tested by this workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            api="repos/$GITHUB_REPOSITORY"
            workflow_id=$(gh api "$api/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
            sha=$(gh api "$api/commits/dev" --jq .sha)
            tested=$(gh api "$api/actions/workflows/$workflow_id/runs?head_sha=$sha&status=completed&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")] | length")
            if [ "$tested" -gt 0 ]; then
              run=false
            fi
            echo "dev at ${sha}; finished runs of this workflow on it: ${tested}; run=${run}"
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
