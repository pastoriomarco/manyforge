name: frontend-build

on:
  pull_request:
    paths:
      - "manyforge_composer/frontend/**"
      # Fixtures the frontend tests import from their owners.
      - "manyforge_deployment/resources/**"
      - "manyforge_headless_api/tests/fixtures/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches: [main, dev]
    paths:
      - "manyforge_composer/frontend/**"
      - "manyforge_deployment/resources/**"
      - "manyforge_headless_api/tests/fixtures/**"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Composer frontend type-check, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: manyforge_composer/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: manyforge_composer/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npx tsc -b --force
      - name: Unit tests
        run: npm test
      - name: Bundle
        run: npx vite build
