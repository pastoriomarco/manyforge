name: ros-image

# Reference ROS image (OD-315): Dockerfile.ros-lyrical-full built on GitHub's
# own amd64 and arm64 runners (native, no emulation) and pushed to GHCR as one
# multi-arch image tagged inputs-<hash> (scripts/ci/ros-image-inputs.sh). A run
# whose inputs-<hash> already exists builds nothing. A run on a v* tag ref also
# tags the release version from VERSION. The package keeps the visibility
# GitHub gives it.
# Manual only for now: the push and v* tag triggers return once the package is
# public, pending the third-party notices review (OD-315).
on:
  workflow_dispatch:

permissions:
  contents: read

# Queued, not cancelled: a build takes hours, and a later run for the same
# inputs finds the image and builds nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs:
    name: Resolve image inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.key.outputs.image }}
      key: ${{ steps.key.outputs.key }}
      version: ${{ steps.key.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        run: |
          set -euo pipefail
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/manyforge-ros"
            echo "key=$(scripts/ci/ros-image-inputs.sh)"
            echo "version=$(<VERSION)"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        env:
          REF: ${{ steps.key.outputs.image }}:${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "$REF exists; nothing to build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$REF not found; building it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: inputs
    if: needs.inputs.outputs.exists != 'true'
    runs-on: ${{ matrix.runner }}
    # GitHub-hosted jobs end at 6 h.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # A hosted runner starts with about 14 GB free; the ROS source build and
      # its layer cache need more. Remove preinstalled toolchains this job never
      # uses (paths absent on a runner image are skipped).
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache
          docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Prepare pinned RoboPlan Docker context
        run: ./scripts/setup-docker.sh --prepare-only

      - id: args
        run: |
          set -euo pipefail
          {
            echo "build_args<<EOF"
            scripts/ci/ros-image-inputs.sh --build-args
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Pushed by digest only; the merge job tags the multi-arch index. The ROS
      # source parallelism (4 vCPU, 16 GB runners) does not change the image.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ros-lyrical-full
          platforms: ${{ matrix.platform }}
          build-args: |
            ${{ steps.args.outputs.build_args }}
            ROS_SOURCE_PARALLEL_WORKERS=4
            ROS_SOURCE_JOBS_PER_PACKAGE=2
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.manyforge.ros-image.inputs=${{ needs.inputs.outputs.key }}
          outputs: type=image,name=${{ needs.inputs.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=manyforge-ros-${{ matrix.arch }}
          cache-to: type=gha,scope=manyforge-ros-${{ matrix.arch }},mode=max,ignore-error=true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.inputs.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: [inputs, build]
    if: ${{ !cancelled() && needs.inputs.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - if: needs.inputs.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: publish
        env:
          IMAGE: ${{ needs.inputs.outputs.image }}
          KEY: ${{ needs.inputs.outputs.key }}
          VERSION: ${{ needs.inputs.outputs.version }}
          EXISTS: ${{ needs.inputs.outputs.exists }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          release=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=(--tag "$IMAGE:$VERSION")
          fi
          if [[ "$EXISTS" == true ]]; then
            if ((${#release[@]})); then
              docker buildx imagetools create "${release[@]}" "$IMAGE:$KEY"
            fi
          else
            sources=()
            for digest in "$RUNNER_TEMP"/digests/*; do
              sources+=("$IMAGE@sha256:$(basename "$digest")")
            done
            docker buildx imagetools create --tag "$IMAGE:$KEY" "${release[@]}" \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              "${sources[@]}"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:$KEY" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Reference ROS image"
            echo
            echo "- Image: \`$IMAGE@$digest\`"
            echo "- Inputs tag: \`$IMAGE:$KEY\`"
            if ((${#release[@]})); then echo "- Release tag: \`$IMAGE:$VERSION\`"; fi
            if [[ "$EXISTS" == true ]]; then echo "- Built earlier; this run built nothing."; fi
            echo
            echo '```'
            docker buildx imagetools inspect "$IMAGE@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: needs.inputs.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.inputs.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
