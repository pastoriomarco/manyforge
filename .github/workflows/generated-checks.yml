name: generated-checks

# Error catalog and committed generated outputs / identity pins. Pure Python,
# no native build: regen.py skips its native steps (program revisions,
# model assets); they run where the native tools are built.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-checks:
    name: Error catalog and regen --check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/generated-checks.yml
      - name: Install Python dependencies (dev-image pins)
        run: |
          python -m pip install \
            pyyaml==6.0.3 rfc8785==0.1.4 py_trees==2.4.0 \
            fastapi==0.135.3 "uvicorn[standard]==0.44.0" httpx==0.28.1 \
            websockets==16.0 mcp==1.27.0
      - name: Error catalog covers every used code
        run: python3 scripts/ci/check-error-catalog.py
      - name: Error catalog is generated
        run: python3 manyforge_core/tools/generate_error_catalog.py --check
      - name: Authority port alignment
        run: python3 scripts/ci/check-authority-port-alignment.py
      - name: Planner portability evidence
        run: python3 scripts/ci/check-planner-portability.py
      - name: Generated outputs and pins are current
        run: python3 scripts/regen.py --check
