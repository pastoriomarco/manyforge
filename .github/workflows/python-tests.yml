name: python-tests

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "manyforge_content_identity/**"
      - "manyforge_core/**"
      - "manyforge_deployment/**"
      - "manyforge_behavior/**"
      - "manyforge_composer/**"
      - "manyforge_supervision/**"
      - "manyforge_assistant_bridge/**"
      - "tests/composable_cell_i4/**"
      - "verification/composable_cell_i4/**"
      - "manyforge_ros/manyforge_ros/diagnostics_bridge.py"
      - "manyforge_ros/tests/test_diagnostics_bridge.py"
      - "manyforge_medkit_adapter/manyforge_medkit_adapter/adapter.py"
      - "manyforge_medkit_adapter/manyforge_medkit_adapter/forwarder.py"
      - "manyforge_medkit_adapter/tests/test_forwarder.py"
      - "scripts/test-all.sh"
      - "scripts/ci/generate-core-bindings-contract.py"
      - "scripts/ci/core-bindings-sanitizer-host.cpp"
      - "scripts/ci/run-composable-cell-i2-determinism.sh"
      - "scripts/ci/run-core-bindings.sh"
      - "scripts/ci/run-core-bindings-contract.sh"
      - "scripts/ci/run-core-bindings-sanitizer.sh"
      - "verification/composable_cell_i2/**"
      - "scripts/setup-docker.sh"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main, dev]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "manyforge_content_identity/**"
      - "manyforge_core/**"
      - "manyforge_deployment/**"
      - "manyforge_behavior/**"
      - "manyforge_composer/**"
      - "manyforge_supervision/**"
      - "manyforge_assistant_bridge/**"
      - "tests/composable_cell_i4/**"
      - "verification/composable_cell_i4/**"
      - "manyforge_ros/manyforge_ros/diagnostics_bridge.py"
      - "manyforge_ros/tests/test_diagnostics_bridge.py"
      - "manyforge_medkit_adapter/manyforge_medkit_adapter/adapter.py"
      - "manyforge_medkit_adapter/manyforge_medkit_adapter/forwarder.py"
      - "manyforge_medkit_adapter/tests/test_forwarder.py"
      - "scripts/test-all.sh"
      - "scripts/ci/generate-core-bindings-contract.py"
      - "scripts/ci/core-bindings-sanitizer-host.cpp"
      - "scripts/ci/run-composable-cell-i2-determinism.sh"
      - "scripts/ci/run-core-bindings.sh"
      - "scripts/ci/run-core-bindings-contract.sh"
      - "scripts/ci/run-core-bindings-sanitizer.sh"
      - "verification/composable_cell_i2/**"
      - "scripts/setup-docker.sh"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

# Qualification is container-only. The job builds the repository development
# image, resolves that tag to an immutable image ID, and runs the retained
# ROS-free I2 compiler bindings, retained Behavior/observation assertions,
# assistant protocol/supervisor clients, and structural Composer shell inside
# that image. Live runtime products remain unavailable and are not represented
# by skips or mock lanes.
jobs:
  python-tests:
    name: I2 bindings, retained Python, and Composer (AMD64 Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned RoboPlan Docker context
        run: ./scripts/setup-docker.sh --prepare-only

      - name: Build development image
        run: docker build --platform linux/amd64 -t manyforge-python-ci:${GITHUB_SHA} .

      - name: Resolve immutable development image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect "manyforge-python-ci:${GITHUB_SHA}" --format '{{.Id}}')"
          if [[ ! "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve immutable development image identity" >&2
            exit 1
          fi
          echo "id=${image_id}" >> "${GITHUB_OUTPUT}"
          echo "Qualified image: ${image_id}"

      - name: Run I2 bindings, retained Python, and Composer qualification
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -e WORKSPACE=/workspace \
            -e PYTHONPYCACHEPREFIX=/tmp/manyforge-pycache \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${IMAGE_ID}" \
            bash -lc 'set -euo pipefail; ./scripts/test-all.sh bindings; ./scripts/test-all.sh python; ./scripts/test-all.sh bridge; cd manyforge_composer/frontend; npm ci --ignore-scripts; cd /workspace; ./scripts/test-all.sh composer'
