name: cpp-tsan

# Heavy tier: nightly (on dev), on demand, and on release tags. Not on PRs.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-cache:
    name: Build development image cache
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - name: Prepare pinned RoboPlan Docker context
        run: ./scripts/setup-docker.sh --prepare-only

      - uses: docker/setup-buildx-action@v3

      # One cache scope shared by every heavy workflow and run: an unchanged
      # Dockerfile reuses its layers instead of rebuilding RoboPlan.
      - name: Build and export image layers
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha,scope=manyforge-dev
          cache-to: type=gha,scope=manyforge-dev,mode=max,ignore-error=true

  manyforge-core-tsan:
    name: C++ ThreadSanitizer (${{ matrix.suite }}, AMD64 Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    needs: image-cache
    strategy:
      fail-fast: false
      matrix:
        suite: [core, relocation-packages]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - name: Prepare pinned RoboPlan Docker context
        run: ./scripts/setup-docker.sh --prepare-only

      - name: Free runner disk before image load
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h
          free -h

      # Sanitizer test TUs are memory-heavy; swap keeps the -j4 build alive.
      - name: Add swap for sanitizer compiles
        run: |
          sudo fallocate -l 8G /mnt/manyforge.swap
          sudo chmod 600 /mnt/manyforge.swap
          sudo mkswap /mnt/manyforge.swap
          sudo swapon /mnt/manyforge.swap
          free -h

      - uses: docker/setup-buildx-action@v3
        id: sanitizer_builder

      - name: Load development image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: manyforge-tsan-ci:${{ github.sha }}
          cache-from: type=gha,scope=manyforge-dev

      - name: Prune local builder cache after image load
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.sanitizer_builder.outputs.name }}
        run: |
          set -euo pipefail
          image="manyforge-tsan-ci:${GITHUB_SHA}"
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          docker buildx prune --builder "$BUILDER_NAME" --all --force
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$image_id"
          df -h

      - name: Run sanitizer registry in immutable image
        shell: bash
        env:
          SANITIZER_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          image_id="$(docker image inspect "manyforge-tsan-ci:${GITHUB_SHA}" --format '{{.Id}}')"
          if [[ ! "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve immutable development image identity" >&2
            exit 1
          fi
          echo "Qualified image: ${image_id}"
          docker run --rm --platform linux/amd64 \
            --network none \
            --security-opt seccomp=unconfined \
            -e TSAN_OPTIONS='halt_on_error=1 second_deadlock_stack=1 history_size=7 exitcode=66' \
            -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            -e MAKEFLAGS=-j4 \
            -e SANITIZER_SUITE \
            -e BUILD_DIR=/tmp/manyforge-tsan/core \
            -e RELOCATION_PACKAGES_BUILD_ROOT=/tmp/manyforge-tsan/relocation-packages \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${image_id}" \
            setarch x86_64 -R bash -lc '
              set -euo pipefail
              expected_personality=00040000
              parent_personality="$(cat /proc/self/personality)"
              child_personality="$(sh -c "cat /proc/self/personality")"
              if [[ "${parent_personality}" != "${expected_personality}" ||
                    "${child_personality}" != "${expected_personality}" ]]; then
                echo "ADDR_NO_RANDOMIZE inheritance check failed" >&2
                exit 2
              fi
              bash "scripts/ci/run-${SANITIZER_SUITE}-tsan.sh"
            '

      - name: Report runner resources after sanitizer run
        if: always()
        run: |
          df -h
          free -h
          dmesg 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process' || true
