name: cpp-tsan

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "manyforge_core/**"
      - "manyforge_content_identity/**"
      - "manyforge_persistence/**"
      - "manyforge_deployment/**"
      - "manyforge_component_manager/**"
      - "manyforge_scene/**"
      - "scripts/ci/run-core-tsan.sh"
      - "scripts/ci/run-relocation-packages-tsan.sh"
      - "scripts/ci/run-ctest-gtest-binaries-grouped.py"
      - "scripts/ci/tsan.supp"
      - "scripts/setup-docker.sh"
      - ".github/workflows/cpp-tsan.yml"
  push:
    branches: [main, dev]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "manyforge_core/**"
      - "manyforge_content_identity/**"
      - "manyforge_persistence/**"
      - "manyforge_deployment/**"
      - "manyforge_component_manager/**"
      - "manyforge_scene/**"
      - "scripts/ci/run-core-tsan.sh"
      - "scripts/ci/run-relocation-packages-tsan.sh"
      - "scripts/ci/run-ctest-gtest-binaries-grouped.py"
      - "scripts/ci/tsan.supp"
      - "scripts/setup-docker.sh"
      - ".github/workflows/cpp-tsan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-cache:
    name: Build development image cache (tsan)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned RoboPlan Docker context
        run: ./scripts/setup-docker.sh --prepare-only

      - name: Report free disk before image build
        run: df -h

      - uses: docker/setup-buildx-action@v3

      - name: Build and export image layers
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          cache-to: type=gha,scope=manyforge-tsan-${{ github.run_id }}-${{ github.run_attempt }},mode=max,ignore-error=true

      - name: Report free disk after image build
        if: always()
        run: df -h

  manyforge-core-tsan:
    name: C++ ThreadSanitizer (${{ matrix.suite }}, AMD64 Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: image-cache
    strategy:
      fail-fast: false
      matrix:
        suite: [core, relocation-packages]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned RoboPlan Docker context
        run: ./scripts/setup-docker.sh --prepare-only

      - name: Report free disk before image build
        run: df -h

      - uses: docker/setup-buildx-action@v3

      - name: Load development image from cache or rebuild
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: manyforge-tsan-ci:${{ github.sha }}
          cache-from: type=gha,scope=manyforge-tsan-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report image size and free disk after build
        run: |
          docker image inspect "manyforge-tsan-ci:${GITHUB_SHA}" --format 'Image size (bytes): {{.Size}}'
          df -h

      - name: Run sanitizer registry in immutable image
        shell: bash
        env:
          SANITIZER_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          image_id="$(docker image inspect "manyforge-tsan-ci:${GITHUB_SHA}" --format '{{.Id}}')"
          if [[ ! "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve immutable development image identity" >&2
            exit 1
          fi
          echo "Qualified image: ${image_id}"
          docker run --rm --platform linux/amd64 \
            --network none \
            --security-opt seccomp=unconfined \
            -e TSAN_OPTIONS='halt_on_error=1 second_deadlock_stack=1 history_size=7 exitcode=66' \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            -e SANITIZER_SUITE \
            -e BUILD_DIR=/tmp/manyforge-tsan/core \
            -e RELOCATION_PACKAGES_BUILD_ROOT=/tmp/manyforge-tsan/relocation-packages \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${image_id}" \
            setarch x86_64 -R bash -lc '
              set -euo pipefail
              expected_personality=00040000
              parent_personality="$(cat /proc/self/personality)"
              child_personality="$(sh -c "cat /proc/self/personality")"
              if [[ "${parent_personality}" != "${expected_personality}" ||
                    "${child_personality}" != "${expected_personality}" ]]; then
                echo "ADDR_NO_RANDOMIZE inheritance check failed" >&2
                exit 2
              fi
              bash "scripts/ci/run-${SANITIZER_SUITE}-tsan.sh"
            '

      - name: Report free disk after sanitizer run
        if: always()
        run: df -h
