name: cpp-asan

on:
  pull_request:
    paths:
      - "manyforge_core/**"
      - "scripts/ci/run-core-asan.sh"
      - ".github/workflows/cpp-asan.yml"
  push:
    branches: [main, dev]
    paths:
      - "manyforge_core/**"
      - "scripts/ci/run-core-asan.sh"
      - ".github/workflows/cpp-asan.yml"
  workflow_dispatch:

jobs:
  manyforge-core-asan:
    name: manyforge_core AddressSanitizer
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:exitcode=66
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:exitcode=66
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libgtest-dev
      - name: Run core C++ tests under AddressSanitizer
        run: bash scripts/ci/run-core-asan.sh
