name: cpp-asan

on:
  pull_request:
    paths:
      - "manyforge_core/**"
      - "manyforge_deployment/**"
      - "manyforge_component_manager/**"
      - "scripts/ci/run-core-asan.sh"
      - "scripts/ci/run-deployment-asan.sh"
      - "scripts/ci/run-component-manager-asan.sh"
      - "scripts/ci/run-ctest-gtest-binaries-grouped.py"
      - ".github/workflows/cpp-asan.yml"
  push:
    branches: [main, dev]
    paths:
      - "manyforge_core/**"
      - "manyforge_deployment/**"
      - "manyforge_component_manager/**"
      - "scripts/ci/run-core-asan.sh"
      - "scripts/ci/run-deployment-asan.sh"
      - "scripts/ci/run-component-manager-asan.sh"
      - "scripts/ci/run-ctest-gtest-binaries-grouped.py"
      - ".github/workflows/cpp-asan.yml"
  workflow_dispatch:

jobs:
  manyforge-cpp-asan:
    name: ROS-free C++ AddressSanitizer
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:exitcode=66
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:exitcode=66
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libdouble-conversion-dev libgtest-dev libssl-dev \
            libexpat1-dev libsqlite3-dev libutf8proc-dev libyaml-dev pkg-config
      - name: Run core C++ tests under AddressSanitizer
        run: bash scripts/ci/run-core-asan.sh
      - name: Run deployment C++ tests under AddressSanitizer
        run: bash scripts/ci/run-deployment-asan.sh
      - name: Run Component Manager C++ tests under AddressSanitizer
        run: bash scripts/ci/run-component-manager-asan.sh
