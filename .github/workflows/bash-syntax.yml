name: bash-syntax

on:
  pull_request:
    paths:
      - "scripts/**/*.sh"
      - ".github/workflows/bash-syntax.yml"
  push:
    branches: [main, dev]
    paths:
      - "scripts/**/*.sh"
      - ".github/workflows/bash-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-syntax:
    name: bash -n on all shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every shell script
        run: |
          set -euo pipefail
          errors=0
          while IFS= read -r script; do
            if ! bash -n "${script}" 2>&1; then
              echo "syntax error in ${script}" >&2
              errors=$((errors + 1))
            fi
          done < <(find scripts -type f -name '*.sh')
          if (( errors > 0 )); then
            echo "Found ${errors} script(s) with syntax errors" >&2
            exit 1
          fi
          echo "All shell scripts pass bash -n"
