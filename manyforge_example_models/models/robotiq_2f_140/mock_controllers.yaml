# Mock controllers of the Robotiq 2F-140 (lanes.mock.controllers_file): its
# commanded finger joint on a stock parallel gripper action controller (stock
# defaults for every Mock gripper), in the manager rates of the robots it
# mounts on (UR). The generator names the manager and writes
# __controller__ and __gripper_joint__.
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: false
    hardware_components_initial_state:
      shutdown_on_initial_state_failure: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    __controller__:
      type: parallel_gripper_action_controller/GripperActionController

/**/__controller__:
  ros__parameters:
    joint: __gripper_joint__
    goal_tolerance: 0.01
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
    allow_stalling: false
