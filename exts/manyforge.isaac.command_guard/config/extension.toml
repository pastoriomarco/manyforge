[package]
version = "0.1.0"
category = "Robotics"
title = "ManyForge Isaac Command Guard"
description = "Stamped JointState receiving guard and scoped position writer."

[dependencies]
"isaacsim.ros2.bridge" = {}
"isaacsim.core.prims" = {}
"isaacsim.core.simulation_manager" = {}

[[python.module]]
name = "manyforge.isaac.command_guard.extension"

[settings]
exts."manyforge.isaac.command_guard".enabled = false
# Enable only with the authored arm-writer cutover and four scene-owned inputs:
# articulation_prim_path, joint_names (JTC order), command_topic,
# max_command_age_ns. Authorization/status topics derive from command_topic.
# Merge the explicit per-scene TOML through Kit --merge-config; no age default.
