# Bounded container logs on every service: the request/status logging is
# chatty and an unbounded json-file log slowly fills the Jetson's eMMC.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROBOPLAN_SOURCE_MODE: ${ROBOPLAN_SOURCE_MODE:-qualified}
    logging: *default-logging
    security_opt:
      # ThreadSanitizer needs personality(ADDR_NO_RANDOMIZE), which Docker's
      # default seccomp profile blocks on this platform. Phase-4 release
      # qualification runs the TSan collision-engine lane in this dev service.
      - seccomp=unconfined
    volumes:
      - .:/workspace
      # Deliberately no persistent CMake volume: every canonical
      # `docker compose run --rm dev` test invocation gets an image-local,
      # container-local build root and cannot consume products from an older
      # dev image. Runtime launchers bind their own immutable-image-keyed cache.
    working_dir: /workspace
    stdin_open: true
    tty: true

  # Structural-only Composer shell. This is not a runtime or lane surface.
  composer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROBOPLAN_SOURCE_MODE: ${ROBOPLAN_SOURCE_MODE:-qualified}
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - .:/workspace
    environment:
      MANYFORGE_CORS_ORIGINS: ${MANYFORGE_CORS_ORIGINS:-http://localhost:3000}
      MANYFORGE_FS_ROOTS: ${MANYFORGE_FS_ROOTS:-/workspace}
    working_dir: /workspace
    command: ["bash", "-lc", "python -m manyforge_composer --host 0.0.0.0 --port 9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    profiles:
      - composer

  # Composer source/API debug mode: FastAPI + Vite with hot reload. Like the
  # raw `composer` profile, this is not a qualified execution lane.
  composer-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROBOPLAN_SOURCE_MODE: ${ROBOPLAN_SOURCE_MODE:-qualified}
    logging: *default-logging
    ports:
      - "9000:9000"
    volumes:
      - .:/workspace
    environment:
      MANYFORGE_CORS_ORIGINS: ${MANYFORGE_CORS_ORIGINS:-http://localhost:3000}
      MANYFORGE_FS_ROOTS: ${MANYFORGE_FS_ROOTS:-/workspace}
    working_dir: /workspace
    command: ["bash", "-lc", "python -m manyforge_composer --host 0.0.0.0 --port 9000"]
    profiles:
      - dev-composer

  composer-ui:
    image: node:22-slim
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - ./manyforge_composer/frontend:/app
    working_dir: /app
    command: ["bash", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    profiles:
      - dev-composer

  # ROS adapter/wrapper checks use the official full Lyrical toolchain.
  # Keep this legacy service name as a compatibility alias.
  # Host networking is intentional for ROS 2 DDS discovery during development.
  ros-jazzy:
    image: ${MANYFORGE_ROS_FULL_IMAGE:-manyforge-ros-lyrical-full}
    logging: *default-logging
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
    working_dir: /workspace
    stdin_open: true
    tty: true
    profiles:
      - ros

  # Full ROS-capable ManyForge image: the workbench image started by
  # scripts/compose-dev.sh (build it with `./scripts/compose-dev.sh build`),
  # also used for development/build/test checks. It includes the pinned
  # controller overlay and the xArm driver.
  # Host networking is intentional for ROS 2 DDS discovery during development.
  ros-jazzy-full:
    # This is the sole build owner for the ROS-full image.
    image: ${MANYFORGE_ROS_FULL_IMAGE:-manyforge-ros-lyrical-full}
    build:
      context: .
      dockerfile: Dockerfile.ros-lyrical-full
      args:
        ROBOPLAN_SOURCE_MODE: ${ROBOPLAN_SOURCE_MODE:-qualified}
        # noble on x86_64, noble-jetpack on Jetson (compose-dev.sh build selects it).
        NVIDIA_ISAAC_ROS_RELEASE_SUITE: ${NVIDIA_ISAAC_ROS_RELEASE_SUITE:-noble}
        CMAKE_BUILD_PARALLEL_LEVEL: ${CMAKE_BUILD_PARALLEL_LEVEL:-4}
    logging: *default-logging
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
    working_dir: /workspace
    stdin_open: true
    tty: true
    profiles:
      - ros-full
