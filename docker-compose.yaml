# Bounded container logs on every service: the request/status logging is
# chatty and an unbounded json-file log slowly fills the Jetson's eMMC.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROBOPLAN_SOURCE_MODE: ${ROBOPLAN_SOURCE_MODE:-qualified}
    logging: *default-logging
    security_opt:
      # ThreadSanitizer needs personality(ADDR_NO_RANDOMIZE), which Docker's
      # default seccomp profile blocks on this platform. Phase-4 release
      # qualification runs the TSan collision-engine lane in this dev service.
      - seccomp=unconfined
    volumes:
      - .:/workspace
      # Deliberately no persistent CMake volume: every canonical
      # `docker compose run --rm dev` test invocation gets an image-local,
      # container-local build root and cannot consume products from an older
      # dev image. Runtime launchers bind their own immutable-image-keyed cache.
    working_dir: /workspace
    stdin_open: true
    tty: true

  # Structural-only Composer shell. This is not a runtime or lane surface.
  composer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROBOPLAN_SOURCE_MODE: ${ROBOPLAN_SOURCE_MODE:-qualified}
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - .:/workspace
    environment:
      MANYFORGE_CORS_ORIGINS: ${MANYFORGE_CORS_ORIGINS:-http://localhost:3000}
      MANYFORGE_FS_ROOTS: ${MANYFORGE_FS_ROOTS:-/workspace}
    working_dir: /workspace
    command: ["bash", "-lc", "python -m manyforge_composer --host 0.0.0.0 --port 9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    profiles:
      - composer

  # Composer source/API debug mode: FastAPI + Vite with hot reload. Like the
  # raw `composer` profile, this is not a qualified execution lane.
  composer-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROBOPLAN_SOURCE_MODE: ${ROBOPLAN_SOURCE_MODE:-qualified}
    logging: *default-logging
    ports:
      - "9000:9000"
    volumes:
      - .:/workspace
    environment:
      MANYFORGE_CORS_ORIGINS: ${MANYFORGE_CORS_ORIGINS:-http://localhost:3000}
      MANYFORGE_FS_ROOTS: ${MANYFORGE_FS_ROOTS:-/workspace}
    working_dir: /workspace
    command: ["bash", "-lc", "python -m manyforge_composer --host 0.0.0.0 --port 9000"]
    profiles:
      - dev-composer

  composer-ui:
    image: node:22-slim
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - ./manyforge_composer/frontend:/app
    working_dir: /app
    command: ["bash", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    profiles:
      - dev-composer

  # ROS Jazzy lane for ROS adapter/wrapper development and validation.
  # Host networking is intentional for ROS 2 DDS discovery during development.
  ros-jazzy:
    build:
      context: .
      dockerfile: Dockerfile.ros-jazzy
    logging: *default-logging
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
    working_dir: /workspace
    stdin_open: true
    tty: true
    profiles:
      - ros

  # Full ROS-capable ManyForge development/build/test toolchain image.
  # Host networking is intentional for ROS 2 DDS discovery during development.
  ros-jazzy-full:
    # This is the sole build owner for the ROS-full toolchain image. Runtime
    # services below remain fenced port targets until their restoration gates.
    image: ${MANYFORGE_ROS_FULL_IMAGE:-manyforge-ros-jazzy-full}
    build:
      context: .
      dockerfile: Dockerfile.ros-jazzy-full
      args:
        ROBOPLAN_SOURCE_MODE: ${ROBOPLAN_SOURCE_MODE:-qualified}
    logging: *default-logging
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
    working_dir: /workspace
    stdin_open: true
    tty: true
    profiles:
      - ros-full

  # ROS Composer porting target. Its start script exits with the stable
  # composable-cell unavailable result before loading ROS adapters or touching
  # a runtime. Only the shared ROS toolchain/container inputs remain here;
  # deleted Composer runtime wires are not kept as dormant environment fields.
  composer-ros:
    image: ${MANYFORGE_ROS_FULL_IMAGE:-manyforge-ros-jazzy-full}
    logging: *default-logging
    restart: "no"
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
      - ros-full-build-cache:/tmp/manyforge-build
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
    working_dir: /workspace
    command: ["bash", "-lc", "./scripts/ros/start-composer-ros.sh"]
    profiles:
      - ros-full

  # I9 mechanical Isaac ros2_control product. Isaac remains a separately
  # owned laptop process; this Orin-side service builds into the persistent
  # cache, proves the exact stopped world, then exposes JTC and thin adapters.
  # Composer/Program auto-load and DemoSupervisor ownership remain absent.
  isaac-topic-control:
    image: ${MANYFORGE_ROS_FULL_IMAGE:-manyforge-ros-jazzy-full}
    logging: *default-logging
    restart: "no"
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
      - ros-full-build-cache:/tmp/manyforge-build
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE=${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      - ROS_STATIC_PEERS=${ROS_STATIC_PEERS:-192.168.1.132;192.168.1.68}
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
    working_dir: /workspace
    command: ["bash", "-lc", "./scripts/ros/launch-isaac-topic-based-control.sh"]
    profiles:
      - ros-full

volumes:
  ros-full-build-cache:
    name: ${MANYFORGE_ROS_FULL_BUILD_CACHE_VOLUME:-manyforge_ros-full-build-cache}
