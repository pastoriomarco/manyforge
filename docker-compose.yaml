# Bounded container logs on every service: the request/status logging is
# chatty and an unbounded json-file log slowly fills the Jetson's eMMC.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    logging: *default-logging
    security_opt:
      # ThreadSanitizer needs personality(ADDR_NO_RANDOMIZE), which Docker's
      # default seccomp profile blocks on this platform. Phase-4 release
      # qualification runs the TSan collision-engine lane in this dev service.
      - seccomp=unconfined
    volumes:
      - .:/workspace
      - build-cache:/tmp/manyforge-build
    working_dir: /workspace
    stdin_open: true
    tty: true

  # Composer backend (FastAPI on 9000) — production mode serves built frontend
  composer:
    build:
      context: .
      dockerfile: Dockerfile
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - .:/workspace
      - build-cache:/tmp/manyforge-build
    environment:
      MANYFORGE_VALIDATION_COLLISION_WORKERS: ${MANYFORGE_VALIDATION_COLLISION_WORKERS:-}
      MANYFORGE_NODE_ROOTS: ${MANYFORGE_NODE_ROOTS:-}
      MANYFORGE_NODE_STRICT: ${MANYFORGE_NODE_STRICT:-}
      MANYFORGE_SCENARIO_ROOTS: ${MANYFORGE_SCENARIO_ROOTS:-}
      MANYFORGE_POINTCLOUD_QUALIFICATION_FIXTURE: ${MANYFORGE_POINTCLOUD_QUALIFICATION_FIXTURE:-OFF}
      MANYFORGE_POINTCLOUD_QUALIFICATION_POINTS: ${MANYFORGE_POINTCLOUD_QUALIFICATION_POINTS:-20000}
      MANYFORGE_POINTCLOUD_QUALIFICATION_RATE_HZ: ${MANYFORGE_POINTCLOUD_QUALIFICATION_RATE_HZ:-10}
      MANYFORGE_VIEWER_QUALIFICATION_FIXTURES: ${MANYFORGE_VIEWER_QUALIFICATION_FIXTURES:-OFF}
      # Traces live under the repo bind mount so they survive reboots and
      # container recreation with correct (host-user) ownership; a fresh
      # named volume would be root-owned while Composer runs non-root.
      MANYFORGE_TRACE_DIR: /workspace/.manyforge-var/traces
    working_dir: /workspace
    command: ["bash", "-lc", "python -m manyforge_composer --catalog-path /workspace/manyforge_behavior/resources/node_catalog.yaml --host 0.0.0.0 --port 9000"]
    # Heartbeat, not /api/health: the heartbeat computes real kernel state,
    # so "healthy" means the app can actually read its kernel. Degraded /
    # intervention states still return 200 on purpose — a robot waiting for
    # an operator must never be restart-looped by the supervisor.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/infra/heartbeat >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    profiles:
      - composer

  # Composer dev mode: FastAPI + Vite dev server with hot reload
  composer-api:
    build:
      context: .
      dockerfile: Dockerfile
    logging: *default-logging
    ports:
      - "9000:9000"
    volumes:
      - .:/workspace
      - build-cache:/tmp/manyforge-build
    environment:
      MANYFORGE_VALIDATION_COLLISION_WORKERS: ${MANYFORGE_VALIDATION_COLLISION_WORKERS:-}
      MANYFORGE_NODE_ROOTS: ${MANYFORGE_NODE_ROOTS:-}
      MANYFORGE_NODE_STRICT: ${MANYFORGE_NODE_STRICT:-}
      MANYFORGE_SCENARIO_ROOTS: ${MANYFORGE_SCENARIO_ROOTS:-}
      MANYFORGE_TRACE_DIR: /workspace/.manyforge-var/traces
    working_dir: /workspace
    command: ["bash", "-lc", "python -m manyforge_composer --catalog-path /workspace/manyforge_behavior/resources/node_catalog.yaml --host 0.0.0.0 --port 9000"]
    profiles:
      - dev-composer

  composer-ui:
    image: node:22-slim
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - ./manyforge_composer/frontend:/app
    working_dir: /app
    command: ["bash", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    profiles:
      - dev-composer

  # ROS Jazzy lane for ROS adapter/wrapper development and validation.
  # Host networking is intentional for ROS 2 DDS discovery during development.
  ros-jazzy:
    build:
      context: .
      dockerfile: Dockerfile.ros-jazzy
    logging: *default-logging
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
      - ros-build-cache:/tmp/manyforge-build
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
    working_dir: /workspace
    stdin_open: true
    tty: true
    profiles:
      - ros

  # Full ROS-capable ManyForge runtime/test image.
  # Host networking is intentional for ROS 2 DDS discovery during development.
  ros-jazzy-full:
    # This is the sole build owner for the ROS-full image. Runtime services
    # below consume this exact tag instead of maintaining independently cached
    # images from the same Dockerfile.
    image: ${MANYFORGE_ROS_FULL_IMAGE:-manyforge-ros-jazzy-full}
    build:
      context: .
      dockerfile: Dockerfile.ros-jazzy-full
    logging: *default-logging
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
      - ros-full-build-cache:/tmp/manyforge-build
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
    working_dir: /workspace
    stdin_open: true
    tty: true
    profiles:
      - ros-full

  # Composer in the ROS-capable full image. Use this profile for deployments
  # selecting execution.ros2_control_follow_joint_trajectory so Composer can
  # load ROS adapter code and discover Isaac/robot ROS endpoints over DDS.
  composer-ros:
    image: ${MANYFORGE_ROS_FULL_IMAGE:-manyforge-ros-jazzy-full}
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
      - ros-full-build-cache:/tmp/manyforge-build
    # Heartbeat healthcheck: see the `composer` service note — degraded /
    # intervention states stay 200 by design so a robot awaiting operator
    # action is never restart-looped.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${MANYFORGE_COMPOSER_PORT:-9000}/api/infra/heartbeat >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Assistant provider/endpoint env vars are passed through so the unified
    # launcher (scripts/launch.sh) can wire Composer to the bridge of its
    # chosen ASSISTANT_PROVIDER lane (openclaw -> :8200, nemoclaw -> :8100).
    # Empty defaults mean Composer falls back to the deployment YAML's
    # pinned base_url, which is the existing behaviour when the lane
    # selector is `--assistant off` or compose is invoked without the
    # launcher.
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
      - MANYFORGE_ASSISTANT_PROVIDER=${MANYFORGE_ASSISTANT_PROVIDER:-}
      - MANYFORGE_ASSISTANT_ENDPOINT_URL=${MANYFORGE_ASSISTANT_ENDPOINT_URL:-}
      - MANYFORGE_ASSISTANT_TIMEOUT_S=${MANYFORGE_ASSISTANT_TIMEOUT_S:-}
      - MANYFORGE_COMPOSER_PORT=${COMPOSER_PORT:-9000}
      - MANYFORGE_VALIDATION_COLLISION_WORKERS=${MANYFORGE_VALIDATION_COLLISION_WORKERS:-}
      - MANYFORGE_FRONTEND_SOURCE_MODE=${MANYFORGE_FRONTEND_SOURCE_MODE:-committed}
      - MANYFORGE_FRONTEND_FORCE_REBUILD=${MANYFORGE_FRONTEND_FORCE_REBUILD:-}
      - MANYFORGE_NODE_ROOTS=${MANYFORGE_NODE_ROOTS:-}
      - MANYFORGE_NODE_STRICT=${MANYFORGE_NODE_STRICT:-}
      - MANYFORGE_SCENARIO_ROOTS=${MANYFORGE_SCENARIO_ROOTS:-}
      - MANYFORGE_POINTCLOUD_QUALIFICATION_FIXTURE=${MANYFORGE_POINTCLOUD_QUALIFICATION_FIXTURE:-OFF}
      - MANYFORGE_POINTCLOUD_QUALIFICATION_POINTS=${MANYFORGE_POINTCLOUD_QUALIFICATION_POINTS:-20000}
      - MANYFORGE_POINTCLOUD_QUALIFICATION_RATE_HZ=${MANYFORGE_POINTCLOUD_QUALIFICATION_RATE_HZ:-10}
      - MANYFORGE_VIEWER_QUALIFICATION_FIXTURES=${MANYFORGE_VIEWER_QUALIFICATION_FIXTURES:-OFF}
      # Opt-in RP5 qualification instrumentation. The start script exports the
      # preload only after the requested probe has built successfully, so
      # normal runtime commands never inherit a missing or test-only library.
      - MANYFORGE_ENABLE_QUALIFICATION_PROBES=${MANYFORGE_ENABLE_QUALIFICATION_PROBES:-OFF}
      - MANYFORGE_QUALIFICATION_LD_PRELOAD=${MANYFORGE_QUALIFICATION_LD_PRELOAD:-}
      # See the `composer` service note on trace persistence/ownership.
      - MANYFORGE_TRACE_DIR=/workspace/.manyforge-var/traces
    working_dir: /workspace
    command: ["bash", "-lc", "./scripts/ros/start-composer-ros.sh"]
    profiles:
      - ros-full

  # Isaac Sim ros2_control bridge. Start this alongside composer-ros when
  # executing against Isaac's /isaac_joint_states and /isaac_joint_commands
  # topics through the standard FollowJointTrajectory surface.
  isaac-topic-control:
    image: ${MANYFORGE_ROS_FULL_IMAGE:-manyforge-ros-jazzy-full}
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    ipc: host
    volumes:
      - .:/workspace
      - ros-full-build-cache:/tmp/manyforge-build
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_AUTOMATIC_DISCOVERY_RANGE
      - ROS_STATIC_PEERS
      - FASTRTPS_DEFAULT_PROFILES_FILE
      - FASTDDS_DEFAULT_PROFILES_FILE
      # LOAD_ARTIFACTS is the operator-facing escape hatch inherited from
      # the old demo-isaac-ros2-control.sh. SUPERVISOR_AUTO_LOAD takes
      # precedence when set explicitly (scripts/lib/isaac.sh exports it);
      # raw `docker compose --profile ros-full up` users can set
      # LOAD_ARTIFACTS=false directly without going through the launcher.
      - COMPOSER_URL=${COMPOSER_URL:-http://127.0.0.1:9000}
      - PROGRAM_PATH=${PROGRAM_PATH:-/workspace/examples/isaac_manipulator_scene_light.program.yaml}
      - DEPLOYMENT_PATH=${DEPLOYMENT_PATH:-/workspace/examples/isaac_manipulator_scene_light_ros2_control.deployment.yaml}
      - ISAAC_TOPIC_CONTROL_PROFILE=${ISAAC_TOPIC_CONTROL_PROFILE:-}
      - SUPERVISOR_AUTO_LOAD=${SUPERVISOR_AUTO_LOAD:-${LOAD_ARTIFACTS:-true}}
    working_dir: /workspace
    command: ["bash", "-lc", "./scripts/ros/launch-isaac-topic-based-control.sh"]
    profiles:
      - ros-full

volumes:
  build-cache:
  ros-build-cache:
  ros-full-build-cache:
