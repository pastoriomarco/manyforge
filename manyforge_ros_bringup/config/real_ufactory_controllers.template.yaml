# Deployment generator input for Real UFACTORY components (same rules as
# mock_ufactory_controllers.template.yaml). D7 (maintainer, 2026-10-27): the
# values are ManyMove's battle-tested ones, i.e. the vendor
# xarm_controller/config/lite6_controllers.yaml ManyMove loads (xarm_ros2
# c3172e57; byte-equal to upstream): position+velocity command interfaces and
# the 10 Hz action monitor. `interpolate_from_desired_state: true` is ManyMove's
# Humble `open_loop_control: true` (its deprecated alias). Only ManyForge's
# Stop needs remain added: decelerate_on_cancel with the deployment's per-joint
# bounds, explicit `allow_trajectory_replacement: true` (= the stock 6.10 JTC
# default) and the inactive hardware start. Each joint's `goal` is the profile
# row's arrival tolerance (0.01 rad, ManyMove's value), kept on every goal.
/**/controller_manager:
  ros__parameters:
    update_rate: 150
    enforce_command_limits: false
    hardware_components_initial_state:
      shutdown_on_initial_state_failure: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    __arm_controller__:
      type: joint_trajectory_controller/JointTrajectoryController

/**/__arm_controller__:
  ros__parameters:
    joints: [__joint__]
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]
    state_publish_rate: 25.0
    action_monitor_rate: 20.0
    interface_name: position
    interpolate_from_desired_state: true
    allow_trajectory_replacement: true
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      decelerate_on_cancel: true
      __joint__: {max_deceleration_on_cancel: null}
