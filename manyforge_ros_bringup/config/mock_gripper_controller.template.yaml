# Optional deployment generator input, not a runnable configuration.
# Include only for an authored model-backed mock gripper. Replace the manager,
# controller and single commanded joint with exact retained names; never add
# mimic followers or invent a joint/initial value. The URDF generator owns seed.
# Q74 uses stock GripperActionController defaults for every mock gripper.
/**/controller_manager:
  ros__parameters:
    __gripper_controller__:
      type: position_controllers/GripperActionController

/**/__gripper_controller__:
  ros__parameters:
    joint: __gripper_joint__
    goal_tolerance: 0.01
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
    allow_stalling: false
