manyforge_isaac_gripper_action_bridge:
  ros__parameters:
    action_name: /robotiq_gripper_controller/gripper_cmd
    command_topic: /isaac_gripper_state
    state_topic: /isaac_joint_states
    commanded_joint: finger_joint
    # The USD articulation couples the remaining Robotiq joints mechanically.
    # Publishing targets for those passive/fixed joints over-constrains the
    # articulation and can destabilize it across repeated cycles. Keep the
    # canonical RMA command authority on the single independent drive joint;
    # /isaac_joint_states remains the observed source for the complete gripper.
    joint_names:
      - finger_joint
    multipliers: [1.0]
    offsets: [0.0]
    completion_tolerance_rad: 0.04
    state_freshness_timeout_s: 1.0
    # Emergency ceiling only. The ManyForge C++ ROS gripper owner normally
    # cancels first at motion_time_s + result_timeout_s (15.8 s in the light
    # scene deployments); this later bound prevents orphaned external goals.
    goal_timeout_s: 20.0
    publish_period_s: 0.05
    hold_last_target: true
    require_state_before_goal: true
    require_all_state_joints: true
