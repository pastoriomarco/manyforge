/**/controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: false
    hardware_components_initial_state:
      shutdown_on_initial_state_failure: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    isaac_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/isaac_arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolation_method: splines
    interpolate_from_desired_state: true
    allow_trajectory_replacement: false
    set_last_command_interface_value_as_state_on_activation: false
    constraints:
      decelerate_on_cancel: true
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      joint1: { trajectory: 0.2, goal: 0.05, max_deceleration_on_cancel: 8.0 }
      joint2: { trajectory: 0.2, goal: 0.05, max_deceleration_on_cancel: 8.0 }
      joint3: { trajectory: 0.2, goal: 0.05, max_deceleration_on_cancel: 8.0 }
      joint4: { trajectory: 0.2, goal: 0.05, max_deceleration_on_cancel: 8.0 }
      joint5: { trajectory: 0.2, goal: 0.05, max_deceleration_on_cancel: 8.0 }
      joint6: { trajectory: 0.2, goal: 0.05, max_deceleration_on_cancel: 8.0 }
