# Mock lane controller rows, one per `mock_profile` id (robots as data, E1).
# Embedded at build time into the host's controller launch artifacts
# (scripts/components/mock_controller_profiles.py); a Deployment component's
# `mock_profile` selects its row. `manyforge component register` writes a
# robot's row from its component.yaml `lanes.mock.controllers` (same field
# names); `manyforge component check <folder>` compares the two.
#
# template: closed list in code. `ufactory` = Track 2's UFACTORY template
#   (xArm 5/6/7, Lite 6, UF850); `ur` = the UR template, which carries its
#   retained constraints, so `vendor_joint_constraints` stays absent.
# vendor_joint_constraints: the trajectory constraint copied exactly from the
#   model's vendor controller file (every joint has the same value); required
#   for `ufactory`.
# arrival_tolerance_rad: the Mock lane's arrival tolerance, written as every
#   arm joint's JTC `goal` constraint and kept on every goal (maintainer
#   2026-10-28: a motion arrives when JTC reports it finished AND every joint
#   is within this tolerance). Mock hardware mirrors its command, so the value
#   is tight. Absent on a gripper-only row.
# arm_controller: the JointTrajectoryController name; absent on a
#   gripper-only row (a tool component, merge 6). The template still supplies
#   the controller manager's rates.
# gripper_controller: the GripperActionController name; absent when the
#   model has no commanded gripper joint (UR5, the split arms).
# Timeouts (Q79): Isaac's values per model family.
#
# Arm controller names and constraints are the retained controller files' own:
# xarm_ros2 c3172e57 xarm_controller/config/<model>_controllers.yaml
# (`<model>_traj_controller`, {trajectory: 1.0, goal: 0.01} on every joint; the
# goal is now the row's arrival tolerance, the same 0.01) and
# ManyMove manymove_bringup/config/ur/ur_with_robotiq_controllers.yaml
# (`joint_trajectory_controller`). Gripper controllers follow Track 2's mapping
# (SX-280).
#
# Merge 6: robots and tools are separate components. An arm row (`lite6`,
# `uf850`, `ur10e`, `ur5e`) has no gripper controller and a tool row
# (`lite_gripper`, `xarm_gripper`, `robotiq_2f_140`, `robotiq_2f_85`) no arm
# controller; each keeps its family's template and timeouts. The combined rows
# (`lite6_lite_gripper`, `uf850_xarm_gripper`, `ur10e_robotiq_2f_140`,
# `ur5e_robotiq_2f_85`) remain for the combined test fixtures only (D2).
mock_profiles:
  - mock_profile: lite6_lite_gripper
    template: ufactory
    hardware_component_name: MockLite6LiteGripperSystem
    arm_controller: lite6_traj_controller
    vendor_joint_constraints: {trajectory: "1.0"}
    gripper_controller: lite_gripper_controller
    hard_stop_completion_timeout_s: 1.5
    gripper_result_timeout_s: 5.0
    arrival_tolerance_rad: 0.01
  - mock_profile: uf850_xarm_gripper
    template: ufactory
    hardware_component_name: MockUF850XArmGripperSystem
    arm_controller: uf850_traj_controller
    vendor_joint_constraints: {trajectory: "1.0"}
    gripper_controller: xarm_gripper_controller
    hard_stop_completion_timeout_s: 1.5
    gripper_result_timeout_s: 5.0
    arrival_tolerance_rad: 0.01
  - mock_profile: ur10e_robotiq_2f_140
    template: ur
    hardware_component_name: MockUR10eRobotiq2F140System
    arm_controller: joint_trajectory_controller
    gripper_controller: robotiq_gripper_controller
    hard_stop_completion_timeout_s: 0.5
    gripper_result_timeout_s: 15.0
    arrival_tolerance_rad: 0.01
