/**/controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: false
    hardware_components_initial_state:
      shutdown_on_initial_state_failure: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    isaac_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/isaac_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolation_method: splines
    interpolate_from_desired_state: true
    allow_trajectory_replacement: false
    set_last_command_interface_value_as_state_on_activation: true
    constraints:
      decelerate_on_cancel: true
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.2, goal: 0.1, max_deceleration_on_cancel: 10.0 }
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.1, max_deceleration_on_cancel: 10.0 }
      elbow_joint: { trajectory: 0.2, goal: 0.1, max_deceleration_on_cancel: 10.0 }
      wrist_1_joint: { trajectory: 0.2, goal: 0.1, max_deceleration_on_cancel: 10.0 }
      wrist_2_joint: { trajectory: 0.2, goal: 0.1, max_deceleration_on_cancel: 10.0 }
      wrist_3_joint: { trajectory: 0.2, goal: 0.1, max_deceleration_on_cancel: 10.0 }
