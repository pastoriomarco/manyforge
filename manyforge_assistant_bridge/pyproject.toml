[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyforge_assistant_bridge"
version = "0.1.0"
description = "Bounded ManyForge assistant provider bridge and owner-neutral read client"
license = { text = "Apache-2.0" }
authors = [{ name = "Marco Pastorio" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "manyforge_headless_api>=0.1.0,<0.2.0",
    "pydantic>=2.7",
    "rfc8785==0.1.4",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
# Flat layout — the directory containing this pyproject.toml IS the package.
package-dir = { "manyforge_assistant_bridge" = "." }
packages = ["manyforge_assistant_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
