[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyforge_assistant_bridge"
version = "0.1.0"
description = "Retained ManyForge assistant protocol and supervisor port targets; live provider bridge unavailable during the composable-cell cutover"
license = { text = "Apache-2.0" }
authors = [{ name = "Marco Pastorio" }]
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
# Flat layout — the directory containing this pyproject.toml IS the package.
package-dir = { "manyforge_assistant_bridge" = "." }
packages = ["manyforge_assistant_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
