# Approved initial values, not device qualification. Supply all required model,
# settle/duplicate/crop/matching/gate/refinement/symmetry settings in a reviewed
# parameter file before running. Missing settings refuse component construction.
instance_pose_sequencer:
  ros__parameters:
    component_container: /phase1_components
    buffer_frames: 2
    completion_grace_s: 1.5
    prior_age_enabled: true
    prior_max_age_s: 30.0
    cache_byte_budget: 33554432
    mask_margin_px: 0
# Required (no fabricated values): model_id, model_revision, settle_frames,
# duplicate_iou, crop_side, max_reuse, prior_iou, prior_center_px,
# prior_size_ratio, unchanged_tol_m, unchanged_max_fraction,
# small_change_max_fraction, small_change_max_m, colour_tol,
# colour_unchanged_max_fraction, colour_small_change_max_fraction,
# refine_max_translation, refine_max_rotation, asset_symmetry_axes,
# asset_symmetry_quaternions (xyzw groups; identity is a valid explicit group).
# The launch shares asset_symmetry_axes with FoundationPose; for the recorded
# trocar asset, supply [x_full] explicitly rather than a second native setting.
