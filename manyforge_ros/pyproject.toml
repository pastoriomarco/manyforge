[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyforge_ros"
version = "0.0.1"
description = "ManyForge ROS adapter and test scaffolding"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
