schema_version: manyforge.operator_alarm_catalog.v1
catalog_version: 2.2.0
descriptor_digest: sha256:c8c0bfebd53655ae7b0acbd30c6ad55df50c63745cd5f4868892e49339b808b6
definitions:
  - definition_id: manyforge.motion.runtime_collision
    version: 2
    title: Runtime collision stop
    message_template: "Collision stop on {subject_id}"
    alarm_class: motion
    priority: critical
    priority_rationale: >-
      A collision-triggered motion stop requires immediate awareness before
      recovery; priority does not imply a safety-rated annunciator.
    consequence: >-
      Motion remains stopped and attempting recovery without inspecting the
      contact can repeat or worsen the collision episode.
    operator_response: >-
      Inspect the normalized contact pair and recovery offer, remove or repair
      the cause, acknowledge attention, then use the permitted recovery action.
    scope_fields: [subject_kind, subject_id, resource_ids]
    set_authority: manyforge.kernel.runtime_collision_condition
    clear_authority: manyforge.kernel.runtime_collision_condition
    adapter_id: manyforge.alarm_adapter.kernel_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 32

  - definition_id: manyforge.motion.execution_fault
    version: 2
    title: Motion execution fault
    message_template: "Operation fault on {subject_id}"
    alarm_class: motion
    priority: high
    priority_rationale: >-
      The current motion/recovery context cannot proceed without prompt
      operator attention but is not a reported collision condition.
    consequence: >-
      The affected execution remains stopped or unavailable until the recovery
      context is resolved or reset.
    operator_response: >-
      Review the fault and recovery offer, repair the reported cause,
      acknowledge attention, then select an enabled recovery or safe reset.
    scope_fields: [subject_kind, subject_id, resource_ids]
    set_authority: manyforge.kernel.operation_condition
    clear_authority: manyforge.kernel.operation_condition
    adapter_id: manyforge.alarm_adapter.kernel_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 32

  - definition_id: manyforge.motion.stop_fault
    version: 1
    title: Motion Stop requires recovery
    message_template: "Stop recovery required for {subject_id}"
    alarm_class: motion
    priority: high
    priority_rationale: >-
      Motion admission remains closed because an exact Stop outcome escalated,
      became uncertain, or otherwise requires explicit recovery.
    consequence: >-
      New motion cannot be admitted until the latched Stop condition is reset
      against its exact certificate and current runtime context.
    operator_response: >-
      Review the Stop reason, latch, and certificate, acknowledge attention,
      then use Reset when the runtime offers that exact recovery action.
    scope_fields: [subject_kind, subject_id, resource_ids]
    set_authority: manyforge.kernel.stop_fault_condition
    clear_authority: manyforge.kernel.stop_fault_condition
    adapter_id: manyforge.alarm_adapter.kernel_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 32

  - definition_id: manyforge.scene.pose_apply_fault
    version: 2
    title: Observed pose could not be applied
    message_template: "Pose apply failed on {subject_id}"
    alarm_class: scene
    priority: high
    priority_rationale: >-
      Execution must not use a scene whose required observed object cannot be
      updated after initialization is complete.
    consequence: >-
      The planning scene can remain stale or inconsistent with the required
      observation source.
    operator_response: >-
      Inspect source health and object/policy compatibility, restore a valid
      observation or configuration, and wait for a successful matching apply.
    scope_fields: [subject_kind, subject_id, resource_ids]
    set_authority: manyforge.runtime.scene_pose_condition
    clear_authority: manyforge.runtime.scene_pose_condition
    adapter_id: manyforge.alarm_adapter.runtime_scene_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 16

  - definition_id: manyforge.runtime.scene_initialization_fault
    version: 2
    title: Runtime scene initialization failed
    message_template: "Scene initialization failed for {subject_id}"
    alarm_class: runtime_health
    priority: high
    priority_rationale: >-
      A definitive reset or authored-scene seed failure leaves the current
      runtime unsuitable for motion until repaired or replaced.
    consequence: >-
      Pose updates and motion admission remain fenced because the authored
      scene is not known to be established.
    operator_response: >-
      Inspect reset/seed diagnostics, restore the backend, then retry the
      matching initialization or load a valid program/deployment.
    scope_fields: [subject_kind, subject_id, resource_ids]
    set_authority: manyforge.runtime.scene_initialization_condition
    clear_authority: manyforge.runtime.scene_initialization_condition
    adapter_id: manyforge.alarm_adapter.runtime_health_condition
    runtime_modes:
      - all
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 16

  - definition_id: manyforge.runtime.provider_unavailable
    version: 2
    title: Required runtime provider unavailable
    message_template: "Required provider {subject_id} is unavailable"
    alarm_class: runtime_health
    priority: high
    priority_rationale: >-
      A required external state or execution provider is explicitly unavailable
      after initialization and trustworthy motion cannot proceed.
    consequence: >-
      Observed state, scene projection, or execution feedback may be unavailable
      or stale for the affected runtime lane.
    operator_response: >-
      Restore the named provider and wait for an explicit fresh ready status;
      absence of another failure does not clear this alarm.
    scope_fields: [subject_kind, subject_id, resource_ids]
    set_authority: manyforge.runtime.provider_health_condition
    clear_authority: manyforge.runtime.provider_health_condition
    adapter_id: manyforge.alarm_adapter.runtime_health_condition
    runtime_modes:
      - all
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 16

  - definition_id: manyforge.runtime.component_lifecycle_fault
    version: 2
    title: Controlled-component lifecycle fault
    message_template: "Lifecycle fault on {subject_id}"
    alarm_class: runtime_health
    priority: high
    priority_rationale: >-
      A current controlled-component fault, warning, recovery latch, or
      uncertain lifecycle transaction requires operator attention before the
      affected resources can be admitted.
    consequence: >-
      Component readiness and command dispatch remain fail-closed until CCLC
      publishes a fresh matching clear or reconciliation result.
    operator_response: >-
      Inspect component and lifecycle diagnostics, correct the physical cause,
      apply only an offered recovery action, and wait for a fresh reconciled
      provider snapshot.
    scope_fields: [subject_kind, subject_id, resource_ids]
    set_authority: manyforge.cclc.lifecycle_condition
    clear_authority: manyforge.cclc.lifecycle_condition
    adapter_id: manyforge.alarm_adapter.cclc_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 32

  - definition_id: manyforge.runtime.alarm_scope_unavailable
    version: 1
    title: Fault alarm scope unavailable
    message_template: "A current fault in {subject_id} could not be raised as its own alarm"
    alarm_class: runtime_health
    priority: high
    priority_rationale: >-
      A current motion fault whose resource scope the alarm owner refused has
      no alarm of its own and does not gate motion on its resources, so the
      fault is otherwise visible only in History.
    consequence: >-
      Motion can be admitted on the refused fault's resources without that
      fault being reviewed, acknowledged, or recovered.
    operator_response: >-
      Review the refused faults named in the alarm details and History, then
      apply a configuration that contains their resources or recover or reset
      the faults; the alarm returns to normal when no refused fault remains.
    scope_fields: [subject_kind, subject_id, resource_ids]
    set_authority: manyforge.headless.alarm_scope_refusal_condition
    clear_authority: manyforge.headless.alarm_scope_refusal_condition
    adapter_id: manyforge.alarm_adapter.runtime_health_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 16
