[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyforge_headless_api"
version = "0.1.0"
description = "Thin HTTP and CLI projections for ManyForge headless owners"
license = { text = "Apache-2.0" }
authors = [{ name = "Marco Pastorio" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rfc8785==0.1.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
manyforge-headless = "manyforge_headless_api.cli:main"

[tool.setuptools]
package-dir = { "manyforge_headless_api" = "." }
packages = ["manyforge_headless_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
