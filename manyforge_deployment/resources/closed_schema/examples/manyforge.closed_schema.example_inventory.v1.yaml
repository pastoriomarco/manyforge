                  - manyforge.closed_schema.example_inventory.v1
              - kind: string_format
                value: api_version
        - field_id: enabled
          presence: optional
          default:
            kind: materialized
            value: true
          value_schema:
            kind: scalar
            scalar_type: boolean
            constraints: []
        - field_id: inventory_id
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: string
            constraints:
              - kind: string_format
                value: portable_id
        - field_id: labels
          presence: optional
          default:
            kind: materialized
            value: []
          value_schema:
            kind: array
            min_items: 0
            max_items: 32
            collection:
              kind: scalar_set
            item_schema:
              kind: scalar
              scalar_type: string
              constraints:
                - kind: string_format
                  value: portable_id
        - field_id: resources
          presence: required
          default:
            kind: absent
          value_schema:
            kind: array
            min_items: 1
            max_items: 64
            collection:
              kind: keyed_record_set
              key_paths:
                - - resource_id
            item_schema:
              kind: local_ref
              definition_id: resource
