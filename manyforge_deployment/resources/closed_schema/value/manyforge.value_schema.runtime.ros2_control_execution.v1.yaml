      kind: object
      fields:
        - field_id: outputs
          presence: required
          default:
            kind: absent
          value_schema:
            kind: array
            min_items: 1
            max_items: 2
            collection:
              kind: keyed_record_set
              key_paths:
                - [signal, controllable_component_id]
                - [signal, signal_name]
            item_schema:
              kind: local_ref
              definition_id: pneumatic_output
        - field_id: inputs
          presence: optional
          default:
            kind: absent
          value_schema:
            kind: object
            fields:
              - field_id: open
                presence: optional
                default:
                  kind: absent
                value_schema:
                  kind: local_ref
                  definition_id: pneumatic_input
              - field_id: closed
                presence: optional
                default:
                  kind: absent
                value_schema:
                  kind: local_ref
                  definition_id: pneumatic_input
              - field_id: pressure
                presence: optional
                default:
                  kind: absent
                value_schema:
                  kind: local_ref
                  definition_id: pneumatic_input
              - field_id: workpiece_grasped
                presence: optional
                default:
                  kind: absent
                value_schema:
                  kind: local_ref
                  definition_id: pneumatic_input
