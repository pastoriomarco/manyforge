api_version: manyforge.closed_schema.v1
schema_id: manyforge.value_schema.runtime.ros2_control_execution.v1
schema_revision: sha256:9d37332a6f3c943e2f1811b5009c329d24248665f4ec14924a5ca437510c6905
schema_purpose: value
root_definition_id: ros2_control_execution_runtime_configuration
definitions:
  - definition_id: ros2_control_execution_runtime_configuration
    value_schema:
      kind: object
      fields:
        - field_id: mode
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: string
            constraints:
              - kind: enum
                values:
                  - commanded_sim
              - kind: string_format
                value: portable_id
        - field_id: isaac_profile
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: string
            constraints:
              - kind: enum
                values:
                  - lite6
                  - ur10e
              - kind: string_format
                value: portable_id
        - field_id: planner_rng_seed
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: integer
            constraints:
              - kind: minimum
                value: 0
              - kind: maximum
                value: 4294967295
        - field_id: initial_joint_positions_rad
          presence: required
          default:
            kind: absent
          value_schema:
            kind: array
            min_items: 1
            max_items: 256
            collection:
              kind: ordered
            item_schema:
              kind: scalar
              scalar_type: number
              constraints: []
        - field_id: motion_target_limits
          presence: required
          default:
            kind: absent
          value_schema:
            kind: array
            min_items: 1
            max_items: 256
            collection:
              kind: keyed_record_set
              key_paths:
                - [controllable_component_id]
                - [command_target_id]
            item_schema:
              kind: object
              fields:
                - field_id: controllable_component_id
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: command_target_id
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: maximum_tcp_linear_speed_mps
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: number
                    constraints:
                      - kind: exclusive_minimum
                        value: 0
                      - kind: maximum
                        value: 1000
        - field_id: execution_tick_hz
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: integer
            constraints:
              - kind: minimum
                value: 1
              - kind: maximum
                value: 10000
        - field_id: collision_monitor_period_ms
          presence: required
          default:
            kind: absent
          value_schema:
