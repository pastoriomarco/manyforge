      kind: object
      fields:
        - field_id: source_joint_name
          presence: required
          default: {kind: absent}
          value_schema:
            kind: scalar
            scalar_type: string
            constraints: [{kind: min_length, value: 1}, {kind: max_length, value: 1024}]
        - field_id: override_rad_s3
          presence: optional
          default: {kind: absent}
          value_schema: {kind: local_ref, definition_id: positive_jerk_number}
  - definition_id: positive_jerk_number
    value_schema:
      kind: scalar
      scalar_type: number
      constraints: [{kind: exclusive_minimum, value: 0}]
