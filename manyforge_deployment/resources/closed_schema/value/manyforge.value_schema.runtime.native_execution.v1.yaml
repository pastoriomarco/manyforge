api_version: manyforge.closed_schema.v1
schema_id: manyforge.value_schema.runtime.native_execution.v1
schema_revision: sha256:19db78f3505f27815b6a90556de58caa0541c91193ead9b6a643f475383d5190
schema_purpose: value
root_definition_id: native_execution_runtime_configuration
definitions:
  - definition_id: native_execution_runtime_configuration
    value_schema:
      kind: object
      fields:
        - field_id: mode
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: string
            constraints:
              - kind: enum
                values:
                  - simulated
              - kind: string_format
                value: portable_id
        - field_id: planner_rng_seed
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: integer
            constraints:
              - kind: minimum
                value: 0
              - kind: maximum
                value: 4294967295
        - field_id: initial_joint_positions_rad
          presence: required
          default:
            kind: absent
          value_schema:
            kind: array
            min_items: 0
            max_items: 256
            collection:
              kind: ordered
            item_schema:
              kind: scalar
              scalar_type: number
              constraints: []
        - field_id: motion_target_limits
          presence: required
          default:
            kind: absent
          value_schema:
            kind: array
            min_items: 0
            max_items: 256
            collection:
              kind: keyed_record_set
              key_paths:
                - [controllable_component_id]
                - [command_target_id]
            item_schema:
              kind: object
              fields:
                - field_id: controllable_component_id
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: command_target_id
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: maximum_tcp_linear_speed_mps
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: number
                    constraints:
                      - kind: exclusive_minimum
                        value: 0
                      - kind: maximum
                        value: 1000
                - field_id: tcp_speed_check
                  presence: optional
                  default:
                    kind: materialized
                    value: active_tcp_and_flange
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: enum
                        values:
                          - active_tcp
                          - active_tcp_and_flange
                - field_id: ordinary_motion_jerk
                  presence: optional
                  default:
                    kind: materialized
                    value: {enabled: false, preset_reference_time_s: 1, joint_limits: []}
                  value_schema:
                    kind: local_ref
                    definition_id: ordinary_motion_jerk
        - field_id: direct_control_joint_limits
          presence: required
          default:
            kind: absent
          value_schema:
            kind: array
            min_items: 0
            max_items: 256
            collection:
              kind: keyed_record_set
              key_paths:
                - [controllable_component_id]
                - [command_target_id]
                - [source_joint_name]
            item_schema:
              kind: object
              fields:
                - field_id: controllable_component_id
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: command_target_id
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: source_joint_name
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: max_velocity_rad_s
                  presence: optional
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: number
                    constraints:
                      - kind: exclusive_minimum
                        value: 0
                - field_id: max_acceleration_rad_s2
                  presence: optional
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: number
                    constraints:
                      - kind: exclusive_minimum
                        value: 0
                - field_id: max_jerk_rad_s3
                  presence: optional
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: number
                    constraints:
                      - kind: exclusive_minimum
                        value: 0
        - field_id: gripper_target_configurations
          presence: optional
          default:
            kind: absent
          value_schema:
            kind: array
            min_items: 0
            max_items: 256
            collection:
              kind: keyed_record_set
              key_paths:
                - [controllable_component_id]
                - [command_target_id]
            item_schema:
              kind: object
              fields:
                - field_id: controllable_component_id
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: command_target_id
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: description
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints: []
                - field_id: actuation_kind
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: enum
                        values:
                          - position_commanded
                          - pneumatic
                - field_id: open_state_ref
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: closed_state_ref
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: command_duration_s
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: number
                    constraints:
                      - kind: exclusive_minimum
                        value: 0
                      - kind: maximum
                        value: 60
                - field_id: touch_links
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: array
                    min_items: 1
                    max_items: 256
                    collection:
                      kind: scalar_set
                    item_schema:
                      kind: scalar
                      scalar_type: string
                      constraints:
                        - kind: string_format
                          value: portable_id
                - field_id: mount_frame
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: attach_frame
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: tcp_frame
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: scalar
                    scalar_type: string
                    constraints:
                      - kind: string_format
                        value: portable_id
                - field_id: auxiliary_frames
                  presence: required
                  default:
                    kind: absent
                  value_schema:
                    kind: array
                    min_items: 0
                    max_items: 256
                    collection:
                      kind: scalar_set
                    item_schema:
                      kind: scalar
                      scalar_type: string
                      constraints:
                        - kind: string_format
                          value: portable_id
        - field_id: execution_tick_hz
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: integer
            constraints:
              - kind: minimum
                value: 1
              - kind: maximum
                value: 10000
        - field_id: collision_monitor_period_ms
          presence: required
          default:
            kind: absent
          value_schema:
            kind: scalar
            scalar_type: number
            constraints:
              - kind: exclusive_minimum
                value: 0
              - kind: maximum
                value: 60000
  - definition_id: ordinary_motion_jerk
    value_schema:
      kind: object
      fields:
        - field_id: enabled
          presence: required
          default: {kind: absent}
          value_schema: {kind: scalar, scalar_type: boolean, constraints: []}
        - field_id: preset_reference_time_s
          presence: required
          default: {kind: absent}
          value_schema: {kind: local_ref, definition_id: positive_jerk_number}
        - field_id: joint_limits
          presence: required
          default: {kind: absent}
          value_schema:
            kind: array
            min_items: 0
            max_items: 256
            collection: {kind: keyed_record_set, key_paths: [[source_joint_name]]}
            item_schema: {kind: local_ref, definition_id: joint_jerk_setting}
  - definition_id: joint_jerk_setting
    value_schema:
      kind: object
      fields:
        - field_id: source_joint_name
          presence: required
          default: {kind: absent}
          value_schema:
            kind: scalar
            scalar_type: string
            constraints: [{kind: min_length, value: 1}, {kind: max_length, value: 1024}]
        - field_id: override_rad_s3
          presence: optional
          default: {kind: absent}
          value_schema: {kind: local_ref, definition_id: positive_jerk_number}
        - field_id: imported
          presence: optional
          default: {kind: absent}
          value_schema: {kind: local_ref, definition_id: imported_joint_jerk}
  - definition_id: imported_joint_jerk
    value_schema:
      kind: object
      fields:
        - field_id: maximum_rad_s3
          presence: required
          default: {kind: absent}
          value_schema: {kind: local_ref, definition_id: positive_jerk_number}
        - field_id: enabled
          presence: required
          default: {kind: absent}
          value_schema: {kind: scalar, scalar_type: boolean, constraints: []}
        - field_id: machine_required
          presence: required
          default: {kind: absent}
          value_schema: {kind: scalar, scalar_type: boolean, constraints: []}
        - field_id: source_id
          presence: required
          default: {kind: absent}
          value_schema:
            kind: scalar
            scalar_type: string
            constraints: [{kind: min_length, value: 1}, {kind: max_length, value: 4096}]
        - field_id: source_digest
          presence: required
          default: {kind: absent}
          value_schema:
            kind: scalar
            scalar_type: string
            constraints: [{kind: string_format, value: sha256_digest}]
  - definition_id: positive_jerk_number
    value_schema:
      kind: scalar
      scalar_type: number
      constraints: [{kind: exclusive_minimum, value: 0}]
