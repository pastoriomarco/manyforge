# Executable specification of the Program checks on authored pose values: a
# key-typed stored_pose node literal, a stored_pose key's `initial`, and its
# `allowed_frames` (program.py _validate_declared_type_value and
# _validate_allowed_frames). The Python Program validator
# (manyforge_behavior/tests/test_program_expressions.py) and the C++ Program
# contract (manyforge_deployment/test/test_program_contract.cpp) run every
# case, so both refuse the same values.
#
# Each suite builds its own valid v3 base Program with direct frame references,
# replaces its `scene` with the one
# below, declares `blackboard_keys` plus the case's `keys`, and puts the `node`
# template in its tree with the case's `value` (when given) as the pose it
# writes. `accepted` cases must load; `refused` cases must be refused with an
# error that contains `reason`. A malformed node literal is refused by the
# Python catalog schema before its pose check, so those cases name only the
# parameter; the same malformations as an `initial` value name the exact cause.
schema: manyforge.program_pose_value_conformance.v1

scene:
  - scene_resource_id: table
    shape: {type: box, box_dimensions_m: [1.0, 0.6, 0.02]}
    pose:
      frame_ref: {kind: cell_frame}
      position_m: [0.6, 0.0, 0.4]
      orientation: {xyzw: [0.0, 0.0, 0.0, 1.0]}

blackboard_keys:
  - {key: place, type: stored_pose, access: read_write, persistence: run}
  - {key: ratio, type: float64, access: read_write, persistence: run}

node:
  node_id: logic.set_value
  instance_id: set
  parameters:
    key: place
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 90.0]}

accepted:
  - name: a pose in a direct component frame
    value:
      frame_ref: {kind: target_frame, frame: {component_id: lite6_robot, frame_id: tcp}}
      position_m: [0.0, 0.0, 0.1]
      orientation: {rpy_deg: [180.0, 0.0, 0.0]}
  - name: a unit quaternion pose on a declared scene resource
    value:
      frame_ref: {kind: scene_resource, scene_resource_id: table}
      position_m: [0.0, 0.0, 0.05]
      orientation: {xyzw: [0.0, 0.0, 0.7071067811865476, 0.7071067811865476]}
  - name: a quaternion within the unit tolerance (squared norm off by 8e-7)
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.0, 0.0, 0.05]
      orientation: {xyzw: [0.0, 0.0, 0.0, 1.0000004]}
  - name: allowed frames and an initial pose in one of them
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        allowed_frames:
          - {kind: cell_frame}
          - {kind: scene_resource, scene_resource_id: table}
          - {kind: target_frame, frame: {component_id: lite6_robot, frame_id: base}}
          - {kind: target_frame, frame: {component_id: lite6_robot, frame_id: tcp}}
        initial:
          frame_ref: {kind: target_frame, frame: {component_id: lite6_robot, frame_id: base}}
          position_m: [0.3, 0.0, 0.2]
          orientation: {xyzw: [0.0, 0.0, 0.0, 1.0]}

  # Resolution of missing direct references is tested at the shared validator boundary.
  - name: a syntactically valid pose in an unbound component frame
    value:
      frame_ref: {kind: target_frame, frame: {component_id: gantry, frame_id: tcp}}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
  - name: a syntactically valid pose in an unbound frame
    value:
      frame_ref: {kind: target_frame, frame: {component_id: lite6_robot, frame_id: camera}}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
  - name: a syntactically valid allowed frame on an unbound component
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        allowed_frames: [{kind: target_frame, frame: {component_id: gantry, frame_id: tcp}}]
  - name: a syntactically valid initial pose in an unbound frame
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: target_frame, frame: {component_id: lite6_robot, frame_id: camera}}
          position_m: [0.3, 0.0, 0.2]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}

refused:
  - name: a pose with an extra member
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
      speed: 1.0
    reason: parameters.value
  - name: a pose without an orientation
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, 0.2, 0.3]
    reason: parameters.value
  - name: a pose with two coordinates
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, 0.2]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: parameters.value
  - name: a pose with a text coordinate
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, "0.2", 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: parameters.value
  - name: a pose with both orientation forms
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 0.0], xyzw: [0.0, 0.0, 0.0, 1.0]}
    reason: parameters.value
  - name: a pose with a short rotation
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0]}
    reason: parameters.value
  - name: a pose with a short quaternion
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, 0.2, 0.3]
      orientation: {xyzw: [0.0, 0.0, 1.0]}
    reason: parameters.value
  - name: a pose with a non-unit quaternion
    value:
      frame_ref: {kind: cell_frame}
      position_m: [0.1, 0.2, 0.3]
      orientation: {xyzw: [0.0, 0.0, 0.0, 2.0]}
    reason: "value.orientation.xyzw: must already be a unit quaternion"
  - name: a pose in an unknown frame kind
    value:
      frame_ref: {kind: world}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: parameters.value
  - name: a cell frame with a frame role
    value:
      frame_ref: {kind: cell_frame, frame_role: tcp}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: parameters.value
  - name: a pose on an undeclared scene resource
    value:
      frame_ref: {kind: scene_resource, scene_resource_id: shelf}
      position_m: [0.1, 0.2, 0.3]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: "value.frame_ref.scene_resource_id: does not name a declared scene resource"
  - name: allowed frames on a key that is not a pose
    keys:
      - key: speed
        type: float64
        access: read_write
        persistence: run
        allowed_frames: [{kind: cell_frame}]
    reason: "allowed_frames: is valid only for a stored_pose key"
  - name: empty allowed frames
    keys:
      - {key: tool_goal, type: stored_pose, access: read_write, persistence: run, allowed_frames: []}
    reason: "allowed_frames: must not be empty; omit it to allow every declared frame"
  - name: allowed frames that are not a list
    keys:
      - {key: tool_goal, type: stored_pose, access: read_write, persistence: run, allowed_frames: {kind: cell_frame}}
    reason: "allowed_frames: must be a list"
  - name: allowed frames out of canonical order
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        allowed_frames:
          - {kind: target_frame, frame: {component_id: lite6_robot, frame_id: tcp}}
          - {kind: target_frame, frame: {component_id: lite6_robot, frame_id: base}}
    reason: "allowed_frames: must be duplicate-free and canonical-sorted"
  - name: a repeated allowed frame
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        allowed_frames: [{kind: cell_frame}, {kind: cell_frame}]
    reason: "allowed_frames: must be duplicate-free and canonical-sorted"
  - name: an allowed frame on an undeclared scene resource
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        allowed_frames: [{kind: scene_resource, scene_resource_id: shelf}]
    reason: "allowed_frames[0].scene_resource_id: does not name a declared scene resource"
  - name: an initial pose outside the allowed frames
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        allowed_frames: [{kind: target_frame, frame: {component_id: lite6_robot, frame_id: tcp}}]
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.3, 0.0, 0.2]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: "initial.frame_ref: is not one of the key's allowed_frames"
  - name: an initial pose with a non-unit quaternion
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.3, 0.0, 0.2]
          orientation: {xyzw: [0.0, 0.0, 0.0, 0.5]}
    reason: "initial.orientation.xyzw: must already be a unit quaternion"
  - name: an initial quaternion just past the unit tolerance (squared norm off by 2e-6)
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.3, 0.0, 0.2]
          orientation: {xyzw: [0.0, 0.0, 0.0, 1.000001]}
    reason: "initial.orientation.xyzw: must already be a unit quaternion"
  - name: an initial pose with an extra member
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.1, 0.2, 0.3]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
          speed: 1.0
    reason: "initial: contains unknown fields ['speed']"
  - name: an initial pose without an orientation
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.1, 0.2, 0.3]
    reason: "initial: is missing required fields ['orientation']"
  - name: an initial pose whose position is not a list
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: {x: 0.1, y: 0.2, z: 0.3}
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: "initial.position_m: must be a list"
  - name: an initial pose whose quaternion is not a list
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.1, 0.2, 0.3]
          orientation: {xyzw: 1.0}
    reason: "initial.orientation.xyzw: must be a list"
  - name: an initial pose with two coordinates
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.1, 0.2]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: "initial.position_m: must contain three numbers"
  - name: an initial pose with a text coordinate
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.1, "0.2", 0.3]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: "initial.position_m[1]: must be a finite number"
  - name: an initial pose with both orientation forms
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.1, 0.2, 0.3]
          orientation: {rpy_deg: [0.0, 0.0, 0.0], xyzw: [0.0, 0.0, 0.0, 1.0]}
    reason: "initial.orientation: must contain exactly one of xyzw or rpy_deg"
  - name: an initial pose with a short rotation
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.1, 0.2, 0.3]
          orientation: {rpy_deg: [0.0, 0.0]}
    reason: "initial.orientation.rpy_deg: must contain 3 numbers"
  - name: an initial pose with a short quaternion
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame}
          position_m: [0.1, 0.2, 0.3]
          orientation: {xyzw: [0.0, 0.0, 1.0]}
    reason: "initial.orientation.xyzw: must contain 4 numbers"
  - name: an initial pose in an unknown frame kind
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: world}
          position_m: [0.1, 0.2, 0.3]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: "initial.frame_ref.kind: must be cell_frame, target_frame, or scene_resource"
  - name: an initial cell frame with a frame role
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: cell_frame, frame_role: tcp}
          position_m: [0.1, 0.2, 0.3]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: "initial.frame_ref: contains unknown fields ['frame_role']"
  - name: an initial pose on an undeclared scene resource
    keys:
      - key: tool_goal
        type: stored_pose
        access: read_write
        persistence: run
        initial:
          frame_ref: {kind: scene_resource, scene_resource_id: shelf}
          position_m: [0.1, 0.2, 0.3]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    reason: "initial.frame_ref.scene_resource_id: does not name a declared scene resource"
