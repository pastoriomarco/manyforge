api_version: manyforge.deployment.v0
schema_version: "0.1.0"
name: native_simple_motion_ur5
description: >-
  Native in-process RoboPlan deployment for live qualification scenarios.

program_profile: v0.1

robot_config:
  robot_id: ur5
  group_id: arm
  urdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.urdf
  srdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.srdf
  global_max_tcp_linear_speed_mps: 0.25

adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - planning.motion.joint_goal
      - planning.motion.pose_goal
      - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - context.collision.check.detailed
      - context.kinematics.fk
      - context.limits.joint
      - context.pose.resolve_reference
      - context.scene.object_query
      - scene.shape.box
      - scene.shape.sphere
      - scene.shape.cylinder
      - scene.shape.mesh
      - scene.edit.add
      - scene.edit.upsert
      - scene.edit.remove
      - scene.edit.update_pose
      - scene.edit.attach_detach
      - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.roboplan_native
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - execution.trajectory.execute
      - execution.feedback.phase_events
      - execution.feedback.state_snapshots
      - execution.stop.soft
      - execution.pause
      - execution.resume
      - execution.reset
    config:
      mode: simulated
      execution_tick_hz: 100
      initial_joint_positions_rad: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]
      # Controlled-stop defaults (backend-computed, native lane): operator Stop
      # button = soft_on_path (1.0 s jerk-continuous path ramp); fault =
      # spring_back_hold. per_joint_max_deceleration_rad_s2 bounds the ramp.
      operator_stop_profile:
        profile_id: "operator_soft_on_path"
        stop_mode: "soft_on_path"
        deceleration_time_s: 1.0
        allow_natural_completion_on_short_path: true
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10.0
          shoulder_lift_joint: 10.0
          elbow_joint: 10.0
          wrist_1_joint: 10.0
          wrist_2_joint: 10.0
          wrist_3_joint: 10.0
      default_fault_stop_profile:
        profile_id: "default_fault_spring_back"
        stop_mode: "spring_back_hold"
        deceleration_time_s: 1.0
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10.0
          shoulder_lift_joint: 10.0
          elbow_joint: 10.0
          wrist_1_joint: 10.0
          wrist_2_joint: 10.0
          wrist_3_joint: 10.0

orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 50.0

launch:
  ros_wrapper_nodes: []
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true
