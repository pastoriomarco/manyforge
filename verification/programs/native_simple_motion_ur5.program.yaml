api_version: manyforge.program.v0
program_profile: v0.1
name: native_simple_motion_ur5
description: >-
  Native-kernel qualification program with deterministic joint-goal motions on
  the UR5 demo model. Intended for live planner/executor requalification.
catalog_version: "0.1.0"

robot:
  robot_id: ur5
  group_id: arm
  base_frame: base_link
  tcp_frame: tool0

scene: []

parameters:
  - name: velocity_scale
    type: float
    default: 0.5
    constraints:
      min_exclusive: 0.0
      max_inclusive: 1.0
    description: Velocity scale for all qualification moves.

tree:
  id: sequence
  name: native_simple_motion
  children:
    - id: move_manipulator_action
      name: move_to_start
      params:
        move_id: move_start
        motion_type: joint_goal
        joint_goal_names:
          - shoulder_pan_joint
          - shoulder_lift_joint
          - elbow_joint
          - wrist_1_joint
          - wrist_2_joint
          - wrist_3_joint
        joint_goal_positions_rad: [0.1, -0.5, 0.5, -0.5, -0.5, 0.0]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0

    - id: move_manipulator_action
      name: move_to_end
      params:
        move_id: move_end
        motion_type: joint_goal
        joint_goal_names:
          - shoulder_pan_joint
          - shoulder_lift_joint
          - elbow_joint
          - wrist_1_joint
          - wrist_2_joint
          - wrist_3_joint
        joint_goal_positions_rad: [0.2, -0.8, 0.8, -0.3, -0.8, 0.1]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
