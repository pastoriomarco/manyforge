api_version: manyforge.program.v0
program_profile: v0.1
name: interrupt_deferred_priority
catalog_version: "0.1.0"

robot:
  robot_id: ur5
  group_id: arm
  base_frame: base_link
  tcp_frame: tool0

interrupt_handlers:
  pause_delay:
    root:
      id: timer
      name: pause_delay
      params:
        duration_s: 0.75
  fault_hold:
    root:
      id: reset_trajectories
      name: fault_hold

interrupt_policies:
  - id: operator_pause_hold
    source: operator_pause
    applies_to:
      node_names: [wait_here]
      interruptible_only: true
    preemption_mode: hold_cycle
    handler: pause_delay
    after_handler: resume_subtree
  - id: operator_fault_halt
    source: operator_fault
    applies_to:
      node_names: [wait_here]
      interruptible_only: true
    preemption_mode: hold_cycle
    handler: fault_hold
    after_handler: halted

tree:
  id: sequence
  name: root
  children:
    - id: timer
      name: wait_here
      params:
        duration_s: 5.0
