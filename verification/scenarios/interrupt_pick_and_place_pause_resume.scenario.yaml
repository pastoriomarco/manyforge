scenario_id: interrupt_pick_and_place_pause_resume
description: Qualification scenario for interrupt hold, handler execution, and resume on the interrupt-focused pick-and-place flow.
program: examples/interrupt_pick_and_place.program.yaml
deployment: examples/interrupt_pick_and_place.deployment.yaml
timeouts:
  scenario_s: 90
  poll_interval_ms: 50
steps:
  - action: load_program
  - action: cycle_run
  - action: wait_for
    endpoint: digest
    path: state
    equals: running
    timeout_s: 15
  - action: publish_signal
    adapter: demo_ui
    signal: pause_request
    value: true
    stale_after_ms: 1500
    mirror_key: demo/pause_request
    metadata:
      reason: operator_pause_qualification
  - action: wait_for
    endpoint: digest
    path: pendingInterrupt.sourceId
    equals: operator_pause
    timeout_s: 10
  - action: wait_for
    endpoint: digest
    path: state
    equals: stopped
    timeout_s: 10
  - action: wait_for
    endpoint: blackboard
    path: keys.demo/pause_latched.valueJson
    equals: true
    timeout_s: 5
  - action: sleep
    seconds: 2.0
  - action: cycle_run
  - action: wait_for
    endpoint: digest
    path: state
    equals: idle
    timeout_s: 45
assertions:
  - endpoint: history
    event_type: interrupt_latched
  - endpoint: history
    event_type: interrupt_handler_completed
  - endpoint: history
    event_type: kernel_error
    absent: true
  - endpoint: blackboard
    path: keys.demo/pause_latched.valueJson
    equals: true
