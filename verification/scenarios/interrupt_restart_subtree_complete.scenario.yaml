scenario_id: interrupt_restart_subtree_complete
description: Qualification scenario for interrupt-driven subtree restart and successful completion.
program: verification/programs/interrupt_restart_subtree.program.yaml
deployment: verification/deployments/interrupt_qualification.deployment.yaml
timeouts:
  scenario_s: 45
  poll_interval_ms: 50
steps:
  - action: load_program
  - action: cycle_run
  - action: wait_for
    endpoint: digest
    path: state
    equals: running
    timeout_s: 10
  - action: publish_signal
    adapter: demo_ui
    signal: pause_request
    value: true
    stale_after_ms: 1500
    metadata:
      reason: restart_subtree_qualification
  - action: wait_for
    endpoint: digest
    path: state
    equals: idle
    timeout_s: 15
assertions:
  - endpoint: history
    event_type: interrupt_handler_completed
  - endpoint: history
    event_type: interrupt_cleared
  - endpoint: blackboard
    path: keys.cycle/done.valueJson
    equals: true
  - endpoint: history
    event_type: kernel_error
    absent: true
