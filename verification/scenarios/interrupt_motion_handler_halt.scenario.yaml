scenario_id: interrupt_motion_handler_halt
description: Qualification scenario for motion-bearing interrupt handlers with deterministic halt semantics.
program: verification/programs/interrupt_motion_handler.program.yaml
deployment: verification/deployments/interrupt_qualification.deployment.yaml
timeouts:
  scenario_s: 60
  poll_interval_ms: 50
steps:
  - action: load_program
  - action: cycle_run
  - action: wait_for
    endpoint: digest
    path: state
    equals: running
    timeout_s: 10
  - action: publish_signal
    adapter: demo_ui
    signal: pause_request
    value: true
    stale_after_ms: 1500
    metadata:
      reason: motion_handler_qualification
  - action: wait_for
    endpoint: digest
    path: pendingInterrupt.details.handler_state
    equals: completed
    timeout_s: 15
  - action: wait_for
    endpoint: digest
    path: requiredOperatorAction
    equals: reset
    timeout_s: 5
assertions:
  - endpoint: digest
    path: pendingInterrupt.details.handler_resource_claims
    contains: motion
  - endpoint: digest
    path: pendingInterrupt.details.handler_kernel_preparation
    equals: stop_and_reset_to_idle
  - endpoint: history
    event_type: execute_started
    greater_equal: 2
  - endpoint: history
    event_type: interrupt_handler_completed
  - endpoint: history
    event_type: kernel_error
    absent: true
