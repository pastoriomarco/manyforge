scenario_id: interrupt_handler_timeout_requires_reset
description: Qualification scenario for timeout-bounded interrupt handler failure and reset-only recovery.
program: verification/programs/interrupt_handler_timeout.program.yaml
deployment: verification/deployments/interrupt_qualification.deployment.yaml
timeouts:
  scenario_s: 45
  poll_interval_ms: 50
steps:
  - action: load_program
  - action: cycle_run
  - action: wait_for
    endpoint: digest
    path: state
    equals: running
    timeout_s: 10
  - action: publish_signal
    adapter: demo_ui
    signal: pause_request
    value: true
    stale_after_ms: 1500
    metadata:
      reason: timeout_qualification
  - action: wait_for
    endpoint: digest
    path: pendingInterrupt.details.handler_state
    equals: failed
    timeout_s: 10
  - action: wait_for
    endpoint: digest
    path: requiredOperatorAction
    equals: reset
    timeout_s: 5
assertions:
  - endpoint: history
    event_type: interrupt_handler_failed
  - endpoint: digest
    path: pendingInterrupt.resetRequired
    equals: true
  - endpoint: digest
    path: pendingInterrupt.timing.handlerDurationNs
    greater_equal: 1
  - endpoint: history
    event_type: kernel_error
    absent: true
