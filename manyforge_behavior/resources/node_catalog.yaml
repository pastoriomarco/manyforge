  - id: attach_object_to_link
    name: AttachObjectToLink
    category: scene
    description: >-
      Behavior-tree leaf — runtime collision-object operation. Attaches
      a scene object to a robot link during program execution (computes
      the relative transform from the link's current FK pose, removes the
      object from world, and re-adds it attached to the link frame for
      collision-aware planning). Authored by inserting it as a node in
      the behavior tree via `tree_draft_insert_node`. There is no
      design-time `scene_draft_*` equivalent — attachment is intrinsically
      a runtime operation tied to a moment in the cycle.
    tags: [scene, collision, attach]
    profiles:
      min_profile: v0.1
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: object_id
        schema:
          type: string
        required: true
        parameterizable: true
        ui_editor: blackboard_key_selector
        blackboard_role: literal_or_key_reader
        blackboard_value_type: string
        description: Object to attach (must exist in scene). May be a literal
          ID, a program parameter, or a declared blackboard key/field binding.
      - name: link_frame
        schema:
          type: string
        required: true
        description: Robot link to attach to (e.g. "tool0").
      - name: gripper_id
        schema:
          type: string
        required: false
        description: Optional gripper identifier. When provided, attach uses the gripper's deployment-defined touch_links for allowable grasp contact.
      - name: touch_links
        schema:
          type: array
          items: string
        required: false
        description: Optional explicit list of robot link names that are allowed to touch the attached object during planning. Overrides gripper_id-derived touch_links when provided.
    required_capabilities:
      - scene.edit.add
      - scene.edit.remove
      - scene.edit.attach_detach
      - context.kinematics.fk
    execution:
      blocking: true
      cancellable: false
    interruptible: true
    default_interrupt_scope: active_node
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.AttachObjectToLink
    observability:
      emits_events: []
      consumes_events: []

  - id: detach_object_from_link
    name: DetachObjectFromLink
    category: scene
    description: >-
      Behavior-tree leaf — runtime collision-object operation. Detaches
      an object from a robot link during program execution and places it
      back in the world frame (computes the object's world pose from the
      link FK and stored relative transform, then removes from link and
      re-adds at world position). Authored by inserting it as a node in
      the behavior tree via `tree_draft_insert_node`. There is no
      design-time `scene_draft_*` equivalent — detachment is intrinsically
      a runtime operation tied to a moment in the cycle.
    tags: [scene, collision, detach]
    profiles:
      min_profile: v0.1
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: object_id
        schema:
          type: string
        required: true
        parameterizable: true
        ui_editor: blackboard_key_selector
        blackboard_role: literal_or_key_reader
        blackboard_value_type: string
        description: Original object_id (attached version is object_id +
          "_attached"). May be a literal ID, a program parameter, or a
          declared blackboard key/field binding.
      - name: link_frame
        schema:
          type: string
        required: true
        description: Robot link it's attached to (e.g. "tool0").
    required_capabilities:
      - scene.edit.add
      - scene.edit.remove
      - scene.edit.attach_detach
      - context.kinematics.fk
    execution:
      blocking: true
      cancellable: false
    interruptible: true
    default_interrupt_scope: active_node
    runners:
      py_trees:
