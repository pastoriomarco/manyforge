- id: scene.add_object
  name: Add scene object
  category: scene
  description: Adds one declared scene resource at a pose while the run executes.
    Every declared scene resource is already present when the run starts, so this
    succeeds only after the same run removed it (scene.remove_object); to make a resource
    appear or move whether or not it exists, use scene.upsert_object. Fails when a
    resource with the same id already exists or the scene commit is rejected.
  stability: stable
  tags:
  - scene
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: scene_resource_id
    required: true
    description: Declared scene resource to add (scene_draft_add_object); it exists
      at run start, so remove it earlier in the run (scene.remove_object) or use scene.upsert_object.
    schema:
      type: string
      semantic_type: scene_resource
  - id: shape
    required: true
    description: Geometry type (box, sphere, cylinder or mesh) with its type-specific
      dimensions in meters.
    schema_ref: '#/schema_types/shape'
  - id: pose
    required: true
    description: Position in meters and orientation, expressed in the frame it names
      (cell frame, target frame or scene resource).
    schema_ref: '#/schema_types/stored_pose'
  required_capabilities:
  - capability_id: scene.shape.box
    scope: cell_global
  - capability_id: scene.shape.sphere
    scope: cell_global
  - capability_id: scene.shape.cylinder
    scope: cell_global
  - capability_id: scene.shape.mesh
    scope: cell_global
  - capability_id: scene.edit.add
    scope: cell_global
  execution:
    blocking: true
    cancellable: false
    owner_api: scene.transaction
  outcomes:
    success: scene_committed
    failure: scene_commit_failed
  runners:
    py_trees:
      implementation_id: scene_add_object_v1
  observability:
    event_family: manyforge.program.node
- id: scene.upsert_object
  name: Upsert scene object
  category: scene
  description: Adds one declared scene resource, or replaces its shape and pose when
    it already exists (declared resources are present when the run starts). Use it
    to make a resource appear or move during the run. Fails when the existing resource
    is carried by a target.
  stability: stable
  tags:
  - scene
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
