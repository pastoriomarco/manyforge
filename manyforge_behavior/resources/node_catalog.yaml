- id: logic.wait_for_value
  name: Wait for value
  category: logic
  description: 'Wait until one declared blackboard key compares true. Without timeout_s
    it waits until the value matches or the run ends; a supplied timeout_s is positive
    and bounds the wait, counting Program time from the start of the attempt. Program
    time is monotonic and stands still while the Program is halted; Execute after
    Halt continues the same wait. By default (timeout_while_held: pause) time the
    node itself is held by an operator Stop does not count and the wait resumes with
    the remaining time; with timeout_while_held: count held time counts too. A node
    whose stop policy keeps it running during a Stop keeps counting. Program Stop
    and Reset end the wait; an operator Stop holds it according to the node''s stop
    policy.'
  stability: stable
  tags:
  - logic
  - blackboard
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: key
    required: true
    schema:
      type: string
      semantic_type: blackboard_key
  - id: operator
    required: false
    default: ==
    schema:
      type: enum
      values:
      - ==
      - '!='
      - <
      - <=
      - '>'
      - '>='
  - id: value
    required: true
    schema:
      type: key_value
      value_type_from_key: key
      value_types:
      - bool
      - float64
      - int64
      - string
  - id: tolerance
    required: false
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: timeout_s
    required: false
    schema:
      type: float
      constraints:
        min_inclusive: 0.01
        max_inclusive: 3600.0
  - id: timeout_while_held
    required: false
    default: pause
    schema:
      type: enum
      values:
      - count
      - pause
  required_capabilities: []
  blackboard:
    reads:
    - key_parameter: key
      value_type: bool
      missing_key: wait
    - key_parameter: key
      value_type: float64
      missing_key: wait
    - key_parameter: key
      value_type: int64
      missing_key: wait
    - key_parameter: key
      value_type: string
      missing_key: wait
    writes: []
  execution:
    blocking: true
    cancellable: true
    owner_api: orchestration.blackboard
  outcomes:
    success: matched
    failure: wait_failed
    interrupted: cancelled
  runners:
    py_trees:
      implementation_id: logic_wait_for_value_v1
  observability:
    event_family: manyforge.program.node
