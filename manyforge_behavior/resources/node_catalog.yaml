- id: assistant.query_model
  name: Query model
  category: assistant
  description: Sends one bounded request to a model endpoint and stores the response
    under output_key after its schema check passes. The node succeeds with model_response_valid
    and fails when the request, parsing, schema or confidence check fails; the policy
    parameters decide whether a failure pauses for an operator or fails the node.
  stability: stable
  tags:
  - assistant
  - model
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: model_endpoint_alias
    required: true
    description: Name of a model endpoint in the assistant contract that the request
      is sent to. Required.
    schema:
      type: string
  - id: prompt_template_id
    required: true
    description: Name of a retained prompt template. Its declared variables must be
      supplied in template_variables. Required.
    schema:
      type: string
  - id: template_variables
    required: false
    description: 'Values for the template variables, keyed by variable id; every declared
      variable must be given. Omitted: empty, which fails if variables are declared.'
    default: {}
    schema:
      type: object
      description: Prompt-template variable values by variable ID; each value is literal
        or comes from a value source at template_variables.<variable_id>.
      additional_properties:
        type: key_value
        value_types:
        - bool
        - float64
        - int64
        - string
        - string_list
  - id: scene_attachment
    required: false
    description: 'Scene data sent with the prompt: none, state_json (cell state as
      JSON) or snapshot_image (a captured image). Omitted: none.'
    default: none
    schema:
      type: enum
      values:
      - none
      - state_json
      - snapshot_image
  - id: output_key
    required: true
    description: Blackboard key that receives the validated response; its declared
      type defines the output schema. Required.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: timeout_s
    required: false
    description: 'Seconds for the whole request, including the parse retry, above
      0 up to 3600. Omitted: the endpoint''s default_timeout_s.'
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 3600.0
  - id: min_confidence
    required: false
    description: 'Minimum confidence from 0 to 1, checked only when the output schema
      declares a numeric confidence property. Omitted: 0.'
    default: 0.0
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
        max_inclusive: 1.0
  - id: model_runtime_failure_policy
    required: false
    description: 'Policy for any failure other than low confidence: pause_for_operator
      pauses for an operator, condition_failure fails the node. Omitted: pause_for_operator.'
    default: pause_for_operator
    schema:
      type: enum
      values:
      - pause_for_operator
      - condition_failure
  - id: model_low_confidence_policy
    required: false
    description: 'Policy when confidence is below min_confidence, with the same two
      values. Omitted: pause_for_operator.'
    default: pause_for_operator
    schema:
      type: enum
      values:
      - pause_for_operator
      - condition_failure
  - id: retry_on_parse_failure
    required: false
    description: 'When true, one more request is sent with a retry instruction if
      the response cannot be parsed. Omitted: false.'
    default: false
    schema:
      type: bool
  - id: scene_snapshot_transport
    required: false
    description: 'How a snapshot_image is delivered: inline_data_url or http_url.
