  # ---------------------------------------------------------------------------
  # Scene / objects
  # ---------------------------------------------------------------------------

  - id: add_collision_object
    name: AddCollisionObject
    category: scene
    description: >-
      Behavior-tree leaf — runtime collision-object operation.
      Adds a collision object to the backend planning scene during
      program execution. Authored by inserting it as a node in the
      behavior tree via `tree_draft_insert_node`. NOT the same as
      `scene_draft_add_object`, which authors a static, design-time
      scene resource that exists for the entire program run; choose
      this leaf instead whenever the request implies the object should
      appear at a specific moment in the cycle.
    tags: [scene, collision]
    profiles:
      min_profile: v0.0
    kind: leaf
    children:
      min: 0
      max: 0
    swap_class: scene_object_create
    parameters:
      - name: object_id
        schema:
          type: string
        required: true
        parameterizable: true
        ui_editor: blackboard_key_selector
        blackboard_role: literal_or_key_reader
        blackboard_value_type: string
        description: Unique identifier for the collision object. May be a literal
          ID, a program parameter, or a declared blackboard key/field binding.
      - name: shape
        schema_ref: "#/schema_types/shape"
        required: true
        ui_editor: shape
        description: >-
          Collision shape object with `type` plus the type-specific dimensions
          required by the schema.
      - name: pose
        schema_ref: "#/schema_types/stored_pose"
        required: true
        description: >-
          Object PoseStamped — must contain `frame_id` (string,
          required), `position_m` ([x, y, z] in meters), and exactly
          one of `orientation_xyzw` ([x, y, z, w] quaternion) or
          `orientation_rpy_deg` ([roll, pitch, yaw] in degrees). The
          frame id lives INSIDE pose; there is no separate top-level
          frame_id parameter.
    required_capabilities:
      - scene.shape.box
      - scene.shape.sphere
      - scene.shape.cylinder
      - scene.shape.mesh
      - scene.edit.add
    execution:
      blocking: true
      cancellable: false
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.AddCollisionObject
    observability:
      emits_events: []
      consumes_events: []

