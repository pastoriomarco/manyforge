    target_parameter: target
  - capability_id: state.observed.current
    scope: target_binding
    target_parameter: target
  - capability_id: validation.trajectory.non_collision
    scope: target_binding
    target_parameter: target
  - capability_id: collision.query.pre_execution
    scope: cell_global
  - capability_id: execution.trajectory.execute
    scope: target_binding
    target_parameter: target
    effectful: true
  - capability_id: execution.feedback.phase_events
    scope: target_binding
    target_parameter: target
  execution:
    blocking: true
    cancellable: true
    owner_api: kernel.operation
  outcomes:
    success: operation_succeeded
    failure: operation_failed
    interrupted: operation_terminal
  runners:
    py_trees:
      implementation_id: motion_follow_cartesian_path_v1
  observability:
    event_family: manyforge.program.node
- id: motion.move_until_signal
  name: Move until signal
  category: motion
  description: Moves the robot to a stored pose and stops it early when the interrupt
    condition trips. A trip gives the node result set by on_signal, and a move that
    ends without a trip gives on_no_signal. The node fails when the Stop cannot be
    proven or the signal source is lost.
  stability: stable
  tags:
  - motion
  - interrupt
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Robot target (component and command target) that the move runs on.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: base_frame
    required: true
    description: Robot base frame that the stored goal pose is stated in.
    schema:
      schema_ref: '#/schema_types/frame_reference'
  - id: tcp_endpoint
    required: false
    description: TCP the move uses; omitted means current, the robot's Active TCP.
    default:
      kind: current
    schema_ref: '#/schema_types/tcp_selector'
  - id: goal
    required: true
    description: Stored pose the move goes to; its frame_ref sets the frame it is
      stated in.
    schema_ref: '#/schema_types/stored_pose'
  - id: planner
    required: false
    description: Planner settings for this move; only the fields set here override
      the Deployment planner.
    schema_ref: '#/schema_types/planner_override'
  - id: max_tcp_linear_speed_mps
    required: false
    description: Per-move TCP linear speed cap in m/s; the lower of this and the Deployment
      limit applies. Omitted uses the Deployment limit.
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: clearance_m
    required: false
    description: Collision clearance in meters for this move, 0 to 0.05. Omitted keeps
      the Deployment clearance.
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
        max_inclusive: 0.05
  - id: velocity_scale
    required: false
    description: Velocity scaling factor, above 0 up to 1; default 1.0.
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 1.0
  - id: acceleration_scale
    required: false
    description: Acceleration scaling factor, above 0 up to 1; default 1.0.
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 1.0
  - id: joint_position_tol_rad
    required: false
    description: Joint tolerance in radians for the start-state check and cached trajectory
      matching; default 0.05.
    default: 0.05
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: translation_tol_m
    required: false
    description: Translation tolerance in meters for pose checks in planning and cached
      trajectory matching; default 0.005.
    default: 0.005
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: rotation_tol_rad
    required: false
    description: Rotation tolerance in radians for pose checks in planning and cached
      trajectory matching; default 0.05.
    default: 0.05
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: planning_timeout_s
    required: false
    description: Seconds allowed for planning before the attempt fails; default 2.0.
    default: 2.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: execution_timeout_s
    required: false
    description: Seconds allowed for executing the move before the attempt fails;
      default 10.0.
    default: 10.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: cache_mode
    required: false
    description: default reuses a stored trajectory when it still matches the scene
      and start state; disable always plans fresh.
    default: default
    schema:
      type: enum
      values:
      - default
      - disable
  - id: stop_mode
    required: true
    description: 'Primary Stop mode used when the condition trips: spring_back_hold,
      soft_on_path, hard_deceleration or spring_back_fast.'
    schema:
      type: enum
      values:
      - spring_back_hold
      - soft_on_path
      - hard_deceleration
      - spring_back_fast
  - id: activation_mode
    required: false
    description: 'Arming rule: require_inactive_at_arm (default) needs the signal
      off at start; fresh_edge_after_arm needs a new change; trip_if_already_active
      trips if on.'
    default: require_inactive_at_arm
    schema:
      type: enum
      values:
      - require_inactive_at_arm
      - fresh_edge_after_arm
      - trip_if_already_active
  - id: interrupt_condition
    required: true
    description: Condition that trips the interrupt, built from signals and keys.
      Keys it reads must declare an initial value.
    schema:
      type: component_interrupt_condition
  - id: on_signal
    required: false
    description: 'Node result when the condition trips: success or failure; default
      success.'
    schema:
      type: enum
      values:
      - success
      - failure
  - id: on_no_signal
    required: false
    description: 'Node result when the move ends without a trip: success or failure;
      default success for this node.'
    schema:
      type: enum
      values:
      - success
      - failure
  - id: priority
    required: false
    description: Priority from 0 to 100 used to choose the Stop when several rules
      act on the same robot; default 0.
    default: 0
    schema:
      type: int
      constraints:
        min_inclusive: 0
        max_inclusive: 100
  - id: stop_entry_stage_id
    required: false
    description: Stop stage the interrupt's Stop starts from. Omitted means the robot's
      first stage.
    schema:
      type: string
  - id: success_through_stage_id
    required: false
    description: Last Stop stage at which a trip still counts as success. Omitted
      means only the entry stage counts.
    schema:
      type: string
  - id: mock_simulation
    required: false
    description: 'Scripted signal values for Mock runs: each row sets a signal''s
      start value and an optional timed change. Omitted means none.'
    schema:
      type: array
      items:
        schema_ref: '#/schema_types/mock_signal_simulation'
  required_capabilities:
  - capability_id: planning.motion.pose_goal
    scope: target_binding
    target_parameter: target
  - capability_id: planning.trajectory.time_parameterized
    scope: target_binding
    target_parameter: target
  - capability_id: state.observed.current
    scope: target_binding
    target_parameter: target
  - capability_id: validation.trajectory.non_collision
    scope: target_binding
    target_parameter: target
  - capability_id: collision.query.pre_execution
    scope: cell_global
  - capability_id: execution.trajectory.execute
    scope: target_binding
    target_parameter: target
    effectful: true
  - capability_id: execution.feedback.phase_events
    scope: target_binding
    target_parameter: target
  - capability_id: execution.interrupt.resource_scoped
    scope: cell_global
  execution:
    blocking: true
    cancellable: true
    owner_api: kernel.operation
  outcomes:
    success: signal_trip_or_allowed_natural_completion
    failure: operation_failed
    interrupted: operation_terminal
  runners:
    py_trees:
      implementation_id: motion_move_until_signal_v1
  observability:
    event_family: manyforge.program.node
