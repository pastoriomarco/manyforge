          type: float
        length: 3
      translation_step_m:
        type: float
        constraints:
          min_exclusive: 0.0
      rotation_step_deg:
        type: float
        constraints:
          min_exclusive: 0.0
      force_vertical_pick:
        type: bool
      min_tcp_z_m:
        type: float
        constraints:
          min_inclusive: 0.0
      maximum_candidate_count:
        type: int
        constraints:
          min_inclusive: 1
          max_inclusive: 4096
      search_strategy:
        type: enum
        values:
        - first_feasible
        - best_cost
  pick_motion_options:
    type: object
    additional_properties: false
    properties:
      approach_velocity_scale:
        type: float
        constraints:
          min_exclusive: 0.0
          max_inclusive: 1.0
      descend_velocity_scale:
        type: float
        constraints:
          min_exclusive: 0.0
          max_inclusive: 1.0
      retreat_velocity_scale:
        type: float
        constraints:
          min_exclusive: 0.0
          max_inclusive: 1.0
      acceleration_scale:
        type: float
        constraints:
          min_exclusive: 0.0
          max_inclusive: 1.0
      max_tcp_linear_speed_mps:
        type: float
        constraints:
          min_exclusive: 0.0
      joint_position_tol_rad:
        type: float
        constraints:
          min_inclusive: 0.0
      translation_tol_m:
        type: float
        constraints:
          min_inclusive: 0.0
      rotation_tol_rad:
        type: float
        constraints:
          min_inclusive: 0.0
      planning_timeout_s:
        type: float
        constraints:
          min_exclusive: 0.0
      execution_timeout_s:
        type: float
        constraints:
          min_exclusive: 0.0
      cache_mode:
        type: enum
        values:
        - default
        - disable
  shape:
    type: object
    additional_properties: false
    required:
    - type
    properties:
      type:
        type: enum
        values:
        - box
        - sphere
        - cylinder
        - mesh
      box_dimensions_m:
        type: array
        items:
          type: float
          constraints:
            min_exclusive: 0.0
        length: 3
        required_when:
          type: box
        allowed_when:
          type: box
      sphere_radius_m:
        type: float
        constraints:
          min_exclusive: 0.0
        required_when:
          type: sphere
        allowed_when:
          type: sphere
      cylinder_radius_m:
        type: float
        constraints:
          min_exclusive: 0.0
        required_when:
          type: cylinder
        allowed_when:
          type: cylinder
      cylinder_height_m:
        type: float
        constraints:
          min_exclusive: 0.0
        required_when:
          type: cylinder
        allowed_when:
          type: cylinder
      mesh_resource_uri:
        type: string
        required_when:
          type: mesh
        allowed_when:
          type: mesh
      mesh_scale:
        type: array
        items:
          type: float
          constraints:
            min_exclusive: 0.0
        length: 3
        allowed_when:
          type: mesh
  mock_signal_simulation:
    type: object
    additional_properties: false
    required:
    - signal
    - start_value
    properties:
      signal:
        type: object
        additional_properties: false
        required:
        - target_role
        - resource_role
        properties:
          target_role:
            type: string
            semantic_type: target_role
          resource_role:
            type: string
            semantic_type: resource_role
      start_value:
        type: bool
      change:
        type: object
        additional_properties: false
