    properties:
      source:
        type: enum
        values:
        - current_pose
        - scene_resource
        - target_frame
      scene_resource_id:
        type: string
        semantic_type: scene_resource
        required_when:
          source: scene_resource
        allowed_when:
          source: scene_resource
      target_role:
        type: string
        semantic_type: target_role
        required_when:
          source: target_frame
        allowed_when:
          source: target_frame
      frame_role:
        type: string
        semantic_type: frame_role
        required_when:
          source: target_frame
        allowed_when:
          source: target_frame
  pose_frame_ref:
    type: object
    additional_properties: false
    required:
    - kind
    properties:
      kind:
        type: enum
        values:
        - cell_frame
        - target_frame
        - scene_resource
      target_role:
        type: string
        semantic_type: target_role
        required_when:
          kind: target_frame
        allowed_when:
          kind: target_frame
      frame_role:
        type: string
        semantic_type: frame_role
        required_when:
          kind: target_frame
        allowed_when:
          kind: target_frame
      scene_resource_id:
        type: string
        semantic_type: scene_resource
        required_when:
          kind: scene_resource
        allowed_when:
          kind: scene_resource
  stored_pose:
    type: object
    additional_properties: false
    required:
    - frame_ref
    - position_m
    - orientation
    properties:
      frame_ref:
        schema_ref: '#/schema_types/pose_frame_ref'
      position_m:
        type: array
        items:
          type: float
        length: 3
      orientation:
        type: object
        additional_properties: false
        properties:
          xyzw:
            type: array
            items:
              type: float
            length: 4
          rpy_deg:
            type: array
            items:
              type: float
            length: 3
        exactly_one:
        - - xyzw
          - rpy_deg
  motion_pose:
    type: object
    additional_properties: false
    required:
    - position_m
    - orientation
    properties:
      frame_ref:
        schema_ref: '#/schema_types/pose_frame_ref'
      position_m:
        type: array
        items:
          type: float
        length: 3
      orientation:
        type: object
        additional_properties: false
        properties:
          xyzw:
            type: array
            items:
              type: float
            length: 4
          rpy_deg:
            type: array
            items:
              type: float
            length: 3
        exactly_one:
        - - xyzw
          - rpy_deg
  motion_reference:
    type: object
    additional_properties: false
    required:
    - type
    properties:
      type:
        type: enum
        values:
        - frame_role
        - component_body_role
        - scene_resource
        - runtime_object
        - pose
        - cell_frame
      frame_role_id:
        type: string
        semantic_type: frame_role
        semantic_scope_parameter: target_role
        required_when:
          type: frame_role
        allowed_when:
          type: frame_role
        description: A frame role of target_role when it is named, otherwise of the
          moving robot (the node's target_role).
      target_role:
        type: string
        semantic_type: target_role
        description: The robot that owns frame_role_id; absent means the moving robot.
          Another robot's frame is sampled once when the motion is admitted.
        allowed_when:
          type: frame_role
      collision_body_role_id:
        type: string
        semantic_type: collision_body_role
        required_when:
          type: component_body_role
        allowed_when:
          type: component_body_role
      scene_resource_id:
        type: string
        semantic_type: scene_resource
        required_when:
          type: scene_resource
        allowed_when:
          type: scene_resource
      runtime_object_id:
        type: string
        required_when:
          type: runtime_object
        allowed_when:
          type: runtime_object
      pose:
        schema_ref: '#/schema_types/motion_pose'
        required_when:
          type: pose
        allowed_when:
          type: pose
  pose_authoring_input:
    type: object
    additional_properties: false
    required:
    - frame_ref
    - position_m
    resolves_to: '#/schema_types/stored_pose'
    properties:
      frame_ref:
        schema_ref: '#/schema_types/pose_frame_ref'
      position_m:
        type: array
        items:
          type: float
        length: 3
      orientation:
        type: object
        additional_properties: false
        properties:
          xyzw:
            type: array
            items:
              type: float
            length: 4
          rpy_deg:
            type: array
            items:
              type: float
            length: 3
        exactly_one:
        - - xyzw
          - rpy_deg
      rotate_local_rpy_deg:
        type: array
        items:
          type: float
        length: 3
        requires_current_value: true
      rotate_world_rpy_deg:
        type: array
        items:
          type: float
        length: 3
        requires_current_value: true
      rpy_delta_deg:
        type: array
        items:
          type: float
        length: 3
        requires_current_value: true
        description: Component-wise authored RPY field addition, not physical composition.
      orientation_from:
        schema_ref: '#/schema_types/orientation_reference'
    exactly_one:
    - - orientation
      - rotate_local_rpy_deg
      - rotate_world_rpy_deg
      - rpy_delta_deg
      - orientation_from
  joint_target:
    type: object
    additional_properties: false
    required:
    - joint_name
    - position_rad
    properties:
      joint_name:
        type: string
        semantic_type: source_joint
