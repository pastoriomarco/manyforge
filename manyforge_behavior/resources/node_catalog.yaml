  - id: command_gripper
    name: CommandGripper
    category: end_effector
    description: >-
      Command an actuated gripper to a numeric command-space position and block
      until the motion completes. This is the transport-aware actuated sibling
      of the logical set/check/wait gripper-state nodes.
    stability: experimental
    tags: [end_effector, gripper, actuation]
    profiles:
      min_profile: v0.1
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: gripper_id
        schema:
          type: string
        required: true
        description: Deployment gripper identifier to command.
      - name: position
        schema:
          type: float
        required: true
        description: >-
          Numeric gripper command-space target position. UI presets are parsed
          from the deployment robot SRDF's matching gripper group_state values.
      - name: max_effort
        schema:
          type: float
        required: false
        description: Optional maximum effort for backends that support gripper-command effort limits.
      - name: duration_s
        schema:
          type: float
          constraints:
            min_inclusive: 0
        required: false
        description: >-
          Optional command duration. If omitted, the runtime uses the deployment
          gripper motion_time_s.
      - name: timeout_s
        schema:
          type: float
          constraints:
            min_inclusive: 0
        required: false
        description: >-
          Maximum time to wait for the gripper command to complete. If omitted,
          the runtime derives a timeout from the selected command duration.
          Use 0 to disable the timeout.
    required_capabilities:
