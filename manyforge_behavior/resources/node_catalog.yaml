  observability:
    event_family: manyforge.program.node
- id: gripper.command_position
  name: Command gripper position
  category: gripper
  description: Commands a gripper to a numeric position or to its open or closed preset
    and waits for the command to complete. A pneumatic gripper instead writes its
    valve outputs, confirms its required inputs and holds for its dwell, and a Close
    that requires grasp evidence fails when no evidence is found.
  stability: stable
  tags:
  - gripper
  - tool
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Gripper component and command target to command.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: position
    required: true
    description: Target as an angular (radians) or linear (meters) position for the
      gripper kind, or the named open or closed preset.
    schema_ref: '#/schema_types/coordinate_position'
  - id: max_effort
    required: false
    description: Effort limit in newton-meters or newtons, sent only to a controller
      that exposes an effort interface; omitted sends no limit.
    schema_ref: '#/schema_types/coordinate_effort_limit'
  - id: command_duration_s
    required: false
    description: Command duration in seconds; omitted uses the configured duration
      of a pneumatic gripper and 0 for other grippers.
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: wait_for_duration
    required: false
    description: When true, a completed command is held until command_duration_s has
      elapsed; omitted or false completes on the controller result.
    default: false
    schema:
      type: bool
  - id: required_inputs
    required: false
    description: Input levels to confirm after a pneumatic gripper's valve outputs,
      at most four, each a declared input of that gripper; ignored by other grippers.
    default: []
    schema:
      type: array
      max_items: 4
      items:
        type: object
        additional_properties: false
        required:
        - input
        - value
        properties:
          input:
            type: enum
            values:
            - open
            - closed
            - pressure
            - workpiece_grasped
          value:
            type: bool
  - id: dwell_while_held
    required: false
    description: 'Whether the pneumatic dwell keeps running while an operator Stop
      holds the node: pause stops it, count keeps it running.'
    default: pause
    schema:
      type: enum
      values:
      - count
      - pause
  - id: completion_timeout_s
    required: false
    description: 'Seconds allowed after command_duration_s for the gripper to report
      done (goal result or confirming signal); the command fails when it has not.
      A pneumatic delivery is bounded by this value alone. Omitted: 5.0.'
    default: 5.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  required_capabilities:
  - capability_id: tool.gripper.command
    scope: target_binding
    target_parameter: target
    effectful: true
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
  execution:
    blocking: true
    cancellable: true
    owner_api: kernel.command_target
  outcomes:
    success: command_succeeded
    failure: command_failed
    interrupted: command_terminal
  runners:
    py_trees:
      implementation_id: gripper_command_position_v1
  observability:
    event_family: manyforge.program.node
- id: gripper.check_status
  name: Check gripper status
  category: gripper
  description: Reads the gripper target's current command state once and compares
    it with expected_state. Succeeds on a match and fails without waiting when the
    state differs. This is the state of the last gripper command, not proof that a
    part is held. Reached means the controller reported the goal reached (position
    gripper) or the valve output was delivered and the dwell elapsed (pneumatic gripper
    with a valve output). A pneumatic gripper that is display-only or switches its
    valves through mapped I/O has no command state; Apply refuses the node.
  stability: stable
  tags:
  - gripper
  - tool
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Gripper component and command target whose command state is read.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: expected_state
    required: true
    description: 'Command state to match: idle, moving (executing), reached (completed)
      or failed.'
    schema:
      type: enum
      values:
      - idle
      - moving
      - reached
      - failed
  required_capabilities:
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
    when:
      parameter: expected_state
      equals: idle
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
    when:
      parameter: expected_state
      equals: moving
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
    when:
      parameter: expected_state
      equals: reached
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
    when:
      parameter: expected_state
      equals: failed
  execution:
    blocking: false
    cancellable: false
    owner_api: kernel.command_target
  outcomes:
    success: matched
    failure: not_matched
  runners:
    py_trees:
      implementation_id: gripper_check_status_v1
  observability:
    event_family: manyforge.program.node
- id: gripper.wait_for_status
  name: Wait for gripper status
  category: gripper
  description: Waits until the captured gripper command reaches expected_state. Fails
    on timeout, when the command or its source is replaced or unavailable, or when
    the command reports failed. This is the command state, not proof that a part is
    held. Reached means the controller reported the goal reached (position gripper)
    or the valve output was delivered and the dwell elapsed (pneumatic gripper with
    a valve output). A pneumatic gripper that is display-only or switches its valves
    through mapped I/O has no command state; Apply refuses the node.
  stability: stable
  tags:
  - gripper
  - tool
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Gripper component and command target whose command is observed.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: expected_state
    required: true
    description: 'Command state to wait for: idle, moving (executing), reached (completed)
      or failed.'
    schema:
      type: enum
      values:
      - idle
      - moving
      - reached
      - failed
  - id: timeout_s
    required: true
    description: Program-time seconds before the wait fails, from 0.01 to 3600; a
      Halt pauses this time.
    schema:
      type: float
      constraints:
        min_inclusive: 0.01
        max_inclusive: 3600.0
  - id: timeout_while_held
    required: false
    description: 'Whether time held by an operator Stop counts toward timeout_s: pause
      excludes it, count includes it.'
    default: pause
    schema:
      type: enum
      values:
      - count
      - pause
  required_capabilities:
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
    when:
      parameter: expected_state
      equals: idle
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
    when:
      parameter: expected_state
      equals: moving
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
    when:
      parameter: expected_state
      equals: reached
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: target
    when:
      parameter: expected_state
      equals: failed
  execution:
    blocking: true
    cancellable: true
    owner_api: kernel.command_target
  outcomes:
    success: matched
    failure: unavailable_stale_failed_or_timeout
    interrupted: cancelled
  runners:
    py_trees:
      implementation_id: gripper_wait_for_status_v1
  observability:
    event_family: manyforge.program.node
- id: model.get_frame_pose
