entries:
- id: sequence
  name: Sequence
  category: control_flow
  description: Tick children in order until one fails or all succeed.
  stability: stable
  tags:
  - control_flow
  - composite
  profiles:
    min_program_profile: composable-cell-v1
  kind: composite
  children:
    min: 1
    max: 4096
  parameters: []
  required_capabilities: []
  execution:
    blocking: false
    cancellable: false
    owner_api: orchestration.control_flow
  runners:
    py_trees:
      implementation_id: sequence_v1
  observability:
    event_family: manyforge.program.node
- id: fallback
  name: Fallback
  category: control_flow
  description: Tick children in order until one succeeds or all fail.
  stability: stable
  tags:
  - control_flow
  - composite
  profiles:
    min_program_profile: composable-cell-v1
  kind: composite
  children:
    min: 1
