        max_inclusive: 1920
  - id: scene_snapshot_height
    required: false
    description: 'Snapshot height in pixels, from 64 to 1080. Used only with snapshot_image.
      Omitted: 480.'
    default: 480
    schema:
      type: int
      constraints:
        min_inclusive: 64
        max_inclusive: 1080
  - id: scene_snapshot_format
    required: false
    description: 'Snapshot image format, jpeg or png. Used only with snapshot_image.
      Omitted: jpeg.'
    default: jpeg
    schema:
      type: enum
      values:
      - jpeg
      - png
  required_capabilities:
  - capability_id: assistant.model.query
    scope: cell_global
  blackboard:
