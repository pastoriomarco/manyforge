# ManyForge v1 Node Catalog (runtime artifact)
#
# This runtime catalog uses schema-backed parameters. Frozen reference
# artifacts live under manyforge_specs/docs/spec/artifacts/.
#
# Schema: docs/spec/440-node-catalog-format-and-versioning.md
# Node semantics: docs/spec/410-node-catalog-and-orchestration-adapters.md
# Capability keys: docs/spec/240-supported-backend-capability-profile.md

api_version: manyforge.node_catalog.v1
catalog_version: "0.2.0"

schema_types:
  orientation_reference:
    type: object
    additional_properties: false
    required: [source]
    properties:
      source:
        type: enum
        values: [current_pose, scene_object, frame]
      object_id:
        type: string
        required_when: {source: scene_object}
      frame_id:
        type: string
        required_when: {source: frame}

  stored_pose:
    type: object
    additional_properties: false
    required: [frame_id, position_m]
    properties:
      frame_id:
        type: string
      position_m:
        type: array
        items: float
        length: 3
      orientation_xyzw:
        type: array
        items: float
        length: 4
      orientation_rpy_deg:
        type: array
        items: float
        length: 3
    exactly_one:
      - [orientation_xyzw, orientation_rpy_deg]
  pose_authoring_input:
    type: object
    additional_properties: false
    required: [frame_id, position_m]
    resolves_to: "#/schema_types/stored_pose"
    properties:
      frame_id:
        type: string
      position_m:
        type: array
        items: float
        length: 3
      orientation_xyzw:
        type: array
        items: float
        length: 4
      orientation_rpy_deg:
        type: array
        items: float
        length: 3
      rotate_local_rpy_deg:
        type: array
        items: float
        length: 3
        requires_current_value: true
      rotate_world_rpy_deg:
        type: array
        items: float
        length: 3
        requires_current_value: true
      rpy_delta_deg:
        type: array
        items: float
        length: 3
        requires_current_value: true
        description: Component-wise authored RPY field addition, not physical composition.
      orientation_from:
        schema_ref: "#/schema_types/orientation_reference"
    exactly_one:
      - [orientation_xyzw, orientation_rpy_deg, rotate_local_rpy_deg,
         rotate_world_rpy_deg, rpy_delta_deg, orientation_from]
  motion_pose_goal:
    # ADR-0023 §3.8: a commanded absolute motion goal is unambiguous:
    # frame_id + position_m + exactly one orientation form. Relative-move
    # deltas use the separate loose `motion_pose_offset`.
    # NOTE: this is the ABSOLUTE goal schema. Relative-move deltas use the
    # separate loose `motion_pose_offset` (an offset has no frame_id of its own
    # and may be position- or orientation-only).
    type: object
    additional_properties: false
    required: [frame_id, position_m]
    properties:
      frame_id:
        type: string
      position_m:
        type: array
        items: float
        length: 3
      orientation_xyzw:
        type: array
        items: float
        length: 4
      orientation_rpy_deg:
        type: array
        items: float
        length: 3
    exactly_one:
      - [orientation_xyzw, orientation_rpy_deg]
  motion_pose_offset:
    # A relative-move delta: expressed in the offset_reference frame, so it
    # carries no frame_id and may be position-only, orientation-only, or both.
    # Ambiguity is still bounded: at most one orientation form.
    type: object
    additional_properties: false
    properties:
      position_m:
        type: array
        items: float
        length: 3
      orientation_xyzw:
        type: array
        items: float
        length: 4
      orientation_rpy_deg:
        type: array
        items: float
        length: 3
    mutually_exclusive:
      - [orientation_xyzw, orientation_rpy_deg]
  shape:
    type: object
    additional_properties: false
    required: [type]
    properties:
      type:
        type: enum
        values: [box, sphere, cylinder, mesh]
      box_dimensions_m:
        type: array
        items:
          type: float
          constraints:
            min_exclusive: 0.0
        length: 3
        required_when: {type: box}
        allowed_when: {type: box}
      sphere_radius_m:
        type: float
        constraints:
          min_exclusive: 0.0
        required_when: {type: sphere}
        allowed_when: {type: sphere}
      cylinder_radius_m:
        type: float
        constraints:
          min_exclusive: 0.0
        required_when: {type: cylinder}
        allowed_when: {type: cylinder}
      cylinder_height_m:
        type: float
        constraints:
          min_exclusive: 0.0
        required_when: {type: cylinder}
        allowed_when: {type: cylinder}
      mesh_resource_uri:
        type: string
        required_when: {type: mesh}
        allowed_when: {type: mesh}
      mesh_scale:
        type: array
        items:
          type: float
          constraints:
            min_exclusive: 0.0
        length: 3
        allowed_when: {type: mesh}
  relative_move_reference:
    type: object
    additional_properties: false
    required: [type]
    properties:
      type:
        type: enum
        values: [frame, object, robot_link, pose]
      id:
        type: string
      pose:
        type: object
        additional_properties: true
  relative_move:
    type: object
    additional_properties: false
    required: [target_reference, offset]
    properties:
      target_reference:
        schema_ref: "#/schema_types/relative_move_reference"
      offset_reference:
        schema_ref: "#/schema_types/relative_move_reference"
      offset:
        schema_ref: "#/schema_types/motion_pose_offset"
  per_joint_deceleration_limits:
    type: object
    additional_properties:
      type: float
      constraints:
        min_exclusive: 0.0
  template_variable_binding:
    type: object
    additional_properties: false
    exactly_one:
      - [key_ref, field_ref]
    properties:
      key_ref:
        type: string
      field_ref:
        type: object
        additional_properties: false
        required: [namespace, field]
        properties:
          namespace:
            type: string
          field:
            type: string
  template_variable_map:
    type: object
    additional_properties:
      schema_ref: "#/schema_types/template_variable_binding"
  pose_offset_envelope:
    type: object
    additional_properties: false
    required:
      - position_min_m
      - position_max_m
      - orientation_rpy_min_deg
      - orientation_rpy_max_deg
    properties:
      position_min_m:
        type: array
        items: float
        length: 3
      position_max_m:
        type: array
        items: float
        length: 3
      orientation_rpy_min_deg:
        type: array
        items: float
        length: 3
      orientation_rpy_max_deg:
        type: array
        items: float
        length: 3

entries:

  # ---------------------------------------------------------------------------
  # Control flow (engine-native)
  # ---------------------------------------------------------------------------

  - id: sequence
    name: Sequence
    category: control_flow
    description: >-
      Tick children left-to-right; succeed when all succeed, fail on first failure.
      Memory-enabled (resumes from last running child).
    tags: [control_flow, composite]
    profiles:
      min_profile: v0.0
    kind: composite
    children:
      min: 1
      max: unbounded
    swap_class: composite_choice
    parameters: []
    required_capabilities: []
    execution:
      blocking: false
      cancellable: false
    runners:
      py_trees:
        implementation_kind: native
        engine_class: py_trees.composites.Sequence
        options:
          memory: true
    observability:
      emits_events: []
      consumes_events: []

  - id: fallback
    name: Fallback
    category: control_flow
    description: >-
      Tick children left-to-right; succeed on first success, fail when all fail.
      Memory-enabled (resumes from last running child).
    tags: [control_flow, composite, selector]
    profiles:
      min_profile: v0.0
    kind: composite
    children:
      min: 1
      max: unbounded
    swap_class: composite_choice
    parameters: []
    required_capabilities: []
    execution:
      blocking: false
      cancellable: false
    runners:
      py_trees:
        implementation_kind: native
        engine_class: py_trees.composites.Selector
        options:
          memory: true
    observability:
      emits_events: []
      consumes_events: []

  - id: parallel
    name: Parallel
    category: control_flow
    description: >-
      Tick all children simultaneously. Succeed when all succeed; fail on any failure.
    tags: [control_flow, composite]
    profiles:
      min_profile: v0.0
    kind: composite
    children:
      min: 1
      max: unbounded
    parameters: []
    required_capabilities: []
    execution:
      blocking: false
      cancellable: false
    runners:
      py_trees:
        implementation_kind: native
        engine_class: py_trees.composites.Parallel
        options:
          policy: py_trees.common.ParallelPolicy.SuccessOnAll()
    observability:
      emits_events: []
      consumes_events: []

  - id: inverter
    name: Inverter
    category: control_flow
    description: >-
      Decorator that inverts the child's result (success becomes failure and vice versa).
    tags: [control_flow, decorator]
    profiles:
      min_profile: v0.0
    kind: decorator
    children:
      min: 1
      max: 1
    parameters: []
    required_capabilities: []
    execution:
      blocking: false
      cancellable: false
    runners:
      py_trees:
        implementation_kind: native
        engine_class: py_trees.decorators.Inverter
    observability:
      emits_events: []
      consumes_events: []

  - id: repeat
    name: Repeat
    category: control_flow
    description: >-
      Decorator that repeats its child a fixed number of times. num_cycles=-1 means forever.
    tags: [control_flow, decorator]
    profiles:
      min_profile: v0.0
    kind: decorator
    children:
      min: 1
      max: 1
    swap_class: bounded_loop
    swap_param_aliases:
      num_attempts: num_cycles
    parameters:
      - name: num_cycles
        schema:
          type: int
        required: true
        default: -1
        parameterizable: true
        description: Number of cycles. -1 for infinite.
    required_capabilities: []
    execution:
      blocking: false
      cancellable: false
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.control_flow.RepeatDecorator
    observability:
      emits_events: []
      consumes_events: []

  - id: retry
    name: Retry
    category: control_flow
    description: >-
      Decorator that retries its child on FAILURE. num_attempts=-1 means forever.
    tags: [control_flow, decorator]
    profiles:
      min_profile: v0.0
    kind: decorator
    children:
      min: 1
      max: 1
    swap_class: bounded_loop
    swap_param_aliases:
      num_cycles: num_attempts
    parameters:
      - name: num_attempts
        schema:
          type: int
        required: true
        default: -1
        parameterizable: true
        description: Max retry attempts. -1 for infinite.
    required_capabilities: []
    execution:
      blocking: false
      cancellable: false
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.control_flow.RetryDecorator
    observability:
      emits_events: []
      consumes_events: []

  - id: timer
    name: Timer
    category: control_flow
    description: >-
      Wait for a specified duration before succeeding.
    tags: [control_flow, timing]
    profiles:
      min_profile: v0.0
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: duration_s
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: true
        parameterizable: true
        description: Duration to wait in seconds.
    required_capabilities: []
    execution:
      blocking: true
      cancellable: true
      timeout_param: duration_s
    interruptible: true
    default_interrupt_scope: active_node
    runners:
      py_trees:
        implementation_kind: native
        engine_class: py_trees.timers.Timer
    observability:
      emits_events: []
      consumes_events: []

  # ---------------------------------------------------------------------------
  # Motion (planning + execution through the kernel)
  # ---------------------------------------------------------------------------

  - id: move_manipulator_action
    name: MoveManipulatorAction
    category: motion
    description: >-
      Execute a motion request (plan + validate + execute) through the kernel.
    tags: [motion, planning, execution]
    profiles:
      min_profile: v0.0
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: move_id
        schema:
          type: string
        required: true
        description: >-
          Stable identifier for this move instance (used for trajectory caching).
      - name: motion_type
        schema:
          type: enum
          values: [joint_goal, pose_goal, relative_move]
        required: true
        enum_options:
          - value: joint_goal
          - value: pose_goal
          - value: relative_move
            profiles:
              min_profile: v0.1
            required_capabilities:
              - context.pose.resolve_reference
        description: The type of motion to plan.
      - name: joint_goal_names
        schema:
          type: array
          items: string
        required: false
        visible_when:
          param: motion_type
          equals: joint_goal
        description: >-
          Joint names for joint_goal motion type. Required when motion_type=joint_goal.
      - name: joint_goal_positions_rad
        schema:
          type: array
          items: float
        required: false
        visible_when:
          param: motion_type
          equals: joint_goal
        description: >-
          Joint positions in radians for joint_goal. Required when motion_type=joint_goal.
      - name: pose_goal
        schema_ref: "#/schema_types/motion_pose_goal"
        required: false
        visible_when:
          param: motion_type
          equals: pose_goal
        ui_editor: pose_or_blackboard_field_selector
        blackboard_role: field_reader
        blackboard_value_type: pose
        description: >-
          Target end-effector pose in base_frame for pose_goal motion type.
          Required when motion_type=pose_goal. May be an inline pose or a
          declared blackboard field_ref.
      - name: relative_move
        schema_ref: "#/schema_types/relative_move"
        required: false
        profiles:
          min_profile: v0.1
        visible_when:
          param: motion_type
          equals: relative_move
        ui_editor: relative_move
        description: >-
          Relative move goal for motion_type=relative_move. Structure:
          {target_reference: {type: frame|object|robot_link|pose, id?: ..., pose?: inline_pose|field_ref},
          offset_reference?: {type: frame|object|robot_link|pose, id?: ..., pose?: inline_pose|field_ref},
          offset: {position_m: [...], orientation_xyzw|orientation_rpy_deg: [...]}}.
          target_reference selects the target origin pose. offset_reference selects the axes in
          which the xyz/rpy offset is expressed; if omitted, it defaults to target_reference.
          Use `robot_link` for current TCP/link-relative moves, `frame` for arbitrary scene
          frames, and `pose` for either an inline reference pose or a declared pose field_ref.
      - name: velocity_scale
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 1.0
        parameterizable: true
        description: Velocity scaling factor.
      - name: acceleration_scale
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 1.0
        parameterizable: true
        description: Acceleration scaling factor.
      - name: max_tcp_linear_speed_mps
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        parameterizable: true
        description: >-
          Per-move TCP linear speed cap (m/s). Effective limit is
          min(global_max, this value). Omit to use global limit only.
      - name: joint_position_tol_rad
        schema:
          type: float
          constraints:
            min_inclusive: 0.0
        required: false
        default: 0.05
        parameterizable: true
        description: Joint position tolerance in radians.
      - name: translation_tol_m
        schema:
          type: float
          constraints:
            min_inclusive: 0.0
        required: false
        default: 0.005
        parameterizable: true
        description: Cartesian translation tolerance in meters.
      - name: rotation_tol_rad
        schema:
          type: float
          constraints:
            min_inclusive: 0.0
        required: false
        default: 0.05
        parameterizable: true
        description: Cartesian rotation tolerance in radians.
      - name: planning_timeout_s
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        default: 2.0
        parameterizable: true
        description: Planning timeout in seconds.
      - name: execution_timeout_s
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        default: 10.0
        parameterizable: true
        description: Execution timeout in seconds.
      - name: cache_mode
        schema:
          type: enum
          values: [default, disable]
        required: false
        default: default
        description: Trajectory cache mode.
    required_capabilities:
      - planning.motion.joint_goal
      - planning.motion.pose_goal
      - planning.trajectory.time_parameterized
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - execution.trajectory.execute
      - execution.feedback.phase_events
      - execution.stop.soft
    execution:
      blocking: true
      cancellable: true
      timeout_param: execution_timeout_s
    interruptible: true
    default_interrupt_scope: kernel_motion
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.MoveManipulatorAction
    observability:
      emits_events:
        - plan_started
        - plan_completed
        - validation_started
        - validation_passed
        - execute_started
        - execute_completed
      consumes_events:
        - stop_requested

  - id: move_until_signal
    name: MoveUntilSignal
    category: motion
    description: >-
      Phase 4.5E motion-scoped trip node (spec/260 §2.6). Submits a
      scoped execute request that arms a `complete_move_on_signal`
      policy for exactly this move; the kernel owns signal
      arbitration, controlled-stop dispatch, and stop-snapshot
      capture. The node maps the kernel's terminal
      `MotionExecutionOutcome` to py_trees Status: signal_trip →
      SUCCESS; no_signal_trip → SUCCESS by default, or FAILURE when
      `not_found_is_failure=true`; every other terminal cause →
      FAILURE with the cause surfaced via `motion_error_message`.
      Motion-field parity with `move_manipulator_action`: same
      tolerances / scales / timeouts / cache mode / blackboard pose
      resolution / pose-source callbacks / global TCP cap /
      `stop_requested` gate.
    tags: [motion, planning, execution, motion_scoped_trip]
    profiles:
      min_profile: v0.2
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: move_id
        schema:
          type: string
        required: true
        description: Stable move identifier for trajectory caching.
      - name: motion_type
        schema:
          type: enum
          values: [joint_goal, pose_goal, relative_move]
        required: true
        enum_options:
          - value: joint_goal
          - value: pose_goal
          - value: relative_move
            profiles:
              min_profile: v0.2
            required_capabilities:
              - context.pose.resolve_reference
        description: The type of motion to plan.
      - name: joint_goal_names
        schema:
          type: array
          items: string
        required: false
        visible_when:
          param: motion_type
          equals: joint_goal
        description: >-
          Joint names for joint_goal motion type. Required when motion_type=joint_goal.
      - name: joint_goal_positions_rad
        schema:
          type: array
          items: float
        required: false
        visible_when:
          param: motion_type
          equals: joint_goal
        description: >-
          Joint positions in radians for joint_goal. Required when motion_type=joint_goal.
      - name: pose_goal
        schema_ref: "#/schema_types/motion_pose_goal"
        required: false
        visible_when:
          param: motion_type
          equals: pose_goal
        ui_editor: pose_or_blackboard_field_selector
        blackboard_role: field_reader
        blackboard_value_type: pose
        description: >-
          Target end-effector pose in base_frame for pose_goal motion type.
          May be an inline pose or a declared blackboard field_ref.
      - name: relative_move
        schema_ref: "#/schema_types/relative_move"
        required: false
        visible_when:
          param: motion_type
          equals: relative_move
        ui_editor: relative_move
        description: >-
          Relative move goal (see move_manipulator_action for structure).
      - name: policy_id
        schema:
          type: string
        required: true
        description: >-
          The registered move-scoped `complete_move_on_signal` policy
          this scope binds to.
      - name: scope_id
        schema:
          type: string
        required: false
        description: >-
          Per-move binding identifier (default `{move_id}_scope`).
      - name: stop_mode
        schema:
          type: enum
          values: [spring_back_hold, soft_on_path, hard_deceleration]
        required: true
        description: >-
          Controlled-stop mode requested at trip time. The backend's
          capability profile MUST advertise the mode or the kernel
          rejects the execute request before dispatch.
      - name: activation_mode
        schema:
          type: enum
          values: [require_inactive_at_arm, fresh_edge_after_arm, trip_if_already_active, maintain_level_with_hysteresis]
        required: false
        description: >-
          Spec/260 §2.6 activation mode for the binding. Default
          `require_inactive_at_arm`.
      - name: not_found_is_failure
        schema:
          type: bool
        required: false
        description: >-
          When true, `no_signal_trip` terminal cause maps to FAILURE
          instead of SUCCESS. Use for "must contact" semantics.
      - name: allowed_fallback_modes
        schema:
          type: array
          items: string
        required: false
        description: >-
          Stop modes the backend may execute as a fallback at trip
          time (spec/210 §3.11 conjunctive rule). Every entry MUST
          be in the backend capability profile AND the kernel
          policy's `allowed_stop_modes`.
      - name: stop_max_time_s
        schema:
          type: float
        required: false
        description: Upper bound on backend stop confirmation.
      - name: stop_deceleration_time_s
        schema:
          type: float
        required: false
        description: Ramp duration for spring_back_hold / soft_on_path.
      - name: per_joint_max_deceleration_rad_s2
        schema_ref: "#/schema_types/per_joint_deceleration_limits"
        required: false
        description: >-
          Per-joint deceleration limits for soft_on_path feasibility
          and replacement-trajectory generation. Required when
          stop_mode is `soft_on_path`.
      - name: allow_natural_completion_on_short_path
        schema:
          type: bool
        required: false
        default: true
        visible_when:
          param: stop_mode
          equals: soft_on_path
        description: >-
          For generic MoveUntilSignal soft_on_path only: when a signal
          arrives too close to the accepted trajectory endpoint for a
          useful wall-time stop ramp, allow the original motion to
          complete and map the terminal outcome to no_signal_trip
          semantics. Disable when a controlled stop is mandatory.
      - name: scope_outcome_key
        schema:
          type: string
        required: false
        description: >-
          Blackboard key for the terminal MotionExecutionOutcome
          (default `motion_scope_outcome`).
      - name: result_binding_key
        schema:
          type: string
        required: false
        description: >-
          Optional spec/260 §2.6 result-binding key recorded on the
          trip outcome for downstream BT consumers.
      - name: velocity_scale
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 1.0
        parameterizable: true
        description: Velocity scaling factor.
      - name: acceleration_scale
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 1.0
        parameterizable: true
        description: Acceleration scaling factor.
      - name: max_tcp_linear_speed_mps
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        parameterizable: true
        description: >-
          Per-move TCP linear speed cap (m/s). Effective limit is
          min(global_max, this value). Omit to use global limit only.
      - name: joint_position_tol_rad
        schema:
          type: float
          constraints:
            min_inclusive: 0.0
        required: false
        default: 0.05
        parameterizable: true
        description: Joint position tolerance in radians.
      - name: translation_tol_m
        schema:
          type: float
          constraints:
            min_inclusive: 0.0
        required: false
        default: 0.005
        parameterizable: true
        description: Cartesian translation tolerance in meters.
      - name: rotation_tol_rad
