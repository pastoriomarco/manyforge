  category: model
  description: Build-owned experimental example that checks the cell-frame height
    of a component frame against an inclusive range. Fails when the height is outside
    the range or the observed state is unavailable.
  stability: experimental
  tags:
  - example
  - model
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Component and command target whose frame height is read.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: frame
    required: true
    description: Component frame whose height in the cell frame is checked.
    schema:
      schema_ref: '#/schema_types/frame_reference'
  - id: minimum_height_m
    required: true
    description: Lower bound of the allowed height in meters, inclusive.
