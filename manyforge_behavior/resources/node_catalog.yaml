  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Robot target the planned moves run on.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: tool_target
    required: true
    description: Gripper target that the planned gripper command runs on.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: base_frame
    required: true
    description: Robot base frame that the planned poses are stated in.
    schema:
      schema_ref: '#/schema_types/frame_reference'
  - id: tcp_endpoint
