schema_types:
  motion_endpoint_ref:
    type: object
    additional_properties: false
    required:
    - target_role
    - frame_role
    properties:
      target_role:
        type: string
        semantic_type: target_role
      frame_role:
        type: string
        semantic_type: frame_role
  coordinate_position:
    type: object
    additional_properties: false
    required:
    - kind
    properties:
      kind:
        type: enum
        values:
        - angular_rad
        - linear_m
        - named_preset
      value_rad:
        type: float
        required_when:
          kind: angular_rad
        allowed_when:
          kind: angular_rad
      value_m:
        type: float
        required_when:
          kind: linear_m
        allowed_when:
          kind: linear_m
      name:
        type: enum
        values:
        - open
        - closed
        required_when:
          kind: named_preset
        allowed_when:
          kind: named_preset
  coordinate_effort_limit:
    type: object
    additional_properties: false
    required:
    - kind
    properties:
      kind:
        type: enum
        values:
        - angular_newton_meter
        - linear_newton
      value_nm:
        type: float
        constraints:
          min_inclusive: 0.0
        required_when:
          kind: angular_newton_meter
        allowed_when:
          kind: angular_newton_meter
      value_n:
        type: float
        constraints:
          min_inclusive: 0.0
        required_when:
          kind: linear_newton
        allowed_when:
          kind: linear_newton
  orientation_reference:
    type: object
    additional_properties: false
    required:
