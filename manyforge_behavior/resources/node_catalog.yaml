# Generated extension composition; edit extension entries in their package descriptor.
api_version: manyforge.node_catalog.v3
content_version: 3.0.0
catalog_id: manyforge_builtin
catalog_digest: sha256:7794f5c2c483e713113143b08316b5dd5b70dfcdc10e5a6eaeea6fdc2c318797
schema_types:
  tcp_selector:
    type: object
    description: 'Selects the TCP a motion uses: the active TCP held on the blackboard,
      the default TCP of a command target, or an explicit target and frame. The kind
      decides which of the other fields apply.'
    additional_properties: false
    required:
    - kind
    properties:
      kind:
        type: enum
        description: current uses the active TCP; default_of_target uses the target's
          default TCP; entry uses the given target and frame.
        values:
        - current
        - default_of_target
        - entry
      target:
        schema_ref: '#/schema_types/target_reference'
        description: Command target for default_of_target and entry; not allowed for
          current.
        required_when:
          kind:
          - default_of_target
          - entry
        allowed_when:
          kind:
          - default_of_target
          - entry
      frame:
        schema_ref: '#/schema_types/frame_reference'
        description: Frame used as the TCP; required only for kind entry.
        required_when:
          kind: entry
        allowed_when:
          kind: entry
  active_tcp_carrier_frame:
    type: object
    description: Selects the carrier frame for a carried object as the active TCP.
      Its only kind is active_tcp, which is resolved when the object is attached.
    additional_properties: false
    required:
    - kind
    properties:
      kind:
        type: enum
        description: Always active_tcp; there are no other kinds.
        values:
        - active_tcp
  tcp_entry:
    type: object
    description: 'A stored active-TCP value: the command target and the frame that
      acts as the TCP for it. Both fields are required.'
    additional_properties: false
    required:
    - target
    - frame
    properties:
      target:
        schema_ref: '#/schema_types/target_reference'
      frame:
        schema_ref: '#/schema_types/frame_reference'
        description: Frame of the component that acts as the TCP for the target.
  coordinate_position:
    type: object
    description: 'A single coordinate position: an angle in radians, a linear position
      in meters, or a named preset. The kind decides which one field is used.'
    additional_properties: false
    required:
    - kind
    properties:
      kind:
        type: enum
        description: angular_rad uses value_rad, linear_m uses value_m, named_preset
          uses name.
        values:
        - angular_rad
        - linear_m
        - named_preset
      value_rad:
        type: float
        description: Angle in radians; used only for kind angular_rad.
        required_when:
          kind: angular_rad
        allowed_when:
          kind: angular_rad
      value_m:
        type: float
        description: Linear position in meters; used only for kind linear_m.
        required_when:
          kind: linear_m
        allowed_when:
          kind: linear_m
      name:
        type: enum
        description: Preset name, open or closed; used only for kind named_preset.
        values:
        - open
        - closed
        required_when:
          kind: named_preset
        allowed_when:
          kind: named_preset
  coordinate_effort_limit:
    type: object
    description: 'An effort limit for one coordinate: a torque in newton-meters for
      an angular coordinate or a force in newtons for a linear one. The kind decides
      which unit field is used and must match the gripper''s own coordinate kind,
      also when the position is the named open or closed preset.'
    additional_properties: false
    required:
    - kind
    properties:
      kind:
        type: enum
        description: angular_newton_meter uses value_nm; linear_newton uses value_n.
        values:
        - angular_newton_meter
        - linear_newton
      value_nm:
        type: float
        description: Torque limit in newton-meters, 0 or more; used only for kind
          angular_newton_meter.
        constraints:
          min_inclusive: 0.0
        required_when:
          kind: angular_newton_meter
        allowed_when:
          kind: angular_newton_meter
      value_n:
        type: float
        description: Force limit in newtons, 0 or more; used only for kind linear_newton.
        constraints:
          min_inclusive: 0.0
        required_when:
          kind: linear_newton
        allowed_when:
          kind: linear_newton
  orientation_reference:
    type: object
    description: 'Names where an orientation is taken from: the current Draft pose,
      a scene resource, or a target frame. The source decides which of the other two
      fields is required.'
    additional_properties: false
    required:
    - source
    properties:
      source:
        type: enum
        description: current_pose uses the existing Draft orientation; scene_resource
          uses a scene resource; target_frame names a frame, which a Draft cannot
          resolve.
        values:
        - current_pose
        - scene_resource
        - target_frame
      scene_resource_id:
        type: string
        description: Scene resource whose orientation is used; required for source
          scene_resource.
        semantic_type: scene_resource
        required_when:
          source: scene_resource
        allowed_when:
          source: scene_resource
      frame:
        schema_ref: '#/schema_types/frame_reference'
        description: Frame whose orientation is used; required for source target_frame.
        required_when:
          source: target_frame
        allowed_when:
          source: target_frame
  pose_frame_ref:
    type: object
    description: 'The frame a stored pose is expressed in: the cell frame, a component
      target frame, or a scene resource. The kind decides which of the other two fields
      is required.'
    additional_properties: false
    required:
    - kind
    properties:
      kind:
        type: enum
        description: cell_frame, target_frame or scene_resource; each kind allows
          only its matching field.
        values:
        - cell_frame
        - target_frame
        - scene_resource
      scene_resource_id:
        type: string
        description: Scene resource whose frame is used; required for kind scene_resource.
        semantic_type: scene_resource
        required_when:
          kind: scene_resource
        allowed_when:
          kind: scene_resource
      frame:
        schema_ref: '#/schema_types/frame_reference'
        description: Component frame reference; required for kind target_frame.
        required_when:
          kind: target_frame
        allowed_when:
          kind: target_frame
  stored_pose:
    type: object
    description: 'A pose kept on the blackboard: a position in meters and an orientation,
      both expressed in the frame named by frame_ref. The orientation is exactly one
      of xyzw or rpy_deg.'
    additional_properties: false
    required:
    - frame_ref
    - position_m
    - orientation
    properties:
      frame_ref:
        schema_ref: '#/schema_types/pose_frame_ref'
        description: Frame the position and orientation are expressed in. Required.
      position_m:
        type: array
        description: Position x, y, z in meters. Required.
        items:
          type: float
        length: 3
      orientation:
        type: object
        description: Exactly one of xyzw (quaternion) or rpy_deg (roll, pitch and
          yaw in degrees).
        additional_properties: false
        properties:
          xyzw:
            type: array
            items:
              type: float
            length: 4
          rpy_deg:
            type: array
            items:
              type: float
            length: 3
        exactly_one:
        - - xyzw
          - rpy_deg
  motion_pose:
    type: object
    description: 'A target pose for a motion: a position and an orientation, where
      the orientation is exactly one of xyzw or rpy_deg. When frame_ref is omitted
      the pose is stated in the moving robot''s base frame.'
    additional_properties: false
    required:
    - position_m
    - orientation
    properties:
      frame_ref:
        schema_ref: '#/schema_types/pose_frame_ref'
        description: Frame the pose is stated in; omitted means the moving robot's
          base frame.
      position_m:
        type: array
        description: Position x, y, z in meters. Required.
        items:
          type: float
        length: 3
      orientation:
        type: object
        description: Exactly one of xyzw or rpy_deg. Required.
        additional_properties: false
        properties:
          xyzw:
            type: array
            items:
              type: float
            length: 4
          rpy_deg:
            type: array
            items:
              type: float
            length: 3
        exactly_one:
        - - xyzw
          - rpy_deg
  cartesian_waypoint:
    type: object
    description: 'One waypoint of a Cartesian path: a pose and an optional blend radius
      for that point. When blend_radius_m is set it overrides the move''s default
      blend radius at this waypoint.'
    additional_properties: false
    required:
    - position_m
    - orientation
    properties:
      frame_ref:
        schema_ref: '#/schema_types/pose_frame_ref'
        description: Frame the waypoint is stated in; omitted means the moving robot's
          base frame.
      position_m:
        type: array
        description: Position x, y, z in meters. Required.
        items:
          type: float
        length: 3
      orientation:
        type: object
        description: Exactly one of xyzw or rpy_deg. Required.
        additional_properties: false
        properties:
          xyzw:
            type: array
            items:
              type: float
            length: 4
          rpy_deg:
            type: array
            items:
              type: float
            length: 3
        exactly_one:
        - - xyzw
          - rpy_deg
      blend_radius_m:
        type: float
        description: Blend radius in meters, 0 or more; overrides the move's blend_radius_m
          for this waypoint only.
        constraints:
          min_inclusive: 0.0
  motion_reference:
    type: object
    description: 'Names what a motion targets: a component frame or collision body,
      a scene resource, a runtime object, an absolute pose, or the cell frame. The
      type decides which other field is required; cell_frame needs none.'
    additional_properties: false
    required:
    - type
    properties:
      type:
        type: enum
        description: component_frame, component_body, scene_resource, runtime_object,
          pose or cell_frame; each type allows only its matching field.
        values:
        - component_frame
        - component_body
        - scene_resource
        - runtime_object
        - pose
        - cell_frame
      scene_resource_id:
        type: string
        description: Scene resource id; required for type scene_resource.
        semantic_type: scene_resource
        required_when:
          type: scene_resource
        allowed_when:
          type: scene_resource
      runtime_object_id:
        type: string
        description: Runtime object id, the object bound to a scene resource during
          a pick; required for type runtime_object.
        required_when:
          type: runtime_object
        allowed_when:
          type: runtime_object
      pose:
        schema_ref: '#/schema_types/motion_pose'
        description: Absolute pose; required for type pose.
        required_when:
          type: pose
        allowed_when:
          type: pose
      frame:
        schema_ref: '#/schema_types/frame_reference'
        description: Component frame reference; required for type component_frame.
        required_when:
          type: component_frame
        allowed_when:
          type: component_frame
      body:
        schema_ref: '#/schema_types/collision_body_reference'
        description: Collision body reference; required for type component_body.
        required_when:
          type: component_body
        allowed_when:
          type: component_body
  pose_authoring_input:
    type: object
    description: 'Authoring form of a pose that the Draft resolves into a stored_pose.
      It needs frame_ref and position_m, plus exactly one orientation form: absolute,
      or relative to the current orientation.'
    additional_properties: false
    required:
    - frame_ref
    - position_m
    resolves_to: '#/schema_types/stored_pose'
    properties:
      frame_ref:
        schema_ref: '#/schema_types/pose_frame_ref'
        description: Frame the position is stated in; carried into the resolved stored
          pose.
      position_m:
        type: array
        description: Position x, y, z in meters, carried into the resolved stored
          pose.
        items:
          type: float
        length: 3
      orientation:
        type: object
        description: 'Absolute orientation: exactly one of xyzw or rpy_deg.'
        additional_properties: false
        properties:
          xyzw:
            type: array
            items:
              type: float
            length: 4
          rpy_deg:
            type: array
            items:
              type: float
            length: 3
        exactly_one:
        - - xyzw
          - rpy_deg
      rotate_local_rpy_deg:
        type: array
        description: Roll, pitch and yaw rotation in degrees composed in the local
          frame of the current orientation; needs an existing orientation.
        items:
          type: float
        length: 3
        requires_current_value: true
      rotate_world_rpy_deg:
        type: array
        description: Roll, pitch and yaw rotation in degrees composed in the world
          frame onto the current orientation; needs an existing orientation.
        items:
          type: float
        length: 3
        requires_current_value: true
      rpy_delta_deg:
        type: array
        description: Component-wise addition of degrees to the current roll, pitch
          and yaw; this is not a physical rotation composition.
        items:
          type: float
        length: 3
        requires_current_value: true
      orientation_from:
        schema_ref: '#/schema_types/orientation_reference'
        description: Takes the orientation from the current pose or a scene resource;
          a target_frame source cannot be resolved in a Draft.
    exactly_one:
    - - orientation
      - rotate_local_rpy_deg
      - rotate_world_rpy_deg
      - rpy_delta_deg
      - orientation_from
  joint_target:
    type: object
    description: 'A target angle for one joint: the joint name and a position in radians.'
    additional_properties: false
    required:
    - joint_name
    - position_rad
    properties:
      joint_name:
        type: string
        description: Name of the joint, as the source component declares it.
        semantic_type: source_joint
      position_rad:
        type: float
  joint_target_list:
    type: array
    description: An ordered list of 1 to 256 joint_target entries.
    min_items: 1
    max_items: 256
    items:
      schema_ref: '#/schema_types/joint_target'
  joint_dynamics_limit:
    type: object
    description: Velocity, acceleration and jerk limits for one joint. Each field
      is optional, and each one that is set must be greater than 0.
    additional_properties: false
    properties:
      max_velocity_rad_s:
        type: float
        description: Velocity limit in radians per second, above 0 when set.
        constraints:
          min_exclusive: 0.0
      max_acceleration_rad_s2:
        type: float
        description: Acceleration limit in radians per second squared, above 0 when
          set.
        constraints:
          min_exclusive: 0.0
      max_jerk_rad_s3:
        type: float
        description: Jerk limit in radians per second cubed, above 0 when set.
        constraints:
          min_exclusive: 0.0
  per_joint_dynamics_limits:
    type: object
    description: A map from joint name to joint_dynamics_limit; each key names the
      joint that the limit applies to.
    additional_properties:
      schema_ref: '#/schema_types/joint_dynamics_limit'
  cartesian_path:
    type: array
    description: An ordered list of 2 to 4096 cartesian_waypoint entries that a motion
      follows as one path.
    min_items: 2
    max_items: 4096
    items:
      schema_ref: '#/schema_types/cartesian_waypoint'
  pose_offset_envelope:
    type: object
    description: 'Per-axis bounds of a grid of pose offsets: position in meters and
      orientation in roll, pitch and yaw degrees. The grid is sampled at the synthesis
      step sizes; the orientation bounds are not sampled when force_vertical_pick
      is true.'
    additional_properties: false
    required:
    - position_min_m
    - position_max_m
    - orientation_rpy_min_deg
    - orientation_rpy_max_deg
    properties:
      position_min_m:
        type: array
        description: Lower bound of the x, y, z offsets in meters.
        items:
          type: float
        length: 3
      position_max_m:
        type: array
        description: Upper bound of the x, y, z offsets in meters.
        items:
          type: float
        length: 3
      orientation_rpy_min_deg:
        type: array
        description: Lower bound of the roll, pitch and yaw offsets in degrees.
        items:
          type: float
        length: 3
      orientation_rpy_max_deg:
        type: array
        description: Upper bound of the roll, pitch and yaw offsets in degrees.
        items:
          type: float
        length: 3
  pose_offset:
    type: object
    description: 'A single pose offset: a position change in meters and a roll, pitch
      and yaw change in degrees.'
    additional_properties: false
    required:
    - position_m
    - rpy_deg
    properties:
      position_m:
        type: array
        description: Offset x, y, z in meters.
        items:
          type: float
        length: 3
      rpy_deg:
        type: array
        description: Offset roll, pitch and yaw in degrees.
        items:
          type: float
        length: 3
  pick_synthesis:
    type: object
    description: 'Settings for generating pick candidates: pick and approach offset
      grids, the base tool orientation, sampling steps, a vertical-pick option, a
      minimum TCP height, the candidate count limit and the search strategy.'
    additional_properties: false
    required:
    - pick_offset_envelope
    - approach_offset_envelope
    properties:
      pick_offset_envelope:
        schema_ref: '#/schema_types/pose_offset_envelope'
        description: Offset grid for the pick pose.
      approach_offset_envelope:
        schema_ref: '#/schema_types/pose_offset_envelope'
        description: Offset grid for the approach pose.
      pick_offset_reference:
        schema_ref: '#/schema_types/motion_reference'
        description: Motion reference that gives the frame in which the pick offsets
          are applied. Optional.
      approach_offset_reference:
        schema_ref: '#/schema_types/motion_reference'
        description: Motion reference that gives the frame in which the approach offsets
          are applied. Optional.
      base_tool_orientation_rpy_deg:
        type: array
        description: 'Base tool orientation in roll, pitch and yaw degrees; the grid''s
          rotation offsets are added to it. Omitted: 180, 0, 0.'
        default:
        - 180.0
        - 0.0
        - 0.0
        items:
          type: float
        length: 3
      translation_step_m:
        type: float
        description: 'Sampling step of the position offsets in meters, above 0. Omitted:
          0.01.'
        default: 0.01
        constraints:
          min_exclusive: 0.0
      rotation_step_deg:
        type: float
        description: 'Sampling step of the rotation offsets in degrees, above 0. Omitted:
          15. Not used when force_vertical_pick is true.'
        default: 15.0
        constraints:
          min_exclusive: 0.0
      force_vertical_pick:
        type: bool
        description: 'When true, pick and approach orientations are a vertical-down
          orientation derived from the object and no rotation offsets are sampled.
          Omitted: false.'
        default: false
      min_tcp_z_m:
        type: float
        description: 'Minimum TCP height in meters, 0 or more. Pick and approach poses
          below it are raised to it. Omitted: no minimum.'
        constraints:
          min_inclusive: 0.0
      maximum_candidate_count:
        type: int
        description: 'Upper bound on generated candidates, from 1 to 4096. Omitted:
          4096.'
        default: 4096
        constraints:
          min_inclusive: 1
          max_inclusive: 4096
      search_strategy:
        type: enum
        description: 'first_feasible takes the first candidate that plans; best_cost
          plans all candidates and takes the lowest planning score. Omitted: first_feasible.'
        default: first_feasible
        values:
        - first_feasible
        - best_cost
  pick_motion_options:
    type: object
    description: Speed, acceleration, tolerance, timeout and cache options for the
      approach, descend and retreat motions of a pick. Every field is optional.
    additional_properties: false
    properties:
      approach_velocity_scale:
        type: float
        description: 'Velocity scale from above 0 to 1 for the approach motion. Omitted:
          0.35.'
        default: 0.35
        constraints:
          min_exclusive: 0.0
          max_inclusive: 1.0
      descend_velocity_scale:
        type: float
        description: 'Velocity scale from above 0 to 1 for the descend motion. Omitted:
          0.35.'
        default: 0.35
        constraints:
          min_exclusive: 0.0
          max_inclusive: 1.0
      retreat_velocity_scale:
        type: float
        description: 'Velocity scale from above 0 to 1 for the retreat motion. Omitted:
          0.35.'
        default: 0.35
        constraints:
          min_exclusive: 0.0
          max_inclusive: 1.0
      acceleration_scale:
        type: float
        description: 'Acceleration scale from above 0 to 1. Omitted: 1.0.'
        default: 1.0
        constraints:
          min_exclusive: 0.0
          max_inclusive: 1.0
      max_tcp_linear_speed_mps:
        type: float
        description: 'Cap on TCP linear speed in meters per second, above 0. Omitted:
          no cap.'
        constraints:
          min_exclusive: 0.0
      joint_position_tol_rad:
        type: float
        description: 'Joint position tolerance in radians, 0 or more. Omitted: 0.05.'
        default: 0.05
        constraints:
          min_inclusive: 0.0
      translation_tol_m:
        type: float
        description: 'Translation tolerance in meters, 0 or more. Omitted: 0.005.'
        default: 0.005
        constraints:
          min_inclusive: 0.0
      rotation_tol_rad:
        type: float
        description: 'Rotation tolerance in radians, 0 or more. Omitted: 0.05.'
        default: 0.05
        constraints:
          min_inclusive: 0.0
      planning_timeout_s:
        type: float
        description: 'Planning timeout in seconds, above 0. Omitted: 2.0.'
        default: 2.0
        constraints:
          min_exclusive: 0.0
      execution_timeout_s:
        type: float
        description: 'Execution timeout in seconds, above 0. Omitted: 10.0.'
        default: 10.0
        constraints:
          min_exclusive: 0.0
      cache_mode:
        type: enum
        description: 'default allows reuse of cached results; disable skips the cache.
          Omitted: disable.'
        default: disable
        values:
        - default
        - disable
  shape:
    type: object
    description: A box, sphere, cylinder or mesh shape. The type decides which dimension
      or resource fields are required and which are not allowed.
    additional_properties: false
    required:
    - type
    properties:
      type:
        type: enum
        description: box, sphere, cylinder or mesh; each type requires its own fields
          and forbids the others.
        values:
        - box
        - sphere
        - cylinder
        - mesh
      box_dimensions_m:
        type: array
        description: Box size in meters along x, y, z, each above 0; required for
          box.
        items:
          type: float
          constraints:
            min_exclusive: 0.0
        length: 3
        required_when:
          type: box
        allowed_when:
          type: box
      sphere_radius_m:
        type: float
        description: Sphere radius in meters, above 0; required for sphere.
        constraints:
          min_exclusive: 0.0
        required_when:
          type: sphere
        allowed_when:
          type: sphere
      cylinder_radius_m:
        type: float
        description: Cylinder radius in meters, above 0; required for cylinder.
        constraints:
          min_exclusive: 0.0
        required_when:
          type: cylinder
        allowed_when:
          type: cylinder
      cylinder_height_m:
        type: float
        description: Cylinder height in meters, above 0; required for cylinder.
        constraints:
          min_exclusive: 0.0
        required_when:
          type: cylinder
        allowed_when:
          type: cylinder
      mesh_resource_uri:
        type: string
        description: URI of the mesh resource; required for mesh.
        required_when:
          type: mesh
        allowed_when:
          type: mesh
      mesh_scale:
        type: array
        description: Scale factors along x, y, z, each above 0; allowed only for mesh.
        items:
          type: float
          constraints:
            min_exclusive: 0.0
        length: 3
        allowed_when:
          type: mesh
  mock_signal_simulation:
    type: object
    description: 'A simulated boolean signal for mock runs: the signal, its start
      value and an optional single change to a new value after a delay.'
    additional_properties: false
    required:
    - signal
    - start_value
    properties:
      signal:
        schema_ref: '#/schema_types/signal_reference'
        description: The signal the simulation drives, as a signal reference.
      start_value:
        type: bool
        description: Boolean value the signal has at the start of the simulation.
      change:
        type: object
        description: 'Optional. An object with after_ms (delay in milliseconds, 0
          or more) and value (the boolean the signal takes). Omitted: no change.'
        additional_properties: false
        required:
        - after_ms
        - value
        properties:
          after_ms:
            type: int
            constraints:
              min_inclusive: 0
          value:
            type: bool
  planner_override:
    type: object
    description: Optional per-motion override of the Deployment's RRT planner settings.
      Only the members that are set replace the Deployment defaults; the others keep
      their Deployment values.
    additional_properties: false
    properties:
      search:
        type: enum
        description: rrt or rrt_connect; rrt_connect selects the RRT-Connect search.
        values:
        - rrt
        - rrt_connect
      optimize:
        type: enum
        description: first returns the first path found; rrt_star rewires toward a
          cheaper path; best_of_n plans n first-path candidates and keeps the shortest.
        values:
        - first
        - rrt_star
        - best_of_n
      n:
        type: int
        description: Number of plans for best_of_n, from 2 to 32. Not used by the
          other optimize values.
        constraints:
          min_inclusive: 2
          max_inclusive: 32
      collision_check_step_rad:
        type: float
        description: Collision-check sampling step in radians, above 0 and at most
          0.2.
        constraints:
          min_exclusive: 0.0
          max_inclusive: 0.2
      max_nodes:
        type: int
        description: Node budget of the RRT search, from 100 to 1000000.
        constraints:
          min_inclusive: 100
          max_inclusive: 1000000
  target_reference:
    type: object
    description: Names one command target of a controllable component by component
      id and command target id.
    semantic_type: target_reference
    additional_properties: false
    required:
    - component_id
    - command_target_id
    properties:
      component_id:
        type: string
      command_target_id:
        type: string
        description: Command target identifier within the component.
  signal_reference:
    type: object
    description: Names one signal of a component by component id and signal name.
    semantic_type: signal_reference
    additional_properties: false
    required:
    - component_id
    - signal_name
    properties:
      component_id:
        type: string
      signal_name:
        type: string
        description: Signal name on the component.
  frame_reference:
    type: object
    description: Names one frame of a component by component id and frame id.
    semantic_type: frame_reference
    additional_properties: false
    required:
    - component_id
    - frame_id
    properties:
      component_id:
        type: string
      frame_id:
        type: string
        description: Frame identifier within the component.
  collision_body_reference:
    type: object
    description: Names one collision body of a component by component id and collision
      body id.
    semantic_type: collision_body_reference
    additional_properties: false
    required:
    - component_id
    - collision_body_id
    properties:
      component_id:
        type: string
      collision_body_id:
        type: string
        description: Collision body identifier within the component.
entries:
- id: sequence
  name: Sequence
  category: control_flow
  description: Runs its children in order and succeeds when all of them succeed; it
    fails at the first child that fails. It resumes at the child that was running
    on the previous tick, and takes 1 to 4096 children.
  stability: stable
  tags:
  - control_flow
  - composite
  profiles:
    min_program_profile: composable-cell-v1
  kind: composite
  children:
    min: 1
    max: 4096
  parameters: []
  required_capabilities: []
  execution:
    blocking: false
    cancellable: false
    owner_api: orchestration.control_flow
  runners:
    py_trees:
      implementation_id: sequence_v1
  observability:
    event_family: manyforge.program.node
- id: fallback
  name: Fallback
  category: control_flow
  description: Runs its children in order and succeeds at the first child that succeeds;
    it fails only when every child fails. It resumes at the child that was running
    on the previous tick, and takes 1 to 4096 children.
  stability: stable
  tags:
  - control_flow
  - composite
  profiles:
    min_program_profile: composable-cell-v1
  kind: composite
  children:
    min: 1
    max: 4096
  parameters: []
  required_capabilities: []
  execution:
    blocking: false
    cancellable: false
    owner_api: orchestration.control_flow
  runners:
    py_trees:
      implementation_id: fallback_v1
  observability:
    event_family: manyforge.program.node
- id: parallel
  name: Parallel
  category: control_flow
  description: Ticks all of its children on every tick and decides its result by success_policy.
    Any child that fails fails the node under either policy, and takes 1 to 4096 children.
    With one, the first child to succeed ends the node and stops children still running.
  stability: stable
  tags:
  - control_flow
  - composite
  profiles:
    min_program_profile: composable-cell-v1
  kind: composite
  children:
    min: 1
    max: 4096
  parameters:
  - id: success_policy
    required: false
    description: 'Success rule: all needs every child to succeed; one needs any child
      to succeed. Omitted: all. An invalid value fails the attempt before any child
      runs.'
    default: all
    schema:
      type: enum
      values:
      - all
      - one
  required_capabilities: []
  execution:
    blocking: false
    cancellable: false
    owner_api: orchestration.control_flow
  runners:
    py_trees:
      implementation_id: parallel_v1
  observability:
    event_family: manyforge.program.node
- id: inverter
  name: Inverter
  category: control_flow
  description: 'Inverts the result of its single child: a child success becomes a
    failure and a child failure becomes a success. A running child stays running,
    and it takes exactly one child.'
  stability: stable
  tags:
  - control_flow
  - decorator
  profiles:
    min_program_profile: composable-cell-v1
  kind: decorator
  children:
    min: 1
    max: 1
  parameters: []
  required_capabilities: []
  execution:
    blocking: false
    cancellable: false
    owner_api: orchestration.control_flow
  runners:
    py_trees:
      implementation_id: inverter_v1
  observability:
    event_family: manyforge.program.node
- id: repeat
  name: Repeat
  category: control_flow
  description: Runs its single child again after each success and succeeds after num_cycles
    successful runs; a child failure fails the node at once. With -1 it never succeeds
    by itself and ends only on a child failure or a stop.
  stability: stable
  tags:
  - control_flow
  - decorator
  profiles:
    min_program_profile: composable-cell-v1
  kind: decorator
  children:
    min: 1
    max: 1
  parameters:
  - id: num_cycles
    required: false
    description: 'Number of successful child runs before success, from 1 to 1000000,
      or -1 for no limit. 0 is rejected. Omitted: -1. Resolved once per attempt.'
    default: -1
    schema:
      type: int
      constraints:
        min_inclusive: -1
        max_inclusive: 1000000
        not_equal: 0
  required_capabilities: []
  execution:
    blocking: false
    cancellable: true
    owner_api: orchestration.control_flow
  runners:
    py_trees:
      implementation_id: repeat_v1
  observability:
    event_family: manyforge.program.node
- id: retry
  name: Retry
  category: control_flow
  description: Runs its single child and runs it again after each failure, so the
    node succeeds on the first child success. After the last allowed failure the node
    fails; a child success passes straight through.
  stability: stable
  tags:
  - control_flow
  - decorator
  profiles:
    min_program_profile: composable-cell-v1
  kind: decorator
  children:
    min: 1
    max: 1
  parameters:
  - id: num_attempts
    required: false
    description: 'Total child runs allowed before the node fails, from 1 to 1000000,
      or -1 for no limit. 0 is rejected. Omitted: -1. Resolved when the node starts
      an attempt.'
    default: -1
    schema:
      type: int
      constraints:
        min_inclusive: -1
        max_inclusive: 1000000
        not_equal: 0
  required_capabilities: []
  execution:
    blocking: false
    cancellable: true
    owner_api: orchestration.control_flow
  runners:
    py_trees:
      implementation_id: retry_v1
  observability:
    event_family: manyforge.program.node
- id: timer
  name: Timer
  category: control_flow
  description: 'Succeeds after duration_s seconds of Program time. Program time stands
    still while the Program is halted, and by default the time an operator Stop holds
    this node is also left out of the delay. The wait itself cannot fail: the node
    fails only when duration_s cannot be resolved, before the delay starts. A Program
    Stop or Reset ends the delay as interrupted.'
  stability: stable
  tags:
  - control_flow
  - timing
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: duration_s
    required: true
    description: Delay in seconds of Program time. Required; greater than 0 and at
      most 86400.
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 86400.0
  - id: duration_while_held
    required: false
    description: 'pause leaves out time an operator Stop holds this node; count includes
      it. Omitted: pause. Resolved once per attempt.'
    default: pause
    schema:
      type: enum
      values:
      - count
      - pause
  required_capabilities: []
  execution:
    blocking: true
    cancellable: true
    owner_api: orchestration.clock
  outcomes:
    success: elapsed
    failure: input_unavailable
    interrupted: cancelled
  runners:
    py_trees:
      implementation_id: timer_v1
  observability:
    event_family: manyforge.program.node
- id: motion.move_to_joint_target
  name: Move to joint target
  category: motion
  description: Moves the robot to a set of joint targets. It plans, validates and
    executes the joint trajectory, and fails when planning, validation or execution
    fails after any automatic retries.
  stability: stable
  tags:
  - motion
  - planning
  - execution
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Robot target (component and command target) that the move runs on.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: base_frame
    required: true
    description: Robot base frame that the move is stated in.
    schema:
      schema_ref: '#/schema_types/frame_reference'
  - id: tcp_endpoint
    required: false
    description: TCP the move uses; omitted means current, the robot's Active TCP.
    default:
      kind: current
    schema_ref: '#/schema_types/tcp_selector'
  - id: goal
    required: true
    description: Joint targets, each a joint name with a position in radians; deltas
      from the start state when target_mode is relative.
    schema_ref: '#/schema_types/joint_target_list'
  - id: target_mode
    required: false
    description: absolute reaches the stated joint positions; relative applies them
      as offsets from the start state.
    default: absolute
    schema:
      type: enum
      values:
      - absolute
      - relative
  - id: planner
    required: false
    description: Planner settings for this move; only the fields set here override
      the Deployment planner.
    schema_ref: '#/schema_types/planner_override'
  - id: velocity_scale
    required: false
    description: Velocity scaling factor, above 0 up to 1; default 1.0.
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 1.0
  - id: acceleration_scale
    required: false
    description: Acceleration scaling factor, above 0 up to 1; default 1.0.
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 1.0
  - id: max_tcp_linear_speed_mps
    required: false
    description: Per-move TCP linear speed cap in m/s; the lower of this and the Deployment
      limit applies. Omitted uses the Deployment limit.
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: clearance_m
    required: false
    description: Collision clearance in meters for this move, 0 to 0.05. Omitted keeps
      the Deployment clearance.
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
        max_inclusive: 0.05
  - id: per_joint_dynamics_limits
    required: false
    description: Per-joint velocity, acceleration and jerk caps keyed by joint name.
      Empty means no per-move caps.
    default: {}
    schema_ref: '#/schema_types/per_joint_dynamics_limits'
  - id: joint_position_tol_rad
    required: false
    description: Joint tolerance in radians for the start-state check and cached trajectory
      matching; default 0.05.
    default: 0.05
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: translation_tol_m
    required: false
    description: Translation tolerance in meters for pose checks in planning and cached
      trajectory matching; default 0.005.
    default: 0.005
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: rotation_tol_rad
    required: false
    description: Rotation tolerance in radians for pose checks in planning and cached
      trajectory matching; default 0.05.
    default: 0.05
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: planning_timeout_s
    required: false
    description: Seconds allowed for planning before the attempt fails; default 2.0.
    default: 2.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: execution_timeout_s
    required: false
    description: Seconds allowed for executing the trajectory before the attempt fails;
      default 10.0.
    default: 10.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: cache_mode
    required: false
    description: default reuses a stored trajectory when it still matches the scene
      and start state; disable always plans fresh.
    default: default
    schema:
      type: enum
      values:
      - default
      - disable
  - id: contact_policy_id
    required: false
    description: Contact policy that makes planning and validation contact-tolerant
      for this move. Omit for free-space motion.
    schema:
      type: string
  - id: contact_scene_resource_id
    required: false
    description: Scene resource the contact policy applies to. Must be given together
      with contact_policy_id.
    schema:
      type: string
      semantic_type: scene_resource
  - id: automatic_retries
    required: false
    description: Automatic retries after a planning no-effect or nominal collision
      stop, 0 to 10; default 3. Relative joint moves are never retried.
    default: 3
    schema:
      type: int
      constraints:
        min_inclusive: 0
        max_inclusive: 10
  - id: automatic_retry_delay_s
    required: false
    description: Seconds to wait before each automatic retry, 0 to 60; default 1.0.
    default: 1.0
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
        max_inclusive: 60.0
  - id: preemption_priority
    required: false
    description: Priority from 0 to 100 for taking over the robot. Equal or higher
      priority preempts a running move; lower is refused. Default 0.
    default: 0
    schema:
      type: int
      constraints:
        min_inclusive: 0
        max_inclusive: 100
  - id: preempted_result
    required: false
    description: 'Node result when this move is preempted or refused by priority:
      success or failure; default failure.'
    default: failure
    schema:
      type: enum
      values:
      - success
      - failure
  required_capabilities:
  - capability_id: planning.motion.joint_goal
    scope: target_binding
    target_parameter: target
  - capability_id: planning.trajectory.time_parameterized
    scope: target_binding
    target_parameter: target
  - capability_id: state.observed.current
    scope: target_binding
    target_parameter: target
  - capability_id: validation.trajectory.non_collision
    scope: target_binding
    target_parameter: target
  - capability_id: collision.query.pre_execution
    scope: cell_global
  - capability_id: execution.trajectory.execute
    scope: target_binding
    target_parameter: target
    effectful: true
  - capability_id: execution.feedback.phase_events
    scope: target_binding
    target_parameter: target
  execution:
    blocking: true
    cancellable: true
    owner_api: kernel.operation
  outcomes:
    success: operation_succeeded
    failure: operation_failed
    interrupted: operation_terminal
  runners:
    py_trees:
      implementation_id: motion_move_to_joint_target_v1
  observability:
    event_family: manyforge.program.node
- id: motion.move_to_pose
  name: Move to pose
  category: motion
  description: Moves the robot's TCP to a pose. It plans, validates and executes the
    motion, and fails when planning, validation or execution fails after any automatic
    retries. The goal is an absolute pose, or an offset from target_reference when
    target_mode is relative.
  stability: stable
  tags:
  - motion
  - planning
  - execution
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Robot target (component and command target) that the move runs on.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: base_frame
    required: true
    description: Robot base frame that absolute poses are stated in.
    schema:
      schema_ref: '#/schema_types/frame_reference'
  - id: tcp_endpoint
    required: false
    description: TCP the move uses; omitted means current, the robot's Active TCP.
    default:
      kind: current
    schema_ref: '#/schema_types/tcp_selector'
  - id: goal
    required: true
    description: Pose to reach, with its frame_ref (default the robot base frame);
      an offset from target_reference when relative.
    schema_ref: '#/schema_types/motion_pose'
  - id: target_mode
    required: false
    description: absolute reaches the stated pose; relative offsets it from target_reference.
    default: absolute
    schema:
      type: enum
      values:
      - absolute
      - relative
  - id: target_reference
    required: false
    description: 'Origin of a relative offset: the pose the offset is applied to.
      Required for relative moves.'
    schema_ref: '#/schema_types/motion_reference'
  - id: offset_reference
    required: false
    description: Pose whose orientation gives the axes of a relative offset; omitted
      uses the target_reference orientation.
    schema_ref: '#/schema_types/motion_reference'
  - id: planner
    required: false
    description: Planner settings for this move; only the fields set here override
      the Deployment planner.
    schema_ref: '#/schema_types/planner_override'
  - id: velocity_scale
    required: false
    description: Velocity scaling factor, above 0 up to 1; default 1.0.
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 1.0
  - id: acceleration_scale
    required: false
    description: Acceleration scaling factor, above 0 up to 1; default 1.0.
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 1.0
  - id: max_tcp_linear_speed_mps
    required: false
    description: Per-move TCP linear speed cap in m/s; the lower of this and the Deployment
      limit applies. Omitted uses the Deployment limit.
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: clearance_m
    required: false
    description: Collision clearance in meters for this move, 0 to 0.05. Omitted keeps
      the Deployment clearance.
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
        max_inclusive: 0.05
  - id: per_joint_dynamics_limits
    required: false
    description: Per-joint velocity, acceleration and jerk caps keyed by joint name.
      Empty means no per-move caps.
    default: {}
    schema_ref: '#/schema_types/per_joint_dynamics_limits'
  - id: joint_position_tol_rad
    required: false
    description: Joint tolerance in radians for the start-state check and cached trajectory
      matching; default 0.05.
    default: 0.05
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: translation_tol_m
    required: false
    description: Translation tolerance in meters for pose checks in planning and cached
      trajectory matching; default 0.005.
    default: 0.005
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: rotation_tol_rad
    required: false
    description: Rotation tolerance in radians for pose checks in planning and cached
      trajectory matching; default 0.05.
    default: 0.05
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: planning_timeout_s
    required: false
    description: Seconds allowed for planning before the attempt fails; default 2.0.
    default: 2.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: execution_timeout_s
    required: false
    description: Seconds allowed for executing the trajectory before the attempt fails;
      default 10.0.
    default: 10.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: cache_mode
    required: false
    description: default reuses a stored trajectory when it still matches the scene
      and start state; disable always plans fresh.
    default: default
    schema:
      type: enum
      values:
      - default
      - disable
  - id: contact_policy_id
    required: false
    description: Contact policy that makes planning and validation contact-tolerant
      for this move. Omit for free-space motion.
    schema:
      type: string
  - id: contact_scene_resource_id
    required: false
    description: Scene resource the contact policy applies to. Must be given together
      with contact_policy_id.
    schema:
      type: string
      semantic_type: scene_resource
  - id: automatic_retries
    required: false
    description: Automatic retries after a planning no-effect or nominal collision
      stop, 0 to 10; default 3. Zero disables retries.
    default: 3
    schema:
      type: int
      constraints:
        min_inclusive: 0
        max_inclusive: 10
  - id: automatic_retry_delay_s
    required: false
    description: Seconds to wait before each automatic retry, 0 to 60; default 1.0.
    default: 1.0
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
        max_inclusive: 60.0
  - id: preemption_priority
    required: false
    description: Priority from 0 to 100 for taking over the robot. Equal or higher
      priority preempts a running move; lower is refused. Default 0.
    default: 0
    schema:
      type: int
      constraints:
        min_inclusive: 0
        max_inclusive: 100
  - id: preempted_result
    required: false
    description: 'Node result when this move is preempted or refused by priority:
      success or failure; default failure.'
    default: failure
    schema:
      type: enum
      values:
      - success
      - failure
  required_capabilities:
  - capability_id: planning.motion.pose_goal
    scope: target_binding
    target_parameter: target
  - capability_id: planning.trajectory.time_parameterized
    scope: target_binding
    target_parameter: target
  - capability_id: state.observed.current
    scope: target_binding
    target_parameter: target
  - capability_id: validation.trajectory.non_collision
    scope: target_binding
    target_parameter: target
  - capability_id: collision.query.pre_execution
    scope: cell_global
  - capability_id: execution.trajectory.execute
    scope: target_binding
    target_parameter: target
    effectful: true
  - capability_id: execution.feedback.phase_events
    scope: target_binding
    target_parameter: target
  execution:
    blocking: true
    cancellable: true
    owner_api: kernel.operation
  outcomes:
    success: operation_succeeded
    failure: operation_failed
    interrupted: operation_terminal
  runners:
    py_trees:
      implementation_id: motion_move_to_pose_v1
  observability:
    event_family: manyforge.program.node
- id: motion.follow_cartesian_path
  name: Follow Cartesian path
  category: motion
  description: Moves the TCP through an ordered list of waypoints as one Cartesian
    path. It plans, validates and executes the whole path, and fails when the path
    cannot be followed in Cartesian space unless the fallback policy allows a joint-space
    plan.
  stability: stable
  tags:
  - motion
  - planning
  - cartesian
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Robot target (component and command target) that the path runs on.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: base_frame
    required: true
    description: Robot base frame that absolute waypoints are stated in.
    schema:
      schema_ref: '#/schema_types/frame_reference'
  - id: tcp_endpoint
    required: false
    description: TCP the path uses; omitted means current, the robot's Active TCP.
    default:
      kind: current
    schema_ref: '#/schema_types/tcp_selector'
  - id: path
    required: true
    description: Ordered waypoint poses, at least two, all in one frame. Relative
      waypoints are offsets from target_reference.
    schema_ref: '#/schema_types/cartesian_path'
  - id: target_mode
    required: false
    description: absolute reaches the stated waypoints; relative offsets them from
      target_reference.
    default: absolute
    schema:
      type: enum
      values:
      - absolute
      - relative
  - id: target_reference
    required: false
    description: Origin of relative waypoint offsets. Required for relative paths.
    schema_ref: '#/schema_types/motion_reference'
  - id: offset_reference
    required: false
    description: Pose whose orientation gives the axes of relative offsets; omitted
      uses the target_reference orientation.
    schema_ref: '#/schema_types/motion_reference'
  - id: max_translation_step_m
    required: false
    description: Largest translation in meters between planned path samples; default
      0.005.
    default: 0.005
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: max_rotation_step_rad
    required: false
    description: Largest rotation in radians between planned path samples; default
      0.05.
    default: 0.05
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: max_angular_speed_rad_s
    required: false
    description: Angular speed limit for the path in rad/s; default 0.5.
    default: 0.5
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: max_linear_acceleration_mps2
    required: false
    description: Linear acceleration limit for the path in m/s2; default 0.5.
    default: 0.5
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: max_angular_acceleration_rad_s2
    required: false
    description: Angular acceleration limit for the path in rad/s2; default 2.5.
    default: 2.5
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: blend_radius_m
    required: false
    description: Blend radius in meters at waypoints that set none; default 0.0, which
