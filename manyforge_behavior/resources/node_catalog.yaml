- id: recovery.apply_offered_action
  name: Apply offered recovery
  category: recovery
  description: Submits one recovery action that the Kernel currently offers for the
    operation of the target. It succeeds when the Kernel accepts the action and fails
    when it rejects the action, including when the offer has changed.
  stability: stable
  tags:
  - recovery
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Robot target whose operation the recovery action applies to.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: recovery_action
    required: true
    description: Recovery action to submit. It must be one of the actions currently
      offered for the operation.
    schema:
      type: enum
      values:
      - retry_motion_from_current_state
      - acknowledge_and_continue
      - retry_after_scene_repair
      - replan_from_stopped_state
  required_capabilities: []
  owner_context:
    kind: current_recovery_offer
    required: true
  execution:
    blocking: true
    cancellable: false
    owner_api: kernel.recovery
  outcomes:
    success: recovery_accepted
    failure: recovery_rejected
  runners:
    py_trees:
      implementation_id: recovery_apply_offered_action_v1
  observability:
    event_family: manyforge.program.node
