- id: geometry.check_pose_distance
  name: Check pose distance
  category: geometry
  description: Compares two stored poses against translation and rotation thresholds.
    It succeeds when both distances are within their thresholds and fails otherwise,
    and it fails when either key is missing. Pose B is expressed in pose A's frame
    before the comparison.
  stability: stable
  tags:
  - geometry
  - blackboard
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: pose_key_a
    required: true
    description: Blackboard key holding the first stored pose, which sets the comparison
      frame.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: pose_key_b
    required: true
    description: Blackboard key holding the second stored pose.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: translation_threshold_m
    required: true
    description: Largest allowed translation between the two poses in meters, inclusive.
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: rotation_threshold_rad
    required: true
    description: Largest allowed rotation between the two poses in radians, inclusive.
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  required_capabilities: []
  blackboard:
    reads:
    - key_parameter: pose_key_a
      value_type: stored_pose
      missing_key: failure
    - key_parameter: pose_key_b
      value_type: stored_pose
      missing_key: failure
    writes: []
  execution:
    blocking: true
    cancellable: false
    owner_api: geometry.compare
  outcomes:
    success: within_threshold
    failure: outside_threshold
  runners:
    py_trees:
      implementation_id: geometry_check_pose_distance_v1
  observability:
    event_family: manyforge.program.node
- id: geometry.offset_pose
  name: Offset pose
  category: geometry
  description: Applies a translation and a roll-pitch-yaw rotation to a stored pose
    and writes the result to a blackboard key. The result stays in the input pose's
    frame. It fails when the offset frame cannot be related to the pose frame.
  stability: stable
  tags:
  - geometry
  - blackboard
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: pose
    required: true
    description: Stored pose to offset. Its frame is kept for the result.
    schema_ref: '#/schema_types/stored_pose'
  - id: offset
    required: true
    description: Translation in meters and roll-pitch-yaw rotation in degrees applied
      to the pose.
    schema_ref: '#/schema_types/pose_offset'
  - id: offset_frame
    required: false
    description: Frame whose axes the offset follows. Omitted means the pose's own
      axes.
    schema_ref: '#/schema_types/pose_frame_ref'
  - id: output_key
    required: true
    description: Blackboard key that receives the offset pose.
    schema:
      type: string
      semantic_type: blackboard_key
  required_capabilities: []
  blackboard:
    reads: []
    writes:
    - key_parameter: output_key
      value_type: stored_pose
  execution:
    blocking: true
    cancellable: false
    owner_api: geometry.compare
  outcomes:
    success: pose_written
    failure: offset_failed
  runners:
    py_trees:
      implementation_id: geometry_offset_pose_v1
  observability:
    event_family: manyforge.program.node
- id: geometry.check_pose_bounds
  name: Check pose bounds
  category: geometry
  description: Checks whether a stored pose lies inside an axis-aligned position box.
    The pose is first expressed in the box frame. It succeeds when the position is
    inside the box and fails otherwise.
  stability: stable
  tags:
  - geometry
  - blackboard
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: pose
    required: true
    description: Stored pose to test.
    schema_ref: '#/schema_types/stored_pose'
  - id: frame_ref
    required: true
    description: Frame in which the box is stated. The pose is expressed in it before
      the test.
    schema_ref: '#/schema_types/pose_frame_ref'
  - id: min_position_m
    required: true
    description: Lower corner of the box as x, y and z in meters.
    schema:
      type: array
      items:
        type: float
      length: 3
  - id: max_position_m
    required: true
    description: Upper corner of the box as x, y and z in meters.
    schema:
      type: array
      items:
        type: float
      length: 3
  - id: inclusive
    required: false
    description: Whether positions on the box faces count as inside. Default true.
