- id: assistant.build_scene_selection
  name: Build scene selection
  category: assistant
  description: Builds the scene-selection context, which holds the request text and
    the candidate scene objects, and writes it to output_key. Candidates are every
    scene object unless candidate_object_ids narrows them; an unavailable scene is
    handled by unavailable_policy.
  stability: stable
  tags:
  - assistant
  - perception
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: selection_request_text
    required: true
    description: Text describing the object to select, bounded in size. Required.
    schema:
      type: string
  - id: output_key
    required: true
    description: Blackboard key that receives the scene-selection context. Required.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: object_source
    required: false
    description: 'Only backend_scene, the authoritative scene, is accepted. Omitted:
      backend_scene.'
    default: backend_scene
    schema:
      type: enum
      values:
      - backend_scene
  - id: candidate_object_ids
    required: false
    description: 'Scene resource ids offered as candidates, without duplicates, up
      to 4096. Omitted or empty: every scene object is a candidate.'
    default: []
    schema:
      type: array
      max_items: 4096
      items:
        type: string
        semantic_type: scene_resource
  - id: image_source
    required: false
    description: 'Image sent with the context; only none, no image. Omitted: none.'
    default: none
    schema:
      type: enum
      values:
      - none
  - id: unavailable_policy
    required: false
    description: 'Policy when candidates, object poses or the scene cannot be read:
      pause_for_operator or condition_failure. Omitted: pause_for_operator.'
    default: pause_for_operator
    schema:
      type: enum
      values:
      - pause_for_operator
      - condition_failure
  required_capabilities:
  - capability_id: assistant.model.query
    scope: cell_global
  blackboard:
    reads: []
    writes:
    - key_parameter: output_key
      value_type: scene_selection_context
  execution:
    blocking: true
    cancellable: true
    owner_api: assistant.scene_context
  outcomes:
    success: context_built
    failure: context_failed
    interrupted: cancelled
  runners:
    py_trees:
      implementation_id: assistant_build_scene_selection_v1
  observability:
    event_family: manyforge.program.node
- id: assistant.validate_scene_selection
  name: Validate scene selection
  category: assistant
  description: Checks a model's selection response against the scene-selection context
    and writes the accepted result to output_key. A selected object must be one of
    the context's candidates; no_match and ambiguous outcomes are accepted only when
    their allow parameter is true.
  stability: stable
  tags:
  - assistant
  - perception
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: selection_context_key
    required: true
    description: Blackboard key holding the scene-selection context from the build
      node. A missing key fails the node. Required.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: selection_response_key
    required: true
    description: Blackboard key holding the model response to check. A missing key
      fails the node. Required.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: output_key
    required: true
    description: 'Blackboard key that receives the accepted result: outcome, selected_object_id,
      confidence, matched_attributes and reason. Required.'
    schema:
      type: string
      semantic_type: blackboard_key
  - id: allow_no_match
    required: false
    description: 'When true, a no_match outcome is accepted; otherwise it fails the
      node. Omitted: false.'
    default: false
    schema:
      type: bool
  - id: allow_ambiguous
    required: false
    description: 'When true, an ambiguous outcome is accepted; otherwise it fails
      the node. Omitted: false.'
    default: false
    schema:
      type: bool
  required_capabilities:
  - capability_id: assistant.model.query
    scope: cell_global
  blackboard:
    reads:
    - key_parameter: selection_context_key
      value_type: scene_selection_context
      missing_key: failure
    - key_parameter: selection_response_key
      value_type: model_response
      missing_key: failure
    writes:
    - key_parameter: output_key
      value_type: scene_selection_result
  execution:
    blocking: true
    cancellable: true
    owner_api: assistant.scene_selection
  outcomes:
    success: selection_valid
    failure: selection_invalid
    interrupted: cancelled
  runners:
    py_trees:
      implementation_id: assistant_validate_scene_selection_v1
  observability:
    event_family: manyforge.program.node
- id: planning.plan_pick_sequence
  name: Plan pick sequence
  category: motion
  description: Plans and validates a pick sequence for one scene object, made of approach,
    descend, gripper close and retreat legs. It writes the planned candidate to its
    output key and does not move the robot. Without a feasible candidate it fails,
    and by default it pauses the Run for the operator.
  stability: stable
  tags:
  - motion
  - planning
  - pick
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target
    required: true
    description: Robot target the planned moves run on.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: tool_target
    required: true
    description: Gripper target that the planned gripper command runs on.
    schema:
      schema_ref: '#/schema_types/target_reference'
  - id: base_frame
    required: true
    description: Robot base frame that the planned poses are stated in.
    schema:
      schema_ref: '#/schema_types/frame_reference'
  - id: tcp_endpoint
    required: false
    description: TCP the planned moves use; omitted means current, the robot's Active
      TCP.
    default:
      kind: current
    schema_ref: '#/schema_types/tcp_selector'
  - id: carrier_frame_ref
    required: true
    description: Robot frame that carries the selected object during the sequence.
    schema:
      schema_ref: '#/schema_types/frame_reference'
  - id: selected_object_id
    required: true
    description: Scene object to pick.
    schema:
      type: string
      semantic_type: scene_resource
  - id: synthesis
    required: false
    description: 'Pick geometry: offset envelopes and references, base tool orientation,
      search steps, vertical pick, minimum TCP height and candidate search.'
    default:
      pick_offset_envelope:
        position_min_m:
        - 0.0
        - 0.0
        - 0.0
        position_max_m:
        - 0.0
        - 0.0
        - 0.0
        orientation_rpy_min_deg:
        - 0.0
        - 0.0
        - 0.0
        orientation_rpy_max_deg:
        - 0.0
        - 0.0
        - 0.0
      approach_offset_envelope:
        position_min_m:
        - 0.0
        - 0.0
        - 0.05
        position_max_m:
        - 0.0
        - 0.0
        - 0.1
        orientation_rpy_min_deg:
        - 0.0
        - 0.0
        - 0.0
        orientation_rpy_max_deg:
        - 0.0
        - 0.0
        - 0.0
    schema_ref: '#/schema_types/pick_synthesis'
  - id: planner
    required: false
    description: Planner settings for the planned moves; only the fields set here
      override the Deployment planner.
    schema_ref: '#/schema_types/planner_override'
  - id: motion_options
    required: false
    description: Settings for the approach, descend and retreat legs. Omitted values
      use velocity 0.35 per leg, acceleration 1.0 and cache mode disable.
    default: {}
    schema_ref: '#/schema_types/pick_motion_options'
  - id: tool_position
    required: true
    description: 'Gripper position for the gripper leg: an angle, a distance, or the
      open or closed preset.'
    schema_ref: '#/schema_types/coordinate_position'
  - id: tool_max_effort
    required: false
    description: Maximum gripper effort for the gripper leg, as a torque or a force.
      Omitted sends none.
    schema_ref: '#/schema_types/coordinate_effort_limit'
  - id: tool_command_duration_s
    required: false
    description: Duration in seconds passed to the gripper command as its command_duration
      option; default 0.0.
    default: 0.0
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: tool_completion_timeout_s
    required: false
    description: Seconds allowed after tool_command_duration_s for the gripper to
      report done before its command fails; default 5.0.
    default: 5.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: output_key
    required: true
    description: Blackboard key that receives the planning result.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: contact_policy_id
    required: true
    description: Contact-grasp policy for the descend leg. Required.
    schema:
      type: string
  - id: no_feasible_plan_policy
    required: false
    description: pause_for_operator (default) holds the Run when no candidate is feasible.
      condition_failure fails the node so that a fallback can run.
    default: pause_for_operator
    schema:
      type: enum
      values:
      - pause_for_operator
      - condition_failure
  required_capabilities:
  - capability_id: planning.motion.pose_goal
    scope: target_binding
    target_parameter: target
  - capability_id: planning.motion.cartesian_path
    scope: target_binding
    target_parameter: target
  - capability_id: planning.trajectory.time_parameterized
    scope: target_binding
    target_parameter: target
  - capability_id: state.observed.current
    scope: target_binding
    target_parameter: target
  - capability_id: validation.trajectory.non_collision
    scope: target_binding
    target_parameter: target
  - capability_id: collision.query.pre_execution
    scope: cell_global
  - capability_id: model.kinematics.fk
    scope: target_binding
    target_parameter: target
  - capability_id: tool.gripper.command
    scope: target_binding
    target_parameter: tool_target
  - capability_id: tool.gripper.feedback
    scope: target_binding
    target_parameter: tool_target
  - capability_id: scene.edit.attach_detach
    scope: cell_global
  blackboard:
    reads: []
    writes:
    - key_parameter: output_key
      value_type: pick_planning_result
  execution:
    blocking: true
    cancellable: true
    owner_api: planning.pick_sequence
  outcomes:
    success: candidate_planned
    failure: no_feasible_candidate
    interrupted: cancelled
  runners:
    py_trees:
      implementation_id: planning_plan_pick_sequence_v1
  observability:
    event_family: manyforge.program.node
