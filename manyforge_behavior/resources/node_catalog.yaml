  - id: probe_search_move
    name: ProbeSearchMove
    category: motion
    description: >-
      Phase 4.5E precision-contact motion-scoped trip node. Same
      shape as MoveUntilSignal but with stricter defaults:
      `node_category=precision_contact`, `not_found_is_failure=true`
      (the probe MUST have contacted), `activation_mode=require_inactive_at_arm`,
      and `allowed_fallback_modes` rejected at construction (spec/210
      §3.11 conjunctive rule disallows fallback for precision-contact
      categories). Motion-field parity with `move_manipulator_action`.
    tags: [motion, planning, execution, motion_scoped_trip, precision_contact]
    profiles:
      min_profile: v0.2
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: move_id
        schema:
          type: string
        required: true
        description: Stable move identifier for trajectory caching.
      - name: motion_type
        schema:
          type: enum
          values: [joint_goal, pose_goal, relative_move]
        required: true
        enum_options:
          - value: joint_goal
          - value: pose_goal
          - value: relative_move
            profiles:
              min_profile: v0.2
            required_capabilities:
              - context.pose.resolve_reference
        description: The type of motion to plan (default pose_goal for contact moves).
      - name: joint_goal_names
        schema:
          type: array
          items: string
        required: false
        visible_when:
          param: motion_type
          equals: joint_goal
        description: Joint names when motion_type=joint_goal.
      - name: joint_goal_positions_rad
        schema:
          type: array
          items: float
        required: false
        visible_when:
          param: motion_type
          equals: joint_goal
        description: Joint positions in radians when motion_type=joint_goal.
      - name: pose_goal
        schema_ref: "#/schema_types/motion_pose_goal"
        required: false
        visible_when:
          param: motion_type
          equals: pose_goal
        ui_editor: pose_or_blackboard_field_selector
        blackboard_role: field_reader
        blackboard_value_type: pose
        description: Target probe-search end pose for motion_type=pose_goal.
      - name: relative_move
        schema_ref: "#/schema_types/relative_move"
        required: false
        visible_when:
          param: motion_type
          equals: relative_move
        ui_editor: relative_move
        description: Relative move goal (see move_manipulator_action).
      - name: policy_id
        schema:
          type: string
        required: true
        description: >-
          The registered move-scoped `complete_move_on_signal` policy
          this scope binds to.
      - name: stop_mode
        schema:
          type: enum
          values: [spring_back_hold, soft_on_path, hard_deceleration]
        required: true
        description: >-
          Controlled-stop mode requested at trip time. Backend
          capability MUST advertise the mode.
      - name: scope_id
        schema:
          type: string
        required: false
        description: Per-move binding identifier.
      - name: stop_max_time_s
        schema:
          type: float
        required: false
        description: Upper bound on backend stop confirmation.
      - name: stop_deceleration_time_s
        schema:
          type: float
        required: false
        description: Ramp duration for spring_back_hold / soft_on_path.
      - name: per_joint_max_deceleration_rad_s2
        schema_ref: "#/schema_types/per_joint_deceleration_limits"
        required: false
        description: >-
          Per-joint deceleration limits for soft_on_path feasibility
          and replacement-trajectory generation. Required when
          stop_mode is `soft_on_path`.
      - name: scope_outcome_key
        schema:
          type: string
        required: false
        description: >-
          Blackboard key for the terminal MotionExecutionOutcome
          (default `motion_scope_outcome`).
      - name: result_binding_key
        schema:
          type: string
        required: false
        description: >-
          Optional spec/260 §2.6 result-binding key recorded on the
          trip outcome.
      - name: velocity_scale
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 1.0
        parameterizable: true
        description: Velocity scaling factor.
      - name: acceleration_scale
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 1.0
        parameterizable: true
        description: Acceleration scaling factor.
      - name: max_tcp_linear_speed_mps
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        parameterizable: true
        description: >-
          Per-move TCP linear speed cap (m/s). Effective limit is
          min(global_max, this value).
      - name: joint_position_tol_rad
        schema:
          type: float
          constraints:
            min_inclusive: 0.0
        required: false
        default: 0.05
        parameterizable: true
        description: Joint position tolerance in radians.
      - name: translation_tol_m
        schema:
          type: float
          constraints:
            min_inclusive: 0.0
        required: false
        default: 0.005
        parameterizable: true
        description: Cartesian translation tolerance in meters.
      - name: rotation_tol_rad
        schema:
