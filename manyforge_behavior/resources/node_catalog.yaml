  joint_dynamics_limit:
    type: object
    additional_properties: false
    properties:
      max_velocity_rad_s:
        type: float
        constraints:
          min_exclusive: 0.0
      max_acceleration_rad_s2:
        type: float
        constraints:
          min_exclusive: 0.0
      max_jerk_rad_s3:
        type: float
        constraints:
          min_exclusive: 0.0
  per_joint_dynamics_limits:
    type: object
    additional_properties:
      schema_ref: '#/schema_types/joint_dynamics_limit'
  cartesian_path:
    type: array
    min_items: 2
    max_items: 4096
    items:
      schema_ref: '#/schema_types/motion_pose'
  pose_offset_envelope:
    type: object
    additional_properties: false
    required:
    - position_min_m
    - position_max_m
    - orientation_rpy_min_deg
    - orientation_rpy_max_deg
    properties:
      position_min_m:
        type: array
        items:
          type: float
        length: 3
      position_max_m:
        type: array
        items:
          type: float
        length: 3
      orientation_rpy_min_deg:
        type: array
        items:
          type: float
        length: 3
      orientation_rpy_max_deg:
        type: array
        items:
          type: float
        length: 3
  pose_offset:
    type: object
    additional_properties: false
    required:
    - position_m
    - rpy_deg
    properties:
      position_m:
        type: array
        items:
          type: float
        length: 3
      rpy_deg:
        type: array
        items:
          type: float
        length: 3
  pick_synthesis:
    type: object
    additional_properties: false
    required:
    - pick_offset_envelope
    - approach_offset_envelope
    properties:
      pick_offset_envelope:
        schema_ref: '#/schema_types/pose_offset_envelope'
      approach_offset_envelope:
        schema_ref: '#/schema_types/pose_offset_envelope'
      pick_offset_reference:
        schema_ref: '#/schema_types/motion_reference'
      approach_offset_reference:
        schema_ref: '#/schema_types/motion_reference'
      base_tool_orientation_rpy_deg:
        type: array
