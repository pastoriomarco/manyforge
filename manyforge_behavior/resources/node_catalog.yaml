- id: logic.check_value
  name: Check value
  category: logic
  description: Compares one declared blackboard key with a value and succeeds when
    the comparison holds, failing otherwise. A missing key fails the node, and a comparison
    that cannot run also fails it. Only bool, string, float64 and int64 keys can be
    compared.
  stability: stable
  tags:
  - logic
  - blackboard
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: key
    required: true
    description: Declared blackboard key read when the attempt starts. A key that
      is still empty fails the node. Required.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: operator
    required: false
    description: 'Comparison: ==, !=, <, <=, >, or >=. Omitted: ==. Ordering operators
      need numeric keys; bool and string keys accept only == and !=.'
    default: ==
    schema:
      type: enum
      values:
      - ==
      - '!='
      - <
      - <=
      - '>'
      - '>='
  - id: value
    required: true
    description: Value to compare the key against, of the key's declared type. Required.
    schema:
      type: key_value
      value_type_from_key: key
      value_types:
      - bool
      - float64
      - int64
      - string
  - id: tolerance
    required: false
    description: 'Allowed absolute difference for == and != on numeric keys; 0 or
      more. Omitted: exact comparison. Not allowed with ordering operators.'
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  required_capabilities: []
  blackboard:
    reads:
    - key_parameter: key
      value_type: bool
      missing_key: failure
    - key_parameter: key
      value_type: float64
      missing_key: failure
    - key_parameter: key
      value_type: int64
      missing_key: failure
    - key_parameter: key
      value_type: string
      missing_key: failure
    writes: []
  execution:
    blocking: false
    cancellable: false
    owner_api: orchestration.blackboard
  outcomes:
    success: matched
    failure: not_matched
  runners:
    py_trees:
      implementation_id: logic_check_value_v1
  observability:
    event_family: manyforge.program.node
- id: logic.wait_for_value
  name: Wait for value
  category: logic
  description: Waits until a declared blackboard key compares true with the value,
    then succeeds. The key is re-read on every tick, so an empty key keeps the node
    waiting. Without timeout_s the wait lasts until a match or until the run ends;
    when timeout_s elapses the node fails, and a Program Stop or Reset ends it as
    interrupted.
  stability: stable
  tags:
  - logic
  - blackboard
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: key
    required: true
    description: Declared blackboard key re-read on every tick; while it is empty
      the node keeps waiting. Required.
    schema:
      type: string
      semantic_type: blackboard_key
  - id: operator
    required: false
    description: 'Comparison: ==, !=, <, <=, >, or >=. Omitted: ==. Ordering operators
      need numeric keys; bool and string keys accept only == and !=.'
    default: ==
    schema:
      type: enum
      values:
      - ==
      - '!='
      - <
      - <=
      - '>'
      - '>='
  - id: value
    required: true
    description: Value to wait for, of the key's declared type. Required.
    schema:
      type: key_value
      value_type_from_key: key
      value_types:
      - bool
      - float64
      - int64
      - string
  - id: tolerance
    required: false
    description: 'Allowed absolute difference for == and != on numeric keys; 0 or
      more. Omitted: exact match. Not allowed with ordering operators.'
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: timeout_s
    required: false
    description: 'Seconds of Program time before the wait fails, from 0.01 to 3600.
      Omitted: no timeout, so the wait lasts until a match or the run ends.'
    schema:
      type: float
      constraints:
        min_inclusive: 0.01
        max_inclusive: 3600.0
  - id: timeout_while_held
    required: false
    description: 'pause leaves out time an operator Stop holds this node from the
      timeout; count includes it. Omitted: pause. Only applies when timeout_s is set.'
    default: pause
    schema:
      type: enum
      values:
      - count
      - pause
  required_capabilities: []
  blackboard:
    reads:
    - key_parameter: key
      value_type: bool
      missing_key: wait
    - key_parameter: key
      value_type: float64
      missing_key: wait
    - key_parameter: key
      value_type: int64
      missing_key: wait
    - key_parameter: key
      value_type: string
      missing_key: wait
    writes: []
  execution:
    blocking: true
    cancellable: true
    owner_api: orchestration.blackboard
  outcomes:
    success: matched
    failure: wait_failed
    interrupted: cancelled
  runners:
    py_trees:
      implementation_id: logic_wait_for_value_v1
  observability:
    event_family: manyforge.program.node
