  - decorator
  profiles:
    min_program_profile: composable-cell-v1
  kind: decorator
  children:
    min: 1
    max: 1
  parameters: []
  required_capabilities: []
  execution:
    blocking: false
    cancellable: false
    owner_api: orchestration.control_flow
  runners:
    py_trees:
      implementation_id: inverter_v1
  observability:
    event_family: manyforge.program.node
- id: repeat
  name: Repeat
  category: control_flow
  description: Repeat one child a finite number of times or indefinitely (-1).
  stability: stable
  tags:
  - control_flow
  - decorator
  profiles:
