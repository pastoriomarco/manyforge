- id: timer
  name: Timer
  category: control_flow
  description: 'Delay for duration_s seconds of Program time, then succeed. Program
    time is monotonic and stands still while the Program is halted; Execute after
    Halt continues the same delay. By default (duration_while_held: pause) time the
    node itself is held by an operator Stop does not count and the delay resumes with
    the remaining time; with duration_while_held: count held time counts too. A node
    whose stop policy keeps it running during a Stop keeps counting. Program Stop
    and Reset end the delay.'
  stability: stable
  tags:
  - control_flow
  - timing
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: duration_s
    required: true
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 86400.0
  - id: duration_while_held
    required: false
    default: pause
    schema:
      type: enum
      values:
      - count
      - pause
  required_capabilities: []
  execution:
    blocking: true
    cancellable: true
    owner_api: orchestration.clock
  outcomes:
    success: elapsed
    interrupted: cancelled
  runners:
    py_trees:
      implementation_id: timer_v1
  observability:
    event_family: manyforge.program.node
- id: motion.move_to_joint_target
  name: Move to joint target
  category: motion
  description: Plan, validate, and execute a target-scoped source-joint goal.
  stability: stable
  tags:
  - motion
  - planning
  - execution
  profiles:
    min_program_profile: composable-cell-v1
  kind: leaf
  children:
    min: 0
    max: 0
  parameters:
  - id: target_role
    required: true
    schema:
      type: string
      semantic_type: target_role
  - id: base_frame_role
    required: true
    schema:
      type: string
      semantic_type: frame_role
      semantic_scope_parameter: target_role
  - id: tcp_endpoint
    required: true
    schema_ref: '#/schema_types/motion_endpoint_ref'
  - id: goal
    required: true
    schema_ref: '#/schema_types/joint_target_list'
  - id: target_mode
    required: false
    default: absolute
    schema:
      type: enum
      values:
      - absolute
      - relative
  - id: planning_profile
    required: false
    default: balanced
    schema:
      type: enum
      values:
      - first_feasible
      - balanced
      - quality_bounded
  - id: velocity_scale
    required: false
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 1.0
  - id: acceleration_scale
    required: false
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 1.0
  - id: max_tcp_linear_speed_mps
    required: false
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: per_joint_dynamics_limits
    required: false
    default: {}
    schema_ref: '#/schema_types/per_joint_dynamics_limits'
  - id: joint_position_tol_rad
    required: false
    default: 0.05
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: translation_tol_m
    required: false
    default: 0.005
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: rotation_tol_rad
    required: false
    default: 0.05
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
  - id: planning_timeout_s
    required: false
    default: 2.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: execution_timeout_s
    required: false
    default: 10.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
  - id: cache_mode
    required: false
    default: default
    schema:
      type: enum
      values:
      - default
      - disable
  - id: contact_policy_id
    required: false
    schema:
      type: string
  - id: contact_scene_resource_id
    required: false
    schema:
      type: string
      semantic_type: scene_resource
  - id: automatic_retries
    required: false
    default: 3
    schema:
      type: int
      constraints:
        min_inclusive: 0
        max_inclusive: 10
  - id: automatic_retry_delay_s
    required: false
    default: 1.0
    schema:
      type: float
      constraints:
        min_inclusive: 0.0
        max_inclusive: 60.0
  - id: preemption_priority
    required: false
    default: 0
    schema:
      type: int
      constraints:
        min_inclusive: 0
        max_inclusive: 100
  - id: preempted_result
    required: false
    default: failure
    schema:
      type: enum
      values:
      - success
      - failure
  required_capabilities:
  - capability_id: planning.motion.joint_goal
    scope: target_binding
    target_parameter: target_role
  - capability_id: planning.profile.first_feasible
    scope: target_binding
    target_parameter: target_role
    when:
      parameter: planning_profile
      equals: first_feasible
  - capability_id: planning.profile.balanced
    scope: target_binding
    target_parameter: target_role
    when:
      parameter: planning_profile
      equals: balanced
  - capability_id: planning.profile.quality_bounded
    scope: target_binding
    target_parameter: target_role
    when:
      parameter: planning_profile
      equals: quality_bounded
  - capability_id: planning.trajectory.time_parameterized
    scope: target_binding
    target_parameter: target_role
  - capability_id: state.observed.current
    scope: target_binding
    target_parameter: target_role
  - capability_id: validation.trajectory.non_collision
    scope: target_binding
    target_parameter: target_role
  - capability_id: collision.query.pre_execution
    scope: cell_global
  - capability_id: execution.trajectory.execute
    scope: target_binding
    target_parameter: target_role
    effectful: true
  - capability_id: execution.feedback.phase_events
    scope: target_binding
    target_parameter: target_role
  execution:
    blocking: true
    cancellable: true
    owner_api: kernel.operation
  outcomes:
    success: operation_succeeded
    failure: operation_failed
    interrupted: operation_terminal
  runners:
    py_trees:
      implementation_id: motion_move_to_joint_target_v1
  observability:
    event_family: manyforge.program.node
- id: motion.move_to_pose
