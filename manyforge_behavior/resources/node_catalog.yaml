    schema:
      type: bool
  required_capabilities: []
  execution:
    blocking: true
    cancellable: false
    owner_api: geometry.compare
  outcomes:
    success: within_bounds
    failure: outside_bounds
  runners:
    py_trees:
      implementation_id: geometry_check_pose_bounds_v1
  observability:
    event_family: manyforge.program.node
