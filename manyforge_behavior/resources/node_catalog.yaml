  # --- Recovery nodes (OP-6) ---

  - id: fallback_override_node
    name: Fallback Override
    category: recovery
    description: >-
      Decorator that retries its child with overridden blackboard parameters
      on failure. Deterministic recovery — no model calls or external
      delegation. Never produces "skip" as an outcome.
    tags: [recovery, deterministic, decorator]
    profiles:
      min_profile: v0.0
    kind: decorator
    children:
      min: 1
      max: 1
    parameters:
      - name: fallback_params
        schema:
          type: object
          additional_properties: true
        required: true
        description: >-
          Parameter overrides to apply to the blackboard on child failure.
          Keys are blackboard key paths, values are the fallback values.
      - name: max_retries
        schema:
          type: int
          constraints:
            min_inclusive: 0
        required: false
        default: 1
        parameterizable: true
        description: >-
          Maximum retry attempts after applying overrides.
          0 means apply overrides and run once without further retries.
    required_capabilities: []
    execution:
      blocking: false
      cancellable: false
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.recovery.FallbackOverrideNode
    outcomes:
      success_criteria:
        - Child succeeds after deterministic fallback parameters are applied.
      failure_classes:
        - child_failed_after_retries
        - invalid_fallback_parameters
      verification_evidence:
        - child subtree terminal status
    observability:
      emits_events: []
      consumes_events: []

  - id: recovery_skill_node
    name: Recovery Skill
    category: recovery
    description: >-
      Decorator that runs a named recovery skill when its child fails, then
      retries the child. Deterministic recovery — the skill must be a catalog
      skill, not a model call. Never produces "skip" as an outcome.
    tags: [recovery, deterministic, decorator]
    profiles:
      min_profile: v0.0
    kind: decorator
    children:
      min: 1
      max: 1
    parameters:
      - name: recovery_skill_id
        schema:
          type: string
        required: true
        description: Skill catalog ID to run as recovery action.
      - name: recovery_params
        schema:
          type: object
          additional_properties: true
        required: false
        default: {}
        description: Parameters to pass to the recovery skill.
      - name: max_retries
        schema:
          type: int
          constraints:
            min_inclusive: 0
        required: false
        default: 1
        parameterizable: true
        description: Maximum retry attempts with recovery skill.
    required_capabilities: []
    execution:
      blocking: false
      cancellable: false
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.recovery.RecoverySkillNode
    outcomes:
      success_criteria:
        - Recovery skill completes and child succeeds within retry budget.
      failure_classes:
        - recovery_skill_failed
        - child_failed_after_retries
        - recovery_skill_not_found
      verification_evidence:
        - child subtree terminal status
    observability:
      emits_events: []
      consumes_events: []

  # --- Model nodes (OP-7) ---

  - id: query_model
    name: Query Model
    category: model
    description: >-
      Non-blocking leaf node that queries a deployment-configured model endpoint
      with a versioned prompt template. Writes validated structured output to the
      blackboard atomically. Supports JSON-schema output validation, wall-clock
      timeout, and clean cancellation via the BT stop path.
    tags: [model, perception, reasoning]
    profiles:
      min_profile: v0.0
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: model_endpoint_alias
        schema:
          type: string
        required: true
        ui_editor: deployment_model_endpoint_alias
        description: >-
          Deployment-configured model endpoint alias.
          Must match a key in deployment.model_endpoints.
      - name: prompt_template_id
        schema:
          type: string
        required: true
        ui_editor: deployment_prompt_template_id
        description: >-
          Deployment-side prompt template ID.
          Must match a key in deployment.prompt_templates.
      - name: template_variables
        schema_ref: "#/schema_types/template_variable_map"
        required: false
        default: {}
        ui_editor: template_variable_map
        description: >-
          Map of template variable names to declared blackboard bindings.
          Each value must be a key_ref or field_ref binding. Variables in the
          template text ({{var_name}}) are replaced with the current value of
          the referenced key or namespace field.
      - name: output_key_prefix
        schema:
          type: string
        required: true
        ui_editor: output_key_prefix_selector
        blackboard_role: namespace_writer
        blackboard_contract: query_model_output_v1
        description: >-
          Blackboard namespace prefix for writing the validated model output bundle.
          The node publishes a single bundle at {prefix} with meta/status data
          under {prefix}.meta and the validated response under {prefix}.value.
      - name: timeout_s
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        default: 30.0
        parameterizable: true
        description: Wall-clock timeout for the model call in seconds.
      - name: min_confidence
        schema:
          type: float
          constraints:
            min_inclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 0.0
        parameterizable: true
        description: >-
          Minimum confidence threshold. If the response confidence is below
          this threshold, the node returns FAILURE.
      - name: retry_on_parse_failure
        schema:
          type: bool
        required: false
        default: false
        parameterizable: true
        description: >-
          When true, allow at most one repair retry if the first model response
          cannot be parsed as the required structured output.
      - name: include_scene_snapshot
        schema:
          type: bool
        required: false
        default: false
        description: >-
          When true, capture a live HMI scene snapshot and attach it to the
          model request as an image input. Requires a running HMI with at least
          one connected Viser client.
      - name: scene_snapshot_transport
        schema:
          type: enum
          values: [inline_data_url, http_url]
        required: false
        default: inline_data_url
        description: >-
          Transport used when attaching the scene snapshot to the model
          request. `inline_data_url` embeds the bytes directly in the request.
          `http_url` publishes the captured bytes under a temporary Composer URL
          and passes that URL to the model instead.
      - name: scene_snapshot_width
        schema:
          type: int
          constraints:
            min_inclusive: 64
            max_inclusive: 1920
        required: false
        default: 640
        description: Render width in pixels when include_scene_snapshot=true.
      - name: scene_snapshot_height
        schema:
          type: int
          constraints:
            min_inclusive: 64
            max_inclusive: 1080
        required: false
        default: 480
        description: Render height in pixels when include_scene_snapshot=true.
      - name: scene_snapshot_format
        schema:
          type: enum
          values: [jpeg, png]
        required: false
        default: jpeg
        description: Image format for the attached scene snapshot.
    required_capabilities: []
    execution:
      blocking: false
      cancellable: true
    interruptible: true
    default_interrupt_scope: active_node
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.model.QueryModelNode
    outcomes:
      success_criteria:
        - Validated structured output written under output_key_prefix.
        - Confidence meets or exceeds min_confidence.
      failure_classes:
        - configuration_error
        - timeout
        - cancelled
        - parse_failed
        - schema_validation_failed
        - confidence_below_threshold
        - output_commit_failed
      verification_evidence:
        - blackboard output namespace under output_key_prefix
        - model_call_started/model_call_completed/model_call_failed events
    observability:
      emits_events: [model_call_started, model_call_completed, model_call_failed]
      consumes_events: []

  - id: build_scene_selection_context
    name: Build Scene Selection Context
    category: perception
    description: >-
      Deterministically build an authoritative object-selection context from
      backend scene state. Writes candidate IDs, privileged object metadata,
      spatial semantics, and a prompt-ready JSON manifest to the blackboard for
      downstream model selection.
    tags: [selection, perception, context, deterministic, blackboard]
    profiles:
      min_profile: v0.0
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: selection_request_text
        schema:
          type: string
        required: true
        description: >-
          Human-authored selection request to resolve, for example "select the
          red object" or "select the sphere". This is authored as a literal
          string in the program.
      - name: output_key_prefix
        schema:
          type: string
        required: true
        ui_editor: output_key_prefix_selector
        blackboard_role: namespace_writer
        blackboard_contract: selection_context_v1
        description: >-
          Blackboard prefix for the generated selection context.
      - name: object_source
        schema:
          type: enum
          values: [backend_scene]
        required: false
        default: backend_scene
        description: >-
          Authoritative scene-object source. Initial implementation supports
          backend_scene only.
      - name: candidate_object_ids
        schema:
          type: array
          items: string
        required: false
        default: []
        description: >-
          Optional explicit candidate object IDs. When omitted, all scene
          objects are exposed as candidates.
      - name: image_source
        schema:
          type: enum
          values: [none, hmi_snapshot]
        required: false
        default: none
        description: >-
          Optional auxiliary image source. When hmi_snapshot is used, the node
          verifies that an HMI render is available and records metadata for the
          prompt context.
      - name: image_snapshot_width
        schema:
          type: int
          constraints:
            min_inclusive: 64
            max_inclusive: 1920
        required: false
        default: 640
        description: Render width in pixels when image_source=hmi_snapshot.
      - name: image_snapshot_height
        schema:
          type: int
          constraints:
            min_inclusive: 64
            max_inclusive: 1080
        required: false
        default: 480
        description: Render height in pixels when image_source=hmi_snapshot.
      - name: image_snapshot_format
        schema:
          type: enum
          values: [jpeg, png]
        required: false
        default: jpeg
        description: Image format for the optional HMI snapshot metadata.
    required_capabilities: []
    execution:
      blocking: true
      cancellable: false
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.selection.BuildSceneSelectionContextNode
    outcomes:
      success_criteria:
        - Authoritative candidate manifest written under output_key_prefix.
      failure_classes:
        - selection_request_missing
        - scene_snapshot_unavailable
        - scene_state_unavailable
      verification_evidence:
        - blackboard output namespace under output_key_prefix
    observability:
      emits_events: []
      consumes_events: []

  - id: validate_scene_selection
    name: Validate Scene Selection
    category: perception
    description: >-
      Validate a model-selected object against a deterministic candidate
      manifest built from backend scene data. Writes a validated selected
      candidate to the blackboard and fails closed when the model output is not
      coherent with the candidate set.
    tags: [selection, perception, validation, deterministic, blackboard]
    profiles:
      min_profile: v0.0
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: selection_context_prefix
        schema:
          type: string
        required: true
        ui_editor: selection_context_prefix_selector
        blackboard_role: namespace_reader
        blackboard_contract: selection_context_v1
        description: >-
          Blackboard prefix produced by build_scene_selection_context.
      - name: selection_response_prefix
        schema:
          type: string
        required: true
        ui_editor: selection_response_prefix_selector
        blackboard_role: namespace_reader
        blackboard_contract: query_model_output_v1
        description: >-
          Blackboard prefix produced by query_model for the selection response.
      - name: output_key_prefix
        schema:
          type: string
        required: true
        ui_editor: output_key_prefix_selector
        blackboard_role: namespace_writer
        blackboard_contract: validated_selection_v1
        description: Blackboard prefix for the validated selection result.
      - name: allow_no_match
        schema:
          type: bool
        required: false
        default: false
        parameterizable: true
        description: >-
          When true, a valid no_match response is accepted. The node still
          writes the no_match outcome to the blackboard.
      - name: allow_ambiguous
        schema:
          type: bool
        required: false
        default: false
        parameterizable: true
        description: >-
          When true, a valid ambiguous response is accepted. The node still
          writes the ambiguous outcome to the blackboard.
    required_capabilities: []
    execution:
      blocking: true
      cancellable: false
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.selection.ValidateSceneSelectionNode
    outcomes:
      success_criteria:
        - Selected object ID is coherent with the deterministic candidate set.
      failure_classes:
        - no_match_rejected
        - ambiguous_rejected
        - invalid_selected_object
        - malformed_selection_payload
      verification_evidence:
        - validated selection under output_key_prefix
    observability:
      emits_events: []
      consumes_events: []

  - id: plan_pick_sequence
    name: Plan Pick Sequence
    category: motion
    description: >-
      Deterministically synthesize and preview a three-leg pick sequence for a
      selected object using backend-authoritative scene data and bounded
      approach envelopes. The validated sequence is current pose -> approach
      pose -> pick pose -> approach pose. Does not execute motion; writes a
      validated pick plan to the blackboard.
    tags: [planning, pick, deterministic, blackboard]
    profiles:
      min_profile: v0.0
    kind: leaf
    children:
      min: 0
      max: 0
    parameters:
      - name: selected_object_id
        schema:
          type: string
        required: true
        ui_editor: string_or_blackboard_field_selector
        blackboard_role: field_reader
        blackboard_value_type: string
        description: >-
          Object ID to plan against. May be a literal ID or a declared
          blackboard field_ref.
      - name: output_key_prefix
        schema:
          type: string
        required: true
        ui_editor: output_key_prefix_selector
        blackboard_role: namespace_writer
        blackboard_contract: pick_plan_v1
        description: >-
          Blackboard namespace prefix for the generated plan bundle. The node
          publishes the validated plan at {prefix}.value with status/meta data
          under {prefix}.meta.
      - name: object_source
        schema:
          type: enum
          values: [backend_scene]
        required: false
        default: backend_scene
        description: >-
          Authoritative object snapshot source. Initial implementation supports
          backend_scene only.
      - name: image_source
        schema:
          type: enum
          values: [none, hmi_snapshot]
        required: false
        default: none
        description: >-
          Optional image-source hook kept for future perception-backed planning
          variants. The deterministic planner does not currently derive poses
          from the image.
      - name: image_snapshot_width
        schema:
          type: int
          constraints:
            min_inclusive: 64
            max_inclusive: 1920
        required: false
        default: 640
        description: Render width in pixels when image_source=hmi_snapshot.
      - name: image_snapshot_height
        schema:
          type: int
          constraints:
            min_inclusive: 64
            max_inclusive: 1080
        required: false
        default: 480
        description: Render height in pixels when image_source=hmi_snapshot.
      - name: image_snapshot_format
        schema:
          type: enum
          values: [jpeg, png]
        required: false
        default: jpeg
        description: Image format for the optional HMI snapshot.
      - name: tcp_frame
        schema:
          type: string
        required: false
        default: tool0
        description: Target TCP/tool frame for the planned pick.
      - name: pick_offset_envelope
        schema_ref: "#/schema_types/pose_offset_envelope"
        required: false
        ui_editor: pose_envelope
        default:
          position_min_m: [0.0, 0.0, 0.0]
          position_max_m: [0.0, 0.0, 0.0]
          orientation_rpy_min_deg: [0.0, 0.0, 0.0]
          orientation_rpy_max_deg: [0.0, 0.0, 0.0]
        description: >-
          Min/max XYZ and RPY offsets applied to the nominal grasp pose at the
          object top surface.
      - name: approach_offset_envelope
        schema_ref: "#/schema_types/pose_offset_envelope"
        required: false
        ui_editor: pose_envelope
        default:
          position_min_m: [0.0, 0.0, 0.05]
          position_max_m: [0.0, 0.0, 0.10]
          orientation_rpy_min_deg: [0.0, 0.0, 0.0]
          orientation_rpy_max_deg: [0.0, 0.0, 0.0]
        description: >-
          Min/max XYZ and RPY offsets applied to the nominal approach pose
          relative to the candidate pick pose.
      - name: search_strategy
        schema:
          type: enum
          values: [first_feasible_grid, best_cost_grid]
        required: false
        default: first_feasible_grid
        description: Deterministic candidate search policy.
      - name: translation_step_m
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        default: 0.01
        parameterizable: true
        description: Grid step size for translational envelope sampling.
      - name: rotation_step_deg
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        default: 15.0
        parameterizable: true
        description: Grid step size for rotational envelope sampling.
      - name: planning_timeout_s
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        default: 2.0
        parameterizable: true
        description: Planning timeout per previewed motion leg.
      - name: velocity_scale
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 0.35
        parameterizable: true
        description: Velocity scale used for motion previews.
      - name: acceleration_scale
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
            max_inclusive: 1.0
        required: false
        default: 1.0
        parameterizable: true
        description: Acceleration scale used for motion previews.
      - name: max_tcp_linear_speed_mps
        schema:
          type: float
          constraints:
            min_exclusive: 0.0
        required: false
        parameterizable: true
        description: Optional TCP speed cap enforced during preview validation.
    required_capabilities:
      - planning.motion.pose_goal
      - planning.trajectory.time_parameterized
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - context.kinematics.fk
      - scene.shape.box
      - scene.shape.sphere
    execution:
      blocking: true
      cancellable: false
    runners:
      py_trees:
        implementation_kind: plugin
        class: manyforge_behavior.nodes.pick_planning.PlanPickSequenceNode
    outcomes:
      success_criteria:
        - Feasible approach, pick, and exit previews found for the selected object.
      failure_classes:
        - selected_object_missing
        - start_state_invalid
        - planning_failed
        - collision_detected
      verification_evidence:
        - pick plan response under output_key_prefix
    observability:
      emits_events: []
      consumes_events: []
