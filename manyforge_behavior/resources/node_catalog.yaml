        blackboard_role: literal_or_key_reader
        blackboard_value_type: string
        description: Identifier for the collision object to insert or replace.
          May be a literal ID, a program parameter, or a declared blackboard
          key/field binding.
      - name: shape
        schema_ref: "#/schema_types/shape"
        required: true
        ui_editor: shape
        description: >-
          Collision shape object with `type` plus the type-specific dimensions
          required by the schema.
      - name: pose
        schema_ref: "#/schema_types/stored_pose"
        required: true
        description: >-
