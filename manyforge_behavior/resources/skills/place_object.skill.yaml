{
  "api_version": "manyforge.skill.v2",
  "skill_id": "place_object",
  "version": "2.0.0",
  "name": "Place object — logical-gripper template",
  "description": "Preserves the historical logical-gripper skill: approach, descend, set a Program flag, request the Scene-owned attachment change, and retreat. It does not actuate or confirm a physical gripper. Add an explicit qualified gripper command/confirmation when needed. Scene revisions invalidate affected cache entries automatically; there is no manual cache-reset node.",
  "compatible_profiles": [
    "composable-cell-v1"
  ],
  "parameters": [
    {
      "id": "object_id",
      "required": true,
      "schema": {
        "type": "string"
      }
    },
    {
      "id": "gripper_state_key",
      "required": true,
      "schema": {
        "type": "string"
      }
    },
    {
      "id": "approach_height_m",
      "required": false,
      "schema": {
        "type": "float",
        "constraints": {
          "min_exclusive": 0
        }
      },
      "default": 0.05
    },
    {
      "id": "tool_orientation_rpy_deg",
      "required": false,
      "schema": {
        "type": "array",
        "items": {
          "type": "float"
        },
        "length": 3
      },
      "default": [
        180,
        0,
        -90
      ]
    },
    {
      "id": "velocity_scale",
      "required": false,
      "schema": {
        "type": "float",
        "constraints": {
          "min_exclusive": 0,
          "max_inclusive": 1
        }
      },
      "default": 0.5
    },
    {
      "id": "acceleration_scale",
      "required": false,
      "schema": {
        "type": "float",
        "constraints": {
          "min_exclusive": 0,
          "max_inclusive": 1
        }
      },
      "default": 1
    },
    {
      "id": "max_tcp_linear_speed_mps",
      "required": true,
      "schema": {
        "type": "float",
        "constraints": {
          "min_exclusive": 0
        }
      }
    },
    {
      "id": "place_pose",
      "required": true,
      "schema": {
        "schema_ref": "#/schema_types/motion_pose"
      }
    },
    {
      "id": "arm_target",
      "required": true,
      "schema": {
        "schema_ref": "#/schema_types/target_reference"
      }
    },
    {
      "id": "base_frame",
      "required": true,
      "schema": {
        "schema_ref": "#/schema_types/frame_reference"
      }
    },
    {
      "id": "gripper_target",
      "required": true,
      "schema": {
        "schema_ref": "#/schema_types/target_reference"
      }
    }
  ],
  "requires": [
    "The Program declares the selected scene resource and writable boolean flag",
    "The mapped arm supports exact pose planning and execution",
    "Any required physical gripper action/confirmation is provided separately",
    "Normal Scene-owner attachment admission remains mandatory"
  ],
  "provides": [
    "Scene object detached after owner acceptance",
    "Logical Program flag false, not physical release evidence",
    "Arm reaches retreat pose"
  ],
  "modifies": [
    "Arm pose",
    "Scene-owned carried attachment",
    "Declared Program boolean flag"
  ],
  "body": {
    "node_id": "sequence",
    "instance_id": "place",
    "parameters": {},
    "children": [
      {
        "node_id": "motion.move_to_pose",
        "instance_id": "approach",
        "parameters": {
          "target": "${param:arm_target}",
          "base_frame": "${param:base_frame}",
          "tcp_endpoint": {
            "kind": "current"
          },
          "target_mode": "relative",
          "target_reference": {
            "type": "pose",
            "pose": "${param:place_pose}"
          },
          "offset_reference": {
            "type": "component_frame",
            "frame": "${param:base_frame}"
          },
          "goal": {
            "position_m": [
              0,
              0,
              "${param:approach_height_m}"
            ],
            "orientation": {
              "rpy_deg": "${param:tool_orientation_rpy_deg}"
            }
          },
          "velocity_scale": "${param:velocity_scale}",
          "acceleration_scale": "${param:acceleration_scale}",
          "max_tcp_linear_speed_mps": "${param:max_tcp_linear_speed_mps}"
        },
        "children": []
      },
      {
        "node_id": "motion.move_to_pose",
        "instance_id": "descend",
        "parameters": {
          "target": "${param:arm_target}",
          "base_frame": "${param:base_frame}",
          "tcp_endpoint": {
            "kind": "current"
          },
          "target_mode": "relative",
          "target_reference": {
            "type": "pose",
            "pose": "${param:place_pose}"
          },
          "offset_reference": {
            "type": "component_frame",
            "frame": "${param:base_frame}"
          },
          "goal": {
            "position_m": [
              0,
              0,
              0
            ],
            "orientation": {
              "rpy_deg": "${param:tool_orientation_rpy_deg}"
            }
          },
          "velocity_scale": "${param:velocity_scale}",
          "acceleration_scale": "${param:acceleration_scale}",
          "max_tcp_linear_speed_mps": "${param:max_tcp_linear_speed_mps}"
        },
        "children": []
      },
      {
        "node_id": "logic.set_value",
        "instance_id": "set_logical_gripper",
        "parameters": {
          "key": "${param:gripper_state_key}",
          "value": false
        },
        "children": []
      },
      {
        "node_id": "scene.detach_carried_object",
        "instance_id": "detach",
        "parameters": {
          "scene_resource_id": "${param:object_id}",
          "target": "${param:gripper_target}"
        },
        "children": []
      },
      {
        "node_id": "motion.move_to_pose",
        "instance_id": "retreat",
        "parameters": {
          "target": "${param:arm_target}",
          "base_frame": "${param:base_frame}",
          "tcp_endpoint": {
            "kind": "current"
          },
          "target_mode": "relative",
          "target_reference": {
            "type": "pose",
            "pose": "${param:place_pose}"
          },
          "offset_reference": {
            "type": "component_frame",
            "frame": "${param:base_frame}"
          },
          "goal": {
            "position_m": [
              0,
              0,
              "${param:approach_height_m}"
            ],
            "orientation": {
              "rpy_deg": "${param:tool_orientation_rpy_deg}"
            }
          },
          "velocity_scale": "${param:velocity_scale}",
          "acceleration_scale": "${param:acceleration_scale}",
          "max_tcp_linear_speed_mps": "${param:max_tcp_linear_speed_mps}"
        },
        "children": []
      }
    ]
  },
  "example": {
    "arguments": {
      "object_id": "graspable",
      "gripper_state_key": "state.gripper_closed",
      "max_tcp_linear_speed_mps": 0.1,
      "place_pose": {
        "position_m": [
          0.3,
          0.3,
          0.2
        ],
        "orientation": {
          "rpy_deg": [
            180,
            0,
            -90
          ]
        }
      },
      "arm_target": {
        "component_id": "robot",
        "command_target_id": "arm"
      },
      "base_frame": {
        "component_id": "robot",
        "frame_id": "base"
      },
      "gripper_target": {
        "component_id": "tool",
        "command_target_id": "gripper"
      }
    },
    "program_declarations": {
      "blackboard": {
        "namespaces": [
          {
            "namespace_id": "state",
            "owner": "program"
          }
        ],
        "keys": [
          {
            "key": "state.gripper_closed",
            "type": "bool",
            "access": "read_write",
            "persistence": "run"
          }
        ]
      },
      "scene": [
        {
          "scene_resource_id": "graspable",
          "shape": {
            "type": "box",
            "box_dimensions_m": [
              0.02,
              0.02,
              0.02
            ]
          },
          "pose": {
            "frame_ref": {
              "kind": "cell_frame"
            },
            "position_m": [
              0.2,
              0.1,
              0.1
            ],
            "orientation": {
              "xyzw": [
                0,
                0,
                0,
                1
              ]
            }
          }
        }
      ]
    },
    "effect": "Compile a portable five-node subtree. The boolean flag is logical only; actual motion/attachment requires normal owner admission at Run."
  }
}
