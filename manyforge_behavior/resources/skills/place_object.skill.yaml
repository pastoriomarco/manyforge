api_version: manyforge.skill.v0
skill_id: place_object
version: "0.1.0"
name: Place Object
description: >-
  Place an attached object at a target pose by approaching from above,
  descending to the target pose, opening the gripper, detaching the object,
  retreating upward, and invalidating the trajectory cache.
compatible_profiles: [v0.0]

requires:
  - "object must already be attached to the TCP"
  - "gripper_closed blackboard key is true"
  - "robot must be able to reach the place pose"

provides:
  - "object is detached from the TCP and placed at the target pose"
  - "gripper_closed blackboard key is false"
  - "robot is at the retreat position above the place pose"
  - "trajectory cache is invalidated"

modifies:
  - scene_object_attachment
  - trajectory_cache
  - blackboard

requires_capabilities:
  - planning.motion.pose_goal
  - context.kinematics.fk
  - scene.edit.add
  - scene.edit.remove
  - execution.trajectory.execute

parameters:
  - name: object_id
    type: string
    required: true
    description: ID of the object to place.
  - name: place_pose
    type: pose
    required: true
    description: Target pose for placement in the robot base frame.
  - name: approach_height_m
    type: float
    required: false
    default: 0.05
    description: Vertical offset above the place pose for approach and retreat.
  - name: tool_orientation_rpy_deg
    type: float_list
    required: false
    default: [180.0, 0.0, -90.0]
    description: Tool orientation for the approach and retreat moves.
  - name: velocity_scale
    type: float
    required: false
    default: 0.5
    description: Velocity scale for all moves in this skill.
  - name: tcp_frame
    type: string
    required: false
    default: tool0
    description: TCP link frame the object is attached to.

body:
  id: sequence
  name: place_sequence
  children:
    - id: move_manipulator_action
      name: approach
      params:
        move_id: "place_approach_${param:object_id}"
        motion_type: relative_move
        relative_move:
          target_reference:
            type: pose
            pose: "${param:place_pose}"
          offset_reference:
            type: frame
            id: base_link
          offset:
            position_m: [0.0, 0.0, "${param:approach_height_m}"]
            orientation_rpy_deg: "${param:tool_orientation_rpy_deg}"
        velocity_scale: "${param:velocity_scale}"
    - id: move_manipulator_action
      name: descend
      params:
        move_id: "place_descend_${param:object_id}"
        motion_type: pose_goal
        pose_goal: "${param:place_pose}"
        velocity_scale: "${param:velocity_scale}"
    - id: set_key_bool_value
      name: open_gripper
      params:
        key: gripper_closed
        value: false
    - id: detach_object_from_link
      name: detach
      params:
        object_id: "${param:object_id}"
        link_frame: "${param:tcp_frame}"
    - id: move_manipulator_action
      name: retreat
      params:
        move_id: "place_retreat_${param:object_id}"
        motion_type: relative_move
        relative_move:
          target_reference:
            type: pose
            pose: "${param:place_pose}"
          offset_reference:
            type: frame
            id: base_link
          offset:
            position_m: [0.0, 0.0, "${param:approach_height_m}"]
            orientation_rpy_deg: "${param:tool_orientation_rpy_deg}"
        velocity_scale: "${param:velocity_scale}"
    - id: reset_trajectories
      name: invalidate_after_place

example:
  object_id: graspable
  place_pose:
    position_m: [0.3, 0.3, 0.2]
    orientation_rpy_deg: [180.0, 0.0, -90.0]
  approach_height_m: 0.05
  tool_orientation_rpy_deg: [180.0, 0.0, -90.0]
  velocity_scale: 0.5
  tcp_frame: tool0

validated_by: tests/fixtures/pick_and_place.program.yaml
