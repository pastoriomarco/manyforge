api_version: manyforge.skill.v0
skill_id: move_to_named_config
version: "0.1.0"
name: Move to Named Configuration
description: >-
  Move the robot to a named joint configuration (for example home, rest, or stow)
  using a single joint-goal move with configurable velocity.
compatible_profiles: [v0.0]

requires:
  - "robot must be able to move collision-free to the target configuration"

provides:
  - "robot is at the target joint configuration"

modifies: []

requires_capabilities:
  - planning.motion.joint_goal
  - execution.trajectory.execute

parameters:
  - name: config_name
    type: string
    required: true
    description: Human-readable name for the configuration.
  - name: joint_names
    type: string_list
    required: true
    description: Ordered joint names.
  - name: joint_positions_rad
    type: float_list
    required: true
    description: Target joint positions in radians, matching joint_names order.
  - name: velocity_scale
    type: float
    required: false
    default: 0.5
    description: Velocity scale for the move.

body:
  id: move_manipulator_action
  name: move_to_named_config
  params:
    move_id: "move_to_${param:config_name}"
    motion_type: joint
    joint_goal_names: "${param:joint_names}"
    joint_goal_positions_rad: "${param:joint_positions_rad}"
    velocity_scale: "${param:velocity_scale}"

example:
  config_name: home
  joint_names: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
  joint_positions_rad: [0.0, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
  velocity_scale: 0.3

validated_by: tests/fixtures/simple_motion.program.yaml
