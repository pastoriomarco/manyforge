{
  "api_version": "manyforge.skill.v2",
  "skill_id": "move_to_named_config",
  "version": "2.0.0",
  "name": "Move to named configuration",
  "description": "Expand a caller-selected source-model joint configuration into one ordinary motion node. The name is authoring context, not a deployed lookup or authority.",
  "compatible_profiles": [
    "composable-cell-v1"
  ],
  "parameters": [
    {
      "id": "configuration_name",
      "required": true,
      "schema": {
        "type": "string"
      }
    },
    {
      "id": "goal",
      "required": true,
      "schema": {
        "schema_ref": "#/schema_types/joint_target_list"
      }
    },
    {
      "id": "velocity_scale",
      "required": false,
      "default": 1.0,
      "schema": {
        "type": "float",
        "constraints": {
          "min_exclusive": 0.0,
          "max_inclusive": 1.0
        }
      }
    },
    {
      "id": "acceleration_scale",
      "required": false,
      "default": 1.0,
      "schema": {
        "type": "float",
        "constraints": {
          "min_exclusive": 0.0,
          "max_inclusive": 1.0
        }
      }
    },
    {
      "id": "max_tcp_linear_speed_mps",
      "required": true,
      "schema": {
        "type": "float",
        "constraints": {
          "min_exclusive": 0.0
        }
      }
    },
    {
      "id": "arm_target",
      "required": true,
      "schema": {
        "schema_ref": "#/schema_types/target_reference"
      }
    },
    {
      "id": "base_frame",
      "required": true,
      "schema": {
        "schema_ref": "#/schema_types/frame_reference"
      }
    }
  ],
  "requires": [
    "Current observed arm state",
    "Exact target Binding",
    "Collision validation before execution"
  ],
  "provides": [
    "Arm reaches the selected configuration on success"
  ],
  "modifies": [
    "Arm joint positions"
  ],
  "body": {
    "node_id": "motion.move_to_joint_target",
    "instance_id": "move",
    "parameters": {
      "target": "${param:arm_target}",
      "base_frame": "${param:base_frame}",
      "tcp_endpoint": {
        "kind": "current"
      },
      "goal": "${param:goal}",
      "velocity_scale": "${param:velocity_scale}",
      "acceleration_scale": "${param:acceleration_scale}",
      "max_tcp_linear_speed_mps": "${param:max_tcp_linear_speed_mps}"
    },
    "metadata": {
      "configuration_name": "${param:configuration_name}"
    },
    "children": []
  },
  "example": {
    "arguments": {
      "configuration_name": "home",
      "goal": [
        {
          "joint_name": "axis",
          "position_rad": 0.0
        }
      ],
      "velocity_scale": 0.25,
      "max_tcp_linear_speed_mps": 0.1,
      "arm_target": {
        "component_id": "robot",
        "command_target_id": "arm"
      },
      "base_frame": {
        "component_id": "robot",
        "frame_id": "base"
      }
    },
    "program_declarations": {},
    "effect": "Move source-model axis to zero after normal Binding validation and admission."
  }
}
