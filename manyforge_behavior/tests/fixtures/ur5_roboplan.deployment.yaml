api_version: manyforge.deployment.v0
schema_version: "0.1.0"
name: ur5_roboplan_local
description: Local deployment with RoboPlan planner and ros2_control JTC.

program_profile: v0.0

robot_config:
  robot_id: ur5
  group_id: arm
  urdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.urdf
  srdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.srdf
  global_max_tcp_linear_speed_mps: 0.25

adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: "0.1.0"
    supported_profiles: ["v0.0"]
    capability_keys:
      - planning.motion.joint_goal
      - planning.motion.pose_goal
      - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: "0.1.0"
    supported_profiles: ["v0.0"]
    capability_keys:
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - context.kinematics.fk
      - context.limits.joint
      - scene.shape.box
      - scene.shape.sphere
      - scene.edit.add
      - scene.edit.remove
      - scene.edit.update_pose
    config: {}
  execution:
    adapter_id: execution.ros2_control_fjt
    adapter_version: "0.1.0"
    supported_profiles: ["v0.0"]
    capability_keys:
      - execution.trajectory.execute
      - execution.feedback.phase_events
      - execution.stop.soft
      - execution.pause
      - execution.resume
      - execution.reset
    config:
      action_name: /joint_trajectory_controller/follow_joint_trajectory
      supports_pause_resume: true

orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 10.0

launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_hmi.backend
    args: []
    enabled: true
