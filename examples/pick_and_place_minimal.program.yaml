  content_version: 3.0.0
compatibility:
  lanes:
  - manyforge-only
  assistant: forbidden
  requires: []
  tags:
  - pick-and-place
  - smoke
  - ur5
scene:
- scene_resource_id: table
  shape:
    type: box
    box_dimensions_m:
    - 1.0
    - 0.6
    - 0.02
  pose:
    frame_ref:
      kind: component_frame
      frame:
        component_id: ur5_robot
        frame_id: base
    position_m:
    - 1.2
    - 0.0
    - 0.4
    orientation:
      xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
parameters:
- parameter_id: pick_velocity_scale
