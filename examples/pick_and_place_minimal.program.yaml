api_version: manyforge.program.v2
program_id: pick_and_place_minimal
program_revision: sha256:791b5d34239299d40a9869170dcf93889b9616e07fff462c163b51e81d2d5d73
program_profile: composable-cell-v1
name: pick_and_place_minimal
description: >-
  Minimal smoke Program for the ur5-simple-pick-place scenario: one
  target-scoped source-joint move followed by removal of one declared scene
  resource.
catalog:
  api_version: manyforge.node_catalog.v2
  content_version: 2.7.0
compatibility:
  lanes: [manyforge-only]
  assistant: forbidden
  requires: []
  tags: [pick-and-place, smoke, ur5]
component_roles:
  robot:
    required_component_type_tags: [articulated-arm]
    required_model_roles: [arm_model]
target_roles:
  arm:
    component_role: robot
    required_capabilities:
      - capability_id: execution.feedback.phase_events
        parameters: {}
        disposition: required
      - capability_id: execution.trajectory.execute
        parameters: {}
        disposition: required
      - capability_id: planning.motion.joint_goal
        parameters: {}
        disposition: required
      - capability_id: planning.profile.balanced
        parameters: {}
        disposition: required
      - capability_id: planning.trajectory.time_parameterized
        parameters: {}
        disposition: required
      - capability_id: state.observed.current
        parameters: {}
        disposition: required
      - capability_id: validation.trajectory.non_collision
        parameters: {}
        disposition: required
    required_frame_roles: [base, tcp]
    required_resource_roles: [arm_joints]
    required_collision_body_roles: [arm_collision]
    required_model_roles: [arm_model]
scene:
  - scene_resource_id: table
    shape:
      type: box
      box_dimensions_m: [1.0, 0.6, 0.02]
    pose:
      frame_ref:
        kind: component_frame
        component_role: robot
        model_role: arm_model
        frame_role: base
      # This smoke object remains outside the retained start/goal envelope;
      # collision-sensitive pick geometry belongs to the full Program.
      position_m: [1.2, 0.0, 0.4]
      orientation: {xyzw: [0.0, 0.0, 0.0, 1.0]}
parameters:
  - parameter_id: pick_velocity_scale
    type: float64
    default: 0.5
    constraints: {min_exclusive: 0.0, max_inclusive: 1.0}
    description: Velocity scale for the pick move.
tree:
  node_id: sequence
  instance_id: main_sequence
  parameters: {}
  children:
    - node_id: motion.move_to_joint_target
      instance_id: move_to_pick
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        goal:
          - {joint_name: shoulder_pan_joint, position_rad: 0.2}
          - {joint_name: shoulder_lift_joint, position_rad: -1.2}
          - {joint_name: elbow_joint, position_rad: 1.0}
          - {joint_name: wrist_1_joint, position_rad: -1.5}
          - {joint_name: wrist_2_joint, position_rad: -1.3}
          - {joint_name: wrist_3_joint, position_rad: 0.4}
        planning_timeout_s: 2.0
        execution_timeout_s: 10.0
      value_sources:
        velocity_scale:
          kind: program_parameter
          reference: pick_velocity_scale
      children: []
    - node_id: scene.remove_object
      instance_id: remove_table
      parameters:
        scene_resource_id: table
      children: []
