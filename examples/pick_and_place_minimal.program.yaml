      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      goal:
      - joint_name: shoulder_pan_joint
        position_rad: 0.2
      - joint_name: shoulder_lift_joint
        position_rad: -1.2
      - joint_name: elbow_joint
        position_rad: 1.0
      - joint_name: wrist_1_joint
        position_rad: -1.5
      - joint_name: wrist_2_joint
        position_rad: -1.3
      - joint_name: wrist_3_joint
        position_rad: 0.4
      planning_timeout_s: 2.0
      execution_timeout_s: 10.0
    children: []
    value_sources:
      velocity_scale:
        kind: program_parameter
        reference: pick_velocity_scale
  - node_id: scene.remove_object
    instance_id: remove_table
