api_version: manyforge.model_endpoint_profiles.v0
schema_version: "0.1.0"
# Reference catalog of model-endpoint profiles for the NemoClaw-Thor serving
# stack. A deployment selects one via `model_endpoints.<alias>.profile_ref`;
# the referenced profile becomes the base and the deployment's inline fields
# override it (capabilities deep-merge; every other field is replaced wholesale).
#
# Conventions (keep new entries consistent):
#   model_id   MUST equal the id the server exposes at /v1/models. On this stack
#              that is the serving profile name itself — NemoClaw-Thor
#              serving/config.sh sets THOR_MODEL_ID_DEFAULT == profile name, and
#              start-model.sh passes it as vLLM --served-model-name / llama.cpp
#              --alias. (vLLM additionally serves a static `cosmos-reason2-8b`
#              back-compat alias; llama.cpp/GGUF serves ONLY the profile name —
#              which is exactly why the assistant panel must read the live
#              /v1/models id, not this label, to know what is actually loaded.)
#   base_url   the local vllm-proxy (:8000) that fronts whichever model is
#              loaded. Deployments that route through the assistant bridge
#              override this with the bridge URL (:8100/v1/manyforge/assistant).
#   tool_call_family  the composer/bridge wire family — always openai_chat_tools
#              (the OpenAI chat-completions tools contract). The native vLLM
#              --tool-call-parser (gemma4 / hermes / qwen3_coder / qwen3_xml) is a
#              serving-layer detail the composer never sees.
#   supports_image_input  real multimodality only. FALSE for text-only profiles:
#              every GGUF/llama.cpp profile (served --no-mmproj) and every vLLM
#              profile launched --language-model-only.
profiles:
  # ───────────────────────────────────────────────────────────────────────
  # Legacy / referenced by the existing pick deployments — DO NOT REMOVE.
  # thor_manyforge_qwen36 is referenced by vision_guided_{pose,bin}_pick and
  # semantic_shape_pick; thor_cosmos_reason2_8b by those plus
  # assistant_modes_scene_authoring and isaac_manipulator_scene_light_assistant.
  # Removing either breaks `profile_ref` resolution in those deployments.
  # NOTE: thor_manyforge_qwen36's model_id is the pre-2026-05-31 production
  # Qwen profile, which has since been superseded in serving/config.sh by
  # qwen3.6-35b-a3b-nvfp4-nvidia (see thor_qwen36_35b_a3b_nvfp4 below).
  # ───────────────────────────────────────────────────────────────────────
  thor_manyforge_qwen36:
    provider: openai
    model_id: qwen3.6-35b-a3b-nvfp4-tq-mtp-manyforge
    base_url: http://127.0.0.1:8000/v1
    default_timeout_s: 30.0
    max_tokens: 512
    capabilities:
      supports_response_tools: true
      supports_json_object: true
      supports_image_input: true
      supported_image_transports: [inline_data_url, http_url]
      tool_call_family: openai_chat_tools

  thor_cosmos_reason2_8b:
    provider: openai
    model_id: cosmos-reason2-8b
    base_url: http://127.0.0.1:8000/v1
    default_timeout_s: 30.0
    max_tokens: 8192
    capabilities:
      supports_response_tools: true
      supports_json_object: true
      supports_image_input: true
      supported_image_transports: [inline_data_url, http_url]
      tool_call_family: openai_chat_tools

  thor_nemotron3_nano_omni:
