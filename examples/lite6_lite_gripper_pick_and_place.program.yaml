      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
parameters:
- parameter_id: acceleration_scale
  type: float64
  default: 1.0
  constraints:
    min_exclusive: 0.0
    max_inclusive: 1.0
  description: Acceleration scale for all Lite6 pick-and-place moves.
- parameter_id: blend_radius_m
  type: float64
  default: 0.0
  constraints:
    min_inclusive: 0.0
  description: Default Cartesian corner blend radius (m); 0 keeps exact corners.
- parameter_id: max_tcp_linear_speed_mps
  type: float64
  default: 0.15
  constraints:
    min_exclusive: 0.0
  description: Maximum TCP linear speed for all Lite6 pick-and-place moves.
- parameter_id: translation_tol_m
  type: float64
  default: 0.005
  constraints:
    min_exclusive: 0.0
  description: Default Cartesian translation tolerance for motion nodes.
- parameter_id: velocity_scale
  type: float64
  default: 0.4
  constraints:
    min_exclusive: 0.0
    max_inclusive: 1.0
  description: Velocity scale for all Lite6 pick-and-place moves.
tree:
