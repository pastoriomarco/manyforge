name: lite6_lite_gripper_pick_and_place
description: Basic ManyForge pick-and-place Program for UFACTORY Lite6 with its lite pneumatic gripper.
  It preserves the ManyMove-derived rest pose, source-local Lite6 joints and frames, primitive scene,
  relative pick motions, physical gripper commands, and carried-object attach/detach sequence.
catalog:
  api_version: manyforge.node_catalog.v3
  content_version: 3.0.0
compatibility:
  lanes:
  - manyforge-only
  assistant: forbidden
  requires:
  - lite_gripper
  tags:
  - lite6
  - pick-and-place
scene:
- scene_resource_id: graspable
  shape:
    type: box
    box_dimensions_m:
    - 0.06
    - 0.015
    - 0.015
  pose:
    frame_ref:
      kind: cell_frame
    position_m:
