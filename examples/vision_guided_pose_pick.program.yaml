api_version: manyforge.program.v3
program_id: vision_guided_pose_pick
program_revision: sha256:116d55f473a2e261127685ade85e9417a28935800a2d4b96ed829434ff190bfc
program_profile: composable-cell-v1
name: vision_guided_pose_pick
description: Preview Program for the typed vision-guided pose dataflow. A model response supplies bounded
  approach and grasp poses in the target base frame; motion nodes consume those fields directly. It remains
  intentionally fail-closed when a single-image model invents unreachable metric coordinates rather than
  grounding them in an authoritative pose source.
catalog:
  api_version: manyforge.node_catalog.v3
  content_version: 3.0.0
compatibility:
  lanes:
  - manyforge-only
  assistant: required
  requires:
  - vision_pose_inference
  tags:
  - ur5
  - vision-pick
scene:
- scene_resource_id: left_part
  shape:
    type: box
    box_dimensions_m:
    - 0.02
    - 0.02
    - 0.02
  pose:
    frame_ref:
      kind: component_frame
      frame:
        component_id: ur5_robot
        frame_id: base
    position_m:
    - 0.4
    - -0.14
    - 0.009
    orientation:
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
  resource_roles:
  - pick_candidate
- scene_resource_id: right_part
  shape:
    type: box
    box_dimensions_m:
    - 0.02
    - 0.02
    - 0.02
  pose:
    frame_ref:
      kind: component_frame
      frame:
        component_id: ur5_robot
        frame_id: base
    position_m:
    - 0.4
    - 0.14
    - 0.009
    orientation:
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
  resource_roles:
  - pick_candidate
- scene_resource_id: table
  shape:
    type: box
    box_dimensions_m:
    - 0.8
    - 0.6
    - 0.04
  pose:
    frame_ref:
      kind: component_frame
      frame:
        component_id: ur5_robot
        frame_id: base
    position_m:
    - 0.55
    - 0.0
    - -0.021
    orientation:
      xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
blackboard:
  namespaces:
  - namespace_id: perception
    owner: program
  keys:
  - key: gripper_closed
    type: bool
    access: read_write
    persistence: run
    description: Intentionally simulated gripper closed/open state.
  - key: perception.grasp_plan
    type: model_response
    access: read_write
    persistence: run
    fields:
    - field: approach_pose
      type: stored_pose
    - field: confidence
      type: float64
    - field: grasp_pose
      type: stored_pose
    - field: reason
      type: string
    - field: selected_object_id
      type: scene_resource
tree:
  node_id: sequence
  instance_id: vision_guided_pose_pick_cycle
  parameters: {}
  children:
  - node_id: assistant.query_model
    instance_id: infer_grasp_pose
    parameters:
      model_endpoint_alias: vision_model
      prompt_template_id: infer_grasp_pose_v1
      scene_attachment: snapshot_image
      output_key: perception.grasp_plan
      timeout_s: 90.0
      min_confidence: 0.7
      scene_snapshot_width: 640
      scene_snapshot_height: 480
      scene_snapshot_format: jpeg
    children: []
  - node_id: motion.move_to_pose
    instance_id: move_to_approach_pose
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      velocity_scale: 0.35
    children: []
    value_sources:
      goal:
        kind: blackboard_field
        reference: perception.grasp_plan
        field: approach_pose
  - node_id: motion.move_to_pose
    instance_id: move_to_grasp_pose
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      velocity_scale: 0.2
    children: []
    value_sources:
      goal:
        kind: blackboard_field
        reference: perception.grasp_plan
        field: grasp_pose
  - node_id: logic.set_value
    instance_id: close_gripper
    parameters:
      key: gripper_closed
      value: true
    children: []
  - node_id: motion.move_to_pose
    instance_id: retreat_after_grasp
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      target_mode: relative
      target_reference:
        type: component_frame
        frame:
          component_id: ur5_robot
          frame_id: tcp
      offset_reference:
        type: component_frame
        frame:
          component_id: ur5_robot
          frame_id: base
      goal:
        position_m:
        - 0.0
        - 0.0
        - 0.08
        orientation:
          rpy_deg:
          - 180.0
          - 0.0
          - -90.0
      velocity_scale: 0.35
    children: []
  - node_id: motion.move_to_pose
    instance_id: move_to_place_pose
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      goal:
        frame_ref:
          kind: target_frame
          frame:
            component_id: ur5_robot
            frame_id: base
        position_m:
        - 0.22
        - 0.0
        - 0.3
        orientation:
          rpy_deg:
          - 180.0
          - 0.0
          - -90.0
      velocity_scale: 0.35
    children: []
  - node_id: logic.set_value
    instance_id: open_gripper
    parameters:
      key: gripper_closed
      value: false
    children: []
