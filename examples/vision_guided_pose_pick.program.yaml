api_version: manyforge.program.v0
program_profile: v0.1
name: vision_guided_pose_pick
description: >-
  PREVIEW / FUTURE CAPABILITY — exercises the typed blackboard field-binding
  WIRING for vision-guided picking, not a working pick out of the box. A
  `query_model` node captures the live scene snapshot, returns validated
  `approach_pose` / `grasp_pose` in the base frame, and downstream
  `move_manipulator_action` nodes consume them through declared field refs.
  The pipeline runs end to end (verified 2026-06-11: cosmos-reason2-8b returns
  a structured, parsed, blackboard-bound grasp plan), but a single-image VLM
  cannot regress metric base-frame coordinates: it fabricates an unreachable
  target and IK fail-closes — by design, the system never moves to invented
  geometry. Production grounding will supply real object poses from privileged
  simulator state (Isaac Sim) or a dedicated 6D-pose model; the model's role is
  visual SELECTION and reasoning, never coordinate invention. Until then this
  scenario demonstrates the wiring and the fail-closed boundary only.
compatibility:
  lanes: [manyforge-only]
  assistant: required
  requires: [vision_pose_inference]
  tags: [vision-pick, ur5]
catalog_version: "0.5.0"

robot:
  robot_id: ur5
  group_id: arm
  base_frame: base_link
  tcp_frame: tool0

scene:
  - object_id: table
    shape:
      type: box
      box_dimensions_m: [0.8, 0.6, 0.04]
    pose:
      frame_id: base_link
      # x=0.45 put the near table edge at x=0.05, inside the UR5 base
      # cylinder -> "start state is already in collision: base_link_0 <->
      # table" the first time planning ever ran on this scenario (the model
      # node masked it until Day 6A finding F3 was fixed). x=0.55 clears the
      # base; both parts (x=0.40) remain on the tabletop.
      position_m: [0.55, 0.0, -0.021]
      orientation_xyzw: [0.0, 0.0, 0.0, 1.0]

  - object_id: left_part
    shape:
      type: box
      box_dimensions_m: [0.02, 0.02, 0.02]
    pose:
      frame_id: base_link
      position_m: [0.40, -0.14, 0.009]
      orientation_rpy_deg: [0.0, 0.0, 0.0]

  - object_id: right_part
    shape:
      type: box
      box_dimensions_m: [0.02, 0.02, 0.02]
    pose:
      frame_id: base_link
      position_m: [0.40, 0.14, 0.009]
      orientation_rpy_deg: [0.0, 0.0, 0.0]

blackboard:
  namespaces:
    - id: grasp_plan
      contract: query_model_output_v1
      prefix: perception/grasp_plan
      description: QueryModel grasp inference output namespace.
      fields:
        - name: selected_object_id
          type: string
        - name: approach_pose
          type: pose
        - name: grasp_pose
          type: pose
        - name: confidence
          type: float
        - name: reason
          type: string
  keys:
    - id: gripper_closed
      type: bool
      key: gripper_closed
      description: Simulated gripper closed/open flag.

tree:
  id: sequence
  name: vision_guided_pose_pick_cycle
  children:
    - id: query_model
      name: infer_grasp_pose
      params:
        model_endpoint_alias: vision_model
        prompt_template_id: infer_grasp_pose_v1
        output_key_prefix:
          namespace_ref: grasp_plan
        include_scene_snapshot: true
        scene_snapshot_width: 640
        scene_snapshot_height: 480
        scene_snapshot_format: jpeg
        # 5.0 was authored against a fast text recipe; a vision reasoning
        # model (cosmos-reason2-8b on Thor) needs image prefill + reasoning
        # tokens — a minimal 50-token describe call alone measures ~5 s warm.
        timeout_s: 90.0
        min_confidence: 0.70

    - id: move_manipulator_action
      name: move_to_approach_pose
      params:
        move_id: vlm_approach_pose
        motion_type: pose
        pose_goal:
          field_ref:
            namespace: grasp_plan
            field: approach_pose
        velocity_scale: 0.35

    - id: move_manipulator_action
      name: move_to_grasp_pose
      params:
        move_id: vlm_grasp_pose
        motion_type: pose
        pose_goal:
          field_ref:
            namespace: grasp_plan
            field: grasp_pose
        velocity_scale: 0.20

    - id: set_gripper_state
      name: close_gripper
      params:
        state_key:
          key_ref: gripper_closed
        state: closed

    - id: move_manipulator_action
      name: retreat_after_grasp
      params:
        move_id: vlm_retreat_pose
        motion_type: pose
        target_mode: relative
        target_reference:
          type: robot_link
          id: tool0
        offset_reference:
          type: frame
          id: base_link
        pose_goal:
          position_m: [0.0, 0.0, 0.08]
          orientation_rpy_deg: [180.0, 0.0, -90.0]
        velocity_scale: 0.35

    - id: move_manipulator_action
      name: move_to_place_pose
      params:
        move_id: vlm_place_pose
        motion_type: pose
        pose_goal:
          frame_id: base_link
          position_m: [0.22, 0.0, 0.30]
          orientation_rpy_deg: [180.0, 0.0, -90.0]
        velocity_scale: 0.35

    - id: set_gripper_state
      name: open_gripper
      params:
        state_key:
          key_ref: gripper_closed
        state: open
