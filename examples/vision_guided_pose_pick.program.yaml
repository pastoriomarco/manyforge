api_version: manyforge.program.v2
program_id: vision_guided_pose_pick
program_revision: sha256:af7865b6fec61066c39e574a61a799d7a68fe5653ea871c9875f5187154bbf85
program_profile: composable-cell-v1
name: vision_guided_pose_pick
description: Preview Program for the typed vision-guided pose dataflow. A model response supplies bounded
  approach and grasp poses in the target base frame; motion nodes consume those fields directly. It remains
  intentionally fail-closed when a single-image model invents unreachable metric coordinates rather than
  grounding them in an authoritative pose source.
catalog:
  api_version: manyforge.node_catalog.v2
  content_version: 2.9.0
compatibility:
  lanes:
  - manyforge-only
  assistant: required
  requires:
  - vision_pose_inference
  tags:
  - ur5
  - vision-pick
component_roles:
  robot:
    required_component_type_tags:
    - articulated-arm
    required_model_roles:
    - arm_model
target_roles:
  arm:
    component_role: robot
    required_capabilities:
    - capability_id: execution.feedback.phase_events
      parameters: {}
      disposition: required
    - capability_id: execution.trajectory.execute
      parameters: {}
      disposition: required
    - capability_id: planning.motion.pose_goal
      parameters: {}
      disposition: required
    - capability_id: planning.profile.balanced
      parameters: {}
      disposition: required
    - capability_id: planning.trajectory.time_parameterized
      parameters: {}
      disposition: required
    - capability_id: state.observed.current
      parameters: {}
      disposition: required
    - capability_id: validation.trajectory.non_collision
      parameters: {}
      disposition: required
    required_frame_roles:
    - base
    - tcp
    required_resource_roles:
    - arm_joints
    required_collision_body_roles:
    - arm_collision
    required_model_roles:
    - arm_model
scene:
- scene_resource_id: left_part
  shape:
    type: box
    box_dimensions_m:
    - 0.02
    - 0.02
    - 0.02
  pose:
    frame_ref:
      kind: component_frame
      component_role: robot
      model_role: arm_model
      frame_role: base
    position_m:
    - 0.4
    - -0.14
    - 0.009
    orientation:
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
  resource_roles:
  - pick_candidate
- scene_resource_id: right_part
  shape:
    type: box
    box_dimensions_m:
    - 0.02
    - 0.02
    - 0.02
  pose:
    frame_ref:
      kind: component_frame
      component_role: robot
      model_role: arm_model
      frame_role: base
    position_m:
    - 0.4
    - 0.14
    - 0.009
    orientation:
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
  resource_roles:
  - pick_candidate
- scene_resource_id: table
  shape:
    type: box
    box_dimensions_m:
    - 0.8
    - 0.6
    - 0.04
  pose:
    frame_ref:
      kind: component_frame
      component_role: robot
      model_role: arm_model
      frame_role: base
    position_m:
    - 0.55
    - 0.0
    - -0.021
    orientation:
      xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
blackboard:
  namespaces:
  - namespace_id: perception
    owner: program
  keys:
  - key: gripper_closed
    type: bool
    access: read_write
    persistence: run
    description: Intentionally simulated gripper closed/open state.
  - key: perception.grasp_plan
    type: model_response
    access: read_write
    persistence: run
    fields:
    - field: approach_pose
      type: stored_pose
    - field: confidence
      type: float64
    - field: grasp_pose
      type: stored_pose
    - field: reason
      type: string
    - field: selected_object_id
      type: scene_resource
tree:
  node_id: sequence
  instance_id: vision_guided_pose_pick_cycle
  parameters: {}
  children:
  - node_id: assistant.query_model
    instance_id: infer_grasp_pose
    parameters:
      model_endpoint_alias: vision_model
      prompt_template_id: infer_grasp_pose_v1
      scene_attachment: snapshot_image
      output_key: perception.grasp_plan
      timeout_s: 90.0
      min_confidence: 0.7
      scene_snapshot_width: 640
      scene_snapshot_height: 480
      scene_snapshot_format: jpeg
    children: []
  - node_id: motion.move_to_pose
    instance_id: move_to_approach_pose
    parameters:
      target_role: arm
      base_frame_role: base
      tcp_endpoint:
        kind: current
      velocity_scale: 0.35
    children: []
    value_sources:
      goal:
        kind: blackboard_field
        reference: perception.grasp_plan
        field: approach_pose
  - node_id: motion.move_to_pose
    instance_id: move_to_grasp_pose
    parameters:
      target_role: arm
      base_frame_role: base
      tcp_endpoint:
        kind: current
      velocity_scale: 0.2
    children: []
    value_sources:
      goal:
        kind: blackboard_field
        reference: perception.grasp_plan
        field: grasp_pose
  - node_id: logic.set_value
    instance_id: close_gripper
    parameters:
      key: gripper_closed
      value: true
    children: []
  - node_id: motion.move_to_pose
    instance_id: retreat_after_grasp
    parameters:
      target_role: arm
      base_frame_role: base
      tcp_endpoint:
        kind: current
      target_mode: relative
      target_reference:
        type: frame_role
        frame_role_id: tcp
      offset_reference:
        type: frame_role
        frame_role_id: base
      goal:
        position_m:
        - 0.0
        - 0.0
        - 0.08
        orientation:
          rpy_deg:
          - 180.0
          - 0.0
          - -90.0
      velocity_scale: 0.35
    children: []
  - node_id: motion.move_to_pose
    instance_id: move_to_place_pose
    parameters:
      target_role: arm
      base_frame_role: base
      tcp_endpoint:
        kind: current
      goal:
        frame_ref:
          kind: target_frame
          target_role: arm
          frame_role: base
        position_m:
        - 0.22
        - 0.0
        - 0.3
        orientation:
          rpy_deg:
          - 180.0
          - 0.0
          - -90.0
      velocity_scale: 0.35
    children: []
  - node_id: logic.set_value
    instance_id: open_gripper
    parameters:
      key: gripper_closed
      value: false
    children: []
