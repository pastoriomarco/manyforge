api_version: manyforge.deployment.v0
schema_version: 0.2.0
name: isaac_manipulator_scene_light_ros2_control_collision
description: 'Isaac Sim preview deployment for the saved light manipulator scene.
  Planning and scene validation stay on RoboPlan; execution is delegated to a ROS
  2 FollowJointTrajectory arm controller exposed by Isaac Sim through a topic_based_ros2_control
  bridge. Robotiq commands use the standard control_msgs/GripperCommand action; the
  Isaac-specific bridge is the only component that publishes the simulator''s raw
  gripper JointState command topic.

  '
program_profile: v0.1
robot_config:
  robot_id: ur10e
  group_id: arm
  urdf_path: package://manyforge_example_models/models/ur10e_robotiq_2f_140/ur10e_robotiq_2f_140.urdf
  srdf_path: package://manyforge_example_models/models/ur10e_robotiq_2f_140/ur10e_robotiq_2f_140.srdf
  package_paths:
  - ..
  global_max_tcp_linear_speed_mps: 0.25
grasp_risk_policy:
  open_loop_grasp:
    allowed: true
    scope: simulation
    rationale: Isaac collision preview attaches objects after gripper command completion
      without an independent grasp confirmation source.
grippers:
  primary:
    command_mode: ros_gripper_command
    group_id: gripper
    joint_name: finger_joint
    motion_time_s: 0.8
    description: Robotiq 2F-140 command through the standard ROS GripperCommand action.
    touch_links:
    - robotiq_base_link
    - left_outer_knuckle
    - left_outer_finger
    - left_inner_knuckle
    - left_inner_finger
    - left_inner_finger_pad
    - right_outer_knuckle
    - right_outer_finger
    - right_inner_knuckle
    - right_inner_finger
    - right_inner_finger_pad
    mount_frame: tool0
    attach_frame: grasp_frame
    tcp_frame: grasp_frame
    auxiliary_frames:
    - gripper_frame
    actuation_kind: position_commanded
    state_authority: sim_observed
    completion_policy: position_reached
    grasp_confirmation_policy: none_open_loop
    open_state_ref: open
    closed_state_ref: closed
    transport:
      kind: ros_gripper_command
      action_name: /robotiq_gripper_controller/gripper_cmd
      result_timeout_s: 15.0
      position_tolerance: 0.04
adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - planning.motion.joint_goal
    - planning.motion.pose_goal
    - planning.motion.cartesian_path
    - planning.profile.first_feasible
    - planning.profile.balanced
    - planning.profile.quality_bounded
    - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - context.state.current
    - context.validation.trajectory
    - context.collision.check
    - context.collision.check.detailed
    - execution.contact.geometric
    - execution.contact.geometric_signed_penetration
    - context.kinematics.fk
    - context.limits.joint
    - context.pose.resolve_reference
    - context.scene.object_query
    - scene.shape.box
    - scene.shape.sphere
    - scene.shape.cylinder
    - scene.shape.mesh
    - scene.edit.add
    - scene.edit.upsert
    - scene.edit.remove
    - scene.edit.update_pose
    - scene.edit.attach_detach
    - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.ros2_control_follow_joint_trajectory
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - execution.trajectory.execute
    - execution.feedback.phase_events
    - execution.feedback.state_snapshots
    - execution.stop.soft
    - execution.pause
    - execution.resume
    - execution.reset
    - tool.gripper.command
    - tool.gripper.feedback
    config:
      action_name: /isaac_arm_controller/follow_joint_trajectory
      arm_action: /isaac_arm_controller/follow_joint_trajectory
      execution_state_authority_profile: commanded_sim
      execution_state_source_mode: commanded_sim
      single_shot_ik_timeout_s: 0.05
      require_fresh_state_before_planning: false
      command_gate_topic: /manyforge/isaac_arm_command_enable
      reset_to_initial_on_load: true
      sim_reset_motion_duration_s: 0
      joint_state_topic: /joint_states
      controller_state_topic: /isaac_arm_controller/controller_state
      controller_manager: /controller_manager
      required_joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      decelerate_on_cancel: true
      velocity_state_interface_joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      max_deceleration_on_cancel_rad_s2:
        shoulder_pan_joint: 10
        shoulder_lift_joint: 10
        elbow_joint: 10
        wrist_1_joint: 10
        wrist_2_joint: 10
        wrist_3_joint: 10
      initial_joint_positions_rad:
      - 2.63422544
      - -0.875980752
      - 1.551074106
      - -2.29231544
      - -1.560498884
      - -2.038544566
      joint_state_max_age_ms: 250
      wait_for_state_timeout_s: 1
      enable_soft_on_path_path_ramp: true
      soft_on_path_sample_period_s: 0.01
      soft_on_path_stop_traj_delta_s: 0.1
      soft_on_path_max_jerk_rad_s3:
        shoulder_pan_joint: 50
        shoulder_lift_joint: 50
        elbow_joint: 50
        wrist_1_joint: 50
        wrist_2_joint: 50
        wrist_3_joint: 50
      operator_stop_profile:
        profile_id: operator_soft_on_path
        stop_mode: soft_on_path
        deceleration_time_s: 1
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10
          shoulder_lift_joint: 10
          elbow_joint: 10
          wrist_1_joint: 10
          wrist_2_joint: 10
          wrist_3_joint: 10
        require_backend_confirmation: true
        allow_natural_completion_on_short_path: true
      default_fault_stop_profile:
        profile_id: fault_spring_back_hold
        stop_mode: spring_back_hold
        deceleration_time_s: 1
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10
          shoulder_lift_joint: 10
          elbow_joint: 10
          wrist_1_joint: 10
          wrist_2_joint: 10
          wrist_3_joint: 10
        require_backend_confirmation: true
      wait_for_action_server_timeout_s: 2
      stop_completion_timeout_s: 0.5
      start_tolerance_rad: 0.15
      final_tolerance_rad: 0.15
      tracking_error_tolerance_rad: 0.05
      tracking_error_timeout_s: 0
      disable_controller_path_tolerances: true
      controller_result_timeout_s: 30
      gripper:
        action_name: /robotiq_gripper_controller/gripper_cmd
        wait_for_action_server_timeout_s: 2
        result_timeout_s: 15
orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 100
    runtime_collision_immediate_query_budget_ms: 75.0
    runtime_collision_lookahead_query_budget_ms: 75.0
    runtime_collision_lookahead_cycle_budget_ms: 350.0
    runtime_collision_lookahead_s: 2.0
    runtime_collision_lookahead_max_samples: 32
    runtime_collision_lookahead_workers: 4
    runtime_dynamic_body_max_age_cap_ms: 750
    validation_collision_workers: 4
launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true
compatibility:
  lane: isaac-sim
  provides:
  - ros2_control
  - robotiq_2f_140_gripper
  tags:
  - runtime-collision
  - isaac-sim
  - ur10e
  - robotiq
  scenarios:
  - name: isaac-ur10e-light-scene-collision
    program: isaac_manipulator_scene_light_collision.program.yaml
    description: Isaac UR10e light scene with a transient runtime obstacle
    aliases: []
pose_sources:
- id: isaac_scene_objects
  kind: simulation_interfaces
  enabled: true
  max_update_hz: 4.0
  stale_after_s: 2.0
  objects:
    isaac_cheese_box:
      apply_policy: continuous_unattached
      entity: /mac_n_cheese_centered
      measured_state_ghost:
        enabled: true
        robot_tcp: true
        object: true
        opacity: 0.5
      measured_attachment_baseline:
        capture: on_attach_or_first_paired_sample
        require_same_time_robot_tcp: true
      attached_drift_monitor:
        enabled: true
        debounce_s: 0.1
        stale_behavior: fault
        action: diagnostic_only
        signal_id: attached_object_drift/isaac_cheese_box
        confirmation_signal_id: attached_object_grasp_confirmed/isaac_cheese_box
        sample_time_tolerance_s: 0.05
        translation_threshold_m: 0.02
        rotation_threshold_rad: 0.2
      scene_admission:
        role: snapshot_obstacle
        allow_runtime_dynamic_obstacle: false
        lease_max_age_s: 2.0
  frame_id: universe
  description: Isaac Sim entity poses for scene objects that can move between plans.
  measured_tcp:
    entity: /World/ur10e_robotiq2f_140_ROS/ur10e_robotiq2f_140/ee_link/robotiq_arg2f_base_link
    tcp_frame_id: grasp_frame
    frame_id: universe
    entity_to_tcp:
      position_xyz: [0.0, 0.0, 0.2]
      orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  measured_robot:
    joint_state_topic: /isaac_joint_states
simulation_control:
  kind: ros2_simulation_interfaces
  service_prefix: auto
  service_timeout_s: 10.0
  capabilities:
    reset: true
    pause: true
    play: true
    step: true
    set_entity_state: true
  reset:
    default_scope: state
    close_command_gate: true
    wait_ready_s: 3.0
    resume_play_after_reset: true
