api_version: manyforge.deployment.v0
schema_version: "0.1.0"
name: ur10e_robotiq_assistant_modes_scene_authoring
description: >-
  Local deployment fixture for v0.1 assistant-mode catalog plumbing on the
  UR10e + Robotiq 2F-140 preview stack. It keeps the deterministic
  scene-authoring provider enabled while declaring the finite tools visible to
  query and composer-assistant requests.

program_profile: v0.1

robot_config:
  robot_id: ur10e
  group_id: arm
  urdf_path: package://manyforge_example_models/models/ur10e_robotiq_2f_140/ur10e_robotiq_2f_140.urdf
  srdf_path: package://manyforge_example_models/models/ur10e_robotiq_2f_140/ur10e_robotiq_2f_140.srdf
  package_paths:
    - ..
  global_max_tcp_linear_speed_mps: 0.25

grippers:
  primary:
    command_mode: simulated_joint
    group_id: gripper
    joint_name: finger_joint
    open_position: 0.0
    closed_position: 0.66
    motion_time_s: 0.8
    touch_links:
      - left_inner_finger
      - right_inner_finger
      - left_inner_finger_pad
      - right_inner_finger_pad
    mount_frame: tool0
    attach_frame: grasp_frame
    tcp_frame: grasp_frame
    auxiliary_frames:
      - gripper_frame
    description: Native simulated Robotiq 2F-140 finger actuation.

adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - planning.motion.joint_goal
      - planning.motion.pose_goal
      - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - context.kinematics.fk
      - context.pose.resolve_reference
      - context.scene.object_query
      - context.limits.joint
      - scene.shape.box
      - scene.shape.sphere
      - scene.edit.add
      - scene.edit.upsert
      - scene.edit.remove
      - scene.edit.update_pose
      - scene.edit.attach_detach
      - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.roboplan_native
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - execution.trajectory.execute
      - execution.feedback.phase_events
      - execution.feedback.state_snapshots
      - execution.stop.soft
      - execution.pause
      - execution.resume
      - execution.reset
      - tool.gripper.command
      - tool.gripper.feedback
    config:
      mode: simulated
      execution_tick_hz: 100
      initial_joint_positions_rad: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]

orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 10.0

launch:
  ros_wrapper_nodes: []
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true

model_audit_policy:
  store_full_prompts: false
  store_full_responses: false
  redact_argument_values: true

model_endpoint_profile_registry: model_endpoint_profiles.yaml

model_endpoints:
  assistant_model:
    profile_ref: thor_nemotron3_nano_omni
    provider: nemoclaw
    base_url: http://127.0.0.1:8100/v1/manyforge/assistant
    default_timeout_s: 180.0
    max_tokens: 32768
    capabilities:
      supports_response_tools: true
      supports_json_object: true
      supports_image_input: true
      supported_image_transports: [inline_data_url, http_url]
      tool_call_family: qwen3_coder

assistant:
  provider: nemoclaw
  endpoint_alias: assistant_model
  enabled: true

assistant_modes:
  query:
    enabled: true
    description: Read-only inspection mode for assistant questions.
    authority:
      session_kind: not_applicable
      approval_mode: human_approved
      review: not_required
    catalog:
      skills: []
      tools:
        - program.read
        - scene.inspect
        - inspect_isaac_scene
      nodes: []
  composer-assistant:
    enabled: true
    description: Offline scene-authoring proposal mode for Composer.
    authority:
      session_kind: not_applicable
      approval_mode: human_approved
      review: required
    catalog:
      skills: []
      tools:
        # A read-write mode must be a strict superset of the read-only
        # tools in `query`, otherwise the assistant can edit the program
        # tree but not read it — the model then loops trying to call
        # program.read (the obvious tool name from training data) and
        # times out the run. Keep this list aligned with `query.tools`.
        - program.read
        - catalog.read
        - skills.read
        - deployment.capabilities.read
        - scene.inspect
        - inspect_isaac_scene
        - propose_scene_objects
        - propose_scene_object_nodes
        - scene.draft.add_object
        - scene.draft.update_object
        - scene.draft.upsert_objects
        - scene.draft.remove_objects
        - tree.draft.insert_node
        - tree.draft.update_node_params
        - tree.draft.delete_node
        - tree.draft.move_node
        - tree.draft.replace_subtree
        - tree.draft.wrap_node
        - program.draft.upsert_parameters
        - program.draft.remove_parameters
        - blackboard.draft.upsert_namespaces
        - blackboard.draft.remove_namespaces
        - blackboard.draft.upsert_keys
        - blackboard.draft.remove_keys
      nodes:
        - attach_object_to_link
        - detach_object_from_link
        - add_collision_object
        - remove_collision_object
        - upsert_collision_object
        - update_collision_object_pose
        - sequence
        - fallback
        - parallel
        - repeat
        - retry
        - inverter

tool_catalog:
  - id: catalog.read
    effect: read_only
    description: Read legal node catalog entries and parameter metadata.
  - id: skills.read
    effect: read_only
    description: Read legal skill catalog entries and required capabilities/tools.
  - id: deployment.capabilities.read
    effect: read_only
    description: Read the active deployment capability keys by adapter family.
  - id: program.read
    effect: read_only
    description: Read the loaded Composer program/session state.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
  - id: scene.inspect
    effect: read_only
    description: Read current backend scene state, including object poses and attachment status.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
  - id: inspect_isaac_scene
    effect: read_only
    description: Inspect the current simulator scene snapshot.
    input_schema:
      type: object
      properties:
        includeSubtrees:
          type: array
          items:
            type: string
        excludeSubtrees:
          type: array
          items:
            type: string
        probePrims:
          type: array
          items:
            type: string
        outputProfile:
          type: string
          enum:
            - llm_scene_authoring
            - raw_inventory
      additionalProperties: false
  - id: propose_scene_objects
    effect: proposal
    description: Propose reviewable scene-resource additions from simulator objects.
    input_schema:
      type: object
      required:
        - inspectionReport
      properties:
        inspectionReport:
          type: object
        sourceRoots:
          type: array
          items:
            type: string
        objectIdPrefix:
          type: string
      additionalProperties: false
  - id: propose_scene_object_nodes
    effect: proposal
    description: Propose reviewable Composer scene nodes from simulator objects.
    input_schema:
      type: object
      required:
        - sceneResources
        - operations
      properties:
        sceneResources:
          type: array
          items:
            type: object
        operations:
          type: array
          items:
            type: string
            enum:
              - add_collision_object
              - upsert_collision_object
              - remove_collision_object
              - attach_object_to_link
              - detach_object_from_link
        linkFrame:
          type: string
        gripperId:
          type: string
      additionalProperties: false
  - id: scene.draft.add_object
    effect: composer_draft_mutating
    description: |
      [SCOPE: scene_resource | TIMING: compile-time]
      Add a STATIC scene object to the program's scene resources. The added
      object exists for the entire program run. Use this for permanent
      collision objects (walls, fixtures, environment).

      Do NOT use this to add an object DURING runtime execution at a specific
      point in the cycle (e.g., 'at the end of the cycle, add X' or 're-add X
      after each iteration'). For runtime scene mutation, insert an
      `add_collision_object` BT node via `tree.draft.insert_node` instead.

      Send objectId, shapeType, size/radius/diameter, and position directly;
      legacy sceneResource wrappers are also accepted.
    input_schema:
      type: object
      required:
        - objectId
      additionalProperties: true
      properties:
        objectId:
          type: string
          minLength: 1
        shapeType:
          type: string
          enum:
            - box
            - sphere
          description: Convenience alias for shape.type.
        shape_type:
          type: string
          enum:
            - box
            - sphere
          description: Convenience alias for shape.type.
        size:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Box dimensions [x, y, z] in meters.
        dimensions:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Box dimensions [x, y, z] in meters.
        radius:
          type: number
          description: Sphere radius in meters.
        diameter:
          type: number
          description: Sphere diameter in meters; callback converts to radius.
        position:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Object position [x, y, z] in the backend world frame.
        frameId:
          type: string
          enum:
            - universe
            - world
            - World
            - /World
          description: Common world-frame aliases accepted for detached Composer draft objects; the callback normalizes these to the active backend's canonical scene frame. Use attach_object_to_link or detach_object_from_link tree nodes for attachment semantics.
        sceneResource:
          type: object
          description: Legacy wrapper form accepted for compatibility.
          additionalProperties: true
        forceDiscardOverrides:
          type: boolean
  - id: scene.draft.update_object
    effect: composer_draft_mutating
    description: |
      [SCOPE: scene_resource | TIMING: compile-time]
      Replace a STATIC scene object's shape/pose. For runtime mutation of
      object pose during execution, use the `update_collision_object_pose` BT
      node via `tree.draft.insert_node` instead.
  - id: scene.draft.upsert_objects
    effect: composer_draft_mutating
    description: |
      [SCOPE: scene_resource | TIMING: compile-time]
      Insert or replace STATIC scene objects. For runtime mutation, use the
      `upsert_collision_object` BT node via `tree.draft.insert_node` instead.
  - id: scene.draft.remove_objects
    effect: composer_draft_mutating
    description: |
      [SCOPE: scene_resource | TIMING: compile-time]
      Remove STATIC scene objects from the program's scene resources. The
      objects no longer exist for any cycle iteration.

      Do NOT use this to remove an object DURING runtime execution at a
      specific point in the cycle (e.g., 'at the end of the cycle, remove X').
      For runtime scene mutation, insert a `remove_collision_object` BT node
      via `tree.draft.insert_node` instead.
  - id: tree.draft.insert_node
    effect: composer_draft_mutating
    description: |
      [SCOPE: behavior_tree | TIMING: runtime per cycle]
      Insert a behavior-tree node into the program tree. Use this for any
      action the robot/program should perform DURING execution at a specific
      point in the cycle, including runtime scene mutations:
      - `add_collision_object` to add an object during runtime
      - `remove_collision_object` to remove an object during runtime
      - `upsert_collision_object` to insert-or-replace an object during runtime
      - `update_collision_object_pose` to move an object during runtime
      - `attach_object_to_link` / `detach_object_from_link` for grasping
      - control-flow: sequence, fallback, parallel, repeat, retry, inverter
      Phrases like 'at the end of the cycle', 'after each iteration', 'when X
      happens during execution' are clear signals to use this tool, not
      scene.draft.*.
  - id: tree.draft.update_node_params
    effect: composer_draft_mutating
    description: Update parameters on an existing draft tree node.
  - id: tree.draft.delete_node
    effect: composer_draft_mutating
    description: Delete an existing non-root draft tree node and its subtree.
  - id: tree.draft.move_node
    effect: composer_draft_mutating
    description: Move an existing draft tree node under another parent.
  - id: tree.draft.replace_subtree
    effect: composer_draft_mutating
    description: Replace an existing draft tree subtree with a validated subtree.
  - id: tree.draft.wrap_node
    effect: composer_draft_mutating
    description: |
      Wrap an existing behavior-tree node with a new parent (decorator or
      control-flow). The target becomes the wrapper's only child, preserving
      the target's full subtree. Wrapping the root produces a new root. Pass
      targetName="@root" to wrap the current root without needing to know its
      name.

      wrapper.id MUST be a literal node-catalog id like 'repeat', 'sequence',
      'fallback', 'parallel', 'retry', 'inverter'. Do NOT invent variants like
      'repeat_root' or 'repeat_node' — those will be rejected.

      The wrapper MUST NOT include `children` — the handler inserts the
      target's existing subtree as the wrapper's only child.
  - id: program.draft.upsert_parameters
    effect: composer_draft_mutating
    description: Insert or replace program parameter declarations in the Composer draft.
  - id: program.draft.remove_parameters
    effect: composer_draft_mutating
    description: Remove existing program parameter declarations from the Composer draft.
  - id: blackboard.draft.upsert_namespaces
    effect: composer_draft_mutating
    description: Insert or replace blackboard namespace declarations in the Composer draft.
  - id: blackboard.draft.remove_namespaces
    effect: composer_draft_mutating
    description: Remove existing blackboard namespace declarations from the Composer draft.
  - id: blackboard.draft.upsert_keys
    effect: composer_draft_mutating
    description: Insert or replace blackboard key declarations in the Composer draft.
  - id: blackboard.draft.remove_keys
    effect: composer_draft_mutating
    description: Remove existing blackboard key declarations from the Composer draft.
