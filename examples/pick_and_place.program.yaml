api_version: manyforge.program.v0
program_profile: v0.1
name: pick_and_place_demo
description: "Pick-and-place demo with UR5 + RoboPlan: approach/pick/retreat/drop\
  \ sequence using backend-resolved relative pick goals, collision-aware motion planning\
  \ (RRT + TOPPRA), gripper simulation, and cache invalidation. Sequence follows manymove\
  \ pattern: approach \u2192 pick \u2192 retreat \u2192 approach drop \u2192 drop\
  \ \u2192 retreat \u2192 rest."
catalog_version: "0.2.0"
robot:
  robot_id: ur5
  group_id: arm
  base_frame: base_link
  tcp_frame: tool0
scene:
- object_id: ground
  shape:
    type: box
    box_dimensions_m:
    - 1
    - 1
    - 0.2
  pose:
    frame_id: universe
    position_m:
    - 0
    - 0
    - -0.11
    orientation_rpy_deg:
    - 0
    - 0
    - 0
- object_id: graspable
  shape:
    type: box
    box_dimensions_m:
    - 0.1
    - 0.01
    - 0.01
  pose:
    frame_id: universe
    position_m:
    - 0.3
    - -0.3
    - 0.15
    orientation_rpy_deg:
    - 0
    - 0
    - -45
parameters:
- name: velocity_scale
  type: float
  default: 0.5
  constraints:
    min_exclusive: 0
    max_inclusive: 1
  description: Velocity scale for all moves.
blackboard:
  namespaces: []
  keys:
  - id: gripper_closed
    type: bool
    key: gripper_closed
    description: Simulated gripper closed/open flag.
tree:
  id: sequence
  name: pick_and_place
  children:
  - id: move_manipulator_action
    name: move_to_pick_approach
    params:
      move_id: pick_approach
      motion_type: relative_move
      relative_move:
        target_reference:
          type: object
          id: graspable
        offset:
          position_m:
          - 0
          - 0
          - 0.1
          orientation_rpy_deg:
          - 180
          - 0
          - -90
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: move_manipulator_action
    name: move_to_pick
    params:
      move_id: pick_down
      motion_type: relative_move
      relative_move:
        target_reference:
          type: object
          id: graspable
        offset:
          position_m:
          - 0
          - 0
          - 0.05
          orientation_rpy_deg:
          - 180
          - 0
          - -90
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: set_gripper_state
    name: close_gripper
    params:
      state_key:
        key_ref: gripper_closed
      state: closed
  - id: attach_object_to_link
    name: attach_graspable
    params:
      object_id: graspable
      link_frame: tool0
  - id: move_manipulator_action
    name: pick_retreat
    params:
      move_id: pick_retreat
      motion_type: relative_move
      relative_move:
        target_reference:
          type: robot_link
          id: tool0
        offset:
          position_m:
          - 0
          - 0
          - -0.05
          orientation_rpy_deg:
          - 0
          - 0
          - 0
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: reset_trajectories
    name: invalidate_after_pick
  - id: move_manipulator_action
    name: move_to_drop_approach
    params:
      move_id: drop_approach
      motion_type: relative_move
      relative_move:
        target_reference:
          type: pose
          pose:
            position_m:
            - 0.3
            - 0.3
            - 0.2
            orientation_rpy_deg:
            - 180
            - 0
            - -90
        offset_reference:
          type: frame
          id: base_link
        offset:
          position_m:
          - 0
          - 0
          - 0.05
          orientation_rpy_deg:
          - 180
          - 0
          - -90
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: move_manipulator_action
    name: move_to_drop
    params:
      move_id: drop_down
      motion_type: pose_goal
      pose_goal:
        frame_id: base_link
        position_m:
        - 0.3
        - 0.3
        - 0.2
        orientation_rpy_deg:
        - 180
        - 0
        - -90
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: set_gripper_state
    name: open_gripper
    params:
      state_key:
        key_ref: gripper_closed
      state: open
  - id: detach_object_from_link
    name: detach_graspable
    params:
      object_id: graspable
      link_frame: tool0
  - id: move_manipulator_action
    name: drop_retreat
    params:
      move_id: drop_retreat
      motion_type: relative_move
      relative_move:
        target_reference:
          type: pose
          pose:
            position_m:
            - 0.3
            - 0.3
            - 0.2
            orientation_rpy_deg:
            - 180
            - 0
            - -90
        offset_reference:
          type: frame
          id: base_link
        offset:
          position_m:
          - 0
          - 0
          - 0.05
          orientation_rpy_deg:
          - 180
          - 0
          - -90
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: reset_trajectories
    name: invalidate_after_drop
  - id: move_manipulator_action
    name: return_rest
    params:
      move_id: return_rest
      motion_type: joint_goal
      joint_goal_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      joint_goal_positions_rad:
      - 0
      - -1.57
      - 1.57
      - -1.57
      - -1.57
      - 0
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
    modification_policy:
      runtime_override: human_approval
      persistent_edit: human_approval
