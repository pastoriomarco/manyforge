api_version: manyforge.deployment.v0
schema_version: 0.2.0
name: lite6_fixed_pneumatic_commissioning
description: >-
  Portable physical-Lite6 commissioning template. It is not directly
  loadable: the real-robot resolver binds the generated model, exact
  controller, lifecycle-provider generation, and retained runtime evidence.
compatibility:
  lane: real-robot
  provides: [ros2_control]
  tags: [commissioning, lite6, real-robot]
  scenarios: []
program_profile: v0.1
robot_config:
  robot_id: lite6-a
  group_id: lite6
  urdf_path: __MANYFORGE_RESOLVED_MODEL_URDF__
  srdf_path: __MANYFORGE_RESOLVED_MODEL_SRDF__
  package_paths:
    - __MANYFORGE_RESOLVED_XARM_PACKAGE_ROOT__
  # Absolute planning caps for attended commissioning. The UI velocity scale
  # can only reduce these; it cannot raise them.
  robot_control_joint_limits:
    joint1: {max_velocity_rad_s: 0.1, max_acceleration_rad_s2: 0.2}
    joint2: {max_velocity_rad_s: 0.1, max_acceleration_rad_s2: 0.2}
    joint3: {max_velocity_rad_s: 0.1, max_acceleration_rad_s2: 0.2}
    joint4: {max_velocity_rad_s: 0.1, max_acceleration_rad_s2: 0.2}
    joint5: {max_velocity_rad_s: 0.1, max_acceleration_rad_s2: 0.2}
    joint6: {max_velocity_rad_s: 0.1, max_acceleration_rad_s2: 0.2}
adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: 0.1.0
    supported_profiles: [v0.1]
    capability_keys:
      - planning.motion.joint_goal
      - planning.motion.pose_goal
      - planning.motion.cartesian_path
      - planning.profile.first_feasible
      - planning.profile.balanced
      - planning.profile.quality_bounded
      - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: 0.1.0
    supported_profiles: [v0.1]
    capability_keys:
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - context.collision.check.detailed
      - execution.contact.geometric
      - execution.contact.geometric_signed_penetration
      - context.kinematics.fk
      - context.limits.joint
      - context.pose.resolve_reference
      - context.scene.object_query
      - scene.shape.box
      - scene.shape.sphere
      - scene.shape.cylinder
      - scene.shape.mesh
      - scene.edit.add
      - scene.edit.upsert
      - scene.edit.remove
      - scene.edit.update_pose
      - scene.edit.attach_detach
      - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.ros2_control_follow_joint_trajectory
    adapter_version: 0.1.0
    supported_profiles: [v0.1]
    capability_keys:
      - execution.trajectory.execute
      - execution.feedback.phase_events
      - execution.feedback.state_snapshots
      - execution.stop.soft
      - execution.reset
    config:
      resolution_marker: __MANYFORGE_SUPERVISED_RUNTIME_BINDING__
      enable_soft_on_path_path_ramp: true
      soft_on_path_sample_period_s: 0.01
      soft_on_path_stop_traj_delta_s: 0.1
      soft_on_path_max_jerk_rad_s3:
        joint1: 20.0
        joint2: 20.0
        joint3: 20.0
        joint4: 20.0
        joint5: 20.0
        joint6: 20.0
      operator_stop_profile:
        profile_id: lite6_commissioning_operator_soft_on_path
        stop_mode: soft_on_path
        deceleration_time_s: 1.0
        allow_natural_completion_on_short_path: true
        per_joint_max_deceleration_rad_s2:
          joint1: 10.0
          joint2: 10.0
          joint3: 10.0
          joint4: 10.0
          joint5: 10.0
          joint6: 10.0
      default_fault_stop_profile:
        profile_id: lite6_commissioning_fault_spring_back_hold
        stop_mode: spring_back_hold
        deceleration_time_s: 2.0
        per_joint_max_deceleration_rad_s2:
          joint1: 10.0
          joint2: 10.0
          joint3: 10.0
          joint4: 10.0
          joint5: 10.0
          joint6: 10.0
      start_tolerance_rad: 0.01
      final_tolerance_rad: 0.01
      tracking_error_tolerance_rad: 0.05
      tracking_error_timeout_s: 0.25
      controller_result_timeout_s: 30
orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 50
launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true
