api_version: manyforge.program.v2
program_id: isaac_manipulator_scene_light
program_revision: sha256:b635c557d3a9c6dccc85540a2cde9c41f54da689647c4081f5ca2dbd46fb0154
program_profile: composable-cell-v1
name: isaac_manipulator_scene_light
description: >-
  Retained Isaac Sim light-scene pick-and-place Program for the UR10e and
  Robotiq 2F-140. It preserves the exact authored meshes and poses, typed
  simulator play/reset/pause lifecycle, observed-scene planning, physical
  gripper commands, carried-object transitions, and retained-world rest pose.
catalog:
  api_version: manyforge.node_catalog.v2
  content_version: 2.4.0
compatibility:
  lanes: [isaac-sim]
  assistant: optional
  requires: [robotiq_2f_140_gripper, ros2_control]
  tags: [isaac-sim, pick-and-place, robotiq, ur10e]
component_roles:
  robot:
    required_component_type_tags: [articulated-arm]
    required_model_roles: [arm_model]
  tool:
    required_component_type_tags: [gripper]
target_roles:
  arm:
    component_role: robot
    required_capabilities:
      - capability_id: execution.feedback.phase_events
        parameters: {}
        disposition: required
      - capability_id: execution.trajectory.execute
        parameters: {}
        disposition: required
      - capability_id: planning.motion.joint_goal
        parameters: {}
        disposition: required
      - capability_id: planning.motion.pose_goal
        parameters: {}
        disposition: required
      - capability_id: planning.profile.balanced
        parameters: {}
        disposition: required
      - capability_id: planning.trajectory.time_parameterized
        parameters: {}
        disposition: required
      - capability_id: state.observed.current
        parameters: {}
        disposition: required
      - capability_id: validation.trajectory.non_collision
        parameters: {}
        disposition: required
    required_frame_roles: [base, tcp]
    required_resource_roles: [arm_joints]
    required_collision_body_roles: [arm_collision]
    required_model_roles: [arm_model]
  gripper:
    component_role: tool
    required_capabilities:
      - capability_id: model.kinematics.fk
        parameters: {}
        disposition: required
      - capability_id: tool.gripper.command
        parameters: {}
        disposition: required
      - capability_id: tool.gripper.feedback
        parameters: {}
        disposition: required
    required_frame_roles: [tcp]
    required_resource_roles: [fingers]
    required_collision_body_roles: [gripper_collision]
scene:
  - scene_resource_id: isaac_cheese_box
    shape:
      type: mesh
      mesh_resource_uri: examples/isaac_manipulator_scene_light/meshes/mac_n_cheese_centered_collider_cooked.obj
      mesh_scale: [1.0, 1.0, 1.0]
    pose:
      frame_ref: {kind: cell_frame}
      position_m: [-0.455038, 0.076595, 0.087827]
      orientation: {rpy_deg: [92.340746, -1.76826, -90.093258]}
    resource_roles: [pick_object]
    metadata:
      support_contacts:
        - support_object_id: isaac_table_low_327
          mode: contact_release
          release_evidence_mode: binary_contact
          enforce_max_start_penetration: false
          max_start_penetration_m: 0.0
          release_tolerance_m: 0.0
          min_release_progress_m: 0.0
          require_separation_by_end: true
          require_strictly_decreasing_penetration: false
          allow_recontact: false
  - scene_resource_id: isaac_small_klt
    shape:
      type: mesh
      mesh_resource_uri: examples/isaac_manipulator_scene_light/meshes/World__small_KLT_collider_primitives.obj
      mesh_scale: [1.0, 1.0, 1.0]
    pose:
      frame_ref: {kind: cell_frame}
      position_m: [-0.561839, -0.367252, 0.073459]
      orientation: {rpy_deg: [-0.000076, 0.162992, 0.006698]}
  - scene_resource_id: isaac_small_klt_01
    shape:
      type: mesh
      mesh_resource_uri: examples/isaac_manipulator_scene_light/meshes/World__small_KLT_01_collider_primitives.obj
      mesh_scale: [1.0, 1.0, 1.0]
    pose:
      frame_ref: {kind: cell_frame}
      position_m: [0.27161648869514465, -0.35853588581085205, 0.07468909025192261]
      orientation: {rpy_deg: [-0.000021, -0.104678, -0.00004]}
  - scene_resource_id: isaac_soup_can
    shape:
      type: mesh
      mesh_resource_uri: examples/isaac_manipulator_scene_light/meshes/World__soup_can_collider_cooked.obj
      mesh_scale: [1.0, 1.0, 1.0]
    pose:
      frame_ref: {kind: cell_frame}
      position_m: [0.085370734333992, -0.004780956543982029, 0.05248536914587021]
      orientation: {rpy_deg: [89.988004, 0.106372, 173.509839]}
  - scene_resource_id: isaac_table_low_327
    shape:
      type: mesh
      mesh_resource_uri: examples/isaac_manipulator_scene_light/meshes/background__table_low_327_collider_cooked.obj
      mesh_scale: [1.0, 1.5, 1.149999976]
    pose:
      frame_ref: {kind: cell_frame}
      position_m: [0.0, 0.0, -0.7695999827980996]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
parameters:
  - parameter_id: velocity_scale
    type: float64
    default: 0.2
    constraints: {min_exclusive: 0.0, max_inclusive: 1.0}
    description: Velocity scale for all retained-world moves.
tree:
  node_id: sequence
  instance_id: isaac_light_cycle
  parameters: {}
  children:
    - node_id: simulation.set_entity_pose
      instance_id: set_cheese_initial_pose
      parameters:
        scene_resource_id: isaac_cheese_box
        pose:
          frame_ref: {kind: cell_frame}
          position_m: [-0.455038, 0.076595, 0.087827]
          orientation: {rpy_deg: [92.340746, -1.76826, -90.093258]}
      children: []
    - node_id: simulation.set_state
      instance_id: play_simulation
      parameters: {state: play}
      children: []
    - node_id: timer
      instance_id: wait_for_simulation
      parameters: {duration_s: 1.0}
      children: []
    - node_id: gripper.command_position
      instance_id: open_gripper_start
      parameters:
        target_role: gripper
        position: {kind: angular_rad, value_rad: 0.0}
        max_effort: {kind: angular_newton_meter, value_nm: 40.0}
        command_duration_s: 1.0
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_pick_approach
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: scene_resource, scene_resource_id: isaac_cheese_box}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.2]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale: {kind: program_parameter, reference: velocity_scale}
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_pick
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: scene_resource, scene_resource_id: isaac_cheese_box}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.08]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale: {kind: program_parameter, reference: velocity_scale}
      children: []
    - node_id: sequence
      instance_id: close_and_attach
      parameters: {}
      children:
        - node_id: gripper.command_position
          instance_id: close_gripper
          parameters:
            target_role: gripper
            position: {kind: angular_rad, value_rad: 0.55}
            max_effort: {kind: angular_newton_meter, value_nm: 40.0}
            command_duration_s: 1.0
          children: []
        - node_id: timer
          instance_id: wait_before_attach
          parameters: {duration_s: 0.5}
          children: []
        - node_id: scene.attach_carried_object
          instance_id: attach_cheese_box
          parameters:
            scene_resource_id: isaac_cheese_box
            target_role: gripper
            carrier_frame_role: tcp
            touch_body_roles: [gripper_collision]
          children: []
    - node_id: motion.move_to_pose
      instance_id: pick_retreat
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: frame_role, frame_role_id: tcp}
        goal:
          position_m: [0.0, 0.0, -0.2]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale: {kind: program_parameter, reference: velocity_scale}
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_drop_approach
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: scene_resource, scene_resource_id: isaac_small_klt}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.4]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale: {kind: program_parameter, reference: velocity_scale}
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_drop
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: scene_resource, scene_resource_id: isaac_small_klt}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.35]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        joint_position_tol_rad: 0.05
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale: {kind: program_parameter, reference: velocity_scale}
      children: []
    - node_id: sequence
      instance_id: detach_and_open
      parameters: {}
      children:
        - node_id: scene.detach_carried_object
          instance_id: detach_cheese_box
          parameters:
            scene_resource_id: isaac_cheese_box
            target_role: gripper
          children: []
        - node_id: timer
          instance_id: wait_after_detach
          parameters: {duration_s: 1.0}
          children: []
        - node_id: gripper.command_position
          instance_id: open_gripper_release
          parameters:
            target_role: gripper
            position: {kind: angular_rad, value_rad: 0.0}
            max_effort: {kind: angular_newton_meter, value_nm: 40.0}
            command_duration_s: 1.0
          children: []
    - node_id: motion.move_to_pose
      instance_id: drop_retreat
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: scene_resource, scene_resource_id: isaac_small_klt}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.4]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale: {kind: program_parameter, reference: velocity_scale}
      children: []
    - node_id: motion.move_to_joint_target
      instance_id: return_rest
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        goal:
          - {joint_name: shoulder_pan_joint, position_rad: 2.63422544}
          - {joint_name: shoulder_lift_joint, position_rad: -0.875980752}
          - {joint_name: elbow_joint, position_rad: 1.551074106}
          - {joint_name: wrist_1_joint, position_rad: -2.29231544}
          - {joint_name: wrist_2_joint, position_rad: -1.560498884}
          - {joint_name: wrist_3_joint, position_rad: -2.038544566}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale: {kind: program_parameter, reference: velocity_scale}
      children: []
    - node_id: simulation.reset
      instance_id: reset_simulation
      parameters: {}
      children: []
    - node_id: timer
      instance_id: wait_after_reset
      parameters: {duration_s: 3.0}
      children: []
    - node_id: simulation.set_state
      instance_id: pause_simulation
      parameters: {state: pause}
      children: []
