name: isaac_manipulator_scene_light
description: Retained Isaac Sim light-scene pick-and-place Program for the UR10e and Robotiq 2F-140. It
  preserves the exact authored meshes and poses, typed simulator play/reset/pause lifecycle, observed-scene
  planning, physical gripper commands, carried-object transitions, and retained-world rest pose.
catalog:
  api_version: manyforge.node_catalog.v3
  content_version: 3.0.0
compatibility:
  lanes:
  - isaac-sim
  assistant: optional
  requires:
  - robotiq_2f_140_gripper
  - ros2_control
  tags:
  - isaac-sim
  - pick-and-place
  - robotiq
  - ur10e
