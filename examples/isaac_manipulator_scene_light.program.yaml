parameters:
- parameter_id: velocity_scale
  type: float64
  default: 0.4
  constraints:
    min_exclusive: 0
    max_inclusive: 1
  description: Velocity scale for all retained-world moves.
tree:
  node_id: sequence
  instance_id: isaac_light_cycle
  parameters: {}
  children:
  - node_id: simulation.set_entity_pose
    instance_id: set_cheese_initial_pose
    parameters:
      scene_resource_id: isaac_cheese_box
      pose:
        frame_ref:
          kind: cell_frame
        position_m:
        - -0.455038
        - 0.076595
        - 0.087827
        orientation:
          rpy_deg:
          - 92.340746
          - -1.76826
          - -90.093258
    children: []
  - node_id: simulation.set_state
    instance_id: play_simulation
    parameters:
      state: play
    children: []
  - node_id: timer
    instance_id: wait_for_simulation
    parameters:
      duration_s: 1.0
    children: []
  - node_id: gripper.command_position
    instance_id: open_gripper_start
    parameters:
      target:
        component_id: robotiq_2f_140
        command_target_id: gripper
      position:
        kind: angular_rad
        value_rad: 0.0
      max_effort:
        kind: angular_newton_meter
        value_nm: 40.0
      command_duration_s: 1.0
    children: []
  - node_id: motion.move_to_pose
    instance_id: move_to_pick_approach
    parameters:
      target:
        component_id: isaac_ur10e_light_robot
        command_target_id: arm
      base_frame:
        component_id: isaac_ur10e_light_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      target_mode: relative
      target_reference:
        type: scene_resource
        scene_resource_id: isaac_cheese_box
      offset_reference:
        type: component_frame
        frame:
          component_id: isaac_ur10e_light_robot
          frame_id: base
      goal:
        position_m:
        - 0.0
        - 0.0
        - 0.2
        orientation:
          rpy_deg:
          - 180.0
          - 0.0
          - -180.0
      planning_timeout_s: 10.0
      execution_timeout_s: 30.0
      acceleration_scale: 0.8
    children: []
    value_sources:
      velocity_scale:
        kind: program_parameter
        reference: velocity_scale
  - node_id: motion.move_to_pose
