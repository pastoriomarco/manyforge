name: isaac_lite6_lite_gripper_pick_and_place
description: Retained Isaac-compatible Lite6 pick-and-place Program. It preserves the scan poses, exact
  scene and rest coordinates, linear lite-gripper commands, carried-object transitions, and typed simulator
  lifecycle. Manager-owned observed-scene latching replaces the retired trajectory-reset node.
