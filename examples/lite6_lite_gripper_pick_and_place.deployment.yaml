api_version: manyforge.deployment.v0
schema_version: 0.1.0
name: lite6_lite_gripper_pick_and_place
description: >-
  Native ManyForge pick-and-place deployment for UFACTORY Lite6 with the lite
  pneumatic gripper. The model bundle is self-contained; xarm_ros2 is a
  generation-time / real-robot runtime dependency only.
program_profile: v0.1
grasp_risk_policy:
  open_loop_grasp:
    allowed: true
    scope: simulation
    rationale: >-
      Native Lite6 preview uses backend-authored gripper state and simulated
      attach actions without an independent grasp confirmation source.
robot_config:
  robot_id: lite6
  group_id: lite6
  urdf_path: package://manyforge_example_models/models/lite6_lite_gripper/lite6_lite_gripper.urdf
  srdf_path: package://manyforge_example_models/models/lite6_lite_gripper/lite6_lite_gripper.srdf
  package_paths:
  - ..
  global_max_tcp_linear_speed_mps: 0.15
grippers:
  primary:
    command_mode: simulated_joint
    group_id: lite_gripper
    joint_name: right_finger_joint
    motion_time_s: 0.8
    description: Native simulated UFACTORY lite pneumatic gripper.
    touch_links:
    - lite_gripper_base_link
    - lite_gripper_left_finger
    - lite_gripper_right_finger
    mount_frame: link_eef
    attach_frame: link_tcp
    tcp_frame: link_tcp
    auxiliary_frames:
    - lite_gripper_base_link
adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - planning.motion.joint_goal
    - planning.motion.pose_goal
    - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - context.state.current
    - context.validation.trajectory
    - context.collision.check
    - context.collision.check.detailed
    - context.kinematics.fk
    - context.limits.joint
    - context.pose.resolve_reference
    - context.scene.object_query
    - scene.shape.box
    - scene.shape.sphere
    - scene.shape.cylinder
    - scene.shape.mesh
    - scene.edit.add
    - scene.edit.upsert
    - scene.edit.remove
    - scene.edit.update_pose
    - scene.edit.attach_detach
    - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.roboplan_native
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - execution.trajectory.execute
    - execution.feedback.phase_events
    - execution.feedback.state_snapshots
    - execution.stop.soft
    - execution.pause
    - execution.resume
    - execution.reset
    - tool.gripper.command
    - tool.gripper.feedback
    config:
      mode: simulated
      execution_tick_hz: 100
      initial_joint_positions_rad: [0.0, 0.0, 1.57, 0.0, 0.0, 0.0]
      operator_stop_profile:
        profile_id: operator_soft_on_path
        stop_mode: soft_on_path
        deceleration_time_s: 1.0
        require_backend_confirmation: true
        allow_natural_completion_on_short_path: true
        per_joint_max_deceleration_rad_s2:
          joint1: 4.0
          joint2: 4.0
          joint3: 4.0
          joint4: 4.0
          joint5: 4.0
          joint6: 4.0
      default_fault_stop_profile:
        profile_id: fault_spring_back_hold
        stop_mode: spring_back_hold
        deceleration_time_s: 1.0
        require_backend_confirmation: true
        per_joint_max_deceleration_rad_s2:
          joint1: 4.0
          joint2: 4.0
          joint3: 4.0
          joint4: 4.0
          joint5: 4.0
          joint6: 4.0
orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 50
launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true
