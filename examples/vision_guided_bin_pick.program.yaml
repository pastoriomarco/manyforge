      scene_snapshot_format: jpeg
      scene_snapshot_height: 480
      scene_snapshot_width: 640
      timeout_s: 5
    children: []
  - node_id: fallback
    instance_id: execute_selected_pick
    parameters: {}
    children:
    - node_id: sequence
      instance_id: pick_left_branch
      parameters: {}
      children:
      - node_id: logic.check_condition
        instance_id: left_was_selected
        parameters: {}
        children: []
        value_sources:
          condition:
            field: pick_left_bin
            kind: blackboard_field
            reference: perception.pick_target
      - node_id: sequence
        instance_id: pick_left_part
        parameters: {}
        children:
        - node_id: planning.plan_pick_sequence
          instance_id: pick_left_part.plan
          parameters:
            tool_completion_timeout_s: 15.0
            base_frame:
              component_id: ur5_robot
              frame_id: base
            carrier_frame_ref:
              component_id: robotiq_2f_85
              frame_id: tcp
            contact_policy_id: selected_object_grasp
            motion_options:
              approach_velocity_scale: 0.4
              descend_velocity_scale: 0.4
              retreat_velocity_scale: 0.4
            output_key: pick_place.pick_left_part
            selected_object_id: left_part
            synthesis:
              approach_offset_envelope:
                orientation_rpy_max_deg:
                - 0
                - 0
                - 0
                orientation_rpy_min_deg:
                - 0
                - 0
                - 0
                position_max_m:
                - 0
                - 0
                - 0.08
                position_min_m:
                - 0
                - 0
                - 0.08
              base_tool_orientation_rpy_deg:
              - 180
              - 0
              - -90
              maximum_candidate_count: 1
              pick_offset_envelope:
                orientation_rpy_max_deg:
                - 0
                - 0
                - 0
                orientation_rpy_min_deg:
                - 0
                - 0
                - 0
                position_max_m:
                - 0
                - 0
                - 0
                position_min_m:
                - 0
                - 0
                - 0
              search_strategy: first_feasible
            target:
              component_id: ur5_robot
              command_target_id: arm
            tcp_endpoint:
              kind: current
            tool_position:
              kind: named_preset
              name: closed
            tool_target:
              component_id: robotiq_2f_85
              command_target_id: gripper
          children: []
        - node_id: motion.move_to_pose
          instance_id: pick_left_part.approach
          parameters:
            base_frame:
              component_id: ur5_robot
              frame_id: base
            target:
              component_id: ur5_robot
              command_target_id: arm
            tcp_endpoint:
              kind: current
            velocity_scale: 0.4
          children: []
          value_sources:
            goal:
              field: approach_pose
              kind: blackboard_field
              reference: pick_place.pick_left_part
        - node_id: motion.follow_cartesian_path
          instance_id: pick_left_part.descend
          parameters:
            base_frame:
              component_id: ur5_robot
              frame_id: base
            contact_policy_id: selected_object_grasp
            target:
              component_id: ur5_robot
              command_target_id: arm
            tcp_endpoint:
              kind: current
            velocity_scale: 0.4
          children: []
          value_sources:
            contact_scene_resource_id:
              field: selected_object_id
              kind: blackboard_field
              reference: pick_place.pick_left_part
            path:
