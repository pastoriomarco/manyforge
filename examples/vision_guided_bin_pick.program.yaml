description: Vision-guided pick-and-place Program. A bounded model request selects one of two declared
  scene resources, an ordered fallback chooses the matching branch, and visible ordinary Pick/Place subtrees
  plan and execute the selected operation through the same motion, gripper, and Scene nodes used elsewhere.
