  "deployment_artifact_id": "lite6_pneumatic_real",
  "description": "Real Lite6 pneumatic example: site address lite6_main, illustrative controller GPIO pin 0 and output polarity, and a separate periodically published ROS Boolean workpiece input. Configure the actual cell wiring, polarity and sensor topic before use; this example is not a hardware qualification.",
  "name": "lite6_pneumatic_real",
  "policies": {
    "interrupt_config": {
      "cancel_validation_timeout_ns": 1000,
      "motion_scope_arm_timeout_ns": 1000,
      "queue_depth": 8,
      "supervisory_poll_rate_hz": 10
    },
    "interrupt_rules": [
      {
        "condition": {
          "all": [
            {
              "compare": {
                "op": "==",
                "operand": {
                  "key": "pneumatic.carrying"
                },
                "value": true
              }
            },
            {
              "compare": {
                "op": "==",
                "operand": {
                  "signal": {
                    "controllable_component_id": "gripper_io",
                    "signal_name": "workpiece_grasped"
                  }
                },
                "value": false
              }
            }
          ]
        },
        "on_trip": "gate",
        "priority": 0,
        "rule_id": "workpiece_lost",
        "scope": "all_motion"
      }
    ]
