api_version: manyforge.program.v0
program_profile: v0.1
name: empty_pick_and_place_ur10e_robotiq
description: |
  Empty program scaffold for the pick_and_place build chain in
  smoke_corpus.yaml. Uses the same robot + catalog as the populated
  demo, but ships with NO scene resources, NO tree nodes, NO
  parameters, and NO blackboard keys — the assistant builds the
  scene + tree from scratch via the PnP_01 → PnP_20 prompt sequence.
catalog_version: "0.2.0"
robot:
  robot_id: ur10e
  group_id: arm
  base_frame: base_link
  tcp_frame: grasp_frame
scene: []
parameters: []
blackboard:
  namespaces: []
  keys: []
# Minimal placeholder tree: Composer requires SOME tree section AND
# composites must have ≥1 child. We seed a `sequence` named "scaffold"
# with one trivial `command_gripper` child as the only allowed-empty
# composite. The PnP build chain's PnP_05 ("create a root sequence
# named pick_and_place") just renames this scaffold via
# `tree_draft_update_node_params`; the rest of the chain inserts new
# children alongside the placeholder, then PnP_06+ effectively shadows
# the scaffold child.
tree:
  # 2026-05-09: scaffold renamed `scaffold` → `pick_and_place` so the
  # PnP build chain (PnP_06–PnP_20) has a valid anchor from the start.
  # The chain prompts reference "as the first child of pick_and_place"
  # / "after the approach" — those need pick_and_place to exist on
  # turn 1. PnP_05 was previously expected to do the rename, but the
  # model couldn't reliably fire `tree_draft_update_node_params` for
  # rename; now PnP_05 is effectively a state-confirmation no-op and
  # the rest of the chain has a real anchor.
  id: sequence
  name: pick_and_place
  children:
    - id: command_gripper
      name: scaffold_open
      params:
        gripper_id: primary
        position: 0.0
        max_effort: 40.0
        duration_s: 1.0
        timeout_s: 0.0
