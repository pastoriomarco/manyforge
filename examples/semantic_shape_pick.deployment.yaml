api_version: manyforge.deployment.v0
schema_version: "0.1.0"
name: ur5_roboplan_local_semantic_shape_pick
description: >-
  Local deployment for the semantic object-selection demo. A VLM selects one
  backend-authoritative scene object from a deterministic manifest plus an
  auxiliary HMI snapshot, and the backend computes the actual pick sequence
  deterministically from backend scene state.

program_profile: v0.1

robot_config:
  robot_id: ur5
  group_id: arm
  urdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.urdf
  srdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.srdf
  global_max_tcp_linear_speed_mps: 0.25

adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - planning.motion.joint_goal
      - planning.motion.pose_goal
      - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - context.kinematics.fk
      - context.pose.resolve_reference
      - context.scene.object_query
      - context.limits.joint
      - scene.shape.box
      - scene.shape.sphere
      - scene.shape.mesh
      - scene.edit.add
      - scene.edit.remove
      - scene.edit.update_pose
      - scene.edit.attach_detach
      - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.roboplan_native
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - execution.trajectory.execute
      - execution.feedback.phase_events
      - execution.feedback.state_snapshots
      - execution.stop.soft
      - execution.pause
      - execution.resume
      - execution.reset
    config:
      mode: simulated
      execution_tick_hz: 100
      initial_joint_positions_rad: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]

orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 10.0

launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true

model_audit_policy:
  store_full_prompts: false
  store_full_responses: false
  redact_argument_values: true

model_endpoint_profile_registry: model_endpoint_profiles.yaml

model_endpoints:
  selection_model:
    profile_ref: thor_manyforge_qwen36
    max_tokens: 384
    capabilities:
      supports_image_input: false
      supported_image_transports: []

assistant:
  provider: deterministic-scene-authoring
  enabled: true

prompt_templates:
  select_scene_object_v1:
    version: "1"
    template_text: >-
      You are selecting the next object for a perception-guided pick cycle.
      Use the authoritative backend scene manifest as the primary source of
      truth for object IDs, poses, shapes, sizes, and spatial semantics.
      If an image is attached, use it only as auxiliary evidence for
      attributes that are not already explicit in the manifest.
      Selection request:
      `{{ selection_request_text }}`

      Authoritative scene context JSON:
      {{ scene_context_json }}

      You must answer by calling the `select_scene_object` tool.
      Use the exact candidate object ID when outcome=`selected`.
      Use an empty string for `selected_object_id` when outcome is
      `no_match` or `ambiguous`.
    response_tool:
      name: select_scene_object
      description: Choose one candidate object from the current runtime scene context.
      parameters:
        type: object
        required: [outcome, selected_object_id, confidence, reason]
        properties:
          outcome:
            type: string
            enum: [selected, no_match, ambiguous]
          selected_object_id:
            type: string
            x-manyforge-enum-template-variable: candidate_object_ids
            x-manyforge-enum-allow-empty-string: true
          confidence:
            type: number
          reason:
            type: string
          matched_attributes:
            type: array
            items:
              type: string
          request_interpretation:
            type: string
          candidate_assessments:
            type: array
            items:
              type: object
              properties:
                object_id:
                  type: string
                  x-manyforge-enum-template-variable: candidate_object_ids
                matches_request:
                  type: boolean
                match:
                  type: boolean
                confidence:
                  type: number
                rationale:
                  type: string
                evaluation:
                  type: string
          missing_information:
            type: array
            items:
              type: string
          diagnostic_notes:
            type: string
