api_version: manyforge.deployment.v0
schema_version: "0.2.0"
name: ur5_roboplan_local_semantic_shape_pick
description: >-
  Local deployment for the semantic object-selection demo. A VLM selects one
  backend-authoritative scene object from a deterministic manifest plus an
  auxiliary viewer snapshot, and the backend computes the actual pick sequence
  deterministically from backend scene state.

compatibility:
  lane: manyforge-only
  provides: [semantic_shape_inference]
  tags: [semantic-pick, ur5]
  scenarios:
    - name: ur5-semantic-shape-pick
      program: semantic_shape_pick.program.yaml
      description: "UR5 semantic shape pick (text model, no image source)"
      aliases: [shape-pick]

program_profile: v0.1

robot_config:
  robot_id: ur5
  group_id: arm
  urdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.urdf
  srdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.srdf
  global_max_tcp_linear_speed_mps: 0.25

adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - planning.motion.joint_goal
      - planning.motion.pose_goal
      - planning.motion.cartesian_path
      - planning.profile.first_feasible
      - planning.profile.balanced
      - planning.profile.quality_bounded
      - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - context.collision.check.detailed
      - context.kinematics.fk
      - context.pose.resolve_reference
      - context.scene.object_query
      - context.limits.joint
      - scene.shape.box
      - scene.shape.sphere
      - scene.shape.cylinder
      - scene.shape.mesh
      - scene.edit.add
      - scene.edit.upsert
      - scene.edit.remove
      - scene.edit.update_pose
      - scene.edit.attach_detach
      - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.roboplan_native
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - execution.trajectory.execute
      - execution.feedback.phase_events
      - execution.feedback.state_snapshots
      - execution.stop.soft
      - execution.pause
      - execution.resume
      - execution.reset
    config:
      mode: simulated
      execution_tick_hz: 100
      initial_joint_positions_rad: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]
      # Industrial controlled stop: the
      # operator Stop button decelerates along the current path with a
      # jerk-continuous 1.0 s ramp. Spring-back is a distinct stop profile,
      # not a default fallback for soft_on_path with the same deceleration time.
      # per_joint_max_deceleration_rad_s2 bounds the decel; soft_on_path jerk
      # limits auto-default from accel + ramp.
      operator_stop_profile:
        profile_id: "operator_soft_on_path"
        stop_mode: "soft_on_path"
        deceleration_time_s: 1.0
        allow_natural_completion_on_short_path: true
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10.0
          shoulder_lift_joint: 10.0
          elbow_joint: 10.0
          wrist_1_joint: 10.0
          wrist_2_joint: 10.0
          wrist_3_joint: 10.0
      default_fault_stop_profile:
        profile_id: "default_fault_spring_back"
        stop_mode: "spring_back_hold"
        deceleration_time_s: 1.0
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10.0
          shoulder_lift_joint: 10.0
          elbow_joint: 10.0
          wrist_1_joint: 10.0
          wrist_2_joint: 10.0
          wrist_3_joint: 10.0

orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 50.0

launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true

model_audit_policy:
  store_full_prompts: false
  store_full_responses: false
  redact_argument_values: true

model_endpoint_profile_registry: model_endpoint_profiles.yaml

model_endpoints:
  selection_model:
    profile_ref: thor_manyforge_qwen36
    max_tokens: 384
    capabilities:
      supports_image_input: false
      supported_image_transports: []
  # Chat-capable endpoint used by the assistant overlay (the AI button
  # in the Composer UI). Independent of `selection_model`, which is
  # used by the program's `query_model` behavior-tree nodes for the
  # deterministic select_scene_object workflow.
  assistant_model:
    profile_ref: thor_cosmos_reason2_8b
    provider: openclaw
    base_url: http://127.0.0.1:8200/v1/manyforge/assistant
    default_timeout_s: 180.0
    max_tokens: 8192
    capabilities:
      supports_response_tools: true
      supports_json_object: true
      supports_image_input: true
      supported_image_transports: [inline_data_url, http_url]
      tool_call_family: openai_chat_tools

assistant:
  # Provider for the AI chat overlay. The launcher defaults to
  # openclaw (`ASSISTANT_PROVIDER=openclaw`); the runtime endpoint URL
  # comes from MANYFORGE_ASSISTANT_ENDPOINT_URL exported by the launcher,
  # not from `base_url` above — the YAML provider/endpoint_alias pair is
  # the deployment-side declaration of intent.
  provider: openclaw
  endpoint_alias: assistant_model
  enabled: true

# Required by the OpenClaw provisioner pre-check on
# /api/assistant/modes/composer-assistant. The full tool/node surface is
# copied from examples/assistant_modes_scene_authoring.deployment.yaml so
# the assistant has the same scene-authoring capability across all
# assistant-on scenarios. Operators are free to chat with the model
# about the running shape-pick demo, propose scene edits, etc.
assistant_modes:
  query:
    enabled: true
    description: Read-only inspection mode for assistant questions.
    authority:
      session_kind: not_applicable
      approval_mode: human_approved
      review: not_required
    catalog:
      skills: []
      tools:
        - program_read
        - scene_inspect
        - inspect_isaac_scene
      nodes: []
  composer-assistant:
    enabled: true
    description: Scene-authoring proposal mode for Composer.
    authority:
      session_kind: not_applicable
      approval_mode: human_approved
      review: required
    catalog:
      skills: []
      tools:
        - program_read
        - catalog_read
        - skills_read
        - deployment_capabilities_read
        - scene_inspect
        - inspect_isaac_scene
        - propose_scene_objects
        - propose_scene_object_nodes
        - scene_draft_add_object
        - scene_draft_update_object
        - scene_draft_upsert_objects
        - scene_draft_remove_objects
        - tree_draft_insert_node
        - tree_draft_update_node_params
        - tree_draft_delete_node
        - tree_draft_move_node
        - tree_draft_replace_subtree
        - tree_draft_change_node_kind
        - tree_draft_wrap_node
        - program_draft_upsert_parameters
        - program_draft_remove_parameters
        - blackboard_draft_upsert_namespaces
        - blackboard_draft_remove_namespaces
        - blackboard_draft_upsert_keys
        - blackboard_draft_remove_keys
      nodes:
        - attach_object_to_link
        - detach_object_from_link
        - add_collision_object
        - remove_collision_object
        - upsert_collision_object
        - update_collision_object_pose
        - sequence
        - fallback
        - parallel
        - repeat
        - retry
        - inverter
        - move_manipulator_action
        - command_gripper
        - timer
        - wait_for_signal_bool
        - set_key_bool_value

# Full tool_catalog definitions for the tool IDs referenced in
# assistant_modes.catalog.tools above. Copied verbatim from
# examples/assistant_modes_scene_authoring.deployment.yaml so the
# assistant has the same scene-authoring surface across all
# assistant-on scenarios. Keep in sync with that file.
tool_catalog:
  - id: catalog_read
    effect: read_only
    description: |
      Reads node-catalog entries that this assistant mode is permitted to
      use. Returns the structural and parameter metadata for each entry,
      including its catalog identifier, its kind, the child arity it
      accepts, the full set of parameter declarations the entry expects,
      and any deployment capabilities required to use it. Use this when
      the per-request manifest's nodeCatalog summary needs to be expanded
      to the full per-parameter description, or when filtering by kind or
      category. The result is read-only metadata; it never changes the
      program.
  - id: skills_read
    effect: read_only
    description: |
      Reads skill-catalog entries that this assistant mode is permitted
      to use. Skills are higher-level, deployment-defined activities that
      expand into one or more behavior-tree nodes; each entry declares
      the deployment capabilities it requires and the tools needed to
      perform it. Use this when planning a request that may be
      implementable via a skill rather than by hand-assembling individual
      nodes. The result is read-only.
  - id: deployment_capabilities_read
    effect: read_only
    description: |
      Reads the active deployment's adapter-family capability keys.
      Capabilities express what the runtime can physically do, such as
      which motion-planning families are available, which gripper kinds
      are supported, and which vision modes are enabled. Capabilities
      constrain which catalog entries are usable in the current
      configuration. Use this when a node insertion would otherwise be
      valid by arity and parameter shape but the deployment may lack the
      underlying capability needed to execute it. The result is
      read-only.
  - id: program_read
    effect: read_only
    description: |
      Reads the loaded Composer program's current state, including the
      in-memory behavior-tree draft, the program's scene resources, its
      parameter declarations, its blackboard configuration, and which
      deployment is loaded. Use this any time you need authoritative
      information about node names, parent-child topology, the current
      parameter values on a node, or what scene resources already exist.
      Most assistant requests already include a snapshot of this state
      in the request envelope; call this tool to refresh state after
      applying a mutation in the same request rather than as a routine
      first step.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
  - id: scene_inspect
    effect: read_only
    description: |
      Reads the current backend scene state, including each object's
      pose, shape, and attachment status. The assistant request envelope
      already includes a snapshot of this state; call this tool to
      refresh after applying mutations in the same request rather than
      as a routine first step.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
  - id: inspect_isaac_scene
    effect: read_only
    description: Inspect the current simulator scene snapshot.
    input_schema:
      type: object
      properties:
        includeSubtrees:
          type: array
          items:
            type: string
        excludeSubtrees:
          type: array
          items:
            type: string
        probePrims:
          type: array
          items:
            type: string
        outputProfile:
          type: string
          enum:
            - llm_scene_authoring
            - raw_inventory
      additionalProperties: false
  - id: propose_scene_objects
    effect: proposal
    description: Propose reviewable scene-resource additions from simulator objects.
    input_schema:
      type: object
      required:
        - inspectionReport
      properties:
        inspectionReport:
          type: object
        sourceRoots:
          type: array
          items:
            type: string
        objectIdPrefix:
          type: string
      additionalProperties: false
  - id: propose_scene_object_nodes
    effect: proposal
    description: Propose reviewable Composer scene nodes from simulator objects.
    input_schema:
      type: object
      required:
        - sceneResources
        - operations
      properties:
        sceneResources:
          type: array
          items:
            type: object
        operations:
          type: array
          items:
            type: string
            enum:
              - add_collision_object
              - upsert_collision_object
              - remove_collision_object
              - attach_object_to_link
              - detach_object_from_link
        linkFrame:
          type: string
        gripperId:
          type: string
      additionalProperties: false
  - id: scene_draft_add_object
    effect: composer_draft_mutating
    description: |
      Adds a static scene resource to the program's scene-resource list.
      Static scene resources exist for the entire program run and are
      part of the program's compile-time configuration; they are not
      part of any runtime cycle. Use this tool for permanent collision
      geometry such as walls, fixtures, or other environment objects
      whose presence is not conditional on the program's behavior. The
      object is added to the draft only; it is not visible in the
      running scene until the draft is materialized. Do not use this
      tool when a request describes adding an object at a particular
      moment during execution, such as at the end of a cycle, after
      each iteration, or in response to a runtime event — that
      requirement maps to a behavior-tree node, not to a scene
      resource, and must be satisfied by inserting the corresponding
      runtime-mutation node into the tree via the tree-draft tools
      instead. Failure modes are limited to validation errors on the
      resource shape and pose declarations.
    input_schema:
      type: object
      required:
        - objectId
      additionalProperties: true
      properties:
        objectId:
          type: string
          minLength: 1
        shapeType:
          type: string
          enum:
            - box
            - sphere
            - cylinder
          description: Convenience alias for shape.type.
        shape_type:
          type: string
          enum:
            - box
            - sphere
            - cylinder
          description: Convenience alias for shape.type.
        size:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Box dimensions [x, y, z] in meters.
        dimensions:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Box dimensions [x, y, z] in meters.
        radius:
          type: number
          description: Sphere radius, or cylinder radius when shapeType is cylinder.
        diameter:
          type: number
          description: Sphere diameter, or cylinder diameter when shapeType is cylinder; callback converts to radius.
        cylinderRadiusM:
          type: number
          description: Cylinder radius in meters.
        cylinder_radius_m:
          type: number
          description: Cylinder radius in meters.
        cylinderHeightM:
          type: number
          description: Cylinder height in meters along local Z.
        cylinder_height_m:
          type: number
          description: Cylinder height in meters along local Z.
        position:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Object position [x, y, z] in the backend world frame.
        frameId:
          type: string
          enum:
            - universe
            - world
            - World
            - /World
          description: Common world-frame aliases accepted for detached Composer draft objects; the callback normalizes these to the active backend's canonical scene frame. Use attach_object_to_link or detach_object_from_link tree nodes for attachment semantics.
        sceneResource:
          type: object
          description: Legacy wrapper form accepted for compatibility.
          additionalProperties: true
        forceDiscardOverrides:
          type: boolean
  - id: scene_draft_update_object
    effect: composer_draft_mutating
    description: |
      Replaces a static scene resource's shape and pose in the program's
      scene-resource list. The change is part of the program's
      compile-time configuration, not a per-cycle event. To change an
      object's pose only at a specific moment during execution, use a
      behavior-tree node that performs runtime pose updates instead,
      inserted via the tree-draft tools.
  - id: scene_draft_upsert_objects
    effect: composer_draft_mutating
    description: |
      Inserts new static scene resources or replaces existing ones in a
      single batched call. The semantics match the single-object add and
      update tools: compile-time configuration, not per-cycle mutation.
      Useful when a request introduces multiple permanent objects at
      once. Duplicate identifiers within a single batch are rejected; the
      caller must assign unique identifiers across the batch.
  - id: scene_draft_remove_objects
    effect: composer_draft_mutating
    description: |
      Removes static scene resources from the program's scene-resource
      list. The resources cease to exist for any subsequent cycle
      iteration. Do not use this tool when a request describes removing
      an object only at a specific moment during execution; that case
      calls for the corresponding runtime-mutation behavior-tree node,
      inserted via the tree-draft tools instead.
  - id: tree_draft_insert_node
    effect: composer_draft_mutating
    description: |
      Inserts a new node as a child of an existing parent node in the
      program's behavior-tree draft. This is the primary tool for adding
      any runtime activity to the program: robot motions, gripper
      actions, scene mutations to be performed during a cycle, and the
      control-flow constructs that govern when other activities run. The
      parent is identified by its instance name, which must already
      exist in the draft tree; if the model does not already know the
      tree's node names, it must call the program-read tool first rather
      than guess.

      This tool authors runtime behavior only. It is NEVER the right
      tool for adding a static obstacle, fixture, or prop that should
      exist for the entire program run. Those are scene resources and
      are authored with scene_draft_add_object (or its upsert/remove
      siblings). If the request describes adding or removing an object
      that is not conditional on the program's behavior — phrases like
      "add an obstacle", "place a fixture", "introduce a wall" —
      use the scene-draft tool family instead. Inserting an
      add_collision_object (or analogous) BT node under a sequence
      creates a runtime mutation that fires every time that branch
      executes, which is almost never what the operator wanted when
      they asked for a static object.

      The new node's structural identifier and its parameter values are
      both taken from the node-catalog manifest. Every accepted
      identifier, every accepted parameter name, every required
      parameter, and every parameter's accepted type is declared in the
      catalog and must be looked up there rather than guessed. Each
      catalog entry also declares its kind, which determines whether the
      entry accepts no children, a single child, or multiple children;
      the parent's declared arity is the binding constraint on
      insertion. Attempting to insert into a parent whose arity is
      already saturated, or into a parent whose kind does not accept
      children at all, is rejected with a structural-error response that
      names the parent and reports its allowed arity. On receiving such
      a response the caller should restructure the tree — typically by
      first introducing a multi-child parent under the saturated
      decorator — rather than re-attempting the same shape.

      Pose-bearing leaves declare their reference-frame parameter as a
      sibling of the pose object, not as a key inside the pose object;
      the catalog entry is the source of truth on whether a parameter is
      nested under another parameter or top-level, and must be consulted
      whenever a parameter's name appears in more than one place in a
      payload draft.

      The model can pass the new-node payload either as a structured
      object or as a JSON-encoded string fallback if that is what its
      tool-call format produces; the bridge normalizes the string form
      back to an object before validation. Successful insertion mutates
      the draft and is reflected in subsequent reads of the program.
      Phrases describing actions to be taken at a specific moment of
      execution — at the end of a cycle, after each iteration, when a
      runtime event occurs — are signals that the corresponding
      requirement is a behavior-tree node and belongs to this tool,
      not to the scene-draft tools.
  - id: tree_draft_update_node_params
    effect: composer_draft_mutating
    description: |
      Changes the parameter values on a node already present in the
      draft tree, without altering the tree's structure. The node is
      identified by its instance name. The parameter payload must
      satisfy the catalog entry's parameter declarations; sending a
      parameter outside that declaration, or omitting a required
      parameter while in non-merge mode, is rejected with a
      structural-error response that lists the parameters actually
      sent and the parameters expected by the catalog. Use this tool
      when a request describes modifying the behavior of an existing
      node — its speed, its pose target, the identifier of the object
      it operates on, and so on — rather than restructuring the tree.
      The merge flag controls whether unspecified parameters are
      preserved or dropped; choose merge when the request only adjusts
      a subset of values.
  - id: tree_draft_delete_node
    effect: composer_draft_mutating
    description: |
      Removes a non-root node and the entire subtree rooted at it from
      the draft. The node is identified by its instance name. Use this
      tool when a request describes removing a step or an entire branch
      of behavior. Removing the root is not permitted; if the request
      implies the entire program should be cleared, that is a different
      operation outside this tool.
  - id: tree_draft_move_node
    effect: composer_draft_mutating
    description: |
      Moves an existing node and its subtree under a different parent
      in the draft. The node and the new parent are both identified by
      their instance names. The new parent's catalog-declared arity
      must accept the additional child; the move is rejected with a
      structural-error response otherwise. Use this tool when a
      request describes reorganizing existing behavior rather than
      introducing new behavior — for example, lifting a step out of
      its current parent into a sibling position elsewhere, or sliding
      a step from one branch of a multi-child parent into another.
  - id: tree_draft_replace_subtree
    effect: composer_draft_mutating
    description: |
      Atomically replaces a node and its entire subtree with a new
      subtree in the draft. The target is identified by its instance
      name. Use this tool for restructurings that would otherwise
      require a long sequence of insert, wrap, move, and delete
      operations — when the change is large enough that a
      transaction-style replacement is more reliable than incremental
      edits. The new subtree must be a valid program tree on its own
      under this assistant mode's allowed catalog: the root's catalog
      kind determines the root's arity, every nested node identifier
      must be in the allowed-nodes set for this mode, and instance
      names within the new subtree must not collide with names already
      present in the rest of the tree. The same payload-form latitude
      applies as for insertion: a structured object is preferred, and
      a JSON-encoded string is accepted as a fallback.
  - id: tree_draft_change_node_kind
    effect: composer_draft_mutating
    description: |
      Changes the catalog identifier (the kind) of an existing node
      in place while preserving the node's instance name, its parent,
      and its entire subtree. Use this tool when a request describes
      switching one node kind for a structurally compatible one — for
      example, replacing a decorator with a different decorator of
      the same arity, substituting one composite for a sibling
      composite of the same arity, or substituting one scene-create
      leaf for a related scene-create leaf — without rewriting any of
      the surrounding tree. The instance name is preserved
      unconditionally, so other parts of the program that reference
      this node by name keep working.

      This tool does NOT reorder siblings. To reorder two named
      nodes (e.g. "swap the order of A and B", "swap A with B",
      "reorder A and B"), use tree_draft_move_node to relocate one
      of them to the desired index inside the same parent.

      The new catalog identifier must be in the deployment catalog
      and in this assistant mode's allowed-nodes set. The current
      child count must satisfy the new identifier's arity range. The
      merged parameters (the existing node's params overlaid by
      whatever the caller supplies) must satisfy the new identifier's
      parameter declarations; the paramsMode option controls whether
      the supplied payload replaces the existing params, merges into
      them, or strictly rejects when the existing params are not all
      accepted by the new identifier.

      Catalog entries may declare a swap_class field naming a
      compatibility family. When both the current and new entries
      declare such a family and the families differ, the call is
      rejected unless force is set to true. Entries without a
      declared family are validated structurally only.

      Prefer this tool over replace_subtree whenever the goal is to
      change a node's kind while keeping its position and children
      intact — replace_subtree would force the caller to re-emit the
      entire subtree from scratch. Prefer wrap_node when the goal is
      to add a new parent above an existing node rather than to
      change the existing node's kind.
  - id: tree_draft_wrap_node
    effect: composer_draft_mutating
    description: |
      Wraps an existing node with a new parent, making the existing
      node the wrapper's only child while the wrapper takes the
      existing node's former position in the tree. Use this tool when
      a request requires changing the control-flow context around an
      existing piece of behavior without rewriting that behavior — for
      example, making an existing step or branch repeat, retry on
      failure, or be inverted.

      The target is identified by its instance name; passing the
      literal protocol token for the current root targets the root
      without requiring its name. The wrapper's catalog identifier
      must be looked up in the manifest and must be a control-flow or
      decorator entry; arbitrary text variants that resemble a real
      catalog identifier are rejected. The wrapper instance name must
      be unique across the entire program tree; collision with an
      existing name is rejected with a structural-error response, and
      the caller should retry with a different name rather than retry
      with the same one.

      The wrapper payload must not carry its own children, because the
      handler inserts the target's existing subtree as the wrapper's
      only child and supplying additional children would be ambiguous.
      A common pattern this tool enables: when a decorator's
      single-child arity prevents inserting multiple steps directly
      under it, wrap the decorator's existing child with a multi-child
      parent first, then insert the additional steps under that new
      multi-child parent.
  - id: program_draft_upsert_parameters
    effect: composer_draft_mutating
    description: |
      Declares or replaces program-level parameter declarations in the
      draft. Program parameters are typed values bound at program-load
      time and referenced by name from inside node parameters; they
      let the same node react to different inputs across runs without
      rewriting the tree. Use this tool when a request describes
      adding a new tunable knob, or changing the type or default of an
      existing one. The replacement is keyed by parameter name.
      Failure modes are limited to validation errors on the parameter
      declaration.
  - id: program_draft_remove_parameters
    effect: composer_draft_mutating
    description: |
      Removes program-level parameter declarations from the draft. If
      a node's parameter still references the removed name, the
      program will fail validation; the caller is responsible for
      clearing those references first.
  - id: blackboard_draft_upsert_namespaces
    effect: composer_draft_mutating
    description: |
      Declares or replaces blackboard namespace declarations in the
      draft. Blackboard namespaces group related runtime values
      written by one node and read by others, with a contract
      describing the expected shape. Use this tool when a request
      introduces a new flow of data between nodes during execution, or
      revises an existing such flow. The replacement is keyed by
      namespace identifier.
  - id: blackboard_draft_remove_namespaces
    effect: composer_draft_mutating
    description: |
      Removes blackboard namespace declarations from the draft. If any
      node still binds to the removed namespace, the program will fail
      validation.
  - id: blackboard_draft_upsert_keys
    effect: composer_draft_mutating
    description: |
      Declares or replaces blackboard key declarations in the draft. A
      blackboard key names a typed slot that nodes can read or write.
      Use this tool when a request introduces a new piece of runtime
      state shared between nodes, or revises an existing key's type.
  - id: blackboard_draft_remove_keys
    effect: composer_draft_mutating
    description: |
      Removes blackboard key declarations from the draft. If any node
      still binds to the removed key, the program will fail validation.

prompt_templates:
  select_scene_object_v1:
    version: "1"
    template_text: >-
      You are selecting the next object for a perception-guided pick cycle.
      Use the authoritative backend scene manifest as the primary source of
      truth for object IDs, poses, shapes, sizes, and spatial semantics.
      If an image is attached, use it only as auxiliary evidence for
      attributes that are not already explicit in the manifest.
      Selection request:
      `{{ selection_request_text }}`

      Authoritative scene context JSON:
      {{ scene_context_json }}

      You must answer by calling the `select_scene_object` tool.
      Use the exact candidate object ID when outcome=`selected`.
      Use an empty string for `selected_object_id` when outcome is
      `no_match` or `ambiguous`.
    response_tool:
      name: select_scene_object
      description: Choose one candidate object from the current runtime scene context.
      parameters:
        type: object
        required: [outcome, selected_object_id, confidence, reason]
        properties:
          outcome:
            type: string
            enum: [selected, no_match, ambiguous]
          selected_object_id:
            type: string
            x-manyforge-enum-template-variable: candidate_object_ids
            x-manyforge-enum-allow-empty-string: true
          confidence:
            type: number
          reason:
            type: string
          matched_attributes:
            type: array
            items:
              type: string
          request_interpretation:
            type: string
          candidate_assessments:
            type: array
            items:
              type: object
              properties:
                object_id:
                  type: string
                  x-manyforge-enum-template-variable: candidate_object_ids
                matches_request:
                  type: boolean
                match:
                  type: boolean
                confidence:
                  type: number
                rationale:
                  type: string
                evaluation:
                  type: string
          missing_information:
            type: array
            items:
              type: string
          diagnostic_notes:
            type: string
