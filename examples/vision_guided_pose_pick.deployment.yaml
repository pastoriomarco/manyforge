    "prompt_templates": {
      "infer_grasp_pose_v1": {
        "response_contract": {
          "response_mode": "json_object"
        },
        "template_text": "You are planning a top-down pick for a UR5 cell. Inspect the attached scene snapshot and choose exactly one visible target: `left_part` or `right_part`. Return JSON only with: - `selected_object_id`: string, one of `left_part` or `right_part` - `approach_pose`: object with `position_m` and `orientation_rpy_deg` - `grasp_pose`: object with `position_m` and `orientation_rpy_deg` - `confidence`: number from 0.0 to 1.0 - `reason`: short string Both poses must be expressed in `base_link`. Use a top-down tool orientation `[180.0, 0.0, -90.0]`. `approach_pose` should be above the part, and `grasp_pose` should be the final descend target.",
        "variable_ids": [],
        "version": "1"
      }
    },
