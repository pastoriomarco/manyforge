api_version: manyforge.deployment.v0
schema_version: "0.1.0"
name: ur5_roboplan_local_vision_guided_pick
description: >-
  Local deployment for the vision-guided bin-pick example. Requires the HMI to
  be running with at least one connected Viser client so `query_model` can
  attach a live scene snapshot.

program_profile: v0.1

robot_config:
  robot_id: ur5
  group_id: arm
  urdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.urdf
  srdf_path: package://roboplan_example_models/models/ur_robot_model/ur5_gripper.srdf
  global_max_tcp_linear_speed_mps: 0.25

adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - planning.motion.joint_goal
      - planning.motion.pose_goal
      - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - context.state.current
      - context.validation.trajectory
      - context.collision.check
      - context.kinematics.fk
      - context.pose.resolve_reference
      - context.scene.object_query
      - context.limits.joint
      - scene.shape.box
      - scene.shape.sphere
      - scene.edit.add
      - scene.edit.remove
      - scene.edit.update_pose
      - scene.edit.attach_detach
      - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.roboplan_native
    adapter_version: "0.1.0"
    supported_profiles: ["v0.1"]
    capability_keys:
      - execution.trajectory.execute
      - execution.feedback.phase_events
      - execution.feedback.state_snapshots
      - execution.stop.soft
      - execution.pause
      - execution.resume
      - execution.reset
    config:
      mode: simulated
      execution_tick_hz: 100
      initial_joint_positions_rad: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]

orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 10.0

launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true

model_audit_policy:
  store_full_prompts: false
  store_full_responses: false
  redact_argument_values: true

model_endpoint_profile_registry: model_endpoint_profiles.yaml

model_endpoints:
  vision_model:
    profile_ref: thor_manyforge_qwen36
    max_tokens: 512

prompt_templates:
  choose_bin_target_v1:
    version: "1"
    template_text: >-
      You are selecting the next object for a pick-and-place cycle.
      Inspect the attached scene snapshot and choose exactly one target:
      the left object (`left_part`) or the right object (`right_part`).
      Prefer a target that is clearly visible and isolated.
      Return JSON only with:
      - `pick_left_bin`: boolean
      - `selected_object_id`: string, one of `left_part` or `right_part`
      - `confidence`: number from 0.0 to 1.0
      - `reason`: short string
    output_schema:
      type: object
      required: [pick_left_bin, selected_object_id, confidence, reason]
      properties:
        pick_left_bin:
          type: boolean
        selected_object_id:
          type: string
        confidence:
          type: number
        reason:
          type: string
