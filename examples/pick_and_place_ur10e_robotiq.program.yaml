api_version: manyforge.program.v2
program_id: pick_and_place_ur10e_robotiq_demo
program_revision: sha256:ce15ba524de796df2626cc423c56cc179ab8778e00edd9872db144ff196a0c12
program_profile: composable-cell-v1
name: pick_and_place_ur10e_robotiq_demo
description: >-
  Pick-and-place demo for the source-local UR10e and Robotiq 2F-140 model.
  It preserves the approach, pick, carried-object, place, detach, retreat, and
  rest sequence together with the Robotiq finger-joint coordinate semantics.
catalog:
  api_version: manyforge.node_catalog.v2
  content_version: 2.0.0
compatibility:
  lanes: [manyforge-only]
  assistant: optional
  requires: [robotiq_2f_140_gripper]
  tags: [pick-and-place, robotiq, ur10e]
component_roles:
  robot:
    required_component_type_tags: [articulated-arm]
    required_model_roles: [arm_model]
  tool:
    required_component_type_tags: [gripper]
target_roles:
  arm:
    component_role: robot
    required_capabilities:
      - capability_id: execution.feedback.phase_events
        parameters: {}
        disposition: required
      - capability_id: execution.trajectory.execute
        parameters: {}
        disposition: required
      - capability_id: planning.motion.joint_goal
        parameters: {}
        disposition: required
      - capability_id: planning.motion.pose_goal
        parameters: {}
        disposition: required
      - capability_id: planning.profile.balanced
        parameters: {}
        disposition: required
      - capability_id: planning.trajectory.time_parameterized
        parameters: {}
        disposition: required
      - capability_id: state.observed.current
        parameters: {}
        disposition: required
      - capability_id: validation.trajectory.non_collision
        parameters: {}
        disposition: required
    required_frame_roles: [base, tcp]
    required_resource_roles: [arm_joints]
    required_collision_body_roles: [arm_collision]
    required_model_roles: [arm_model]
  gripper:
    component_role: tool
    required_capabilities:
      - capability_id: model.kinematics.fk
        parameters: {}
        disposition: required
      - capability_id: tool.gripper.command
        parameters: {}
        disposition: required
      - capability_id: tool.gripper.feedback
        parameters: {}
        disposition: required
    required_frame_roles: [tcp]
    required_resource_roles: [fingers]
    required_collision_body_roles: [gripper_collision]
scene:
  - scene_resource_id: graspable
    shape:
      type: box
      box_dimensions_m: [0.1, 0.01, 0.01]
    pose:
      frame_ref: {kind: cell_frame}
      position_m: [0.3, -0.3, 0.15]
      orientation: {xyzw: [0.0, 0.0, -0.3826834323650898, 0.9238795325112867]}
    resource_roles: [pick_object]
  - scene_resource_id: ground
    shape:
      type: box
      box_dimensions_m: [1.0, 1.0, 0.2]
    pose:
      frame_ref: {kind: cell_frame}
      position_m: [0.0, 0.0, -0.11]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
parameters:
  - parameter_id: velocity_scale
    type: float64
    default: 0.5
    constraints: {min_exclusive: 0.0, max_inclusive: 1.0}
    runtime_mutability: before_run
    description: Velocity scale for all moves.
tree:
  node_id: sequence
  instance_id: pick_and_place
  parameters: {}
  children:
    - node_id: gripper.command_position
      instance_id: command_gripper
      parameters:
        target_role: gripper
        position: {kind: angular_rad, value_rad: 0.0}
        max_effort: {kind: angular_newton_meter, value_nm: 40.0}
        command_duration_s: 1.0
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_pick_approach
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: scene_resource, scene_resource_id: graspable}
        goal:
          position_m: [0.0, 0.0, 0.1]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale:
          kind: program_parameter
          reference: velocity_scale
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_pick
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: scene_resource, scene_resource_id: graspable}
        goal:
          position_m: [0.0, 0.0, 0.025]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale:
          kind: program_parameter
          reference: velocity_scale
      children: []
    - node_id: gripper.command_position
      instance_id: close_gripper
      parameters:
        target_role: gripper
        position: {kind: angular_rad, value_rad: 0.66}
        max_effort: {kind: angular_newton_meter, value_nm: 40.0}
        command_duration_s: 1.0
      children: []
    - node_id: scene.attach_carried_object
      instance_id: attach_graspable
      parameters:
        scene_resource_id: graspable
        target_role: gripper
        carrier_frame_role: tcp
        touch_body_roles: [gripper_collision]
      children: []
    - node_id: motion.move_to_pose
      instance_id: pick_retreat
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference: {type: frame_role, frame_role_id: tcp}
        goal:
          position_m: [0.0, 0.0, -0.1]
          orientation: {rpy_deg: [0.0, 0.0, 0.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale:
          kind: program_parameter
          reference: velocity_scale
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_drop_approach
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference:
          type: pose
          pose:
            frame_ref: {kind: target_frame, target_role: arm, frame_role: base}
            position_m: [0.3, 0.3, 0.05]
            orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.1]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale:
          kind: program_parameter
          reference: velocity_scale
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_drop
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        goal:
          frame_ref: {kind: target_frame, target_role: arm, frame_role: base}
          position_m: [0.3, 0.3, 0.05]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        joint_position_tol_rad: 0.05
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale:
          kind: program_parameter
          reference: velocity_scale
      children: []
    - node_id: gripper.command_position
      instance_id: open_gripper
      parameters:
        target_role: gripper
        position: {kind: angular_rad, value_rad: 0.0}
        max_effort: {kind: angular_newton_meter, value_nm: 40.0}
        command_duration_s: 1.0
      children: []
    - node_id: scene.detach_carried_object
      instance_id: detach_graspable
      parameters:
        scene_resource_id: graspable
        target_role: gripper
      children: []
    - node_id: motion.move_to_pose
      instance_id: drop_retreat
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        target_mode: relative
        target_reference:
          type: pose
          pose:
            frame_ref: {kind: target_frame, target_role: arm, frame_role: base}
            position_m: [0.3, 0.3, 0.05]
            orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.1]
          orientation: {rpy_deg: [180.0, 0.0, -180.0]}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale:
          kind: program_parameter
          reference: velocity_scale
      children: []
    - node_id: motion.move_to_joint_target
      instance_id: return_rest
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_frame_role: tcp
        goal:
          - {joint_name: shoulder_pan_joint, position_rad: 0.0}
          - {joint_name: shoulder_lift_joint, position_rad: -1.57}
          - {joint_name: elbow_joint, position_rad: 1.57}
          - {joint_name: wrist_1_joint, position_rad: -1.57}
          - {joint_name: wrist_2_joint, position_rad: -1.57}
          - {joint_name: wrist_3_joint, position_rad: 0.0}
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      value_sources:
        velocity_scale:
          kind: program_parameter
          reference: velocity_scale
      children: []
