name: pick_and_place_ur10e_robotiq_demo
description: Pick-and-place demo for the source-local UR10e and Robotiq 2F-140 model. It preserves the
  approach, pick, carried-object, place, detach, retreat, and rest sequence together with the Robotiq
  finger-joint coordinate semantics.
catalog:
  api_version: manyforge.node_catalog.v3
  content_version: 3.0.0
compatibility:
  lanes:
  - manyforge-only
  assistant: optional
  requires:
  - robotiq_2f_140_gripper
  tags:
  - pick-and-place
  - robotiq
  - ur10e
scene:
- scene_resource_id: graspable
  shape:
    type: box
    box_dimensions_m:
    - 0.1
    - 0.01
    - 0.01
  pose:
    frame_ref:
      kind: cell_frame
    position_m:
    - 0.3
    - -0.3
    - 0.15
    orientation:
      xyzw:
      - 0.0
      - 0.0
      - -0.3826834323650898
      - 0.9238795325112867
  resource_roles:
  - pick_object
- scene_resource_id: ground
  shape:
    type: box
    box_dimensions_m:
    - 1.0
    - 1.0
    - 0.2
  pose:
    frame_ref:
      kind: cell_frame
    position_m:
    - 0.0
    - 0.0
    - -0.11
    orientation:
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
parameters:
- parameter_id: velocity_scale
  type: float64
  default: 0.5
  constraints:
    min_exclusive: 0.0
    max_inclusive: 1.0
  description: Velocity scale for all moves.
