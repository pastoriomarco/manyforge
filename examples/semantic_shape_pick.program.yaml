api_version: manyforge.program.v2
program_id: semantic_shape_pick
program_revision: sha256:5fede5c65a6dd59c001d809f94d29783bdd9ecd22277960d6737f693b8daedcb
program_profile: composable-cell-v1
name: semantic_shape_pick
description: >-
  Semantic object-selection demo. Deterministic nodes build and validate a
  retained scene-selection context around one bounded model request. A C++
  planning preview supplies portable approach, pick, and retreat poses; the
  original explicit motion, logical gripper, carried-object, and place sequence
  remains visible in the Program.
catalog:
  api_version: manyforge.node_catalog.v2
  content_version: 2.8.0
compatibility:
  lanes: [manyforge-only]
  assistant: required
  requires: [semantic_shape_inference]
  tags: [semantic-pick, ur5]
component_roles:
  robot:
    required_component_type_tags: [articulated-arm]
    required_model_roles: [arm_model]
  tool:
    required_component_type_tags: [gripper]
target_roles:
  arm:
    component_role: robot
    required_capabilities:
      - capability_id: execution.feedback.phase_events
        parameters: {}
        disposition: required
      - capability_id: execution.trajectory.execute
        parameters: {}
        disposition: required
      - capability_id: model.kinematics.fk
        parameters: {}
        disposition: required
      - capability_id: planning.motion.cartesian_path
        parameters: {}
        disposition: required
      - capability_id: planning.motion.pose_goal
        parameters: {}
        disposition: required
      - capability_id: planning.profile.balanced
        parameters: {}
        disposition: required
      - capability_id: planning.profile.first_feasible
        parameters: {}
        disposition: required
      - capability_id: planning.trajectory.time_parameterized
        parameters: {}
        disposition: required
      - capability_id: state.observed.current
        parameters: {}
        disposition: required
      - capability_id: validation.trajectory.non_collision
        parameters: {}
        disposition: required
    required_frame_roles: [base, tcp]
    required_resource_roles: [arm_joints]
    required_collision_body_roles: [arm_collision]
    required_model_roles: [arm_model]
  gripper:
    component_role: tool
    required_capabilities:
      - capability_id: model.kinematics.fk
        parameters: {}
        disposition: required
      - capability_id: tool.gripper.command
        parameters: {}
        disposition: required
      - capability_id: tool.gripper.feedback
        parameters: {}
        disposition: required
    required_frame_roles: [tcp]
    required_resource_roles: [fingers]
    required_collision_body_roles: [gripper_collision]
scene:
  - scene_resource_id: cube_part
    shape:
      type: box
      box_dimensions_m: [0.02, 0.02, 0.02]
    pose:
      frame_ref:
        kind: component_frame
        component_role: robot
        model_role: arm_model
        frame_role: base
      position_m: [0.4, 0.14, 0.009]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    resource_roles: [pick_candidate]
  - scene_resource_id: sphere_part
    shape:
      type: sphere
      sphere_radius_m: 0.01
    pose:
      frame_ref:
        kind: component_frame
        component_role: robot
        model_role: arm_model
        frame_role: base
      position_m: [0.4, -0.14, 0.009]
      orientation: {rpy_deg: [0.0, 0.0, 0.0]}
    resource_roles: [pick_candidate]
  - scene_resource_id: table
    shape:
      type: box
      box_dimensions_m: [0.8, 0.6, 0.04]
    pose:
      frame_ref:
        kind: component_frame
        component_role: robot
        model_role: arm_model
        frame_role: base
      position_m: [0.45, 0.0, -0.121]
      orientation: {xyzw: [0.0, 0.0, 0.0, 1.0]}
blackboard:
  namespaces:
    - namespace_id: planning
      owner: program
    - namespace_id: selection
      owner: program
  keys:
    - key: gripper_closed
      type: bool
      access: read_write
      persistence: run
      description: Intentionally simulated gripper closed/open state.
    - key: planning.pick_plan
      type: pick_planning_result
      access: read_write
      persistence: run
      fields:
        - {field: approach_pose, type: stored_pose}
        - {field: descend_path, type: cartesian_path}
        - {field: pick_pose, type: stored_pose}
        - {field: retreat_path, type: cartesian_path}
        - {field: retreat_pose, type: stored_pose}
        - {field: selected_object_id, type: scene_resource}
        - {field: tool_position, type: coordinate_position}
    - key: selected_object
      type: scene_resource
      access: read_write
      persistence: run
      description: Operation-scoped selected-object binding for contact policy resolution.
    - key: selection.context
      type: scene_selection_context
      access: read_write
      persistence: run
      fields:
        - {field: candidate_object_ids, type: string_list}
        - {field: scene_context_json, type: string}
        - {field: selection_request_text, type: string}
    - key: selection.response
      type: model_response
      access: read_write
      persistence: run
      fields:
        - {field: confidence, type: float64}
        - {field: matched_attributes, type: string_list}
        - {field: outcome, type: string}
        - {field: reason, type: string}
        - {field: selected_object_id, type: scene_resource}
    - key: selection.validated
      type: scene_selection_result
      access: read_write
      persistence: run
      fields:
        - {field: confidence, type: float64}
        - {field: matched_attributes, type: string_list}
        - {field: outcome, type: string}
        - {field: reason, type: string}
        - {field: selected_object_id, type: scene_resource}
contact_policies:
  - api_version: manyforge.contact_policy.v1
    policy_id: selected_object_grasp
    version: sha256:13cce018403acdc3768ed8f1e86656fa482cf40aa3a1eb7984cd6c93e9acc47c
    mode: contact_grasp
    sensing_mode: geometry_only
    default_unmatched_response: hard_stop
    zones:
      - zone_id: tool_contact
        body_pairs:
          - body_a:
              kind: component_model_body
              component_role_id: tool
              collision_body_role_id: gripper_collision
            body_b:
              kind: runtime_object
              runtime_object_id: selected_object
        violation_response: hard_stop
        max_penetration_m: 0.002
        terminal_window_start_fraction: 0.8
tree:
  node_id: sequence
  instance_id: semantic_shape_pick_cycle
  parameters: {}
  children:
    - node_id: assistant.build_scene_selection
      instance_id: build_selection_context
      parameters:
        selection_request_text: Select the sphere object.
        output_key: selection.context
        object_source: backend_scene
        candidate_object_ids: [sphere_part, cube_part]
        image_source: none
      children: []
    - node_id: assistant.query_model
      instance_id: choose_scene_object
      parameters:
        model_endpoint_alias: selection_model
        prompt_template_id: select_scene_object_v1
        scene_attachment: none
        output_key: selection.response
        timeout_s: 20.0
        min_confidence: 0.7
      value_sources:
        template_variables.candidate_object_ids:
          kind: blackboard_field
          reference: selection.context
          field: candidate_object_ids
        template_variables.scene_context_json:
          kind: blackboard_field
          reference: selection.context
          field: scene_context_json
        template_variables.selection_request_text:
          kind: blackboard_field
          reference: selection.context
          field: selection_request_text
      children: []
    - node_id: assistant.validate_scene_selection
      instance_id: validate_selected_object
      parameters:
        selection_context_key: selection.context
        selection_response_key: selection.response
        output_key: selection.validated
        allow_no_match: false
        allow_ambiguous: false
      children: []
    - node_id: planning.plan_pick_sequence
      instance_id: plan_selected_object_pick
      parameters:
        target_role: arm
        tool_target_role: gripper
        base_frame_role: base
        tcp_endpoint: {target_role: arm, frame_role: tcp}
        carrier_frame_role: tcp
        synthesis:
          pick_offset_envelope:
            position_min_m: [0.0, 0.0, 0.04]
            position_max_m: [0.0, 0.0, 0.04]
            orientation_rpy_min_deg: [0.0, 0.0, 0.0]
            orientation_rpy_max_deg: [0.0, 0.0, 0.0]
          approach_offset_envelope:
            position_min_m: [0.0, 0.0, 0.05]
            position_max_m: [0.0, 0.0, 0.1]
            orientation_rpy_min_deg: [0.0, 0.0, 0.0]
            orientation_rpy_max_deg: [0.0, 0.0, 0.0]
          translation_step_m: 0.025
          rotation_step_deg: 15.0
          search_strategy: best_cost
        motion_options:
          approach_velocity_scale: 0.3
          descend_velocity_scale: 0.3
          retreat_velocity_scale: 0.3
          planning_timeout_s: 5.0
        tool_position: {kind: named_preset, name: closed}
        output_key: planning.pick_plan
        contact_policy_id: selected_object_grasp
      value_sources:
        selected_object_id:
          kind: blackboard_field
          reference: selection.validated
          field: selected_object_id
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_planned_approach_pose
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_endpoint: {target_role: arm, frame_role: tcp}
        velocity_scale: 0.3
      value_sources:
        goal:
          kind: blackboard_field
          reference: planning.pick_plan
          field: approach_pose
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_planned_pick_pose
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_endpoint: {target_role: arm, frame_role: tcp}
        velocity_scale: 0.2
      value_sources:
        goal:
          kind: blackboard_field
          reference: planning.pick_plan
          field: pick_pose
      children: []
    - node_id: gripper.command_position
      instance_id: close_gripper
      parameters:
        target_role: gripper
        position: {kind: named_preset, name: closed}
      children: []
    - node_id: scene.attach_carried_object
      instance_id: attach_selected_object
      parameters:
        target_role: gripper
        carrier_frame_role: tcp
        touch_body_roles: [gripper_collision]
      value_sources:
        scene_resource_id:
          kind: blackboard_field
          reference: planning.pick_plan
          field: selected_object_id
      children: []
    - node_id: motion.move_to_pose
      instance_id: retreat_after_pick
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_endpoint: {target_role: arm, frame_role: tcp}
        velocity_scale: 0.3
      value_sources:
        goal:
          kind: blackboard_field
          reference: planning.pick_plan
          field: retreat_pose
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_place_approach
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_endpoint: {target_role: arm, frame_role: tcp}
        target_mode: relative
        target_reference:
          type: pose
          pose:
            frame_ref: {kind: target_frame, target_role: arm, frame_role: base}
            position_m: [0.22, 0.0, 0.3]
            orientation: {rpy_deg: [180.0, 0.0, 0.0]}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.08]
          orientation: {rpy_deg: [180.0, 0.0, 0.0]}
        velocity_scale: 0.3
      children: []
    - node_id: motion.move_to_pose
      instance_id: move_to_place_pose
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_endpoint: {target_role: arm, frame_role: tcp}
        goal:
          frame_ref: {kind: target_frame, target_role: arm, frame_role: base}
          position_m: [0.22, 0.0, 0.3]
          orientation: {rpy_deg: [180.0, 0.0, 0.0]}
        velocity_scale: 0.2
      children: []
    - node_id: gripper.command_position
      instance_id: open_gripper
      parameters:
        target_role: gripper
        position: {kind: named_preset, name: open}
      children: []
    - node_id: scene.detach_carried_object
      instance_id: detach_selected_object
      parameters:
        target_role: gripper
      value_sources:
        scene_resource_id:
          kind: blackboard_field
          reference: planning.pick_plan
          field: selected_object_id
      children: []
    - node_id: motion.move_to_pose
      instance_id: retreat_after_place
      parameters:
        target_role: arm
        base_frame_role: base
        tcp_endpoint: {target_role: arm, frame_role: tcp}
        target_mode: relative
        target_reference:
          type: pose
          pose:
            frame_ref: {kind: target_frame, target_role: arm, frame_role: base}
            position_m: [0.22, 0.0, 0.3]
            orientation: {rpy_deg: [180.0, 0.0, 0.0]}
        offset_reference: {type: frame_role, frame_role_id: base}
        goal:
          position_m: [0.0, 0.0, 0.08]
          orientation: {rpy_deg: [180.0, 0.0, 0.0]}
        velocity_scale: 0.3
      children: []
