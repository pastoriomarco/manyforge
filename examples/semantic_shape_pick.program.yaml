api_version: manyforge.program.v3
program_id: semantic_shape_pick
program_revision: sha256:b337631267104c2383f626df2003deb5fa41a5ac8923614793548cf0501b0b95
program_profile: composable-cell-v1
name: semantic_shape_pick
description: Semantic object-selection demo. Deterministic nodes build and validate a retained scene-selection
  context around one bounded model request. A C++ planning preview supplies portable approach, pick, and
  retreat poses; the original explicit motion, logical gripper, carried-object, and place sequence remains
  visible in the Program.
catalog:
  api_version: manyforge.node_catalog.v3
  content_version: 3.0.0
compatibility:
  lanes:
  - manyforge-only
  assistant: required
  requires:
  - semantic_shape_inference
  tags:
  - semantic-pick
  - ur5
scene:
- scene_resource_id: cube_part
  shape:
    type: box
    box_dimensions_m:
    - 0.02
    - 0.02
    - 0.02
  pose:
    frame_ref:
      kind: component_frame
      frame:
        component_id: ur5_robot
        frame_id: base
    position_m:
    - 0.4
    - 0.14
    - 0.009
    orientation:
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
  resource_roles:
  - pick_candidate
- scene_resource_id: sphere_part
  shape:
    type: sphere
    sphere_radius_m: 0.01
  pose:
    frame_ref:
      kind: component_frame
      frame:
        component_id: ur5_robot
        frame_id: base
    position_m:
    - 0.4
    - -0.14
    - 0.009
    orientation:
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
  resource_roles:
  - pick_candidate
- scene_resource_id: table
  shape:
    type: box
    box_dimensions_m:
    - 0.8
    - 0.6
    - 0.04
  pose:
    frame_ref:
      kind: component_frame
      frame:
        component_id: ur5_robot
        frame_id: base
    position_m:
    - 0.45
    - 0.0
    - -0.121
    orientation:
      xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
blackboard:
  namespaces:
  - namespace_id: planning
    owner: program
  - namespace_id: selection
    owner: program
  keys:
  - key: gripper_closed
    type: bool
    access: read_write
    persistence: run
    description: Intentionally simulated gripper closed/open state.
  - key: planning.pick_plan
    type: pick_planning_result
    access: read_write
    persistence: run
    fields:
    - field: approach_pose
      type: stored_pose
    - field: descend_path
      type: cartesian_path
    - field: pick_pose
      type: stored_pose
    - field: retreat_path
      type: cartesian_path
    - field: retreat_pose
      type: stored_pose
    - field: selected_object_id
      type: scene_resource
    - field: tool_position
      type: coordinate_position
  - key: selected_object
    type: scene_resource
    access: read_write
    persistence: run
    description: Operation-scoped selected-object binding for contact policy resolution.
  - key: selection.context
    type: scene_selection_context
    access: read_write
    persistence: run
    fields:
    - field: candidate_object_ids
      type: string_list
    - field: scene_context_json
      type: string
    - field: selection_request_text
      type: string
  - key: selection.response
    type: model_response
    access: read_write
    persistence: run
    fields:
    - field: confidence
      type: float64
    - field: matched_attributes
      type: string_list
    - field: outcome
      type: string
    - field: reason
      type: string
    - field: selected_object_id
      type: scene_resource
  - key: selection.validated
    type: scene_selection_result
    access: read_write
    persistence: run
    fields:
    - field: confidence
      type: float64
    - field: matched_attributes
      type: string_list
    - field: outcome
      type: string
    - field: reason
      type: string
    - field: selected_object_id
      type: scene_resource
contact_policies:
- api_version: manyforge.contact_policy.v1
  policy_id: selected_object_grasp
  version: sha256:cdd5cd17bdd43f72582cbc09806d1ebbe2e658b8ad896b3ce040e5a842a79977
  mode: contact_grasp
  sensing_mode: geometry_only
  default_unmatched_response: hard_stop
  zones:
  - zone_id: tool_contact
    body_pairs:
    - body_a:
        kind: component_model_body
        body:
          component_id: robotiq_2f_85
          collision_body_id: gripper_collision
      body_b:
        kind: runtime_object
        runtime_object_id: selected_object
    violation_response: hard_stop
    max_penetration_m: 0.002
    terminal_window_start_fraction: 0.8
tree:
  node_id: sequence
  instance_id: semantic_shape_pick_cycle
  parameters: {}
  children:
  - node_id: assistant.build_scene_selection
    instance_id: build_selection_context
    parameters:
      selection_request_text: Select the sphere object.
      output_key: selection.context
      object_source: backend_scene
      candidate_object_ids:
      - sphere_part
      - cube_part
      image_source: none
    children: []
  - node_id: assistant.query_model
    instance_id: choose_scene_object
    parameters:
      model_endpoint_alias: selection_model
      prompt_template_id: select_scene_object_v1
      scene_attachment: none
      output_key: selection.response
      timeout_s: 20.0
      min_confidence: 0.7
    children: []
    value_sources:
      template_variables.candidate_object_ids:
        kind: blackboard_field
        reference: selection.context
        field: candidate_object_ids
      template_variables.scene_context_json:
        kind: blackboard_field
        reference: selection.context
        field: scene_context_json
      template_variables.selection_request_text:
        kind: blackboard_field
        reference: selection.context
        field: selection_request_text
  - node_id: assistant.validate_scene_selection
    instance_id: validate_selected_object
    parameters:
      selection_context_key: selection.context
      selection_response_key: selection.response
      output_key: selection.validated
      allow_no_match: false
      allow_ambiguous: false
    children: []
  - node_id: planning.plan_pick_sequence
    instance_id: plan_selected_object_pick
    parameters:
      tool_completion_timeout_s: 15.0
      target:
        component_id: ur5_robot
        command_target_id: arm
      tool_target:
        component_id: robotiq_2f_85
        command_target_id: gripper
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      carrier_frame_ref:
        component_id: robotiq_2f_85
        frame_id: tcp
      synthesis:
        pick_offset_envelope:
          position_min_m:
          - 0.0
          - 0.0
          - 0.04
          position_max_m:
          - 0.0
          - 0.0
          - 0.04
          orientation_rpy_min_deg:
          - 0.0
          - 0.0
          - 0.0
          orientation_rpy_max_deg:
          - 0.0
          - 0.0
          - 0.0
        approach_offset_envelope:
          position_min_m:
          - 0.0
          - 0.0
          - 0.05
          position_max_m:
          - 0.0
          - 0.0
          - 0.1
          orientation_rpy_min_deg:
          - 0.0
          - 0.0
          - 0.0
          orientation_rpy_max_deg:
          - 0.0
          - 0.0
          - 0.0
        translation_step_m: 0.025
        rotation_step_deg: 15.0
        search_strategy: best_cost
      motion_options:
        approach_velocity_scale: 0.3
        descend_velocity_scale: 0.3
        retreat_velocity_scale: 0.3
        planning_timeout_s: 5.0
      tool_position:
        kind: named_preset
        name: closed
      output_key: planning.pick_plan
      contact_policy_id: selected_object_grasp
    children: []
    value_sources:
      selected_object_id:
        kind: blackboard_field
        reference: selection.validated
        field: selected_object_id
  - node_id: motion.move_to_pose
    instance_id: move_to_planned_approach_pose
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      velocity_scale: 0.3
    children: []
    value_sources:
      goal:
        kind: blackboard_field
        reference: planning.pick_plan
        field: approach_pose
  - node_id: motion.move_to_pose
    instance_id: move_to_planned_pick_pose
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      velocity_scale: 0.2
    children: []
    value_sources:
      goal:
        kind: blackboard_field
        reference: planning.pick_plan
        field: pick_pose
  - node_id: gripper.command_position
    instance_id: close_gripper
    parameters:
      completion_timeout_s: 15.0
      target:
        component_id: robotiq_2f_85
        command_target_id: gripper
      position:
        kind: named_preset
        name: closed
    children: []
  - node_id: scene.attach_carried_object
    instance_id: attach_selected_object
    parameters:
      target:
        component_id: robotiq_2f_85
        command_target_id: gripper
      carrier_frame_ref:
        component_id: robotiq_2f_85
        frame_id: tcp
      touch_bodies:
      - component_id: robotiq_2f_85
        collision_body_id: gripper_collision
    children: []
    value_sources:
      scene_resource_id:
        kind: blackboard_field
        reference: planning.pick_plan
        field: selected_object_id
  - node_id: motion.move_to_pose
    instance_id: retreat_after_pick
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      velocity_scale: 0.3
    children: []
    value_sources:
      goal:
        kind: blackboard_field
        reference: planning.pick_plan
        field: retreat_pose
  - node_id: motion.move_to_pose
    instance_id: move_to_place_approach
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      target_mode: relative
      target_reference:
        type: pose
        pose:
          frame_ref:
            kind: target_frame
            frame:
              component_id: ur5_robot
              frame_id: base
          position_m:
          - 0.22
          - 0.0
          - 0.3
          orientation:
            rpy_deg:
            - 180.0
            - 0.0
            - 0.0
      offset_reference:
        type: component_frame
        frame:
          component_id: ur5_robot
          frame_id: base
      goal:
        position_m:
        - 0.0
        - 0.0
        - 0.08
        orientation:
          rpy_deg:
          - 180.0
          - 0.0
          - 0.0
      velocity_scale: 0.3
    children: []
  - node_id: motion.move_to_pose
    instance_id: move_to_place_pose
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      goal:
        frame_ref:
          kind: target_frame
          frame:
            component_id: ur5_robot
            frame_id: base
        position_m:
        - 0.22
        - 0.0
        - 0.3
        orientation:
          rpy_deg:
          - 180.0
          - 0.0
          - 0.0
      velocity_scale: 0.2
    children: []
  - node_id: gripper.command_position
    instance_id: open_gripper
    parameters:
      completion_timeout_s: 15.0
      target:
        component_id: robotiq_2f_85
        command_target_id: gripper
      position:
        kind: named_preset
        name: open
    children: []
  - node_id: scene.detach_carried_object
    instance_id: detach_selected_object
    parameters:
      target:
        component_id: robotiq_2f_85
        command_target_id: gripper
    children: []
    value_sources:
      scene_resource_id:
        kind: blackboard_field
        reference: planning.pick_plan
        field: selected_object_id
  - node_id: motion.move_to_pose
    instance_id: retreat_after_place
    parameters:
      target:
        component_id: ur5_robot
        command_target_id: arm
      base_frame:
        component_id: ur5_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      target_mode: relative
      target_reference:
        type: pose
        pose:
          frame_ref:
            kind: target_frame
            frame:
              component_id: ur5_robot
              frame_id: base
          position_m:
          - 0.22
          - 0.0
          - 0.3
          orientation:
            rpy_deg:
            - 180.0
            - 0.0
            - 0.0
      offset_reference:
        type: component_frame
        frame:
          component_id: ur5_robot
          frame_id: base
      goal:
        position_m:
        - 0.0
        - 0.0
        - 0.08
        orientation:
          rpy_deg:
          - 180.0
          - 0.0
          - 0.0
      velocity_scale: 0.3
    children: []
