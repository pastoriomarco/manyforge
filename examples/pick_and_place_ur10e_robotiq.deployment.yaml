api_version: manyforge.deployment.v0
schema_version: 0.1.0
name: ur10e_robotiq_pick_place_preview
description: Preview deployment for UR10e + Robotiq 2F-140 native RoboPlan pick-and-place
  demo.
program_profile: v0.1
grasp_risk_policy:
  open_loop_grasp:
    allowed: true
    scope: simulation
    rationale: >-
      Native Robotiq preview uses simulated gripper state and attach actions
      without an independent grasp confirmation source.
robot_config:
  robot_id: ur10e
  group_id: arm
  urdf_path: package://manyforge_example_models/models/ur10e_robotiq_2f_140/ur10e_robotiq_2f_140.urdf
  srdf_path: package://manyforge_example_models/models/ur10e_robotiq_2f_140/ur10e_robotiq_2f_140.srdf
  package_paths:
  - ..
  global_max_tcp_linear_speed_mps: 0.25
grippers:
  primary:
    command_mode: simulated_joint
    group_id: gripper
    joint_name: finger_joint
    motion_time_s: 0.8
    description: Native simulated Robotiq 2F-140 finger actuation.
    touch_links:
    - robotiq_base_link
    - left_outer_knuckle
    - left_outer_finger
    - left_inner_knuckle
    - left_inner_finger
    - left_inner_finger_pad
    - right_outer_knuckle
    - right_outer_finger
    - right_inner_knuckle
    - right_inner_finger
    - right_inner_finger_pad
    mount_frame: tool0
    attach_frame: grasp_frame
    tcp_frame: grasp_frame
    auxiliary_frames:
    - gripper_frame
adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - planning.motion.joint_goal
    - planning.motion.pose_goal
    - planning.motion.cartesian_path
    - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - context.state.current
    - context.validation.trajectory
    - context.collision.check
    - context.collision.check.detailed
    - context.kinematics.fk
    - context.limits.joint
    - context.pose.resolve_reference
    - context.scene.object_query
    - scene.shape.box
    - scene.shape.sphere
    - scene.shape.cylinder
    - scene.shape.mesh
    - scene.edit.add
    - scene.edit.upsert
    - scene.edit.remove
    - scene.edit.update_pose
    - scene.edit.attach_detach
    - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.roboplan_native
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - execution.trajectory.execute
    - execution.feedback.phase_events
    - execution.feedback.state_snapshots
    - execution.stop.soft
    - execution.pause
    - execution.resume
    - execution.reset
    - tool.gripper.command
    - tool.gripper.feedback
    config:
      mode: simulated
      execution_tick_hz: 100
      initial_joint_positions_rad:
      - 0
      - -1.57
      - 1.57
      - -1.57
      - -1.57
      - 0
      operator_stop_profile:
        profile_id: operator_soft_on_path
        stop_mode: soft_on_path
        deceleration_time_s: 1
        require_backend_confirmation: true
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10
          shoulder_lift_joint: 10
          elbow_joint: 10
          wrist_1_joint: 10
          wrist_2_joint: 10
          wrist_3_joint: 10
          finger_joint: 10
          left_inner_knuckle_joint: 10
          left_inner_finger_joint: 10
          right_outer_knuckle_joint: 10
          right_inner_knuckle_joint: 10
          right_inner_finger_joint: 10
        allow_natural_completion_on_short_path: true
      default_fault_stop_profile:
        profile_id: fault_spring_back_hold
        stop_mode: spring_back_hold
        deceleration_time_s: 1
        require_backend_confirmation: true
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10
          shoulder_lift_joint: 10
          elbow_joint: 10
          wrist_1_joint: 10
          wrist_2_joint: 10
          wrist_3_joint: 10
          finger_joint: 10
          left_inner_knuckle_joint: 10
          left_inner_finger_joint: 10
          right_outer_knuckle_joint: 10
          right_inner_knuckle_joint: 10
          right_inner_finger_joint: 10
orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 50
launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true
