{
  "api_version": "manyforge.program.v2",
  "blackboard": {
    "keys": [
      {
        "access": "read_write",
        "description": "Intentionally simulated gripper closed/open state.",
        "key": "gripper_closed",
        "persistence": "run",
        "type": "bool"
      },
      {
        "access": "read_write",
        "fields": [
          {
            "field": "approach_pose",
            "type": "stored_pose"
          },
          {
            "field": "confidence",
            "type": "float64"
          },
          {
            "field": "grasp_pose",
            "type": "stored_pose"
          },
          {
            "field": "reason",
            "type": "string"
          },
          {
            "field": "selected_object_id",
            "type": "scene_resource"
          }
        ],
        "key": "perception.grasp_plan",
        "persistence": "run",
        "type": "model_response"
      }
    ],
    "namespaces": [
      {
        "namespace_id": "perception",
        "owner": "program"
      }
    ]
  },
  "catalog": {
    "api_version": "manyforge.node_catalog.v2",
    "content_version": "2.3.0"
  },
  "compatibility": {
    "assistant": "required",
    "lanes": [
      "manyforge-only"
    ],
    "requires": [
      "vision_pose_inference"
    ],
    "tags": [
      "ur5",
      "vision-pick"
    ]
  },
  "component_roles": {
    "robot": {
      "required_component_type_tags": [
        "articulated-arm"
      ],
      "required_model_roles": [
        "arm_model"
      ]
    }
  },
  "description": "Preview Program for the typed vision-guided pose dataflow. A model response supplies bounded approach and grasp poses in the target base frame; motion nodes consume those fields directly. It remains intentionally fail-closed when a single-image model invents unreachable metric coordinates rather than grounding them in an authoritative pose source.",
  "forest": [
    {
      "children": [
        {
          "children": [],
          "instance_id": "infer_grasp_pose",
          "node_id": "assistant.query_model",
          "parameters": {
            "min_confidence": 0.7,
            "model_endpoint_alias": "vision_model",
            "output_key": "perception.grasp_plan",
            "prompt_template_id": "infer_grasp_pose_v1",
            "scene_attachment": "snapshot_image",
            "scene_snapshot_format": "jpeg",
            "scene_snapshot_height": 480,
            "scene_snapshot_width": 640,
            "timeout_s": 90.0
          }
        },
        {
          "children": [],
          "instance_id": "move_to_approach_pose",
          "node_id": "motion.move_to_pose",
          "parameters": {
            "base_frame_role": "base",
            "target_role": "arm",
            "tcp_frame_role": "tcp",
            "velocity_scale": 0.35
          },
          "value_sources": {
            "goal": {
              "field": "approach_pose",
              "kind": "blackboard_field",
              "reference": "perception.grasp_plan"
            }
          }
        },
        {
          "children": [],
          "instance_id": "move_to_grasp_pose",
          "node_id": "motion.move_to_pose",
          "parameters": {
            "base_frame_role": "base",
            "target_role": "arm",
            "tcp_frame_role": "tcp",
            "velocity_scale": 0.2
          },
          "value_sources": {
            "goal": {
              "field": "grasp_pose",
              "kind": "blackboard_field",
              "reference": "perception.grasp_plan"
            }
          }
        },
        {
          "children": [],
          "instance_id": "close_gripper",
          "node_id": "logic.set_bool",
          "parameters": {
            "key": "gripper_closed",
            "value": true
          }
        },
        {
          "children": [],
          "instance_id": "retreat_after_grasp",
          "node_id": "motion.move_to_pose",
          "parameters": {
            "base_frame_role": "base",
            "goal": {
              "orientation": {
                "rpy_deg": [
                  180.0,
                  0.0,
                  -90.0
                ]
              },
              "position_m": [
                0.0,
                0.0,
                0.08
              ]
            },
            "offset_reference": {
              "frame_role_id": "base",
              "type": "frame_role"
            },
            "target_mode": "relative",
            "target_reference": {
              "frame_role_id": "tcp",
              "type": "frame_role"
            },
            "target_role": "arm",
            "tcp_frame_role": "tcp",
            "velocity_scale": 0.35
          }
        },
        {
          "children": [],
          "instance_id": "move_to_place_pose",
          "node_id": "motion.move_to_pose",
          "parameters": {
            "base_frame_role": "base",
            "goal": {
              "frame_ref": {
                "frame_role": "base",
                "kind": "target_frame",
                "target_role": "arm"
              },
              "orientation": {
                "rpy_deg": [
                  180.0,
                  0.0,
                  -90.0
                ]
              },
              "position_m": [
                0.22,
                0.0,
                0.3
              ]
            },
            "target_role": "arm",
            "tcp_frame_role": "tcp",
            "velocity_scale": 0.35
          }
        },
        {
          "children": [],
          "instance_id": "open_gripper",
          "node_id": "logic.set_bool",
          "parameters": {
            "key": "gripper_closed",
            "value": false
          }
        }
      ],
      "instance_id": "vision_guided_pose_pick_cycle",
      "node_id": "sequence",
      "parameters": {}
    }
  ],
