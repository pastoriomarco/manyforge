api_version: manyforge.external_node.v0
id: example_plc_write_bool
name: Example PLC Write Bool
version: 0.1.0
category: io
description: >-
  Demonstrates a bounded, cancellable write through a deployment-owned PLC
  client. This is a contract example, not a production PLC driver.
stability: experimental
kind: leaf
children:
  min: 0
  max: 0
profiles:
  min_profile: v0.0
runtime:
  language: python
  file: node.py
  class: ExamplePlcWriteBool
  py_trees: "==2.4.0"
  constructor: name_kwargs
  tick_thread_policy: nonblocking
required_capabilities:
  - plc.siemens.s7.write
runtime_resources:
  - id: plc_client
    type: plc_client
    access: read_write
    required: true
    alias_parameter: plc_client_id
parameters:
  - name: plc_client_id
    required: false
    default: default
    schema:
      type: string
    description: Deployment-owned PLC client alias.
  - name: tag
    required: true
    schema:
      type: string
    description: Logical PLC tag, not an endpoint or credential.
  - name: value
    required: true
    schema:
      type: bool
    description: Boolean value to write.
  - name: timeout_s
    required: false
    default: 1.0
    schema:
      type: float
      constraints:
        min_exclusive: 0.0
        max_inclusive: 10.0
    description: Maximum elapsed time before the node cancels the operation.
operator_stop_policy: continue
execution:
  blocking: false
  cancellable: true
  timeout_param: timeout_s
observability:
  emits_events: []
  consumes_events: []
