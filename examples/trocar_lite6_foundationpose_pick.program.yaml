api_version: manyforge.program.v3
program_id: trocar_lite6_foundationpose_pick
program_revision: sha256:eead1a0eec72be8bd4fe479ed37e4d3773905d7a07f922d29708b9665a32434a
program_profile: composable-cell-v1
name: trocar_lite6_foundationpose_pick
description: Retained Isaac-compatible Lite6 trocar pick Program. The Manager latches the FoundationPose
  observation for graspable immediately before planning; this Program then synthesizes and executes the
  original top-down pick and place sequence using the physical lite-gripper and typed simulator lifecycle.
  When another Active TCP is selected, pick offsets stay relative to the gripper TCP.
catalog:
  api_version: manyforge.node_catalog.v3
  content_version: 3.0.0
compatibility:
  lanes:
  - isaac-sim
  assistant: forbidden
  requires:
  - foundationpose
  - lite_gripper
  - ros2_control
  tags:
  - foundationpose
  - isaac-sim
  - lite6
  - pick-and-place
scene:
- scene_resource_id: graspable
  shape:
    type: box
    box_dimensions_m:
    - 0.089
    - 0.028
    - 0.028
  pose:
    frame_ref:
      kind: component_frame
      frame:
        component_id: isaac_lite6_trocar_robot
        frame_id: base
    position_m:
    - 0.18
    - -0.2
    - 0.08
    orientation:
      rpy_deg:
      - 0.0
      - 0.0
      - 0.0
  resource_roles:
  - pick_object
  metadata:
    support_contacts:
    - support_object_id: ground
      release_evidence_mode: signed_penetration
      enforce_max_start_penetration: true
      max_start_penetration_m: 0.03
      release_tolerance_m: 0.001
      min_release_progress_m: 0.0
      require_separation_by_end: true
      require_strictly_decreasing_penetration: true
      allow_recontact: false
- scene_resource_id: ground
  shape:
    type: box
    box_dimensions_m:
    - 1.0
    - 1.0
    - 0.1
  pose:
    frame_ref:
      kind: cell_frame
    position_m:
    - 0.0
    - 0.0
    - -0.06
    orientation:
      xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
- scene_resource_id: wall
  shape:
    type: box
    box_dimensions_m:
    - 1.0
    - 0.02
    - 0.2
  pose:
    frame_ref:
      kind: cell_frame
    position_m:
    - 0.0
    - -0.15
    - 0.09
    orientation:
      xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
parameters:
- parameter_id: velocity_scale
  type: float64
  default: 0.35
  constraints:
    min_exclusive: 0.0
    max_inclusive: 1.0
  description: Velocity scale for explicit Lite6 trocar moves.
blackboard:
  namespaces:
  - namespace_id: planning
    owner: program
  keys:
  - key: planning.pick_plan
    type: pick_planning_result
    access: read_write
    persistence: run
    fields:
    - field: approach_pose
      type: stored_pose
    - field: descend_path
      type: cartesian_path
    - field: pick_pose
      type: stored_pose
    - field: retreat_path
      type: cartesian_path
    - field: retreat_pose
      type: stored_pose
    - field: selected_object_id
      type: scene_resource
    - field: tool_position
      type: coordinate_position
  - key: selected_object
    type: scene_resource
    access: read_write
    persistence: run
    description: Operation-scoped FoundationPose-selected object binding.
contact_policies:
- api_version: manyforge.contact_policy.v1
  policy_id: selected_object_grasp
  version: sha256:4dd457c3867359c71b3ff8a1885042786887a79dec93808446726efa1dabc5c1
  mode: contact_grasp
  sensing_mode: geometry_only
  default_unmatched_response: hard_stop
  zones:
  - zone_id: tool_contact
    body_pairs:
    - body_a:
        kind: component_model_body
        body:
          component_id: lite_gripper
          collision_body_id: gripper_collision
      body_b:
        kind: runtime_object
        runtime_object_id: selected_object
    violation_response: hard_stop
    max_penetration_m: 0.002
    terminal_window_start_fraction: 0.8
tree:
  node_id: sequence
  instance_id: trocar_foundationpose_pick
  parameters: {}
  children:
  - node_id: simulation.set_state
    instance_id: play_simulation
    parameters:
      state: play
    children: []
  - node_id: timer
    instance_id: wait_for_pose_source
    parameters:
      duration_s: 1.0
    children: []
  - node_id: gripper.command_position
    instance_id: open_gripper_start
    parameters:
      target:
        component_id: lite_gripper
        command_target_id: gripper
      position:
        kind: linear_m
        value_m: 0.0081
      max_effort:
        kind: linear_newton
        value_n: 10.0
      command_duration_s: 0.8
    children: []
  - node_id: motion.move_to_joint_target
    instance_id: move_to_rest
    parameters:
      target:
        component_id: isaac_lite6_trocar_robot
        command_target_id: arm
      base_frame:
        component_id: isaac_lite6_trocar_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      goal:
      - joint_name: joint1
        position_rad: 0.0
      - joint_name: joint2
        position_rad: -0.785
      - joint_name: joint3
        position_rad: 0.785
      - joint_name: joint4
        position_rad: 0.0
      - joint_name: joint5
        position_rad: 1.57
      - joint_name: joint6
        position_rad: 0.0
      planning_timeout_s: 10.0
      execution_timeout_s: 30.0
    children: []
    value_sources:
      velocity_scale:
        kind: program_parameter
        reference: velocity_scale
  - node_id: planning.plan_pick_sequence
    instance_id: plan_foundationpose_trocar_pick
    parameters:
      target:
        component_id: isaac_lite6_trocar_robot
        command_target_id: arm
      tool_target:
        component_id: lite_gripper
        command_target_id: gripper
      base_frame:
        component_id: isaac_lite6_trocar_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      carrier_frame_ref:
        component_id: lite_gripper
        frame_id: tcp
      selected_object_id: graspable
      synthesis:
        pick_offset_envelope:
          position_min_m:
          - -0.015
          - 0.0
          - 0.004
          position_max_m:
          - -0.015
          - 0.0
          - 0.004
          orientation_rpy_min_deg:
          - 0.0
          - 0.0
          - 0.0
          orientation_rpy_max_deg:
          - 0.0
          - 0.0
          - 0.0
        approach_offset_envelope:
          position_min_m:
          - 0.0
          - 0.0
          - -0.08
          position_max_m:
          - 0.0
          - 0.0
          - -0.08
          orientation_rpy_min_deg:
          - 0.0
          - 0.0
          - 0.0
          orientation_rpy_max_deg:
          - 0.0
          - 0.0
          - 0.0
        pick_offset_reference:
          type: component_frame
          frame:
            component_id: lite_gripper
            frame_id: tcp
        approach_offset_reference:
          type: component_frame
          frame:
            component_id: lite_gripper
            frame_id: tcp
        force_vertical_pick: true
        min_tcp_z_m: 0.016
        search_strategy: first_feasible
        translation_step_m: 0.01
        rotation_step_deg: 15.0
      motion_options:
        approach_velocity_scale: 0.35
        descend_velocity_scale: 0.35
        retreat_velocity_scale: 0.35
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
      tool_position:
        kind: linear_m
        value_m: 0.0
      tool_max_effort:
        kind: linear_newton
        value_n: 10.0
      tool_command_duration_s: 0.8
      output_key: planning.pick_plan
      contact_policy_id: selected_object_grasp
    children: []
  - node_id: motion.move_to_pose
    instance_id: move_to_planned_pick_approach
    parameters:
      target:
        component_id: isaac_lite6_trocar_robot
        command_target_id: arm
      base_frame:
        component_id: isaac_lite6_trocar_robot
        frame_id: base
      tcp_endpoint:
        kind: current
      planning_timeout_s: 10.0
      execution_timeout_s: 30.0
    children: []
    value_sources:
      goal:
        kind: blackboard_field
        reference: planning.pick_plan
        field: approach_pose
      velocity_scale:
        kind: program_parameter
        reference: velocity_scale
  - node_id: motion.move_to_pose
    instance_id: move_to_planned_pick
    parameters:
      target:
        component_id: isaac_lite6_trocar_robot
        command_target_id: arm
      base_frame:
        component_id: isaac_lite6_trocar_robot
