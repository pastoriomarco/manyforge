api_version: manyforge.program.v0
program_profile: v0.1
name: trocar_lite6_foundationpose_pick
description: Isaac-compatible Lite6 pick-and-place program for the trocar scene. The
  deployment latches a FoundationPose Detection3DArray pose source for the `graspable`
  object before planning, then this program plans and executes a top-down pick sequence
  against the updated scene object.
catalog_version: 0.2.0
robot:
  robot_id: lite6
  group_id: lite6
  base_frame: link_base
  tcp_frame: link_tcp
scene:
- object_id: ground
  shape:
    type: box
    box_dimensions_m:
    - 1
    - 1
    - 0.1
  pose:
    frame_id: universe
    position_m:
    - 0
    - 0
    - -0.06
    orientation_xyzw:
    - 0
    - 0
    - 0
    - 1
- object_id: wall
  shape:
    type: box
    box_dimensions_m:
    - 1
    - 0.02
    - 0.2
  pose:
    frame_id: universe
    position_m:
    - 0
    - -0.15
    - 0.09
    orientation_xyzw:
    - 0
    - 0
    - 0
    - 1
- object_id: graspable
  shape:
    type: box
    box_dimensions_m:
    - 0.089
    - 0.028
    - 0.028
  pose:
    frame_id: link_base
    position_m:
    - 0.18
    - -0.2
    - 0.08
    orientation_rpy_deg:
    - 0
    - 0
    - 0
  metadata:
    support_contacts:
    - support_object_id: ground
      enforce_max_start_penetration: true
      max_start_penetration_m: 0.03
      release_tolerance_m: 0.001
      min_release_progress_m: 0
      min_separation_clearance_m: 0
      require_separation_by_end: true
      require_strictly_decreasing_penetration: true
      allow_recontact: false
parameters:
- name: velocity_scale
  type: float
  default: 0.35
  constraints:
    min_exclusive: 0
    max_inclusive: 1
  description: Velocity scale for all Lite6 trocar pick-and-place moves.
blackboard:
  namespaces:
  - id: pick_plan
    contract: pick_plan_v1
    prefix: planning/pick_plan
    description: Planned trocar pick approach and pick poses.
    fields:
    - name: selected_object_id
      type: string
    - name: approach_pose
      type: pose
    - name: pick_pose
      type: pose
    - name: retreat_pose
      type: pose
saved_with_deployment:
  name: trocar_lite6_foundationpose_pick
  source_path: /workspace/examples/trocar_lite6_foundationpose_pick.deployment.yaml
  content_sha256: 7c2a8cb0ba3854eb0d860abf7a5abc2fbd73514ea47345ee424218ced9a04a15
tree:
  id: sequence
  name: trocar_lite6_foundationpose_pick
  children:
  - id: command_gripper
    name: open_gripper_start
    params:
      gripper_id: primary
      position: 0.0081
      max_effort: 10
      duration_s: 0.8
      timeout_s: 0
  - id: move_manipulator_action
    name: move_to_rest
    params:
      move_id: lite6_rest
      motion_type: joint_goal
      joint_goal_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      joint_goal_positions_rad:
      - 0
      - -0.785
      - 0.785
      - 0
      - 1.57
      - 0
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: plan_pick_sequence
    name: plan_foundationpose_trocar_pick
    params:
      selected_object_id: graspable
      output_key_prefix:
        namespace_ref: pick_plan
      object_source: backend_scene
      image_source: none
      tcp_frame: link_tcp
      pick_offset_envelope:
        position_min_m:
        - -0.015
        - 0
        - 0.004
        position_max_m:
        - -0.015
        - 0
        - 0.004
        orientation_rpy_min_deg:
        - 0
        - 0
        - 0
        orientation_rpy_max_deg:
        - 0
        - 0
        - 0
      pick_offset_reference:
        type: robot_link
        id: link_tcp
      approach_offset_envelope:
        position_min_m:
        - 0
        - 0
        - -0.08
        position_max_m:
        - 0
        - 0
        - -0.08
        orientation_rpy_min_deg:
        - 0
        - 0
        - 0
        orientation_rpy_max_deg:
        - 0
        - 0
        - 0
      approach_offset_reference:
        type: robot_link
        id: link_tcp
      force_vertical_pick: true
      enable_min_tcp_z: true
      min_tcp_z_m: 0.016
      search_strategy: first_feasible_grid
      translation_step_m: 0.01
      rotation_step_deg: 15
      planning_timeout_s: 10
      velocity_scale: ${param:velocity_scale}
      approach_move_node_name: move_to_planned_pick_approach
      pick_move_node_name: move_to_planned_pick
      retreat_move_node_name: retreat_after_pick
  - id: move_manipulator_action
    name: move_to_planned_pick_approach
    params:
      move_id: lite6_fp_pick_approach
      motion_type: pose_goal
      pose_goal:
        field_ref:
          namespace: pick_plan
          field: approach_pose
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: move_manipulator_action
    name: move_to_planned_pick
    params:
      move_id: lite6_fp_pick_down
      motion_type: pose_goal
      pose_goal:
        field_ref:
          namespace: pick_plan
          field: pick_pose
      velocity_scale: 0.2
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: sequence
    name: sequence_grasp
    children:
    - id: timer
      name: timer_pre_grasp
      params:
        duration_s: 1
    - id: command_gripper
      name: close_gripper
      params:
        gripper_id: primary
        position: 0
        max_effort: 10
        duration_s: 0.8
        timeout_s: 0
    - id: attach_object_to_link
      name: attach_graspable
      params:
        object_id:
          field_ref:
            namespace: pick_plan
            field: selected_object_id
        link_frame: link_tcp
        gripper_id: primary
    - id: timer
      name: timer_post_grasp
      params:
        duration_s: 2
  - id: reset_trajectories
    name: invalidate_after_pick_attach
  - id: move_manipulator_action
    name: retreat_after_pick
    params:
      move_id: lite6_fp_pick_retreat
      motion_type: pose_goal
      pose_goal:
        field_ref:
          namespace: pick_plan
          field: retreat_pose
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: move_manipulator_action
    name: move_to_drop_approach
    params:
      move_id: lite6_drop_approach
      motion_type: pose_goal
      pose_goal:
        frame_id: link_base
        position_m:
        - 0.16
        - 0.08
        - 0.2
        orientation_rpy_deg:
        - 180
        - 0
        - 0
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: move_manipulator_action
    name: move_to_drop
    params:
      move_id: lite6_drop_down
      motion_type: pose_goal
      pose_goal:
        frame_id: link_base
        position_m:
        - 0.16
        - 0.08
        - 0.17
        orientation_rpy_deg:
        - 180
        - 0
        - 0
      velocity_scale: 0.2
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: command_gripper
    name: open_gripper_release
    params:
      gripper_id: primary
      position: 0.0081
      max_effort: 10
      duration_s: 0.8
      timeout_s: 0
  - id: detach_object_from_link
    name: detach_graspable
    params:
      object_id:
        field_ref:
          namespace: pick_plan
          field: selected_object_id
      link_frame: link_tcp
  - id: move_manipulator_action
    name: drop_retreat
    params:
      move_id: lite6_drop_retreat
      motion_type: pose_goal
      pose_goal:
        frame_id: link_base
        position_m:
        - 0.16
        - 0.08
        - 0.22
        orientation_rpy_deg:
        - 180
        - 0
        - 0
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
  - id: reset_trajectories
    name: invalidate_after_drop
  - id: move_manipulator_action
    name: return_rest
    params:
      move_id: lite6_return_rest
      motion_type: joint_goal
      joint_goal_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      joint_goal_positions_rad:
      - 0
      - -0.785
      - 0.785
      - 0
      - 1.57
      - 0
      velocity_scale: ${param:velocity_scale}
      planning_timeout_s: 10
      execution_timeout_s: 30
