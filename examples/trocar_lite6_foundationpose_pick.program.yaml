      goal:
        kind: blackboard_field
        reference: planning.pick_plan
        field: pick_pose
  - node_id: sequence
    instance_id: close_and_attach
    parameters: {}
    children:
    - node_id: timer
      instance_id: wait_before_grasp
      parameters:
        duration_s: 1.0
      children: []
    - node_id: gripper.command_position
