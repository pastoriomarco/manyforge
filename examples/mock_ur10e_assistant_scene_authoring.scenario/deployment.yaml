  "deployment_artifact_id": "ur10e_robotiq_assistant_modes_scene_authoring",
  "description": "Local deployment fixture for assistant-mode catalog plumbing on the UR10e + Robotiq 2F-140 preview stack, set up as a Mock pick-and-place workcell. It keeps the deterministic scene-authoring provider enabled while declaring the finite tools visible to composer-assistant requests. The Mock cell_io device carries the cell signals: inputs part_present (pick-table part sensor, starts true), clamp_pressure_ok (drop-fixture clamp pressure switch, follows clamp_valve after 300 ms), touch_probe (fixture touch probe), start_button (operator start) and zone_occupied (area scanner); outputs clamp_valve, alarm_light and ready_light. The global rule zone_intrusion stops all motion while the area scanner reports the zone occupied.",
  "name": "ur10e_robotiq_assistant_modes_scene_authoring",
  "policies": {
    "interrupt_rules": [
      {
        "active_at_start": true,
        "after_stop": "hold",
        "condition": {
          "compare": {
            "op": "==",
            "operand": {
              "signal": {
                "controllable_component_id": "cell_io",
                "signal_name": "zone_occupied"
              }
            },
            "value": true
          }
        },
        "on_trip": "stop",
        "priority": 0,
        "rule_id": "zone_intrusion",
        "scope": "all_motion"
      }
    ]
  }
