api_version: manyforge.program.v0
program_profile: v0.1
name: interrupt_pick_and_place_demo
description: >-
  Pick-and-place demo with an operator pause interrupt. Triggering the
  operator_pause source during motion latches a resumable hold, runs a safe
  handler that marks the pause in the blackboard and invalidates cached plans,
  then requires explicit operator resume.
catalog_version: "0.1.0"

robot:
  robot_id: ur5
  group_id: arm
  base_frame: base_link
  tcp_frame: tool0

scene:
  - object_id: ground
    shape:
      type: box
      box_dimensions_m: [1.0, 1.0, 0.2]
    pose:
      frame_id: universe
      position_m: [0.0, 0.0, -0.11]
      orientation_rpy_deg: [0, 0, 0]

  - object_id: graspable
    shape:
      type: box
      box_dimensions_m: [0.1, 0.01, 0.01]
    pose:
      frame_id: universe
      position_m: [0.3, -0.3, 0.15]
      orientation_rpy_deg: [0, 0, -45]

parameters:
  - name: velocity_scale
    type: float
    default: 0.5
    constraints:
      min_exclusive: 0.0
      max_inclusive: 1.0
    description: Velocity scale for all moves.

blackboard:
  keys:
    - id: gripper_closed
      type: bool
      key: gripper_closed
      description: Simulated gripper closed/open flag.
    - id: pause_latched
      type: bool
      key: demo/pause_latched
      description: Set true by the operator pause interrupt handler.

interrupt_handlers:
  operator_pause_hold_handler:
    description: >-
      Safe operator pause handler. Marks the pause on the blackboard and
      invalidates cached trajectories before entering resumable hold.
    resource_claims:
      - signals
      - planner
    root:
      id: sequence
      name: operator_pause_hold_handler
      children:
        - id: set_signal_bool
          name: mark_pause_latched
          params:
            key:
              key_ref: pause_latched
            value: true
        - id: reset_trajectories
          name: invalidate_after_pause

interrupt_policies:
  - id: operator_pause_hold
    source: operator_pause
    applies_to:
      subtree_root: pick_and_place
      interruptible_only: true
    preemption_mode: hold_cycle
    handler: operator_pause_hold_handler
    after_handler: resumable_hold
    description: Pause the active manipulation step and wait for explicit resume.

tree:
  id: sequence
  name: pick_and_place
  children:
    - id: move_manipulator_action
      name: move_to_pick_approach
      params:
        move_id: pick_approach
        motion_type: relative_move
        relative_move:
          target_reference:
            type: object
            id: graspable
          offset:
            position_m: [0.0, 0.0, 0.10]
            orientation_rpy_deg: [180, 0, -90]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0

    - id: move_manipulator_action
      name: move_to_pick
      params:
        move_id: pick_down
        motion_type: relative_move
        relative_move:
          target_reference:
            type: object
            id: graspable
          offset:
            position_m: [0.0, 0.0, 0.05]
            orientation_rpy_deg: [180, 0, -90]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0

    - id: set_gripper_state
      name: close_gripper
      params:
        state_key:
          key_ref: gripper_closed
        state: closed

    - id: attach_object_to_link
      name: attach_graspable
      params:
        object_id: graspable
        link_frame: tool0

    - id: move_manipulator_action
      name: pick_retreat
      params:
        move_id: pick_retreat
        motion_type: relative_move
        relative_move:
          target_reference:
            type: robot_link
            id: tool0
          offset_reference:
            type: frame
            id: base_link
          offset:
            position_m: [0.0, 0.0, 0.05]
            orientation_rpy_deg: [180, 0, -90]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0

    - id: reset_trajectories
      name: invalidate_after_pick

    - id: move_manipulator_action
      name: move_to_drop_approach
      params:
        move_id: drop_approach
        motion_type: relative_move
        relative_move:
          target_reference:
            type: pose
            pose:
              position_m: [0.3, 0.3, 0.2]
              orientation_rpy_deg: [180, 0, -90]
          offset_reference:
            type: frame
            id: base_link
          offset:
            position_m: [0.0, 0.0, 0.05]
            orientation_rpy_deg: [180, 0, -90]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0

    - id: move_manipulator_action
      name: move_to_drop
      params:
        move_id: drop_down
        motion_type: pose_goal
        pose_goal:
          position_m: [0.3, 0.3, 0.2]
          orientation_rpy_deg: [180, 0, -90]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0

    - id: set_gripper_state
      name: open_gripper
      params:
        state_key:
          key_ref: gripper_closed
        state: open

    - id: detach_object_from_link
      name: detach_graspable
      params:
        object_id: graspable
        link_frame: tool0

    - id: move_manipulator_action
      name: drop_retreat
      params:
        move_id: drop_retreat
        motion_type: relative_move
        relative_move:
          target_reference:
            type: pose
            pose:
              position_m: [0.3, 0.3, 0.2]
              orientation_rpy_deg: [180, 0, -90]
          offset_reference:
            type: frame
            id: base_link
          offset:
            position_m: [0.0, 0.0, 0.05]
            orientation_rpy_deg: [180, 0, -90]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0

    - id: reset_trajectories
      name: invalidate_after_drop

    - id: move_manipulator_action
      name: return_rest
      params:
        move_id: return_rest
        motion_type: joint_goal
        joint_goal_names:
          - shoulder_pan_joint
          - shoulder_lift_joint
          - elbow_joint
          - wrist_1_joint
          - wrist_2_joint
          - wrist_3_joint
        joint_goal_positions_rad: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]
        velocity_scale: "${param:velocity_scale}"
        planning_timeout_s: 10.0
        execution_timeout_s: 30.0
