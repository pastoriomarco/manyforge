api_version: manyforge.deployment.v0
schema_version: 0.1.0
name: isaac_manipulator_scene_light_ros2_control
description: 'Isaac Sim preview deployment for the saved light manipulator scene.
  Planning and scene validation stay on RoboPlan; execution is delegated to a ROS
  2 FollowJointTrajectory arm controller exposed by Isaac Sim through a topic_based_ros2_control
  bridge. Robotiq commands use the standard control_msgs/GripperCommand action; the
  Isaac-specific bridge is the only component that publishes the simulator''s raw
  gripper JointState command topic.

  '
program_profile: v0.1
grasp_risk_policy:
  open_loop_grasp:
    allowed: true
    scope: simulation
    rationale: >-
      Isaac preview attaches objects after gripper command completion without
      an independent grasp confirmation source.
robot_config:
  robot_id: ur10e
  group_id: arm
  urdf_path: package://manyforge_example_models/models/ur10e_robotiq_2f_140/ur10e_robotiq_2f_140.urdf
  srdf_path: package://manyforge_example_models/models/ur10e_robotiq_2f_140/ur10e_robotiq_2f_140.srdf
  package_paths:
  - ..
  global_max_tcp_linear_speed_mps: 0.25
grippers:
  primary:
    command_mode: ros_gripper_command
    group_id: gripper
    joint_name: finger_joint
    actuation_kind: position_commanded
    state_authority: sim_observed
    completion_policy: position_reached
    grasp_confirmation_policy: none_open_loop
    open_state_ref: open
    closed_state_ref: closed
    motion_time_s: 0.8
    description: Robotiq 2F-140 command through the standard ROS GripperCommand action.
    transport:
      kind: ros_gripper_command
      action_name: /robotiq_gripper_controller/gripper_cmd
      result_timeout_s: 15.0
      position_tolerance: 0.04
    touch_links:
    - robotiq_base_link
    - left_outer_knuckle
    - left_outer_finger
    - left_inner_knuckle
    - left_inner_finger
    - left_inner_finger_pad
    - right_outer_knuckle
    - right_outer_finger
    - right_inner_knuckle
    - right_inner_finger
    - right_inner_finger_pad
    mount_frame: tool0
    attach_frame: grasp_frame
    tcp_frame: grasp_frame
    auxiliary_frames:
    - gripper_frame
simulation_control:
  kind: ros2_simulation_interfaces
  service_prefix: auto
  capabilities:
    reset: true
    pause: true
    play: true
    step: true
    set_entity_state: true
  reset:
    default_scope: state
    close_command_gate: true
    wait_ready_s: 3.0
    resume_play_after_reset: true
adapters:
  planning:
    adapter_id: planning.roboplan
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - planning.motion.joint_goal
    - planning.motion.pose_goal
    - planning.motion.cartesian_path
    - planning.profile.first_feasible
    - planning.profile.balanced
    - planning.profile.quality_bounded
    - planning.trajectory.time_parameterized
    config:
      rng_seed: 12345
  context:
    adapter_id: planning.roboplan_context
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - context.state.current
    - context.validation.trajectory
    - context.collision.check
    - context.collision.check.detailed
    - context.kinematics.fk
    - context.limits.joint
    - context.pose.resolve_reference
    - context.scene.object_query
    - scene.shape.box
    - scene.shape.sphere
    - scene.shape.cylinder
    - scene.shape.mesh
    - scene.edit.add
    - scene.edit.upsert
    - scene.edit.remove
    - scene.edit.update_pose
    - scene.edit.attach_detach
    - observability.trace.scene
    config: {}
  execution:
    adapter_id: execution.ros2_control_follow_joint_trajectory
    adapter_version: 0.1.0
    supported_profiles:
    - v0.1
    capability_keys:
    - execution.trajectory.execute
    - execution.feedback.phase_events
    - execution.feedback.state_snapshots
    - execution.stop.soft
    - execution.pause
    - execution.resume
    - execution.reset
    - tool.gripper.command
    - tool.gripper.feedback
    config:
      action_name: /isaac_arm_controller/follow_joint_trajectory
      arm_action: /isaac_arm_controller/follow_joint_trajectory
      execution_state_authority_profile: commanded_sim
      execution_state_source_mode: commanded_sim
      # Per-call budget for single-shot IK (IPlannerBackend::solve_ik). Tight
      # so interactive cartesian targets fail fast instead of stalling.
      single_shot_ik_timeout_s: 0.05
      require_fresh_state_before_planning: false
      command_gate_topic: /manyforge/isaac_arm_command_enable
      reset_to_initial_on_load: true
      sim_reset_motion_duration_s: 0.0
      joint_state_topic: /joint_states
      controller_state_topic: /isaac_arm_controller/controller_state
      controller_manager: /controller_manager
      required_joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      # Hard-stop evidence for JTC `constraints.decelerate_on_cancel`.
      # These fields intentionally mirror the controller YAML and let
      # ManyForge advertise `hard_deceleration` only when the controller has
      # velocity state and positive per-joint cancel-deceleration limits.
      decelerate_on_cancel: true
      velocity_state_interface_joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      max_deceleration_on_cancel_rad_s2:
        shoulder_pan_joint: 10.0
        shoulder_lift_joint: 10.0
        elbow_joint: 10.0
        wrist_1_joint: 10.0
        wrist_2_joint: 10.0
        wrist_3_joint: 10.0
      initial_joint_positions_rad:
      - 2.63422544
      - -0.875980752
      - 1.551074106
      - -2.29231544
      - -1.560498884
      - -2.038544566
      joint_state_max_age_ms: 250
      wait_for_state_timeout_s: 1
      # Industrial controlled stop. soft_on_path is the default operator-stop:
      # a self-computed jerk-continuous stop trajectory preempts the active
      # goal over a 1.0 s ramp. enable_jtc_speed_scaling_input stays true
      # (velocity slider via JTC scaling); the stop publishes unit scale
      # immediately before the preempt, so soft_on_path works WITH speed-scaling
      # once the controller seam has been validated for that ordering.
      enable_soft_on_path_path_ramp: true
      soft_on_path_sample_period_s: 0.01
      # Command-frame lead-in budget (D_lead): the replacement opens with the
      # in-flight command resampled from the cursor for this long, then the decel
      # ramp. The compute+dispatch latency (stage A) is consumed from it and the
      # rest rides to rest at deceleration_time_s; if the latency exceeds this
      # budget the stop escalates to a hard stop. Sized > the worst-case planner
      # compute incl. the ALI/backtracking tail (~12 ms): 0.1 s gives ~8x margin
      # (measured normal-path Delta ~0.8 ms). Decel ramp = deceleration_time_s - D_lead.
      soft_on_path_stop_traj_delta_s: 0.1
      # Explicit per-joint jerk ceiling for the stop ramp + handoff. Without
      # this the planner derives a heuristic jerk limit from accel + ramp time;
      # deployments should instead record the intended operational ceiling.
      # 50 rad/s^3 reaches the 10 rad/s^2 accel limit in 0.2 s.
      soft_on_path_max_jerk_rad_s3:
        shoulder_pan_joint: 50.0
        shoulder_lift_joint: 50.0
        elbow_joint: 50.0
        wrist_1_joint: 50.0
        wrist_2_joint: 50.0
        wrist_3_joint: 50.0
      operator_stop_profile:
        profile_id: "operator_soft_on_path"
        stop_mode: "soft_on_path"
        deceleration_time_s: 1.0
        # Default policy, made explicit here for operator audit: if the
        # accepted trajectory will finish sooner than a useful 1 s stop ramp
        # can be generated, keep running that trajectory and report Stopping
        # until the controller reaches the endpoint.
        allow_natural_completion_on_short_path: true
        # No spring_back_hold fallback: spring-back is a distinct operator
        # profile and is harder to generate than soft_on_path when both share
        # the same deceleration time.
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10.0
          shoulder_lift_joint: 10.0
          elbow_joint: 10.0
          wrist_1_joint: 10.0
          wrist_2_joint: 10.0
          wrist_3_joint: 10.0
      default_fault_stop_profile:
        profile_id: "default_fault_hard_deceleration"
        stop_mode: "hard_deceleration"
        deceleration_time_s: 1.0
        per_joint_max_deceleration_rad_s2:
          shoulder_pan_joint: 10.0
          shoulder_lift_joint: 10.0
          elbow_joint: 10.0
          wrist_1_joint: 10.0
          wrist_2_joint: 10.0
          wrist_3_joint: 10.0
      wait_for_action_server_timeout_s: 2
      # Auto max stop time for profiles without explicit max_stop_time_s is
      # deceleration_time_s + this margin: 1.0 + 0.5 = 1.5 s.
      stop_completion_timeout_s: 0.5
      start_tolerance_rad: 0.15
      final_tolerance_rad: 0.15
      tracking_error_tolerance_rad: 0.05
      tracking_error_timeout_s: 0
      disable_controller_path_tolerances: true
      controller_result_timeout_s: 30
      gripper:
        action_name: /robotiq_gripper_controller/gripper_cmd
        wait_for_action_server_timeout_s: 2
        result_timeout_s: 15
orchestrator:
  engine: py_trees
  config:
    collision_monitor_period_ms: 50.0
    # The simulation_interfaces source runs at 4 Hz and timestamps at poll
    # admission. Three source periods cover bounded acquisition/delivery jitter
    # while remaining stricter than the source's 1 s stale contract.
    runtime_dynamic_body_max_age_cap_ms: 750.0
launch:
  runner:
    module: manyforge_behavior.runner
    args: []
  ui_backend:
    module: manyforge_composer
    args: []
    enabled: true
pose_sources:
- id: isaac_scene_objects
  kind: simulation_interfaces
  enabled: true
  max_update_hz: 4.0
  stale_after_s: 1.0
  measured_tcp:
    entity: /World/ur10e_robotiq2f_140_ROS/ur10e_robotiq2f_140/ee_link
    tcp_frame_id: ee_link
    frame_id: universe
  measured_robot:
    joint_state_topic: /joint_states
  objects:
    isaac_cheese_box:
      apply_policy: continuous_unattached
      entity: /mac_n_cheese_centered
      scene_admission:
        role: snapshot_obstacle
        lease_max_age_s: 2.0
      measured_state_ghost:
        enabled: true
        robot_tcp: true
        object: true
        opacity: 0.5
      measured_attachment_baseline:
        capture: on_attach_or_first_paired_sample
        require_same_time_robot_tcp: true
      attached_drift_monitor:
        enabled: true
        translation_threshold_m: 0.02
        rotation_threshold_rad: 0.2
        debounce_s: 0.1
        stale_behavior: fault
        action: diagnostic_only
        signal_id: attached_object_drift/isaac_cheese_box
  frame_id: universe
  description: Isaac Sim entity poses for scene objects that can move between plans.
