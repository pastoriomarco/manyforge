name: isaac_manipulator_scene_light_collision
description: Retained Isaac UR10e runtime-collision scenario. It starts from the exact light-scene geometry,
  removes the declared probe wall before planning, then re-inserts that wall concurrently with command
  execution so the Manager-owned collision and Stop path can be observed without a supervisor fallback.
