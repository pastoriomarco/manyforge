parameters:
- name: velocity_scale
  type: float
  default: 0.2
  constraints:
    min_exclusive: 0
    max_inclusive: 1
  description: Velocity scale for all moves.
saved_with_deployment:
  name: isaac_manipulator_scene_light_ros2_control_collision
  source_path: /workspace/examples/isaac_manipulator_scene_light_ros2_control_collision.deployment.yaml
  content_sha256: a9af22559174a1def206f723950f65f01d11dc78f14b9c2393e9e041eb0b6f7f
tree:
  id: parallel
  name: parallel
  children:
  - id: sequence
    name: sequence
    operator_stop_policy: continue
    children:
    - id: timer
      name: timer
      params:
        duration_s: 1.5
    - id: add_collision_object
      name: add_collision_object
      params:
        shape:
          type: box
          box_dimensions_m:
          - 0.02
          - 0.4
          - 0.8
        pose:
          frame_id: universe
          position_m:
          - -0.3
          - 0
          - 0.4
          orientation_rpy_deg:
          - 0
          - 0
          - 0
        object_id: wall
    - id: timer
      name: timer2
      params:
        duration_s: 2
    - id: remove_collision_object
      name: remove_collision_object
      params:
        object_id: wall
  - id: sequence
    name: pick_and_place
    children:
    - id: command_gripper
      name: command_gripper
      params:
        gripper_id: primary
        position: 0
        max_effort: 40
        duration_s: 1
        timeout_s: 0
    - id: move_manipulator_action
      name: move_to_pick_approach
      params:
        move_id: pick_approach
        motion_type: relative_move
        relative_move:
          target_reference:
            type: object
            id: isaac_cheese_box
          offset:
            position_m:
            - 0
            - 0
            - 0.2
            orientation_rpy_deg:
            - 180
            - 0
            - 180
          offset_reference:
            type: frame
            id: base_link
        velocity_scale: ${param:velocity_scale}
        planning_timeout_s: 10
        execution_timeout_s: 30
    - id: move_manipulator_action
      name: move_to_pick
      params:
        move_id: pick_down
        motion_type: relative_move
        relative_move:
          target_reference:
            type: object
            id: isaac_cheese_box
          offset:
            position_m:
            - 0
            - 0
            - 0.08
            orientation_rpy_deg:
            - 180
            - 0
            - 180
          offset_reference:
            type: frame
            id: base_link
        velocity_scale: ${param:velocity_scale}
        planning_timeout_s: 10
        execution_timeout_s: 30
    - id: command_gripper
      name: close_gripper
      params:
        gripper_id: primary
        position: 0.55
        max_effort: 40
        duration_s: 1
        timeout_s: 0
    - id: attach_object_to_link
      name: attach_cheese_box
      params:
        object_id: isaac_cheese_box
        link_frame: grasp_frame
        gripper_id: primary
    - id: move_manipulator_action
      name: pick_retreat
      params:
        move_id: pick_retreat
        motion_type: relative_move
        relative_move:
          target_reference:
            type: robot_link
            id: grasp_frame
          offset:
            position_m:
            - 0
            - 0
            - -0.2
            orientation_rpy_deg:
            - 0
            - 0
            - 0
        velocity_scale: ${param:velocity_scale}
        planning_timeout_s: 10
        execution_timeout_s: 30
    - id: move_manipulator_action
      name: move_to_drop_approach
      params:
        move_id: drop_approach
        motion_type: relative_move
        relative_move:
          target_reference:
            type: object
            id: isaac_small_KLT
          offset:
            position_m:
            - 0
            - 0
            - 0.4
            orientation_rpy_deg:
            - 180
            - 0
            - 180
          offset_reference:
            type: frame
            id: base_link
        velocity_scale: ${param:velocity_scale}
        planning_timeout_s: 10
        execution_timeout_s: 30
    - id: move_manipulator_action
      name: move_to_drop
      params:
        move_id: drop_down
        motion_type: relative_move
        pose_goal:
          frame_id: base_link
          position_m:
          - 0.3
          - 0.3
          - 0.05
          orientation_rpy_deg:
          - 180
          - 0
          - -180
        velocity_scale: ${param:velocity_scale}
        planning_timeout_s: 10
        execution_timeout_s: 30
        joint_position_tol_rad: 0.05
        relative_move:
          target_reference:
            type: object
            id: isaac_small_KLT
          offset:
            position_m:
            - 0
            - 0
            - 0.35
            orientation_rpy_deg:
            - 180
            - 0
            - 180
          offset_reference:
            type: frame
            id: base_link
    - id: command_gripper
      name: open_gripper
      params:
        gripper_id: primary
        position: 0
        max_effort: 40
        duration_s: 1
        timeout_s: 0
    - id: detach_object_from_link
      name: detach_cheese_box
      params:
        object_id: isaac_cheese_box
        link_frame: grasp_frame
    - id: move_manipulator_action
      name: drop_retreat
      params:
        move_id: drop_retreat
        motion_type: relative_move
        relative_move:
          target_reference:
            type: object
            id: isaac_small_KLT
          offset:
            position_m:
            - 0
            - 0
            - 0.4
            orientation_rpy_deg:
            - 180
            - 0
            - 180
          offset_reference:
            type: frame
            id: base_link
        velocity_scale: ${param:velocity_scale}
        planning_timeout_s: 10
        execution_timeout_s: 30
    - id: move_manipulator_action
      name: return_rest
      params:
        move_id: return_rest
        motion_type: joint_goal
        joint_goal_names:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
        joint_goal_positions_rad:
        - 2.63422544
        - -0.875980752
        - 1.551074106
        - -2.29231544
        - -1.560498884
        - -2.038544566
        velocity_scale: ${param:velocity_scale}
        planning_timeout_s: 10
        execution_timeout_s: 30
