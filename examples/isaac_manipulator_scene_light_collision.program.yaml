parameters:
- parameter_id: velocity_scale
  type: float64
  default: 0.2
  constraints:
    min_exclusive: 0.0
    max_inclusive: 1.0
  description: Velocity scale for the collision-bearing move.
tree:
  node_id: sequence
  instance_id: isaac_collision_cycle
  parameters: {}
  children:
  - node_id: simulation.set_entity_pose
    instance_id: set_cheese_initial_pose
    parameters:
      scene_resource_id: isaac_cheese_box
      pose:
        frame_ref:
          kind: cell_frame
        position_m:
        - -0.455038
        - 0.076595
        - 0.087827
        orientation:
          rpy_deg:
          - 92.340746
          - -1.76826
          - -90.093258
    children: []
  - node_id: simulation.set_state
    instance_id: play_simulation
    parameters:
      state: play
    children: []
  - node_id: scene.remove_object
    instance_id: clear_collision_wall
    parameters:
      scene_resource_id: runtime_collision_wall
    children: []
  - node_id: parallel
    instance_id: insert_wall_during_motion
    parameters:
      success_policy: all
    children:
    - node_id: sequence
      instance_id: collision_wall_lifecycle
      parameters: {}
      children:
      - node_id: timer
        instance_id: wait_before_collision
        parameters:
          duration_s: 1.0
        children: []
      - node_id: scene.add_object
        instance_id: insert_collision_wall
        parameters:
          scene_resource_id: runtime_collision_wall
          shape:
            type: box
            box_dimensions_m:
            - 0.02
            - 0.2
            - 0.2
          pose:
            frame_ref:
              kind: cell_frame
            position_m:
            - -0.4
            - 0.0
            - 0.4
            orientation:
              rpy_deg:
              - 0.0
              - 0.0
              - 0.0
        children: []
      - node_id: timer
        instance_id: hold_collision_wall
        parameters:
          duration_s: 2.0
        children: []
      - node_id: scene.remove_object
        instance_id: remove_collision_wall
        parameters:
          scene_resource_id: runtime_collision_wall
        children: []
    - node_id: sequence
      instance_id: collision_motion
      parameters: {}
      children:
      - node_id: gripper.command_position
        instance_id: open_gripper_start
        parameters:
          target_role: gripper
          position:
            kind: angular_rad
            value_rad: 0.0
          max_effort:
            kind: angular_newton_meter
            value_nm: 40.0
          command_duration_s: 1.0
        children: []
      - node_id: motion.move_to_pose
        instance_id: move_to_pick_approach
        parameters:
          target_role: arm
          base_frame_role: base
          tcp_endpoint:
            kind: current
          target_mode: relative
          target_reference:
            type: scene_resource
            scene_resource_id: isaac_cheese_box
          offset_reference:
            type: frame_role
            frame_role_id: base
          goal:
            position_m:
            - 0.0
            - 0.0
            - 0.2
            orientation:
              rpy_deg:
              - 180.0
              - 0.0
              - -180.0
          planning_timeout_s: 10.0
          execution_timeout_s: 30.0
          acceleration_scale: 0.8
        children: []
        value_sources:
          velocity_scale:
            kind: program_parameter
            reference: velocity_scale
      - node_id: motion.move_to_pose
        instance_id: move_to_pick
        parameters:
          target_role: arm
          base_frame_role: base
          tcp_endpoint:
            kind: current
          target_mode: relative
          target_reference:
            type: scene_resource
            scene_resource_id: isaac_cheese_box
          offset_reference:
            type: frame_role
            frame_role_id: base
          goal:
            position_m:
            - 0.0
            - 0.0
            - 0.08
            orientation:
              rpy_deg:
              - 180.0
              - 0.0
              - -180.0
          planning_timeout_s: 10.0
          execution_timeout_s: 30.0
          acceleration_scale: 0.8
        children: []
        value_sources:
          velocity_scale:
            kind: program_parameter
            reference: velocity_scale
  - node_id: simulation.set_state
    instance_id: pause_if_no_collision
    parameters:
      state: pause
    children: []
