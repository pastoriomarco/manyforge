[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyforge_example_nodes"
version = "0.2.0"
description = "Reviewed read-only ManyForge node-package example"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["manyforge_example_nodes"]
package-dir = {manyforge_example_nodes = "."}

[tool.setuptools.package-data]
manyforge_example_nodes = ["descriptor.json", "_retained_source/pyproject.toml"]
