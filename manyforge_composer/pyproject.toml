[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyforge_composer"
version = "0.1.0"
description = "ManyForge Composer — FastAPI backend + React frontend for behavior-tree authoring and assistant modes"
license = { text = "Apache-2.0" }
authors = [{ name = "Marco Pastorio" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp==1.27.0",
    "pyyaml>=6.0",
    "trimesh>=4.0",
    "yourdfpy>=0.0.60",
]

[tool.setuptools]
# Flat layout — the directory containing this pyproject.toml IS the package.
# `backend` is a sub-package; `frontend`, `tests`, `verification` are excluded.
package-dir = { "manyforge_composer" = "." }
packages = ["manyforge_composer", "manyforge_composer.backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
