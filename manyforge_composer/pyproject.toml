[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyforge_composer"
version = "0.2.1"
description = "ManyForge Composer structural and Program-authoring shell during the composable-cell runtime cutover"
license = { text = "Apache-2.0" }
authors = [{ name = "Marco Pastorio" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "trimesh>=4.0",
    "yourdfpy>=0.0.60",
]

[project.optional-dependencies]
mcp = [
    "mcp==1.27.0",
]
# Retained compiled-model structural/FK parity qualification uses Pinocchio.
# This extra does not enable the removed live scene or runtime authority.
visual = [
    "pin==3.9.0",
]
headless = [
    "manyforge_headless_api>=0.2.0,<0.3.0",
]

[tool.setuptools]
# Flat layout — the directory containing this pyproject.toml IS the package.
# `backend` is a sub-package; `frontend`, `tests`, `verification` are excluded.
package-dir = { "manyforge_composer" = "." }
packages = ["manyforge_composer", "manyforge_composer.backend"]

[tool.setuptools.package-data]
manyforge_composer = ["resources/*.yaml"]
"manyforge_composer.backend" = ["resources/Untitled.scenario/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
