schema_version: manyforge.operator_alarm_catalog.v1
catalog_version: 1.1.0
definitions:
  - definition_id: manyforge.motion.runtime_collision
    version: 1
    title: Runtime collision stop
    message_template: "Collision stop for {contact_pair} on {robot_resource}"
    alarm_class: motion
    priority: critical
    priority_rationale: >-
      A collision-triggered motion stop requires immediate awareness before
      recovery; priority does not imply a safety-rated annunciator.
    consequence: >-
      Motion remains stopped and attempting recovery without inspecting the
      contact can repeat or worsen the collision episode.
    operator_response: >-
      Inspect the normalized contact pair and recovery offer, remove or repair
      the cause, acknowledge attention, then use the permitted recovery action.
    scope_fields:
      - robot_resource
      - contact_pair
    set_authority: manyforge.kernel.runtime_collision_recovery
    clear_authority: manyforge.cycle.collision_recovery_resolution
    adapter_id: manyforge.adapter.motion_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 32

  - definition_id: manyforge.motion.execution_fault
    version: 1
    title: Motion execution fault
    message_template: "Motion fault {fault_code} on {robot_resource}"
    alarm_class: motion
    priority: high
    priority_rationale: >-
      The current motion/recovery context cannot proceed without prompt
      operator attention but is not a reported collision condition.
    consequence: >-
      The affected execution remains stopped or unavailable until the recovery
      context is resolved or reset.
    operator_response: >-
      Review the fault and recovery offer, repair the reported cause,
      acknowledge attention, then select an enabled recovery or safe reset.
    scope_fields:
      - robot_resource
      - fault_code
    set_authority: manyforge.cycle.motion_recovery_context
    clear_authority: manyforge.cycle.motion_recovery_resolution
    adapter_id: manyforge.adapter.motion_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 32

  - definition_id: manyforge.scene.pose_apply_fault
    version: 1
    title: Observed pose could not be applied
    message_template: "Pose apply failed for {object_id} from {pose_source_id}"
    alarm_class: scene
    priority: high
    priority_rationale: >-
      Execution must not use a scene whose required observed object cannot be
      updated after initialization is complete.
    consequence: >-
      The planning scene can remain stale or inconsistent with the required
      observation source.
    operator_response: >-
      Inspect source health and object/policy compatibility, restore a valid
      observation or configuration, and wait for a successful matching apply.
    scope_fields:
      - pose_source_id
      - object_id
      - apply_policy_id
    set_authority: manyforge.composer.scene_apply_worker
    clear_authority: manyforge.composer.scene_apply_worker
    adapter_id: manyforge.adapter.scene_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 16

  - definition_id: manyforge.runtime.scene_initialization_fault
    version: 1
    title: Runtime scene initialization failed
    message_template: "Scene initialization failed for {runtime_lane}"
    alarm_class: runtime_health
    priority: high
    priority_rationale: >-
      A definitive reset or authored-scene seed failure leaves the current
      runtime unsuitable for motion until repaired or replaced.
    consequence: >-
      Pose updates and motion admission remain fenced because the authored
      scene is not known to be established.
    operator_response: >-
      Inspect reset/seed diagnostics, restore the backend, then retry the
      matching initialization or load a valid program/deployment.
    scope_fields:
      - runtime_lane
    set_authority: manyforge.composer.scene_initialization_barrier
    clear_authority: manyforge.composer.scene_initialization_barrier
    adapter_id: manyforge.adapter.runtime_health_condition
    runtime_modes:
      - all
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 16

  - definition_id: manyforge.runtime.provider_unavailable
    version: 1
    title: Required runtime provider unavailable
    message_template: "Provider {provider_id} is unavailable for {runtime_lane}"
    alarm_class: runtime_health
    priority: high
    priority_rationale: >-
      A required external state or execution provider is explicitly unavailable
      after initialization and trustworthy motion cannot proceed.
    consequence: >-
      Observed state, scene projection, or execution feedback may be unavailable
      or stale for the affected runtime lane.
    operator_response: >-
      Restore the named provider and wait for an explicit fresh ready status;
      absence of another failure does not clear this alarm.
    scope_fields:
      - provider_id
      - runtime_lane
    set_authority: manyforge.composer.runtime_readiness
    clear_authority: manyforge.composer.runtime_readiness
    adapter_id: manyforge.adapter.runtime_health_condition
    runtime_modes:
      - all
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 16

  - definition_id: manyforge.runtime.robot_lifecycle_fault
    version: 1
    title: Robot lifecycle fault
    message_template: "Robot lifecycle fault {fault_code} on {robot_resource}"
    alarm_class: runtime_health
    priority: high
    priority_rationale: >-
      A current physical-robot fault, warning, recovery latch, or uncertain
      lifecycle transaction requires operator attention before motion can be
      admitted.
    consequence: >-
      Robot readiness and trajectory dispatch remain fail-closed until the
      provider publishes a fresh matching clear or reconciliation result.
    operator_response: >-
      Inspect robot and lifecycle diagnostics, correct the physical cause,
      apply only an offered recovery action, and wait for a fresh reconciled
      provider snapshot.
    scope_fields:
      - robot_resource
      - fault_code
    set_authority: manyforge.robot_lifecycle.provider_snapshot
    clear_authority: manyforge.robot_lifecycle.provider_snapshot
    adapter_id: manyforge.adapter.runtime_health_condition
    runtime_modes:
      - program
      - direct_control
    acknowledgement_required: true
    acknowledgement_reason_required: false
    requires_motion_attention: true
    max_evidence_refs: 32
