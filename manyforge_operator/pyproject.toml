[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manyforge_operator"
version = "0.2.0"
description = "ManyForge O1 operator contracts and native operator-launch boundary"
license = { text = "Apache-2.0" }
authors = [{ name = "Marco Pastorio" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "rfc8785==0.1.4",
]

[tool.setuptools]
# Flat layout — the directory containing this pyproject.toml IS the package.
package-dir = { "manyforge_operator" = "." }
packages = ["manyforge_operator"]

[project.scripts]
manyforge-operator = "manyforge_operator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
