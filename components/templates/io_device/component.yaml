# Component descriptor of one I/O device: its signals. Guide:
# docs/authoring/ADDING_A_COMPONENT.md. Edit, then run
#   scripts/manyforge component check <this folder>
# Provider form (this template), a separately connected device: each signal
# names its provider. Inputs: geometric_contact, mock, ros2_control_gpio,
# ros_bool; outputs: mock_output, ros2_control_gpio, ros_set_bool.
# Model form, a machine's own I/O bank used as a member of its machine
# (e.g. components/io_device/ufactory.lite6_controller_io): signals without a
# provider, plus `lanes: {real: {adapter, bank, input_maximum_age_ms}}`; on Mock and Isaac the host's
# Mock I/O provides them. Register a model-form device with
#   scripts/manyforge component register <this folder>
api_version: manyforge.component_package.v1
kind: io_device
id: __ID__
version: 1.0.0
title: <TODO what the device is>
license: Apache-2.0
signals:
  - signal_name: output_1
    direction: output
    value_type: bool
    provider: {profile: mock_output, channel: output_1}
  - signal_name: input_1
    direction: input
    value_type: bool
    provider: {profile: mock, initial_value: false}
    freshness: {mode: provider_validity}
    transition_capability: sampled_only
    update_mode: change_only
