  - {signal_name: CO5, direction: output, value_type: bool}
  - {signal_name: CO6, direction: output, value_type: bool}
  - {signal_name: CO7, direction: output, value_type: bool}
  - {signal_name: DO0, direction: output, value_type: bool}
  - {signal_name: DO1, direction: output, value_type: bool}
