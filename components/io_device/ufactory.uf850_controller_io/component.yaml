lanes:
  # Inputs: one sample per `xarm_io_states` period (`io_states.rate`, 100 Hz).
  # A sample older than this budget is stale: rules reading it can't watch.
  # Ten periods at 100 Hz, as the I/O member's own stale bound.
  real: {adapter: xarm, bank: controller, input_maximum_age_ms: 100}    # manyforge_xarm_control/vendor/README.md
