# Component descriptor (docs/authoring/ADDING_A_COMPONENT.md, docs/authoring/IO_BANKS.md):
# a generic I/O bank of a device such as a PLC, an owner-less model-form I/O
# device. Real lane: the `ros_io_bank` family reads `/<component_id>/io_bank/state`
# and writes on `/<component_id>/io_bank/command` (manyforge_io_interfaces);
# Mock and Isaac lanes: the host's Mock I/O (outputs read back). Inputs I0-I63
# and outputs Q0-Q63 at their bank index; a site model names its own signals.
